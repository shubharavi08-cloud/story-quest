*{box-sizing:border-box}

button{font-family:inherit}

.top{max-width:1100px;margin:0 auto 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top a.back{color:var(--muted);text-decoration:none;font-weight:600}

.top h1 small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold);font-family:var(--body);font-weight:700;margin-bottom:4px}
.pill{background:var(--night-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:14px}

.pull.deva{background:linear-gradient(180deg,#ffe28a,var(--deva))}
.pull.asura{background:linear-gradient(180deg,#c9b6ff,var(--asura))}

.pull.miss{animation:shake .3s}
.shelf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shelf b{font-family:var(--display);font-size:18px;margin-right:4px}
.gem{display:flex;align-items:center;gap:6px;background:var(--night-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font-weight:600;font-size:14px;opacity:.35}

.gem i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:#ffffff14}
.tip{color:var(--muted);font-size:14px;margin:0}
.ov{position:fixed;inset:0;background:#0d0826cc;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.card{width:min(460px,100%);background:var(--cloth);color:#3a1d0c;border-radius:22px;padding:22px;box-shadow:0 30px 80px #000a;border:5px solid var(--marigold);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-height:92vh;overflow:auto}
.card .tag{display:inline-block;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--marigold);color:#2a1100}
.card h3{font-family:var(--display);font-size:28px;line-height:1.05;margin:10px 0 6px}
.card p{margin:0 0 12px}

.card .go{font:800 18px var(--display);background:#3a1d0c;color:var(--cloth);border:0;border-radius:14px;padding:12px 18px;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block}
.card .go.alt{background:#b8643a;margin-top:8px}
.modes{display:grid;gap:8px;margin:10px 0}
.modes button{text-align:left;border:2px solid #d9bf8d;background:#fffaf0;color:#3a1d0c;border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer}
.modes button b{display:block;font:800 19px var(--display)}
.modes button[aria-pressed="true"]{border-color:#3a1d0c;background:#ffe7b0}
.small{font-size:13px;color:#7a5a3a}
.by{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}.by a{color:var(--flame)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- sound ---------- */
let AC=null,soundOn=true;
function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC }
function tone(f,d=.12,type='triangle',v=.15,when=0,slide=0){ if(!soundOn)return; const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+when; o.type=type; o.frequency.setValueAtTime(f,t0); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+d+.02) }
function drum(when=0,low=true){ tone(low?90:180,.18,'sine',.35,when,low?-40:-80) }
const SFX={pull(side){tone(side?330:262,.09,'triangle',.12)},good(){tone(784,.1,'sine',.1)},miss(){tone(140,.2,'square',.07)},
 rise(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.08))},poison(){tone(200,1,'sawtooth',.06,0,-120)},
 shiva(){[147,220,294].forEach((f,i)=>tone(f,1.5,'sine',.08,i*.05))},win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.11))}};

/* ---------- state ---------- */
const BPM=112, BEAT=60/BPM;
let G=null, mode='solo';
function newState(){ return {power:0,stage:0,last:null,lastAt:0,combo:1,streak:0,t0:performance.now(),angle:0,spin:0,lean:0,poison:false,hold:{d:false,a:false},holdT:0,found:[],done:false,beatT:0,risingK:null,riseP:0,paused:false} }

/* ---------- drawing ---------- */
const cv=$('#sea'), cx=cv.getContext('2d'); let W=960,H=540,dpr=1;
function size(){ dpr=Math.min(2,devicePixelRatio||1); const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0) }
function figure(x,y,s,col,lean,crown){ // a simple pulling figure
  cx.save(); cx.translate(x,y); cx.rotate(lean); cx.fillStyle=col;
  cx.beginPath(); cx.arc(0,-s*1.55,s*.32,0,7); cx.fill(); // head
  if(crown){ cx.fillStyle=crown; cx.beginPath(); cx.moveTo(-s*.3,-s*1.8); cx.lineTo(-s*.18,-s*2.1); cx.lineTo(0,-s*1.85); cx.lineTo(s*.18,-s*2.1); cx.lineTo(s*.3,-s*1.8); cx.fill(); cx.fillStyle=col }
  cx.beginPath(); cx.moveTo(-s*.35,-s*1.2); cx.lineTo(s*.35,-s*1.2); cx.lineTo(s*.45,0); cx.lineTo(-s*.45,0); cx.closePath(); cx.fill();
  cx.strokeStyle=col; cx.lineWidth=s*.16; cx.lineCap='round'; cx.beginPath(); cx.moveTo(0,-s*1.05); cx.lineTo(s*.9,-s*.95); cx.stroke();
  cx.beginPath(); cx.moveTo(-s*.2,0); cx.lineTo(-s*.45,s*.75); cx.moveTo(s*.2,0); cx.lineTo(s*.35,s*.75); cx.stroke(); cx.restore() }
const BG=new Image(); BG.src='img/ep2_churning.jpg';
function draw(ts){
  if(!G){ requestAnimationFrame(draw); return }
  const now=ts/1000; G.spin*=.965; G.angle+=G.spin*.016; G.lean*=.9;
  const sp=Math.min(1,Math.abs(G.spin)/6);
  cx.fillStyle='#10204a'; cx.fillRect(0,0,W,H);
  if(BG.complete&&BG.naturalWidth){ const z=1.04+sp*.04+.01*Math.sin(now*.6), r=Math.sin(G.angle*.8)*.012*sp, dx=G.lean*W*.012;
    cx.save(); cx.translate(W/2+dx,H/2); cx.rotate(r); cx.scale(z,z); const ar=BG.naturalWidth/BG.naturalHeight; let w=W,h=W/ar; if(h<H){h=H;w=H*ar}
    cx.drawImage(BG,-w/2,-h/2,w,h); cx.restore() }
  // side glows when each team pulls
  const pullL=G.lean>0?G.lean:0, pullR=G.lean<0?-G.lean:0;
  if(pullL>.05){ const g=cx.createRadialGradient(W*.15,H*.6,0,W*.15,H*.6,W*.35); g.addColorStop(0,`rgba(155,123,255,${pullL*.45})`); g.addColorStop(1,'rgba(155,123,255,0)'); cx.fillStyle=g; cx.fillRect(0,0,W,H) }
  if(pullR>.05){ const g=cx.createRadialGradient(W*.85,H*.6,0,W*.85,H*.6,W*.35); g.addColorStop(0,`rgba(255,207,90,${pullR*.45})`); g.addColorStop(1,'rgba(255,207,90,0)'); cx.fillStyle=g; cx.fillRect(0,0,W,H) }
  // churning foam swirl around the mountain
  const mx=W*.5, my=H*.66;
  for(let r=0;r<7;r++){ const a0=G.angle*(r%2?1.3:-1.1)+r*1.7; cx.strokeStyle=`rgba(255,255,255,${(.18+sp*.5)*(1-r/8)})`; cx.lineWidth=2+sp*3;
    cx.beginPath(); cx.ellipse(mx,my+r*H*.012,W*(.1+r*.05),H*(.03+r*.012),0,a0,a0+Math.PI*(.6+sp*.8)); cx.stroke() }
  for(let i=0;i<Math.round(14*sp);i++){ const a=Math.random()*7, rr=W*(.08+Math.random()*.25); const x=mx+Math.cos(a)*rr, y=my+Math.sin(a)*rr*.25; cx.fillStyle='rgba(255,255,255,.8)'; cx.beginPath(); cx.arc(x,y,1.5+Math.random()*2.5,0,7); cx.fill() }
  if(G.poison){ cx.fillStyle=`rgba(60,180,80,${.22+.08*Math.sin(now*3)})`; cx.fillRect(0,0,W,H);
    for(let i=0;i<5;i++){ const x=mx+Math.sin(now+i)*W*.1, y=H*(.5-.06*i)-((now*30+i*40)%120); cx.fillStyle='rgba(120,60,160,.35)'; cx.beginPath(); cx.arc(x,y,H*.08,0,7); cx.fill() } }
  // beat ring on the mountain peak
  const bp=((now-G.beatT)%BEAT)/BEAT; const R=H*.07*(1-bp)+H*.02; cx.strokeStyle=`rgba(255,211,90,${1-bp})`; cx.lineWidth=4; cx.beginPath(); cx.arc(W*.5,H*.2,R,0,7); cx.stroke();
  // rising treasure glow
  if(G.risingK){ const T=TREASURES.find(x=>x.k===G.risingK); G.riseP=Math.min(1,G.riseP+.012); const y=my-(H*.45)*easeOut(G.riseP);
    const gl=cx.createRadialGradient(mx,y,0,mx,y,H*.22); gl.addColorStop(0,T.c+'dd'); gl.addColorStop(1,T.c+'00'); cx.fillStyle=gl; cx.beginPath(); cx.arc(mx,y,H*.22,0,7); cx.fill();
    cx.font=`${Math.round(H*.12)}px serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(T.ico,mx,y) }
  if(G.shivaGlow>0){ G.shivaGlow-=.01; cx.fillStyle=`rgba(90,140,255,${G.shivaGlow*.4})`; cx.fillRect(0,0,W,H) }
  fxDraw(); requestAnimationFrame(draw);
}
const easeOut=x=>1-Math.pow(1-x,3);

/* ---------- particles ---------- */
const fx=$('#fx'), fc=fx.getContext('2d'); let parts=[];
function fxSize(){ fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; fc.setTransform(dpr,0,0,dpr,0,0) }
function burst(x,y,n=30,cols=['#ffd35a','#fff','#7fd3ff']){ for(let i=0;i<n;i++){ const a=Math.random()*7,s=1+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c:cols[i%cols.length],r:2+Math.random()*3}) } }
function fxDraw(){ fc.clearRect(0,0,innerWidth,innerHeight); parts=parts.filter(p=>p.l>0); for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.1; p.l-=.02; fc.globalAlpha=Math.max(0,p.l); fc.fillStyle=p.c; fc.beginPath(); fc.arc(p.x,p.y,p.r,0,7); fc.fill() } fc.globalAlpha=1 }
function stageCenter(){ const r=cv.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height*.4] }

/* ---------- game logic ---------- */
const STEP=100/TREASURES.length;
function pull(side){ // side 0 = devas, 1 = asuras
  if(!G||G.done||G.paused)return; ac();
  const btn=side?$('#pa'):$('#pd'); btn.classList.add('hit'); setTimeout(()=>btn.classList.remove('hit'),90);
  if(G.poison) return; // holding phase handled separately
  const now=performance.now()/1000;
  if(G.last===side){ G.combo=1; G.streak=0; SFX.miss(); btn.classList.remove('miss'); void btn.offsetWidth; btn.classList.add('miss'); $('#tip').textContent=t('miss'); G.last=side; return }
  // rhythm: closeness to the beat grid
  const off=Math.abs(((now-G.beatT)%BEAT+BEAT)%BEAT); const d=Math.min(off,BEAT-off); const onBeat=d<BEAT*.28;
  G.streak=onBeat?G.streak+1:0; G.combo=Math.min(4,1+Math.floor(G.streak/6)); G.last=side;
  SFX.pull(side); if(onBeat) SFX.good();
  G.spin+=(side?-1:1)*(onBeat?1.6:.8)*(side?-1:1); G.spin=Math.min(8,Math.abs(G.spin)); G.lean=side?.8:-.8; // +: left (asuras) glow, -: right (devas) glow
  G.power+= (onBeat?1.15:.55)*G.combo*.55;
  if(G.streak===12) $('#tip').textContent=t('great');
  const next=(G.stage+1)*STEP;
  if(G.power>=next && !G.risingK) reveal();
  hud();
}
function hud(){ $('#meter').style.width=Math.min(100,G.power)+'%'; $('#combo').textContent='×'+G.combo }
function fmt(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') }
function reveal(){
  const T=TREASURES[G.stage]; G.stage++;
  if(T.k==='poison'){ G.poison=true; SFX.poison(); overlayCard(`<img class="hero" src="img/ep2_halahala.jpg" alt=""><span class="tag">☠</span><h3>${t('poisonT')}</h3><p>${t('poisonP')}</p>`, t('hold'), ()=>{ $('#tip').textContent=t('hold') }); return }
  G.risingK=T.k; G.riseP=0; SFX.rise(); const [x,y]=stageCenter(); burst(x,y,40,[T.c,'#fff','#ffd35a']);
  if(T.k==='dhanvantari'){ setTimeout(win,1800); return }
  G.found.push(T.k); renderShelf();
  setTimeout(()=>{ overlayCard(`${T.img?`<img class="hero" src="${T.img}" alt="">`:''}<span class="tag">${T.ico} ${t('shelf')}</span><h3>${tx(T.n)}</h3><p>${tx(T.d)}</p>`, t('cont'), ()=>{ G.risingK=null }) },1300);
}
function overlayCard(html,btn,after){ G.paused=true; $('#overlay').innerHTML=`<div class="ov"><div class="card">${html}<button class="go" id="ok">${btn}</button></div></div>`; const b=$('#ok'); b.focus(); b.onclick=()=>{ $('#overlay').innerHTML=''; G.paused=false; after&&after() } }
// holding both buttons calls Shiva
function holdLoop(){
  if(G&&G.poison&&!G.paused){ if(G.hold.d&&G.hold.a){ G.holdT+=1/60; G.power=Math.max(G.power,STEP); $('#tip').textContent='🔱 '+Math.round(G.holdT/1.5*100)+'%'; if(G.holdT>=1.5){ G.poison=false; G.holdT=0; G.shivaGlow=1; SFX.shiva(); const [x,y]=stageCenter(); burst(x,y,50,['#7fb2ff','#b9d3ff','#fff']); overlayCard(`<img class="hero" src="img/ep2_shiva.jpg" alt=""><span class="tag">🔱</span><h3>${t('shivaT')}</h3><p>${t('shivaP')}</p>`, t('cont'), ()=>{ $('#tip').textContent=t('tip') }); G.found.push('shiva'); renderShelf() } } else G.holdT=Math.max(0,G.holdT-1/120) }
  requestAnimationFrame(holdLoop) }
function setHold(side,v){ if(!G)return; if(side)G.hold.a=v; else G.hold.d=v }
function renderShelf(){ const items=[{k:'shiva',ico:'🔱',n:{en:'Neelkantha',hi:'नीलकंठ',kn:'ನೀಲಕಂಠ'}},...TREASURES.filter(x=>x.ico&&x.k!=='dhanvantari')];
  $('#shelf').innerHTML=`<b>${t('shelf')}</b>`+items.map(x=>`<span class="gem ${G&&G.found.includes(x.k)?'on':''}"><i>${x.ico}</i>${tx(x.n)}</span>`).join('') }
function win(){ G.done=true; SFX.win(); const ms=performance.now()-G.t0; let best=null; try{ best=+localStorage.getItem('sq_manthan_best')||null; if(!best||ms<best){ localStorage.setItem('sq_manthan_best',ms); best=ms } const pr=JSON.parse(localStorage.getItem('storyquest')||'{}'); pr.dv2=1; localStorage.setItem('storyquest',JSON.stringify(pr)) }catch(e){}
  for(let k=0;k<6;k++) setTimeout(()=>burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.2+Math.random()*.3),50,['#ffd35a','#ff7b54','#7fd3ff','#b98cff']),k*250);
  $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep2_dhanvantari.jpg" alt=""><span class="tag">🏺 Dhanteras</span><h3>${t('winT')}</h3><p>${t('winP')}</p><p class="small">${t('time')(fmt(ms))}${best?' · '+t('best')(fmt(best)):''}</p><button class="go" id="again">${t('again')}</button><a class="go alt" href="index.html#dv2">${t('story')}</a></div></div>`;
  $('#again').onclick=setup }

/* ---------- setup & input ---------- */
function setup(){
  $('#overlay').innerHTML=`<div class="ov"><div class="card"><span class="tag">🌊 ${t('title')}</span><h3>${t('setupTitle')}</h3><p>${t('setupText')}</p>
   <div class="modes"><button data-m="solo" aria-pressed="${mode==='solo'}"><b>${t('solo')}</b>${t('soloD')}</button><button data-m="duo" aria-pressed="${mode==='duo'}"><b>${t('duo')}</b>${t('duoD')}</button></div>
   <button class="go" id="start">${t('start')}</button></div></div>`;
  document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',x===b)) });
  $('#start').onclick=()=>{ ac(); $('#overlay').innerHTML=''; G=newState(); G.beatT=performance.now()/1000; renderShelf(); hud(); $('#tip').textContent=t('tip'); startDrums() };
}
let drumTimer=null;
function startDrums(){ clearInterval(drumTimer); let i=0; drumTimer=setInterval(()=>{ if(!G||G.done){clearInterval(drumTimer);return} if(!G.paused) drum(0,i%2===0); i++ }, BEAT*1000) }
function bindBtn(el,side){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); setHold(side,true); pull(side) });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>setHold(side,false)));
}
bindBtn($('#pd'),0); bindBtn($('#pa'),1);
addEventListener('keydown',e=>{ if(e.repeat){ if(e.key==='a'||e.key==='A')setHold(1,true); if(e.key==='l'||e.key==='L')setHold(0,true); return }
  if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft'){ setHold(1,true); pull(1) } if(e.key==='l'||e.key==='L'||e.key==='ArrowRight'){ setHold(0,true); pull(0) } });
addEventListener('keyup',e=>{ if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')setHold(1,false); if(e.key==='l'||e.key==='L'||e.key==='ArrowRight')setHold(0,false) });
function applyLang(){ document.documentElement.lang=lang; $('#t-eyebrow').textContent=t('eyebrow'); $('#t-title').textContent=t('title'); document.title=t('title'); $('#back').textContent=t('back');
  $('#t-deva').textContent=t('deva'); $('#t-asura').textContent=t('asura'); $('#k-deva').textContent=t('kd'); $('#k-asura').textContent=t('ka'); $('#tip').textContent=t('tip');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang)); renderShelf() }
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('sq_lang',lang)}catch(e){} applyLang(); if(!G||G.done)setup() });
$('#sound').onclick=()=>{ soundOn=!soundOn; $('#sound').textContent=soundOn?'🔊':'🔇'; $('#sound').setAttribute('aria-pressed',soundOn) };
$('#newgame').onclick=()=>{ G=null; setup() };
setInterval(()=>{ if(G&&!G.done) $('#timer').textContent=fmt(performance.now()-G.t0) },500);
addEventListener('resize',()=>{ size(); fxSize() });
size(); fxSize(); G=newState(); G.paused=true; applyLang(); setup(); requestAnimationFrame(draw); holdLoop();
</script>
</body>
</html>
