 {ty:100,la:26.925,lo:75.824,n:['Jantar Mantar','जंतर मंतर','ಜಂತರ್ ಮಂತರ್'],f:["Jaipur's Jantar Mantar has the world's largest stone sundial. Its shadow moves about 6 cm every minute and tells the time to about 2 seconds.",'जयपुर के जंतर मंतर में दुनिया की सबसे बड़ी पत्थर की धूपघड़ी है। इसकी छाया हर मिनट लगभग 6 सेंटीमीटर खिसकती है और लगभग 2 सेकंड तक सही समय बताती है।','ಜೈಪುರದ ಜಂತರ್ ಮಂತರ್‌ನಲ್ಲಿ ಜಗತ್ತಿನ ಅತಿ ದೊಡ್ಡ ಕಲ್ಲಿನ ಸೂರ್ಯ ಗಡಿಯಾರವಿದೆ. ಅದರ ನೆರಳು ಪ್ರತಿ ನಿಮಿಷ ಸುಮಾರು 6 ಸೆಂ.ಮೀ. ಸರಿಯುತ್ತದೆ; ಸುಮಾರು 2 ಸೆಕೆಂಡು ನಿಖರವಾಗಿ ಸಮಯ ಹೇಳುತ್ತದೆ.']},
 {ty:101,la:27.16,lo:77.52,n:['Keoladeo bird park','केवलादेव पक्षी उद्यान','ಕೇವಲಾದೇವ್ ಪಕ್ಷಿಧಾಮ'],f:['Keoladeo in Bharatpur is a wetland where hundreds of kinds of birds live, many flying in from far-off lands for the winter. It is a UNESCO World Heritage Site.','भरतपुर का केवलादेव एक दलदली उद्यान है जहाँ सैकड़ों तरह के पक्षी रहते हैं, कई सर्दियों में दूर देशों से उड़कर आते हैं। यह यूनेस्को विश्व धरोहर है।','ಭರತಪುರದ ಕೇವಲಾದೇವ್ ಒಂದು ಜೌಗು ಪಕ್ಷಿಧಾಮ; ನೂರಾರು ಬಗೆಯ ಹಕ್ಕಿಗಳು ಇಲ್ಲಿವೆ, ಹಲವು ಚಳಿಗಾಲಕ್ಕೆ ದೂರದ ದೇಶಗಳಿಂದ ಹಾರಿ ಬರುತ್ತವೆ. ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣ.']},
 {ty:102,la:28.05,lo:75.15,n:['Shekhawati painted havelis','शेखावाटी की चित्रित हवेलियाँ','ಶೇಖಾವಟಿಯ ಚಿತ್ರಿತ ಹವೇಲಿಗಳು'],f:['In Shekhawati, merchants covered their havelis in wall paintings of gods, elephants and even trains, so the region is called an open-air art gallery.','शेखावाटी में व्यापारियों ने अपनी हवेलियों की दीवारों पर देवता, हाथी और रेलगाड़ियाँ तक चित्रित करवाईं, इसलिए इसे खुली कला दीर्घा कहते हैं।','ಶೇಖಾವಟಿಯಲ್ಲಿ ವ್ಯಾಪಾರಿಗಳು ತಮ್ಮ ಹವೇಲಿಗಳ ಗೋಡೆಗಳ ಮೇಲೆ ದೇವರು, ಆನೆಗಳು, ರೈಲುಗಳನ್ನೂ ಚಿತ್ರಿಸಿದರು; ಹಾಗಾಗಿ ಇದನ್ನು ತೆರೆದ ಕಲಾ ಗ್ಯಾಲರಿ ಎನ್ನುತ್ತಾರೆ.']},
 {ty:103,la:25.116,lo:73.473,n:['Ranakpur Jain temple','रणकपुर जैन मंदिर','ರಣಕ್‌ಪುರ ಜೈನ ದೇವಾಲಯ'],f:['The marble Ranakpur Jain temple has 1,444 carved pillars, and no two are alike.','संगमरमर के रणकपुर जैन मंदिर में 1,444 नक्काशीदार खंभे हैं, और कोई भी दो एक जैसे नहीं हैं।','ಅಮೃತಶಿಲೆಯ ರಣಕ್‌ಪುರ ಜೈನ ದೇವಾಲಯದಲ್ಲಿ 1,444 ಕೆತ್ತಿದ ಕಂಬಗಳಿವೆ; ಯಾವ ಎರಡೂ ಒಂದೇ ತರಹ ಇಲ್ಲ.']},
 {ty:104,la:26.97,lo:75.08,n:['Sambhar Salt Lake','सांभर झील','ಸಾಂಭರ್ ಉಪ್ಪಿನ ಸರೋವರ'],f:["Sambhar is India's biggest inland salt lake. In winter, flocks of pink flamingos come to feed in its shallow water.",'सांभर भारत की सबसे बड़ी अंतर्देशीय खारे पानी की झील है। सर्दियों में यहाँ गुलाबी फ़्लेमिंगो के झुंड दाना चुगने आते हैं।','ಸಾಂಭರ್ ಭಾರತದ ಒಳನಾಡಿನ ಅತಿ ದೊಡ್ಡ ಉಪ್ಪುನೀರಿನ ಸರೋವರ. ಚಳಿಗಾಲದಲ್ಲಿ ಗುಲಾಬಿ ಫ್ಲೆಮಿಂಗೋ ಹಕ್ಕಿಗಳ ಹಿಂಡು ಇಲ್ಲಿ ಆಹಾರ ಹುಡುಕಲು ಬರುತ್ತದೆ.']},
 {ty:105,la:25.75,lo:71.39,n:['Manganiyar singers','मांगणियार गायक','ಮಾಂಗಣಿಯಾರ್ ಹಾಡುಗಾರರು'],f:['Manganiyar families of the Thar desert have sung folk songs for generations, playing the kamaicha and khartal at weddings and festivals.','थार रेगिस्तान के मांगणियार परिवार पीढ़ियों से शादियों और उत्सवों में कमायचा और खड़ताल बजाकर लोकगीत गाते आए हैं।','ಥಾರ್ ಮರುಭೂಮಿಯ ಮಾಂಗಣಿಯಾರ್ ಕುಟುಂಬಗಳು ತಲೆಮಾರುಗಳಿಂದ ಮದುವೆ, ಹಬ್ಬಗಳಲ್ಲಿ ಕಮಾಯಚಾ ಮತ್ತು ಖಡ್ತಾಲ್ ನುಡಿಸುತ್ತಾ ಜಾನಪದ ಹಾಡು ಹಾಡುತ್ತಾರೆ.']}],
 gj:[
 {ty:100,la:23.6,lo:71.4,n:['Little Rann wild ass','कच्छ का जंगली गधा','ಕಚ್ಛ್‌ನ ಕಾಡುಕತ್ತೆ'],f:['The Little Rann of Kutch is the last home of the Indian wild ass, a desert runner that can reach about 70 km an hour.','कच्छ का छोटा रण भारतीय जंगली गधे का आख़िरी घर है, जो रेगिस्तान में लगभग 70 किलोमीटर प्रति घंटा दौड़ सकता है।','ಕಚ್ಛ್‌ನ ಸಣ್ಣ ರಣ ಭಾರತದ ಕಾಡುಕತ್ತೆಯ ಕೊನೆಯ ಮನೆ; ಅದು ಮರುಭೂಮಿಯಲ್ಲಿ ಗಂಟೆಗೆ ಸುಮಾರು 70 ಕಿ.ಮೀ. ಓಡಬಲ್ಲದು.']},
 {ty:101,la:22.45,lo:69.95,n:['Marine National Park','समुद्री राष्ट्रीय उद्यान','ಸಾಗರ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನ'],f:["India's first marine national park, in the Gulf of Kutch, has coral reefs where you can spot octopus, starfish and sea turtles at low tide.",'कच्छ की खाड़ी में भारत का पहला समुद्री राष्ट्रीय उद्यान है, जहाँ भाटे के समय मूंगे की चट्टानों पर ऑक्टोपस, तारामछली और कछुए दिखते हैं।','ಕಚ್ಛ್ ಕೊಲ್ಲಿಯಲ್ಲಿ ಭಾರತದ ಮೊದಲ ಸಾಗರ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವಿದೆ; ಇಳಿತದ ಸಮಯದಲ್ಲಿ ಹವಳದ ದಿಬ್ಬಗಳ ಮೇಲೆ ಆಕ್ಟೋಪಸ್, ನಕ್ಷತ್ರಮೀನು, ಆಮೆಗಳನ್ನು ನೋಡಬಹುದು.']},
 {ty:102,la:23.75,lo:69.85,n:['Bhunga houses','भूंगा घर','ಭೂಂಗಾ ಮನೆಗಳು'],f:["Kutch's round mud houses, called bhungas, stayed standing in the 2001 earthquake; their round walls spread the shaking.",'कच्छ के गोल मिट्टी के घर, जिन्हें भूंगा कहते हैं, 2001 के भूकंप में भी खड़े रहे; उनकी गोल दीवारें झटकों को बाँट देती हैं।','ಕಚ್ಛ್‌ನ ಭೂಂಗಾ ಎಂಬ ದುಂಡನೆಯ ಮಣ್ಣಿನ ಮನೆಗಳು 2001ರ ಭೂಕಂಪದಲ್ಲೂ ಉಳಿದವು; ಅವುಗಳ ದುಂಡು ಗೋಡೆಗಳು ಕಂಪನವನ್ನು ಹಂಚಿಬಿಡುತ್ತವೆ.']},
 {ty:103,la:23.027,lo:72.581,n:['Sidi Saiyyed ni Jali','सीदी सैयद की जाली','ಸೀದಿ ಸಯ್ಯದ್ ಜಾಲಿ'],f:["A stone window in Ahmedabad's Sidi Saiyyed mosque is carved like a tree with curling branches, so fine it looks like lace. It has become a symbol of the city.",'अहमदाबाद की सीदी सैयद मस्जिद की पत्थर की खिड़की पर घुमावदार डालियों वाला पेड़ लेस जैसा बारीक तराशा गया है। यह शहर की पहचान बन गई है।','ಅಹಮದಾಬಾದ್‌ನ ಸೀದಿ ಸಯ್ಯದ್ ಮಸೀದಿಯ ಕಲ್ಲಿನ ಕಿಟಕಿಯಲ್ಲಿ ಸುರುಳಿ ಕೊಂಬೆಗಳ ಮರವನ್ನು ಕಸೂತಿಯಷ್ಟು ನಾಜೂಕಾಗಿ ಕೆತ್ತಿದ್ದಾರೆ; ಇದು ನಗರದ ಗುರುತಾಗಿದೆ.']},
 {ty:104,la:22.294,lo:73.192,n:['Laxmi Vilas Palace','लक्ष्मी विलास पैलेस','ಲಕ್ಷ್ಮೀ ವಿಲಾಸ ಅರಮನೆ'],f:["Vadodara's Laxmi Vilas Palace is about four times the size of Buckingham Palace, and the royal family still lives there.",'वडोदरा का लक्ष्मी विलास पैलेस बकिंघम पैलेस से लगभग चार गुना बड़ा है, और राजपरिवार आज भी वहीं रहता है।','ವಡೋದರಾದ ಲಕ್ಷ್ಮೀ ವಿಲಾಸ ಅರಮನೆ ಬಕಿಂಗ್‌ಹ್ಯಾಮ್ ಅರಮನೆಗಿಂತ ಸುಮಾರು ನಾಲ್ಕು ಪಟ್ಟು ದೊಡ್ಡದು; ರಾಜಮನೆತನ ಇಂದಿಗೂ ಅಲ್ಲೇ ವಾಸಿಸುತ್ತದೆ.']},
 {ty:105,la:22.39,lo:71.02,n:['Rajkot airport','राजकोट हवाई अड्डा','ರಾಜಕೋಟ್ ವಿಮಾನ ನಿಲ್ದಾಣ'],f:["Rajkot's new airport at Hirasar opened in 2023. Its front is inspired by Rajkot's Ranjit Vilas Palace, and the curved shapes at the entrance are inspired by kites.",'हीरासर में राजकोट का नया हवाई अड्डा 2023 में खुला। इसका अग्रभाग राजकोट के रणजीत विलास महल से प्रेरित है, और प्रवेश की घुमावदार आकृतियाँ पतंगों से।','ಹೀರಾಸರ್‌ನಲ್ಲಿ ರಾಜಕೋಟ್‌ನ ಹೊಸ ವಿಮಾನ ನಿಲ್ದಾಣ 2023ರಲ್ಲಿ ತೆರೆಯಿತು. ಅದರ ಮುಂಭಾಗಕ್ಕೆ ರಾಜಕೋಟ್‌ನ ರಣಜಿತ್ ವಿಲಾಸ ಅರಮನೆ ಸ್ಫೂರ್ತಿ; ಪ್ರವೇಶದ ಬಾಗಿದ ಆಕಾರಗಳಿಗೆ ಗಾಳಿಪಟಗಳು ಸ್ಫೂರ್ತಿ.']}],
 dd:[
 {ty:100,la:20.7028,lo:70.9769,n:['INS Khukri Memorial','आईएनएस खुकरी स्मारक','ಐಎನ್‌ಎಸ್ ಖುಕ್ರಿ ಸ್ಮಾರಕ'],f:['This memorial on a hill at Chakratirth beach honours the 18 officers and 176 sailors of INS Khukri, which sank off Diu in 1971. A model of the ship stands in a glass house facing the sea.','चक्रतीर्थ बीच की पहाड़ी पर बना यह स्मारक आईएनएस खुकरी के 18 अधिकारियों और 176 नौसैनिकों को याद करता है, जो 1971 में दीव के पास समुद्र में डूब गया था। जहाज़ का एक मॉडल समुद्र की ओर मुँह किए शीशे के घर में रखा है।','ಚಕ್ರತೀರ್ಥ ಕಡಲತೀರದ ದಿಬ್ಬದ ಮೇಲಿನ ಈ ಸ್ಮಾರಕ 1971ರಲ್ಲಿ ದಿಯು ಬಳಿ ಮುಳುಗಿದ ಐಎನ್‌ಎಸ್ ಖುಕ್ರಿಯ 18 ಅಧಿಕಾರಿಗಳು ಮತ್ತು 176 ನಾವಿಕರನ್ನು ನೆನಪಿಸುತ್ತದೆ. ಹಡಗಿನ ಮಾದರಿ ಕಡಲಿನತ್ತ ಮುಖ ಮಾಡಿ ಗಾಜಿನ ಮನೆಯಲ್ಲಿ ನಿಂತಿದೆ.']},
 {ty:101,la:20.7195,lo:70.9945,n:['Panikotha sea fort','पानीकोठा समुद्री किला','ಪಾನಿಕೋಠಾ ಕಡಲ ಕೋಟೆ'],f:['Fortim do Mar, called Panikotha or water fort, stands on a rock at the mouth of the creek, about one nautical mile from the Diu jetty. It has a lighthouse and a small chapel.','फ़ोर्टिम दो मार, जिसे पानीकोठा यानी पानी का किला कहते हैं, खाड़ी के मुहाने पर एक चट्टान पर खड़ा है, दीव की जेटी से लगभग एक समुद्री मील दूर। इसमें एक लाइटहाउस और छोटा गिरजा है।','ಫೋರ್ಟಿಮ್ ದೋ ಮಾರ್, ಅಂದರೆ ಪಾನಿಕೋಠಾ ಅಥವಾ ನೀರಿನ ಕೋಟೆ, ಹಿನ್ನೀರು ಕಡಲು ಸೇರುವಲ್ಲಿನ ಬಂಡೆಯ ಮೇಲೆ ನಿಂತಿದೆ; ದಿಯುವಿನ ದೋಣಿಕಟ್ಟೆಯಿಂದ ಸುಮಾರು ಒಂದು ನಾವಿಕ ಮೈಲಿ ದೂರ. ಇದರಲ್ಲಿ ಒಂದು ದೀಪಸ್ತಂಭ ಮತ್ತು ಪುಟ್ಟ ಪ್ರಾರ್ಥನಾ ಮಂದಿರವಿದೆ.']},
 {ty:102,la:20.7148,lo:70.9877,n:["St Paul's Church, Diu",'सेंट पॉल चर्च, दीव','ಸಂತ ಪೌಲರ ಇಗರ್ಜಿ, ದಿಯು'],f:["Built between 1601 and 1610, St Paul's is the only one of Diu's three old Portuguese churches still used for prayer. Its white front is covered in curling carvings.",'1601 से 1610 के बीच बना सेंट पॉल चर्च दीव के तीन पुराने पुर्तगाली गिरजों में अकेला है, जहाँ आज भी प्रार्थना होती है। इसके सफ़ेद अग्रभाग पर घुमावदार नक्काशी है।','1601ರಿಂದ 1610ರ ನಡುವೆ ಕಟ್ಟಿದ ಸಂತ ಪೌಲರ ಇಗರ್ಜಿ, ದಿಯುವಿನ ಮೂರು ಹಳೆಯ ಪೋರ್ಚುಗೀಸ್ ಇಗರ್ಜಿಗಳಲ್ಲಿ ಇಂದಿಗೂ ಪ್ರಾರ್ಥನೆ ನಡೆಯುವ ಏಕೈಕ ಇಗರ್ಜಿ. ಇದರ ಬಿಳಿ ಮುಂಭಾಗದ ತುಂಬ ಸುರುಳಿ ಕೆತ್ತನೆಗಳಿವೆ.']},
 {ty:103,la:20.706,lo:70.972,n:['Fudam Bird Sanctuary','फुदम पक्षी अभयारण्य','ಫುದಮ್ ಪಕ್ಷಿಧಾಮ'],f:["Diu's Fudam Bird Sanctuary, notified in 2006, has mudflats and mangroves where many birds come to feed and build nests.",'2006 में घोषित दीव के फुदम पक्षी अभयारण्य में कीचड़ भरे तट और मैंग्रोव हैं, जहाँ बहुत से पक्षी दाना चुगने और घोंसले बनाने आते हैं।','2006ರಲ್ಲಿ ಘೋಷಿತವಾದ ದಿಯುವಿನ ಫುದಮ್ ಪಕ್ಷಿಧಾಮದಲ್ಲಿ ಕೆಸರಿನ ತೀರಗಳು ಮತ್ತು ಕಾಂಡ್ಲಾ ಕಾಡುಗಳಿವೆ; ಅನೇಕ ಹಕ್ಕಿಗಳು ಇಲ್ಲಿ ಆಹಾರ ಹುಡುಕಲು ಮತ್ತು ಗೂಡು ಕಟ್ಟಲು ಬರುತ್ತವೆ.']},
 {ty:104,la:20.4085,lo:72.8285,n:['Daman lighthouses','दमण के लाइटहाउस','ದಮನ್ ದೀಪಸ್ತಂಭಗಳು'],f:['Moti Daman has two lighthouses: an old one built by the Portuguese and a newer one built by the Government of India.','मोटी दमण में दो लाइटहाउस हैं: एक पुराना, जिसे पुर्तगालियों ने बनाया, और एक नया, जिसे भारत सरकार ने बनाया।','ಮೋಟಿ ದಮನ್‌ನಲ್ಲಿ ಎರಡು ದೀಪಸ್ತಂಭಗಳಿವೆ: ಪೋರ್ಚುಗೀಸರು ಕಟ್ಟಿದ ಹಳೆಯದು ಮತ್ತು ಭಾರತ ಸರ್ಕಾರ ಕಟ್ಟಿದ ಹೊಸದು.']},
 {ty:105,la:20.2,lo:73.03,n:['Tarpa festival','तारपा उत्सव','ತಾರ್ಪಾ ಉತ್ಸವ'],f:['Dadra and Nagar Haveli holds a Tarpa festival named after the gourd-and-bamboo wind instrument. Warli, Kokna and Koli dancers link arms and circle the tarpa player.','दादरा और नागर हवेली में लौकी-बाँस के वाद्य के नाम पर तारपा उत्सव मनाया जाता है। वारली, कोकना और कोली नर्तक हाथ में हाथ डालकर तारपा बजाने वाले के चारों ओर घूमते हैं।','ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿಯಲ್ಲಿ ಸೋರೆಕಾಯಿ-ಬಿದಿರಿನ ಊದುವ ವಾದ್ಯದ ಹೆಸರಿನಲ್ಲೇ ತಾರ್ಪಾ ಉತ್ಸವ ನಡೆಯುತ್ತದೆ. ವಾರ್ಲಿ, ಕೋಕ್ನಾ ಮತ್ತು ಕೋಲಿ ನರ್ತಕರು ಕೈ ಬೆಸೆದು ತಾರ್ಪಾ ಊದುವವನ ಸುತ್ತ ಸುತ್ತುತ್ತಾರೆ.']}
],
 ga:[
 {ty:100,la:15.744,lo:73.862,n:['Manohar International Airport','मनोहर अंतरराष्ट्रीय हवाई अड्डा','ಮನೋಹರ ಅಂತರರಾಷ್ಟ್ರೀಯ ವಿಮಾನ ನಿಲ್ದಾಣ'],f:["Goa's new airport at Mopa in north Goa started flights in January 2023. It is named after Manohar Parrikar, a former Chief Minister of Goa.",'उत्तर गोवा के मोपा में गोवा के नए हवाई अड्डे से जनवरी 2023 में उड़ानें शुरू हुईं। इसका नाम गोवा के पूर्व मुख्यमंत्री मनोहर पर्रिकर के नाम पर है।','ಉತ್ತರ ಗೋವಾದ ಮೋಪಾದಲ್ಲಿರುವ ಗೋವಾದ ಹೊಸ ವಿಮಾನ ನಿಲ್ದಾಣದಿಂದ 2023ರ ಜನವರಿಯಲ್ಲಿ ಹಾರಾಟ ಶುರುವಾಯಿತು. ಗೋವಾದ ಮಾಜಿ ಮುಖ್ಯಮಂತ್ರಿ ಮನೋಹರ್ ಪರ್ರಿಕರ್ ಅವರ ಹೆಸರನ್ನು ಇದಕ್ಕೆ ಇಡಲಾಗಿದೆ.']},
 {ty:101,la:15.504,lo:73.9124,n:['Golden Bell of Se Cathedral','से कैथेड्रल की सुनहरी घंटी','ಸೇ ಕ್ಯಾಥೆಡ್ರಲ್‌ನ ಚಿನ್ನದ ಗಂಟೆ'],f:["Se Cathedral in Old Goa is one of the largest churches in Asia. Its tower holds the Golden Bell, the biggest bell in Goa, famous for its rich sound.",'पुराने गोवा का से कैथेड्रल एशिया के सबसे बड़े गिरजाघरों में से एक है। इसकी मीनार में गोवा की सबसे बड़ी घंटी, सुनहरी घंटी है, जो अपनी गहरी आवाज़ के लिए मशहूर है।','ಹಳೆಯ ಗೋವಾದ ಸೇ ಕ್ಯಾಥೆಡ್ರಲ್ ಏಷ್ಯಾದ ಅತಿ ದೊಡ್ಡ ಇಗರ್ಜಿಗಳಲ್ಲಿ ಒಂದು. ಇದರ ಗೋಪುರದಲ್ಲಿ ಗೋವಾದ ಅತಿ ದೊಡ್ಡ ಗಂಟೆ, ಚಿನ್ನದ ಗಂಟೆ ಇದೆ; ಅದರ ಗಂಭೀರ ನಾದ ಪ್ರಸಿದ್ಧ.']},
 {ty:102,la:15.62,lo:73.73,n:['Turtle nesting beach','कछुओं का अंडे देने वाला तट','ಕಡಲಾಮೆ ಮೊಟ್ಟೆ ಇಡುವ ತೀರ'],f:['Olive ridley sea turtles crawl up quiet Goan beaches such as Morjim and Galgibaga at night to lay their eggs, and forest guards protect the nests.','ऑलिव रिडले समुद्री कछुए रात में मोरजिम और गालजीबाग जैसे शांत तटों पर अंडे देने आते हैं, और वन रक्षक उनके घोंसलों की रखवाली करते हैं।','ಆಲಿವ್ ರಿಡ್ಲೀ ಕಡಲಾಮೆಗಳು ರಾತ್ರಿ ಮೊರ್ಜಿಮ್, ಗಾಲ್ಜಿಬಾಗ್‌ನಂಥ ಶಾಂತ ತೀರಗಳಿಗೆ ಹತ್ತಿ ಬಂದು ಮೊಟ್ಟೆ ಇಡುತ್ತವೆ; ಅರಣ್ಯ ಕಾವಲುಗಾರರು ಗೂಡುಗಳನ್ನು ಕಾಯುತ್ತಾರೆ.']},
 {ty:103,la:15.5555,lo:74.023,n:['Arvalem rock-cut caves','अरवलम की चट्टानी गुफाएँ','ಅರವಲೆಂ ಬಂಡೆಗುಹೆಗಳು'],f:['Near the Arvalem waterfall, small caves were cut into a laterite hill long ago. They are now a protected monument.','अरवलम जलप्रपात के पास बहुत पहले एक लेटराइट पहाड़ी को काटकर छोटी गुफाएँ बनाई गई थीं। अब ये संरक्षित स्मारक हैं।','ಅರವಲೆಂ ಜಲಪಾತದ ಬಳಿ ಬಹಳ ಹಿಂದೆ ಮುರಕಲ್ಲಿನ ಗುಡ್ಡವನ್ನು ಕೊರೆದು ಪುಟ್ಟ ಗುಹೆಗಳನ್ನು ಮಾಡಲಾಗಿತ್ತು. ಈಗ ಅವು ಸಂರಕ್ಷಿತ ಸ್ಮಾರಕ.']},
 {ty:104,la:15.588,lo:73.954,n:['Kaavi revival','कावी कला की वापसी','ಕಾವಿ ಕಲೆಯ ಪುನರುಜ್ಜೀವನ'],f:["Kaavi art had almost disappeared, but artists and the Goa government are now restoring old murals, such as those at the Saptakoteshwar temple in Narve, and teaching it in schools.",'कावी कला लगभग लुप्त हो चुकी थी, पर अब कलाकार और गोवा सरकार पुराने भित्तिचित्रों को सुधार रहे हैं, जैसे नार्वे के सप्तकोटेश्वर मंदिर में, और इसे स्कूलों में भी सिखा रहे हैं।','ಕಾವಿ ಕಲೆ ಬಹುತೇಕ ಮರೆಯಾಗಿತ್ತು; ಈಗ ಕಲಾವಿದರು ಮತ್ತು ಗೋವಾ ಸರ್ಕಾರ ನಾರ್ವೆಯ ಸಪ್ತಕೋಟೇಶ್ವರ ದೇವಾಲಯದಂಥ ಕಡೆ ಹಳೆಯ ಗೋಡೆಚಿತ್ರಗಳನ್ನು ಸರಿಪಡಿಸುತ್ತಿದ್ದಾರೆ, ಶಾಲೆಗಳಲ್ಲೂ ಕಲಿಸುತ್ತಿದ್ದಾರೆ.']},
 {ty:105,la:15.498,lo:73.828,n:['Carnival in Panaji','पणजी का कार्निवल','ಪಣಜಿಯ ಕಾರ್ನಿವಲ್ ಹಬ್ಬ'],f:["Goa's Carnival is India's only carnival of its kind, a legacy of Portuguese times. Its grandest float parade rolls through Panaji every February or March.",'गोवा का कार्निवल भारत में अपनी तरह का अकेला उत्सव है, जो पुर्तगाली दौर की देन है। इसकी सबसे बड़ी झाँकी परेड हर फ़रवरी या मार्च में पणजी से गुज़रती है।','ಗೋವಾದ ಕಾರ್ನಿವಲ್ ಭಾರತದಲ್ಲಿ ಈ ಬಗೆಯ ಏಕೈಕ ಹಬ್ಬ; ಪೋರ್ಚುಗೀಸರ ಕಾಲದ ಬಳುವಳಿ. ಇದರ ಅತಿ ದೊಡ್ಡ ತೇರುಗಳ ಮೆರವಣಿಗೆ ಪ್ರತಿ ಫೆಬ್ರವರಿ ಅಥವಾ ಮಾರ್ಚ್‌ನಲ್ಲಿ ಪಣಜಿಯಲ್ಲಿ ಸಾಗುತ್ತದೆ.']}
],
 kl:[
 {ty:100,la:10.152,lo:76.4019,n:['Cochin International Airport','कोचीन अंतरराष्ट्रीय हवाई अड्डा','ಕೊಚ್ಚಿ ಅಂತರರಾಷ್ಟ್ರೀಯ ವಿಮಾನ ನಿಲ್ದಾಣ'],f:["In 2015 Kochi's airport became the first airport in the world to run fully on solar power, using thousands of solar panels laid out next to it.",'2015 में कोच्चि का हवाई अड्डा दुनिया का पहला ऐसा हवाई अड्डा बना जो पूरी तरह सौर ऊर्जा से चलता है; इसके पास हज़ारों सोलर पैनल बिछाए गए हैं।','2015ರಲ್ಲಿ ಕೊಚ್ಚಿಯ ವಿಮಾನ ನಿಲ್ದಾಣ ಪೂರ್ತಿಯಾಗಿ ಸೌರಶಕ್ತಿಯಿಂದ ನಡೆಯುವ ವಿಶ್ವದ ಮೊದಲ ವಿಮಾನ ನಿಲ್ದಾಣವಾಯಿತು; ಪಕ್ಕದಲ್ಲೇ ಸಾವಿರಾರು ಸೌರಫಲಕಗಳನ್ನು ಹಾಸಿದ್ದಾರೆ.']},
 {ty:101,la:9.985,lo:76.275,n:['Kochi Water Metro','कोच्चि वॉटर मेट्रो','ಕೊಚ್ಚಿ ಜಲ ಮೆಟ್ರೋ'],f:["India's first water metro started in Kochi in April 2023. Quiet electric boats carry people between the city and the islands around it.",'भारत की पहली वॉटर मेट्रो अप्रैल 2023 में कोच्चि में शुरू हुई। शांत बिजली वाली नावें लोगों को शहर और आसपास के द्वीपों के बीच ले जाती हैं।','ಭಾರತದ ಮೊದಲ ಜಲ ಮೆಟ್ರೋ 2023ರ ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಕೊಚ್ಚಿಯಲ್ಲಿ ಶುರುವಾಯಿತು. ಸದ್ದಿಲ್ಲದ ವಿದ್ಯುತ್ ದೋಣಿಗಳು ಜನರನ್ನು ನಗರ ಮತ್ತು ಸುತ್ತಲಿನ ದ್ವೀಪಗಳ ನಡುವೆ ಕರೆದೊಯ್ಯುತ್ತವೆ.']},
 {ty:102,la:8.3742,lo:76.9951,n:['Vizhinjam Seaport','विळिंजम बंदरगाह','ವಿಳಿಂಜಂ ಬಂದರು'],f:["Vizhinjam, near Thiruvananthapuram, opened in May 2025 as India's first port built just for moving containers between giant ships. Its sea is naturally deep, so the biggest ships can come in.",'तिरुवनंतपुरम के पास विळिंजम मई 2025 में खुला, भारत का पहला ऐसा बंदरगाह जो बड़े जहाज़ों के बीच कंटेनर बदलने के लिए ही बना है। यहाँ का समुद्र प्राकृतिक रूप से गहरा है, इसलिए सबसे बड़े जहाज़ भी आ सकते हैं।','ತಿರುವನಂತಪುರದ ಬಳಿಯ ವಿಳಿಂಜಂ 2025ರ ಮೇ ತಿಂಗಳಲ್ಲಿ ತೆರೆಯಿತು; ದೈತ್ಯ ಹಡಗುಗಳ ನಡುವೆ ಕಂಟೇನರ್ ಬದಲಿಸಲೆಂದೇ ಕಟ್ಟಿದ ಭಾರತದ ಮೊದಲ ಬಂದರು ಇದು. ಇಲ್ಲಿನ ಸಮುದ್ರ ಸಹಜವಾಗಿ ಆಳ, ಹಾಗಾಗಿ ಅತಿ ದೊಡ್ಡ ಹಡಗುಗಳೂ ಬರಬಹುದು.']},
 {ty:103,la:10.2,lo:77.03,n:['Neelakurinji hills','नीलकुरिंजी की पहाड़ियाँ','ನೀಲಕುರಿಂಜಿ ಬೆಟ್ಟಗಳು'],f:['The neelakurinji shrub flowers only once every twelve years. When it blooms, the hills around Munnar turn a soft purple-blue.','नीलकुरिंजी झाड़ी बारह साल में सिर्फ़ एक बार फूलती है। जब यह खिलती है, मुन्नार के आसपास की पहाड़ियाँ हल्की बैंगनी-नीली हो जाती हैं।','ನೀಲಕುರಿಂಜಿ ಗಿಡ ಹನ್ನೆರಡು ವರ್ಷಕ್ಕೆ ಒಮ್ಮೆ ಮಾತ್ರ ಹೂ ಬಿಡುತ್ತದೆ. ಅದು ಅರಳಿದಾಗ ಮುನ್ನಾರಿನ ಸುತ್ತಲಿನ ಬೆಟ್ಟಗಳು ತಿಳಿ ನೇರಳೆ-ನೀಲಿಯಾಗುತ್ತವೆ.']},
 {ty:104,la:10.7436,lo:76.2795,n:['Kerala Kalamandalam','केरल कलामंडलम','ಕೇರಳ ಕಲಾಮಂಡಲಂ'],f:['The poet Vallathol Narayana Menon started Kerala Kalamandalam in 1930 to save Kathakali and other classical arts. Students still learn there under the trees at Cheruthuruthy.','कवि वल्लत्तोल नारायण मेनन ने कथकली और दूसरी शास्त्रीय कलाओं को बचाने के लिए 1930 में केरल कलामंडलम शुरू किया। चेरुतुरुत्ति में विद्यार्थी आज भी पेड़ों के नीचे सीखते हैं।','ಕಥಕ್ಕಳಿ ಮತ್ತು ಇತರ ಶಾಸ್ತ್ರೀಯ ಕಲೆಗಳನ್ನು ಉಳಿಸಲು ಕವಿ ವಳ್ಳತ್ತೋಳ್ ನಾರಾಯಣ ಮೆನನ್ 1930ರಲ್ಲಿ ಕೇರಳ ಕಲಾಮಂಡಲಂ ಆರಂಭಿಸಿದರು. ಚೆರುತುರುತ್ತಿಯಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಇಂದಿಗೂ ಮರಗಳ ಕೆಳಗೆ ಕಲಿಯುತ್ತಾರೆ.']},
 {ty:105,la:11.08,lo:76.45,n:['Silent Valley National Park','साइलेंट वैली राष्ट्रीय उद्यान','ಸೈಲೆಂಟ್ ವ್ಯಾಲಿ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನ'],f:['In the 1970s and 80s people across India campaigned to stop a dam that would have flooded this rainforest. It was saved and became a national park in 1984, a home for the rare lion-tailed macaque.','1970 और 80 के दशक में पूरे भारत के लोगों ने उस बाँध को रोकने का अभियान चलाया जो इस वर्षावन को डुबो देता। जंगल बच गया और 1984 में राष्ट्रीय उद्यान बना, दुर्लभ शेरपूँछ मकाक का घर।','1970-80ರ ದಶಕಗಳಲ್ಲಿ ಈ ಮಳೆಕಾಡನ್ನು ಮುಳುಗಿಸಬಹುದಾಗಿದ್ದ ಅಣೆಕಟ್ಟನ್ನು ತಡೆಯಲು ದೇಶದಾದ್ಯಂತ ಜನ ಹೋರಾಡಿದರು. ಕಾಡು ಉಳಿಯಿತು, 1984ರಲ್ಲಿ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವಾಯಿತು; ಅಪರೂಪದ ಸಿಂಗಳೀಕನ ನೆಲೆ ಇದು.']}
],
 ld:[
 {ty:100,la:10.8237,lo:72.176,n:['Agatti Airport','अगत्ती हवाई अड्डा','ಅಗತ್ತಿ ವಿಮಾನ ನಿಲ್ದಾಣ'],f:["Agatti has the only airport in Lakshadweep. Visitors fly in from Kochi and then go on to other islands by boat or helicopter.",'लक्षद्वीप का अकेला हवाई अड्डा अगत्ती में है। सैलानी कोच्चि से उड़कर आते हैं और फिर नाव या हेलिकॉप्टर से दूसरे द्वीपों पर जाते हैं।','ಲಕ್ಷದ್ವೀಪದ ಏಕೈಕ ವಿಮಾನ ನಿಲ್ದಾಣ ಅಗತ್ತಿಯಲ್ಲಿದೆ. ಪ್ರವಾಸಿಗರು ಕೊಚ್ಚಿಯಿಂದ ಹಾರಿ ಬಂದು, ನಂತರ ದೋಣಿ ಅಥವಾ ಹೆಲಿಕಾಪ್ಟರ್‌ನಲ್ಲಿ ಬೇರೆ ದ್ವೀಪಗಳಿಗೆ ಹೋಗುತ್ತಾರೆ.']},
 {ty:101,la:10.53,lo:72.62,n:['Undersea internet cable','समुद्र के नीचे इंटरनेट केबल','ಸಮುದ್ರದಡಿಯ ಅಂತರ್ಜಾಲ ತಂತಿ'],f:["In January 2024 a cable laid on the sea floor from Kochi reached 11 islands, making the internet here about 100 times faster.",'जनवरी 2024 में कोच्चि से समुद्र तल पर बिछाई गई केबल 11 द्वीपों तक पहुँची, जिससे यहाँ इंटरनेट लगभग 100 गुना तेज़ हो गया।','2024ರ ಜನವರಿಯಲ್ಲಿ ಕೊಚ್ಚಿಯಿಂದ ಸಮುದ್ರತಳದಲ್ಲಿ ಹಾಸಿದ ತಂತಿ 11 ದ್ವೀಪಗಳನ್ನು ತಲುಪಿತು; ಇದರಿಂದ ಇಲ್ಲಿನ ಅಂತರ್ಜಾಲ ಸುಮಾರು 100 ಪಟ್ಟು ವೇಗವಾಯಿತು.']},
 {ty:102,la:10.6,lo:72.66,n:['Seawater to drinking water','समुद्री पानी से पीने का पानी','ಸಮುದ್ರದ ನೀರಿನಿಂದ ಕುಡಿಯುವ ನೀರು'],f:["In 2005 Kavaratti opened the world's first plant that turns seawater into drinking water using the cold water from deep in the ocean. Today several islands have one.",'2005 में कवरत्ती में दुनिया का पहला ऐसा संयंत्र खुला जो समुद्र की गहराई के ठंडे पानी की मदद से समुद्री पानी को पीने लायक बनाता है। आज कई द्वीपों में ऐसे संयंत्र हैं।','2005ರಲ್ಲಿ ಕವರತ್ತಿಯಲ್ಲಿ ಆಳಸಮುದ್ರದ ತಣ್ಣೀರಿನ ಸಹಾಯದಿಂದ ಸಮುದ್ರದ ನೀರನ್ನು ಕುಡಿಯುವ ನೀರಾಗಿಸುವ ವಿಶ್ವದ ಮೊದಲ ಘಟಕ ಆರಂಭವಾಯಿತು. ಇಂದು ಹಲವು ದ್ವೀಪಗಳಲ್ಲಿ ಇಂಥ ಘಟಕಗಳಿವೆ.']},
 {ty:103,la:10.083,lo:72.283,n:['Suheli Par atoll','सुहेली पार प्रवाल द्वीप','ಸುಹೇಲಿ ಪಾರ್ ಹವಳದ ದ್ವೀಪ'],f:['Suheli Par is an oval coral atoll about 17 km long with two small islets. No one lives there, and its reef is full of fish, turtles and seabirds.','सुहेली पार लगभग 17 किलोमीटर लंबा अंडाकार प्रवाल द्वीप है, जिसमें दो छोटे टापू हैं। यहाँ कोई नहीं रहता, और इसकी चट्टानें मछलियों, कछुओं और समुद्री पक्षियों से भरी हैं।','ಸುಹೇಲಿ ಪಾರ್ ಸುಮಾರು 17 ಕಿಲೋಮೀಟರ್ ಉದ್ದದ ಅಂಡಾಕಾರದ ಹವಳದ ದ್ವೀಪ, ಎರಡು ಪುಟ್ಟ ದಿಬ್ಬಗಳಿವೆ. ಇಲ್ಲಿ ಯಾರೂ ವಾಸಿಸುವುದಿಲ್ಲ; ಇದರ ಹವಳದ ದಿಬ್ಬ ಮೀನು, ಆಮೆ, ಕಡಲಹಕ್ಕಿಗಳಿಂದ ತುಂಬಿದೆ.']},
 {ty:104,la:8.31,lo:73.07,n:['Minicoy tuna factory','मिनिकॉय का टूना कारख़ाना','ಮಿನಿಕಾಯ್‌ನ ಕೇದರ್ ಮೀನು ಕಾರ್ಖಾನೆ'],f:['Minicoy is an important tuna-fishing centre, and a factory on the island cans the catch. Many Minicoy men also work as sailors on ships around the world.','मिनिकॉय टूना पकड़ने का बड़ा केंद्र है, और द्वीप का एक कारख़ाना पकड़ी गई मछली को डिब्बों में बंद करता है। मिनिकॉय के कई पुरुष दुनिया भर के जहाज़ों पर नाविक भी हैं।','ಮಿನಿಕಾಯ್ ಕೇದರ್ ಮೀನು ಹಿಡಿಯುವ ಮುಖ್ಯ ಕೇಂದ್ರ; ದ್ವೀಪದ ಕಾರ್ಖಾನೆ ಹಿಡಿದ ಮೀನನ್ನು ಡಬ್ಬಿಗಳಲ್ಲಿ ತುಂಬುತ್ತದೆ. ಮಿನಿಕಾಯ್‌ನ ಅನೇಕ ಗಂಡಸರು ಜಗತ್ತಿನಾದ್ಯಂತ ಹಡಗುಗಳಲ್ಲಿ ನಾವಿಕರೂ ಹೌದು.']},
 {ty:105,la:8.95,lo:73.15,n:['Nine Degree Channel','नौ डिग्री चैनल','ಒಂಬತ್ತು ಡಿಗ್ರಿ ಕಾಲುವೆ'],f:['This wide stretch of open sea, along the 9th line of latitude, separates Minicoy from the other islands. Big ships sail through it between Asia and the Middle East.','अक्षांश की 9वीं रेखा के साथ खुले समुद्र का यह चौड़ा हिस्सा मिनिकॉय को बाक़ी द्वीपों से अलग करता है। एशिया और पश्चिम एशिया के बीच बड़े जहाज़ इसी से गुज़रते हैं।','ಅಕ್ಷಾಂಶದ 9ನೇ ರೇಖೆಯುದ್ದಕ್ಕೂ ಇರುವ ತೆರೆದ ಸಮುದ್ರದ ಈ ಅಗಲ ಭಾಗ ಮಿನಿಕಾಯ್ ಅನ್ನು ಉಳಿದ ದ್ವೀಪಗಳಿಂದ ಬೇರ್ಪಡಿಸುತ್ತದೆ. ಏಷ್ಯಾ ಮತ್ತು ಪಶ್ಚಿಮ ಏಷ್ಯಾದ ನಡುವೆ ದೊಡ್ಡ ಹಡಗುಗಳು ಇದರ ಮೂಲಕ ಸಾಗುತ್ತವೆ.']}
],

 {ty:100,la:8.07,lo:77.565,n:['Kanniyakumari glass bridge','कन्याकुमारी काँच का पुल','ಕನ್ಯಾಕುಮಾರಿ ಗಾಜಿನ ಸೇತುವೆ'],f:["In December 2024 India's first glass bridge over the sea opened here. It is 77 metres long and joins the Vivekananda memorial rock to the Thiruvalluvar statue, with waves splashing beneath your feet.",'दिसंबर 2024 में यहाँ समुद्र के ऊपर भारत का पहला काँच का पुल खुला। यह 77 मीटर लंबा है और विवेकानंद स्मारक शिला को तिरुवल्लुवर मूर्ति से जोड़ता है; पैरों के नीचे लहरें उछलती दिखती हैं।','2024ರ ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಇಲ್ಲಿ ಸಮುದ್ರದ ಮೇಲೆ ಭಾರತದ ಮೊದಲ ಗಾಜಿನ ಸೇತುವೆ ತೆರೆಯಿತು. 77 ಮೀಟರ್ ಉದ್ದದ ಇದು ವಿವೇಕಾನಂದ ಸ್ಮಾರಕ ಬಂಡೆಯನ್ನು ತಿರುವಳ್ಳುವರ್ ಪ್ರತಿಮೆಗೆ ಜೋಡಿಸುತ್ತದೆ; ಕಾಲಡಿಯಲ್ಲಿ ಅಲೆಗಳು ಚಿಮ್ಮುವುದು ಕಾಣುತ್ತದೆ.']},
 {ty:101,la:9.862,lo:78.181,n:['Keeladi excavations','कीलड़ी उत्खनन','ಕೀಳಡಿ ಉತ್ಖನನ'],f:['Near Madurai, archaeologists have dug up an ancient town of the Sangam age with brick houses, wells, pottery and beads. A museum shows what they found.','मदुरै के पास पुरातत्वविदों ने संगम काल का एक प्राचीन नगर खोदकर निकाला है, जिसमें ईंटों के घर, कुएँ, मिट्टी के बर्तन और मनके मिले। एक संग्रहालय में ये सब दिखाए गए हैं।','ಮಧುರೈ ಬಳಿ ಪುರಾತತ್ವಜ್ಞರು ಸಂಗಮ ಕಾಲದ ಪುರಾತನ ಪಟ್ಟಣವನ್ನು ಅಗೆದು ತೆಗೆದಿದ್ದಾರೆ: ಇಟ್ಟಿಗೆ ಮನೆಗಳು, ಬಾವಿಗಳು, ಮಡಕೆ, ಮಣಿಗಳು. ಸಿಕ್ಕಿದ್ದನ್ನೆಲ್ಲ ಒಂದು ವಸ್ತುಸಂಗ್ರಹಾಲಯದಲ್ಲಿ ತೋರಿಸುತ್ತಾರೆ.']},
 {ty:102,la:12.545,lo:79.873,n:['Vedanthangal Bird Sanctuary','वेदंतंगल पक्षी अभयारण्य','ವೇದಾಂತಂಗಲ್ ಪಕ್ಷಿಧಾಮ'],f:['One of the oldest bird sanctuaries in India. Villagers have protected the birds here for over 200 years, because bird droppings make the lake water rich for their fields.','भारत के सबसे पुराने पक्षी अभयारण्यों में से एक। गाँव वाले 200 से ज़्यादा सालों से यहाँ पक्षियों की रक्षा करते आए हैं, क्योंकि पक्षियों की बीट झील के पानी को उनके खेतों के लिए उपजाऊ बनाती है।','ಭಾರತದ ಅತಿ ಹಳೆಯ ಪಕ್ಷಿಧಾಮಗಳಲ್ಲಿ ಒಂದು. ಹಕ್ಕಿಗಳ ಹಿಕ್ಕೆ ಕೆರೆಯ ನೀರನ್ನು ಹೊಲಗಳಿಗೆ ಫಲವತ್ತಾಗಿಸುವುದರಿಂದ, ಹಳ್ಳಿಯವರು 200 ವರ್ಷಗಳಿಗೂ ಹೆಚ್ಚು ಕಾಲದಿಂದ ಇಲ್ಲಿನ ಹಕ್ಕಿಗಳನ್ನು ಕಾಪಾಡುತ್ತಿದ್ದಾರೆ.']},
 {ty:103,la:8.25,lo:77.53,n:['Muppandal wind farm','मुप्पंदल पवन फ़ार्म','ಮುಪ್ಪಂದಲ್ ಗಾಳಿಯಂತ್ರ ಕ್ಷೇತ್ರ'],f:['Strong winds rush through a gap in the hills near Kanniyakumari, so hundreds of tall wind turbines stand here making electricity.','कन्याकुमारी के पास पहाड़ियों के एक दर्रे से तेज़ हवाएँ बहती हैं, इसलिए यहाँ सैकड़ों ऊँची पवन चक्कियाँ खड़ी होकर बिजली बनाती हैं।','ಕನ್ಯಾಕುಮಾರಿ ಬಳಿ ಬೆಟ್ಟಗಳ ಕಣಿವೆಯೊಂದರ ಮೂಲಕ ಜೋರಾಗಿ ಗಾಳಿ ಬೀಸುತ್ತದೆ; ಹಾಗಾಗಿ ಇಲ್ಲಿ ನೂರಾರು ಎತ್ತರದ ಗಾಳಿಯಂತ್ರಗಳು ನಿಂತು ವಿದ್ಯುತ್ ತಯಾರಿಸುತ್ತವೆ.']},
 {ty:104,la:11.2063,lo:79.4486,n:['Gangaikonda Cholapuram','गंगैकोंड चोलपुरम','ಗಂಗೈಕೊಂಡ ಚೋಳಪುರಂ'],f:['Rajendra Chola I, son of the Big Temple king, built a new capital and a great temple here about 1,000 years ago. It is part of the UNESCO Great Living Chola Temples.','बड़े मंदिर वाले राजा के बेटे राजेंद्र चोल प्रथम ने लगभग 1,000 साल पहले यहाँ नई राजधानी और एक बड़ा मंदिर बनवाया। यह यूनेस्को के महान जीवंत चोल मंदिरों में शामिल है।','ಬೃಹದೀಶ್ವರ ದೇವಾಲಯ ಕಟ್ಟಿದ ರಾಜನ ಮಗ ರಾಜೇಂದ್ರ ಚೋಳ I ಸುಮಾರು 1,000 ವರ್ಷಗಳ ಹಿಂದೆ ಇಲ್ಲಿ ಹೊಸ ರಾಜಧಾನಿ ಮತ್ತು ಭವ್ಯ ದೇವಾಲಯ ಕಟ್ಟಿಸಿದ. ಇದು ಯುನೆಸ್ಕೋದ ಮಹಾನ್ ಜೀವಂತ ಚೋಳ ದೇವಾಲಯಗಳಲ್ಲಿ ಒಂದು.']},
 {ty:105,la:11.6,lo:76.95,n:['Nilgiri Biosphere Reserve','नीलगिरि जीवमंडल आरक्षित क्षेत्र','ನೀಲಗಿರಿ ಜೀವಗೋಳ ಮೀಸಲು'],f:["Started in 1986, this was India's first biosphere reserve. Its forests, shared with Karnataka and Kerala, are home to elephants, tigers and the Nilgiri tahr.",'1986 में शुरू हुआ यह भारत का पहला जीवमंडल आरक्षित क्षेत्र था। कर्नाटक और केरल के साथ फैले इसके जंगलों में हाथी, बाघ और नीलगिरि तहर रहते हैं।','1986ರಲ್ಲಿ ಆರಂಭವಾದ ಇದು ಭಾರತದ ಮೊದಲ ಜೀವಗೋಳ ಮೀಸಲು. ಕರ್ನಾಟಕ, ಕೇರಳದ ಜೊತೆ ಹಂಚಿಕೊಂಡಿರುವ ಇದರ ಕಾಡುಗಳಲ್ಲಿ ಆನೆ, ಹುಲಿ, ನೀಲಗಿರಿ ತಾರ್ ವಾಸಿಸುತ್ತವೆ.']}
],

 {ty:100,la:11.9345,lo:79.8305,n:['Aayi Mandapam','आयी मंडपम','ಆಯಿ ಮಂಟಪ'],f:['This white monument in the middle of Bharathi Park was built in the time of the French emperor Napoleon III. It remembers Aayi, a woman who gave the town a pond for water.','भारती पार्क के बीच का यह सफ़ेद स्मारक फ़्रांसीसी सम्राट नेपोलियन तृतीय के समय बना। यह आयी नाम की उस महिला की याद में है जिसने शहर को पानी के लिए तालाब दिया।','ಭಾರತಿ ಉದ್ಯಾನದ ನಡುವಿನ ಈ ಬಿಳಿ ಸ್ಮಾರಕವನ್ನು ಫ್ರೆಂಚ್ ಚಕ್ರವರ್ತಿ ಮೂರನೇ ನೆಪೋಲಿಯನ್ ಕಾಲದಲ್ಲಿ ಕಟ್ಟಲಾಯಿತು. ಊರಿಗೆ ನೀರಿಗಾಗಿ ಕೊಳ ಕೊಟ್ಟ ಆಯಿ ಎಂಬ ಮಹಿಳೆಯ ನೆನಪಿನದು.']},
 {ty:101,la:11.942,lo:79.836,n:['French War Memorial','फ़्रांसीसी युद्ध स्मारक','ಫ್ರೆಂಚ್ ಯುದ್ಧ ಸ್ಮಾರಕ'],f:['Built in 1971 on the seafront, it honours soldiers who died in the First World War. It is lit up every year on 14 July, Bastille Day.','1971 में समुद्र तट पर बना यह स्मारक पहले विश्व युद्ध में मारे गए सैनिकों का सम्मान करता है। हर साल 14 जुलाई, बास्तील दिवस पर इसे रोशन किया जाता है।','1971ರಲ್ಲಿ ಕಡಲತೀರದಲ್ಲಿ ಕಟ್ಟಿದ ಇದು ಮೊದಲ ಮಹಾಯುದ್ಧದಲ್ಲಿ ಮಡಿದ ಸೈನಿಕರ ಗೌರವಾರ್ಥ. ಪ್ರತಿ ವರ್ಷ ಜುಲೈ 14, ಬಾಸ್ತಿಲ್ ದಿನದಂದು ಇದಕ್ಕೆ ದೀಪಾಲಂಕಾರ ಮಾಡುತ್ತಾರೆ.']},
 {ty:102,la:11.865,lo:79.79,n:['Chunnambar backwaters','चुन्नाम्बर बैकवॉटर','ಚುನ್ನಾಂಬರ್ ಹಿನ್ನೀರು'],f:['Calm backwaters wind through mangroves here. Boats carry visitors from the boat house to the beach, past birds fishing along the banks.','यहाँ शांत बैकवॉटर मैंग्रोव के बीच से घुमावदार बहते हैं। नावें सैलानियों को बोट हाउस से तट तक ले जाती हैं, किनारों पर मछली पकड़ते पक्षियों के पास से।','ಇಲ್ಲಿ ಶಾಂತ ಹಿನ್ನೀರು ಕಾಂಡ್ಲಾ ಕಾಡಿನ ನಡುವೆ ಅಂಕುಡೊಂಕಾಗಿ ಹರಿಯುತ್ತದೆ. ದೋಣಿಗಳು ಪ್ರವಾಸಿಗರನ್ನು ದೋಣಿಮನೆಯಿಂದ ಕಡಲತೀರಕ್ಕೆ ಕರೆದೊಯ್ಯುತ್ತವೆ, ದಡದಲ್ಲಿ ಮೀನು ಹಿಡಿಯುವ ಹಕ್ಕಿಗಳ ಪಕ್ಕದಿಂದ.']},

 {ty:104,la:11.715,lo:75.548,n:['The name Mahe','माहे का नाम','ಮಾಹೆ ಹೆಸರು'],f:["Many people think Mahe was named after the French officer Mahé de La Bourdonnais, but the local Malayalam name, Mayyazhi, is older, and the French spelling simply sounded like his name.",'बहुत से लोग सोचते हैं कि माहे का नाम फ़्रांसीसी अफ़सर माहे दे ला बूर्दोने पर पड़ा, पर इसका मलयालम नाम मय्यऴि उससे पुराना है, और फ़्रांसीसी वर्तनी बस उनके नाम जैसी सुनाई देती थी।','ಮಾಹೆಗೆ ಫ್ರೆಂಚ್ ಅಧಿಕಾರಿ ಮಾಹೆ ದ ಲಾ ಬೂರ್ದೋನೆಯ ಹೆಸರಿಟ್ಟರು ಎಂದು ಅನೇಕರು ತಿಳಿದಿದ್ದಾರೆ; ಆದರೆ ಇದರ ಮಲಯಾಳಂ ಹೆಸರು ಮಯ್ಯಳಿ ಅದಕ್ಕಿಂತ ಹಳೆಯದು, ಫ್ರೆಂಚ್ ಕಾಗುಣಿತ ಅವರ ಹೆಸರಿನಂತೆ ಕೇಳಿಸುತ್ತಿತ್ತು ಅಷ್ಟೇ.']},

 fact:{
  ka:[["At Mysuru Dasara, a grand elephant carries the golden howdah through the city.", "मैसूरु दशहरे में एक भव्य हाथी सोने का हौदा लेकर शहर में निकलता है।", "ಮೈಸೂರು ದಸರಾದಲ್ಲಿ ಭವ್ಯ ಆನೆ ಚಿನ್ನದ ಅಂಬಾರಿ ಹೊತ್ತು ನಗರದಲ್ಲಿ ಸಾಗುತ್ತದೆ."],
   ["Mysore mallige is so special it has its own GI tag.", "मैसूर मल्लिगे इतनी ख़ास है कि उसे अपना जीआई टैग मिला है।", "ಮೈಸೂರು ಮಲ್ಲಿಗೆ ಎಷ್ಟು ವಿಶೇಷ ಎಂದರೆ ಅದಕ್ಕೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಸಿಕ್ಕಿದೆ."],
   ["Brass lamps are lit at dusk in homes and temples to welcome the light.", "शाम को घरों और मंदिरों में रोशनी के स्वागत में पीतल के दीये जलाए जाते हैं।", "ಸಂಜೆ ಮನೆ ಮತ್ತು ದೇವಾಲಯಗಳಲ್ಲಿ ಬೆಳಕನ್ನು ಸ್ವಾಗತಿಸಲು ಹಿತ್ತಾಳೆ ದೀಪ ಹಚ್ಚುತ್ತಾರೆ."],
   ["Karnataka grows most of India's coffee, in the hills of Chikkamagaluru and Kodagu.", "भारत की ज़्यादातर कॉफ़ी कर्नाटक के चिकमगलूरु और कोडगु की पहाड़ियों में उगती है।", "ಭಾರತದ ಹೆಚ್ಚಿನ ಕಾಫಿ ಕರ್ನಾಟಕದ ಚಿಕ್ಕಮಗಳೂರು ಮತ್ತು ಕೊಡಗಿನ ಬೆಟ್ಟಗಳಲ್ಲಿ ಬೆಳೆಯುತ್ತದೆ."],
   ["A coconut is broken for luck at every new beginning.", "हर नई शुरुआत पर शुभ के लिए नारियल फोड़ा जाता है।", "ಪ್ರತಿ ಹೊಸ ಆರಂಭದಲ್ಲೂ ಶುಭಕ್ಕಾಗಿ ತೆಂಗಿನಕಾಯಿ ಒಡೆಯುತ್ತಾರೆ."],
   ["The peacock is India's national bird.", "मोर भारत का राष्ट्रीय पक्षी है।", "ನವಿಲು ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಪಕ್ಷಿ."],
   ["Channapatna is called the town of toys, for its bright lacquered wooden toys.", "रंग-बिरंगे लकड़ी के खिलौनों के कारण चन्नपटना को खिलौनों का शहर कहते हैं।", "ಬಣ್ಣಬಣ್ಣದ ಮರದ ಗೊಂಬೆಗಳಿಗಾಗಿ ಚನ್ನಪಟ್ಟಣವನ್ನು 'ಗೊಂಬೆಗಳ ಊರು' ಎನ್ನುತ್ತಾರೆ."],
   ["Mysore pak was first made in the royal kitchen of Mysuru Palace.", "मैसूर पाक पहली बार मैसूरु महल की शाही रसोई में बना था।", "ಮೈಸೂರು ಪಾಕ್ ಮೊದಲು ತಯಾರಾದದ್ದು ಮೈಸೂರು ಅರಮನೆಯ ಅಡುಗೆಮನೆಯಲ್ಲಿ."],
   ["Hampi was the capital of the great Vijayanagara empire, and is now a UNESCO World Heritage Site.", "हम्पी महान विजयनगर साम्राज्य की राजधानी थी, आज यह यूनेस्को विश्व धरोहर है।", "ಹಂಪಿ ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ರಾಜಧಾನಿಯಾಗಿತ್ತು, ಇಂದು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣ."],
   ["The lotus blooms clean and bright even in muddy water.", "कमल कीचड़ में भी साफ़ और सुंदर खिलता है।", "ಕೆಸರಿನಲ್ಲೂ ಕಮಲ ಶುಭ್ರವಾಗಿ, ಸುಂದರವಾಗಿ ಅರಳುತ್ತದೆ."],
   ["Every summer Karnataka's markets fill with Badami and Raspuri mangoes.", "हर गर्मी में कर्नाटक के बाज़ार बादामी और रसपुरी आमों से भर जाते हैं।", "ಪ್ರತಿ ಬೇಸಿಗೆಯಲ್ಲಿ ಕರ್ನಾಟಕದ ಮಾರುಕಟ್ಟೆಗಳು ಬಾದಾಮಿ, ರಸಪುರಿ ಮಾವಿನಿಂದ ತುಂಬುತ್ತವೆ."],
   ["The nadaswaram is a long wooden pipe played at temple festivals and weddings.", "नादस्वरम लकड़ी का लंबा बाजा है, जो मंदिर उत्सवों और शादियों में बजता है।", "ನಾದಸ್ವರ ಮರದ ಉದ್ದನೆಯ ವಾದ್ಯ, ದೇವಾಲಯದ ಉತ್ಸವ ಮತ್ತು ಮದುವೆಗಳಲ್ಲಿ ನುಡಿಸುತ್ತಾರೆ."],
   ["Dasara elephants practise walking with heavy loads for weeks before the big parade.", "दशहरे के हाथी बड़े जुलूस से पहले हफ़्तों तक भारी बोझ लेकर चलने का अभ्यास करते हैं।", "ದಸರಾ ಆನೆಗಳು ಮೆರವಣಿಗೆಗೆ ಮುಂಚೆ ವಾರಗಟ್ಟಲೆ ಭಾರ ಹೊತ್ತು ನಡೆಯುವ ತಾಲೀಮು ಮಾಡುತ್ತವೆ."],
   ["Orange kanakambara and white jasmine are often strung together in one hair garland.", "नारंगी कनकाम्बर और सफ़ेद चमेली अक्सर एक ही गजरे में गूँथे जाते हैं।", "ಕಿತ್ತಳೆ ಬಣ್ಣದ ಕನಕಾಂಬರ ಮತ್ತು ಬಿಳಿ ಮಲ್ಲಿಗೆಯನ್ನು ಒಂದೇ ದಂಡೆಯಲ್ಲಿ ಕಟ್ಟುತ್ತಾರೆ."],
   ["A five-flame lamp is lit in homes and temples during festivals and pujas.", "त्योहारों और पूजा में घरों व मंदिरों में पाँच बत्ती वाला दीया जलाया जाता है।", "ಹಬ್ಬ ಮತ್ತು ಪೂಜೆಗಳಲ್ಲಿ ಮನೆ, ದೇವಸ್ಥಾನಗಳಲ್ಲಿ ಐದು ಬತ್ತಿಯ ದೀಪ ಹಚ್ಚುತ್ತಾರೆ."],
   ["Filter coffee is poured between the tumbler and its bowl to cool it and make it frothy.", "फ़िल्टर कॉफ़ी को गिलास और कटोरी के बीच उड़ेलकर ठंडा और झागदार बनाया जाता है।", "ಫಿಲ್ಟರ್ ಕಾಫಿಯನ್ನು ಲೋಟ ಮತ್ತು ದಬರದ ನಡುವೆ ಎತ್ತಿ ಸುರಿದು ನೊರೆ ಬರಿಸುತ್ತಾರೆ."],
   ["Dry coconut is grated into many Karnataka sweets and chutneys.", "सूखे नारियल को कद्दूकस करके कर्नाटक की कई मिठाइयों और चटनियों में डाला जाता है।", "ಒಣ ಕೊಬ್ಬರಿಯನ್ನು ತುರಿದು ಕರ್ನಾಟಕದ ಅನೇಕ ಸಿಹಿ ಮತ್ತು ಚಟ್ನಿಗಳಿಗೆ ಹಾಕುತ್ತಾರೆ."],
   ["A peacock's long 'tail' is really a bunch of special feathers called a train.", "मोर की लंबी 'पूँछ' असल में ख़ास पंखों का गुच्छा है।", "ನವಿಲಿನ ಉದ್ದ 'ಬಾಲ' ನಿಜವಾದ ಬಾಲವಲ್ಲ, ಅದು ವಿಶೇಷ ಗರಿಗಳ ಗೊಂಚಲು."],
   ["Channapatna toys are coloured with natural dyes, so they are safe for little children.", "चन्नपट्टन के खिलौने प्राकृतिक रंगों से रंगे जाते हैं, इसलिए छोटे बच्चों के लिए सुरक्षित हैं।", "ಚನ್ನಪಟ್ಟಣದ ಬೊಂಬೆಗಳಿಗೆ ಸಹಜ ಬಣ್ಣ ಹಚ್ಚುವುದರಿಂದ ಪುಟ್ಟ ಮಕ್ಕಳಿಗೂ ಸುರಕ್ಷಿತ."],
   ["Dharwad pedha is a brown milk sweet with its own GI tag.", "धारवाड़ पेड़ा दूध से बनी भूरी मिठाई है, जिसे अपना जीआई टैग मिला है।", "ಧಾರವಾಡ ಪೇಡಾ ಹಾಲಿನಿಂದ ಮಾಡುವ ಕಂದು ಬಣ್ಣದ ಸಿಹಿ; ಇದಕ್ಕೂ ಭೌಗೋಳಿಕ ಗುರುತು ಸಿಕ್ಕಿದೆ."],
   ["Some stone pillars at Hampi's Vittala temple make musical notes when tapped.", "हम्पी के विट्ठल मंदिर के कुछ पत्थर के खंभे थपथपाने पर संगीत के सुर निकालते हैं।", "ಹಂಪಿಯ ವಿಠಲ ದೇವಸ್ಥಾನದ ಕೆಲವು ಕಲ್ಲಿನ ಕಂಬಗಳನ್ನು ತಟ್ಟಿದರೆ ಸಂಗೀತದ ಸ್ವರ ಕೇಳುತ್ತದೆ."],
   ["Water never stays on a lotus leaf; it rolls off in shiny drops.", "कमल के पत्ते पर पानी टिकता नहीं, चमकती बूँदें बनकर लुढ़क जाता है।", "ತಾವರೆ ಎಲೆಯ ಮೇಲೆ ನೀರು ನಿಲ್ಲದೆ ಹೊಳೆಯುವ ಹನಿಗಳಾಗಿ ಜಾರುತ್ತದೆ."],
   ["Raw mango goes into chitranna, a tangy rice made for festivals.", "कच्चे आम से चित्रान्न बनता है, त्योहारों का खट्टा-चटपटा चावल।", "ಮಾವಿನಕಾಯಿ ಚಿತ್ರಾನ್ನ ಹಬ್ಬದ ದಿನಗಳ ಹುಳಿ ಹುಳಿ ರುಚಿಯ ಅನ್ನ."],
   ["The sweet sound of the shehnai is heard at weddings and festivals.", "शहनाई की मीठी धुन शादियों और त्योहारों में बजती है।", "ಶಹನಾಯಿಯ ಇಂಪಾದ ನಾದ ಮದುವೆ, ಹಬ್ಬಗಳಲ್ಲಿ ಕೇಳಿಬರುತ್ತದೆ."],
   ["The two-headed Gandaberunda bird is the emblem of Karnataka's government.", "दो सिर वाला गंडभेरुंड पक्षी कर्नाटक सरकार का प्रतीक चिह्न है।", "ಎರಡು ತಲೆಯ ಗಂಡಭೇರುಂಡ ಪಕ್ಷಿ ಕರ್ನಾಟಕ ಸರ್ಕಾರದ ಲಾಂಛನ."],
   ["In royal processions, guards with silver maces walked ahead of the king.", "शाही जुलूस में चाँदी की गदा लिए पहरेदार राजा के आगे चलते थे।", "ರಾಜರ ಮೆರವಣಿಗೆಯಲ್ಲಿ ಬೆಳ್ಳಿ ಗದೆ ಹಿಡಿದ ಕಾವಲುಗಾರರು ಮುಂದೆ ನಡೆಯುತ್ತಿದ್ದರು."],
   ["Small cymbals keep the rhythm in bhajans and Yakshagana.", "भजन और यक्षगान में छोटे मंजीरे ताल बनाए रखते हैं।", "ಭಜನೆ ಮತ್ತು ಯಕ್ಷಗಾನದಲ್ಲಿ ತಾಳ ಲಯ ಹಿಡಿದಿಡುತ್ತದೆ."],
   ["A royal umbrella was held over kings and gods as a mark of honour.", "सम्मान दिखाने के लिए राजाओं और देवताओं के ऊपर राजछत्र रखा जाता था।", "ಗೌರವದ ಗುರುತಾಗಿ ರಾಜರು ಮತ್ತು ದೇವರ ಮೇಲೆ ರಾಜಛತ್ರಿ ಹಿಡಿಯುತ್ತಿದ್ದರು."],
   ["Sailors from Karnataka's coast carried pepper to faraway lands.", "कर्नाटक के तट से नाविक काली मिर्च दूर देशों तक ले जाते थे।", "ಕರ್ನಾಟಕದ ಕರಾವಳಿಯಿಂದ ನಾವಿಕರು ಕಾಳುಮೆಣಸನ್ನು ದೂರದ ದೇಶಗಳಿಗೆ ಸಾಗಿಸುತ್ತಿದ್ದರು."],
   ["A palanquin was carried on the shoulders of four or more bearers.", "पालकी को चार या ज़्यादा कहार कंधों पर उठाते थे।", "ಪಲ್ಲಕ್ಕಿಯನ್ನು ನಾಲ್ಕು ಅಥವಾ ಹೆಚ್ಚು ಜನ ಹೆಗಲ ಮೇಲೆ ಹೊರುತ್ತಿದ್ದರು."],
   ["The mridanga has two faces, and both are played at once in Carnatic music.", "मृदंगम के दो मुख होते हैं, कर्नाटक संगीत में दोनों एक साथ बजाए जाते हैं।", "ಮೃದಂಗಕ್ಕೆ ಎರಡು ಮುಖ; ಕರ್ನಾಟಕ ಸಂಗೀತದಲ್ಲಿ ಎರಡನ್ನೂ ಒಟ್ಟಿಗೆ ನುಡಿಸುತ್ತಾರೆ."],
   ["Swords of Karnataka's old kingdoms were made from very strong steel.", "कर्नाटक के पुराने राज्यों की तलवारें बहुत मज़बूत इस्पात से बनती थीं।", "ಹಳೆಯ ಕನ್ನಡ ರಾಜರ ಖಡ್ಗಗಳನ್ನು ಬಹಳ ಗಟ್ಟಿಯಾದ ಉಕ್ಕಿನಿಂದ ಮಾಡುತ್ತಿದ್ದರು."],
   ["A kindi is a spouted water pot used in pujas to pour water.", "किंडी टोंटी वाला लोटा है, जिससे पूजा में जल चढ़ाया जाता है।", "ಕಿಂಡಿ ಮೂತಿಯಿರುವ ಪಾತ್ರೆ; ಪೂಜೆಯಲ್ಲಿ ನೀರು ಸುರಿಯಲು ಬಳಸುತ್ತಾರೆ."],
   ["Chess was born in India as chaturanga, and Mysuru's kings loved it.", "शतरंज भारत में चतुरंग के रूप में जन्मा, और मैसूर के राजाओं को यह बहुत पसंद था।", "ಚದುರಂಗ ಭಾರತದಲ್ಲೇ ಹುಟ್ಟಿದ ಆಟ; ಮೈಸೂರಿನ ರಾಜರಿಗೆ ಇದು ತುಂಬಾ ಇಷ್ಟ."],
   ["Devotees ring the temple bell as they enter.", "भक्त मंदिर में प्रवेश करते समय घंटी बजाते हैं।", "ಭಕ್ತರು ದೇವಸ್ಥಾನ ಪ್ರವೇಶಿಸುವಾಗ ಗಂಟೆ ಬಾರಿಸುತ್ತಾರೆ."],
   ["Kings stamped their letters with a royal seal so people knew they were real.", "राजा अपने पत्रों पर राजमुहर लगाते थे ताकि सब जानें कि वे असली हैं।", "ಪತ್ರ ನಿಜವೆಂದು ತಿಳಿಯಲು ರಾಜರು ಅದರ ಮೇಲೆ ರಾಜಮುದ್ರೆ ಒತ್ತುತ್ತಿದ್ದರು."],
   ["Mysore silk sarees use pure silk and real gold zari.", "मैसूर सिल्क साड़ी में शुद्ध रेशम और असली सोने की ज़री लगती है।", "ಮೈಸೂರು ರೇಷ್ಮೆ ಸೀರೆಗೆ ಶುದ್ಧ ರೇಷ್ಮೆ ಮತ್ತು ನಿಜವಾದ ಚಿನ್ನದ ಜರಿ ಬಳಸುತ್ತಾರೆ."],
   ["Honoured guests in Karnataka are welcomed with a Mysore peta.", "कर्नाटक में सम्मानित मेहमानों को मैसूर पेटा पहनाकर स्वागत किया जाता है।", "ಗೌರವಾನ್ವಿತ ಅತಿಥಿಗಳಿಗೆ ಮೈಸೂರು ಪೇಟ ತೊಡಿಸಿ ಸನ್ಮಾನಿಸುತ್ತಾರೆ."],
   ["Yakshagana is an all-night dance drama from the coast, with giant crowns.", "यक्षगान तटीय कर्नाटक का रात भर चलने वाला नृत्य-नाटक है, जिसके मुकुट बहुत बड़े होते हैं।", "ಯಕ್ಷಗಾನ ಕರಾವಳಿಯ ರಾತ್ರಿಯಿಡೀ ನಡೆಯುವ ನೃತ್ಯನಾಟಕ; ಅದರ ಕಿರೀಟಗಳು ದೊಡ್ಡವು."],
   ["Mysore Ganjifa cards are round and hand-painted with stories from the epics.", "मैसूर गंजीफ़ा पत्ते गोल होते हैं और उन पर पुराणों की कहानियाँ हाथ से चित्रित होती हैं।", "ಮೈಸೂರು ಗಂಜೀಫಾ ಎಲೆಗಳು ದುಂಡಗಿದ್ದು, ಪುರಾಣ ಕಥೆಗಳ ಚಿತ್ರಗಳನ್ನು ಕೈಯಲ್ಲೇ ಬಿಡಿಸುತ್ತಾರೆ."],
   ["Bidriware from Bidar has silver patterns set into a black metal.", "बीदर के बिदरी काम में काली धातु में चाँदी के नक़्श जड़े जाते हैं।", "ಬೀದರಿನ ಬಿದರಿ ಕಲೆಯಲ್ಲಿ ಕಪ್ಪು ಲೋಹದೊಳಗೆ ಬೆಳ್ಳಿಯ ಚಿತ್ತಾರ ಕೂರಿಸುತ್ತಾರೆ."],
   ["Mysuru sandalwood is famous for its sweet smell and is used in soap and carvings.", "मैसूर चंदन अपनी मीठी ख़ुशबू के लिए मशहूर है, साबुन और नक़्क़ाशी में काम आता है।", "ಮೈಸೂರು ಶ್ರೀಗಂಧ ತನ್ನ ಸುವಾಸನೆಗೆ ಹೆಸರಾಗಿದ್ದು, ಸಾಬೂನು ಮತ್ತು ಕೆತ್ತನೆಗೆ ಬಳಕೆಯಾಗುತ್ತದೆ."],
   ["A crispy masala dosa is filled with spiced potato palya.", "कुरकुरे मसाला डोसे के अंदर आलू की मसालेदार सब्ज़ी भरी होती है।", "ಗರಿಗರಿ ಮಸಾಲೆ ದೋಸೆಯೊಳಗೆ ಆಲೂಗಡ್ಡೆ ಪಲ್ಯ ಇರುತ್ತದೆ."],
   ["Guests are offered betel leaves and areca nut as a sign of respect.", "मेहमानों को सम्मान से पान का पत्ता और सुपारी दी जाती है।", "ಅತಿಥಿಗಳಿಗೆ ಗೌರವದಿಂದ ವೀಳ್ಯದೆಲೆ ಅಡಿಕೆ ಕೊಡುತ್ತಾರೆ."],
   ["In Gol Gumbaz's round gallery, even a whisper can be heard on the far side.", "गोल गुंबज की गोल दीर्घा में फुसफुसाहट भी दूसरी ओर सुनाई देती है।", "ಗೋಲ ಗುಮ್ಮಟದ ಸುತ್ತಿನ ಮೊಗಸಾಲೆಯಲ್ಲಿ ಮೆಲ್ಲನೆ ಪಿಸುಗುಟ್ಟಿದರೂ ಆಚೆ ಬದಿಗೆ ಕೇಳಿಸುತ್ತದೆ."],
   ["The Mysore veena was loved by the Wodeyar kings, and great veena players sang at their court.", "मैसूर के वोडेयार राजाओं को वीणा बहुत प्रिय थी, और उनके दरबार में बड़े वीणा वादक बजाते थे।", "ಮೈಸೂರು ಒಡೆಯರಿಗೆ ವೀಣೆ ಬಹಳ ಪ್ರಿಯ; ಅವರ ಆಸ್ಥಾನದಲ್ಲಿ ಮಹಾನ್ ವೈಣಿಕರು ನುಡಿಸುತ್ತಿದ್ದರು."],
   ["The jackfruit is the biggest fruit that grows on a tree.", "कटहल पेड़ पर उगने वाला सबसे बड़ा फल है।", "ಹಲಸು ಮರದಲ್ಲಿ ಬೆಳೆಯುವ ಅತಿದೊಡ್ಡ ಹಣ್ಣು."],
   ["In coastal Kambala, pairs of buffaloes race through muddy paddy fields.", "तटीय कम्बला में भैंसों के जोड़े कीचड़ भरे धान के खेतों में दौड़ते हैं।", "ಕರಾವಳಿಯ ಕಂಬಳದಲ್ಲಿ ಕೋಣಗಳ ಜೋಡಿ ಕೆಸರುಗದ್ದೆಯಲ್ಲಿ ಓಡುತ್ತವೆ."]],
  br:[["In Madhubani paintings, a pair of fish stands for good luck and happiness.", "मधुबनी चित्रों में मछली का जोड़ा सौभाग्य और खुशी का प्रतीक है।", "ಮಧುಬನಿ ಚಿತ್ರಗಳಲ್ಲಿ ಮೀನಿನ ಜೋಡಿ ಅದೃಷ್ಟ ಮತ್ತು ಸಂತೋಷದ ಸಂಕೇತ."],
   ["Muzaffarpur's Shahi litchi is famous across India and has a GI tag.", "मुज़फ़्फ़रपुर की शाही लीची पूरे भारत में मशहूर है और उसे जीआई टैग मिला है।", "ಮುಜಫ್ಫರ್‌ಪುರದ ಶಾಹಿ ಲಿಚಿ ಭಾರತದಾದ್ಯಂತ ಪ್ರಸಿದ್ಧ, ಅದಕ್ಕೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆಯೂ ಇದೆ."],
   ["Most of India's makhana (fox nuts) comes from the ponds of Mithila in Bihar.", "भारत का ज़्यादातर मखाना बिहार के मिथिला के तालाबों से आता है।", "ಭಾರತದ ಹೆಚ್ಚಿನ ಮಖಾನಾ ಬಿಹಾರದ ಮಿಥಿಲಾ ಪ್ರದೇಶದ ಕೊಳಗಳಿಂದ ಬರುತ್ತದೆ."],
   ["Litti are wheat balls stuffed with sattu and roasted, eaten with mashed chokha.", "लिट्टी सत्तू भरे गेहूँ के गोले हैं, जिन्हें सेंककर चोखे के साथ खाते हैं।", "ಲಿಟ್ಟಿ ಎಂದರೆ ಸತ್ತು ತುಂಬಿ ಸುಟ್ಟ ಗೋಧಿ ಉಂಡೆಗಳು, ಅದನ್ನು ಚೋಖಾ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Sikki baskets are woven from shiny golden wild grass.", "सिक्की की टोकरियाँ चमकीली सुनहरी जंगली घास से बुनी जाती हैं।", "ಸಿಕ್ಕಿ ಬುಟ್ಟಿಗಳನ್ನು ಹೊಳೆಯುವ ಚಿನ್ನದ ಬಣ್ಣದ ಕಾಡುಹುಲ್ಲಿನಿಂದ ಹೆಣೆಯುತ್ತಾರೆ."],
   ["At Chhath, families offer fruits to the Sun in a bamboo soop.", "छठ में परिवार बाँस के सूप में फल रखकर सूर्य को अर्घ्य देते हैं।", "ಛಠ್ ಹಬ್ಬದಲ್ಲಿ ಕುಟುಂಬಗಳು ಬಿದಿರಿನ ಮೊರದಲ್ಲಿ ಹಣ್ಣಿಟ್ಟು ಸೂರ್ಯನಿಗೆ ಅರ್ಪಿಸುತ್ತಾರೆ."],
   ["The Buddha found enlightenment under a Bodhi tree in Bodh Gaya.", "बोधगया में बोधि वृक्ष के नीचे बुद्ध को ज्ञान मिला।", "ಬೋಧಗಯಾದ ಬೋಧಿ ವೃಕ್ಷದ ಕೆಳಗೆ ಬುದ್ಧನಿಗೆ ಜ್ಞಾನೋದಯವಾಯಿತು."],
   ["The Mahabodhi Temple in Bodh Gaya is a UNESCO World Heritage Site.", "बोधगया का महाबोधि मंदिर यूनेस्को विश्व धरोहर है।", "ಬೋಧಗಯಾದ ಮಹಾಬೋಧಿ ದೇವಾಲಯ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣ."],
   ["Madhubani artists draw animals like the tortoise with fine, careful lines.", "मधुबनी कलाकार कछुए जैसे जानवरों को बारीक रेखाओं से बनाते हैं।", "ಮಧುಬನಿ ಕಲಾವಿದರು ಆಮೆಯಂತಹ ಪ್ರಾಣಿಗಳನ್ನು ಸೂಕ್ಷ್ಮ ಗೆರೆಗಳಿಂದ ಚಿತ್ರಿಸುತ್ತಾರೆ."],
   ["In Madhubani paintings, parrots are messengers of love.", "मधुबनी चित्रों में तोते प्रेम के संदेशवाहक होते हैं।", "ಮಧುಬನಿ ಚಿತ್ರಗಳಲ್ಲಿ ಗಿಳಿಗಳು ಪ್ರೀತಿಯ ಸಂದೇಶವಾಹಕರು."],
   ["Chhath, Bihar's biggest festival, is a thank-you to the Sun.", "बिहार का सबसे बड़ा पर्व छठ सूर्य को धन्यवाद कहने का त्योहार है।", "ಬಿಹಾರದ ದೊಡ್ಡ ಹಬ್ಬ ಛಠ್, ಸೂರ್ಯನಿಗೆ ಕೃತಜ್ಞತೆ ಹೇಳುವ ಹಬ್ಬ."],
   ["Tall sugarcane stalks decorate the riverbanks at Chhath.", "छठ पर नदी के घाट ऊँचे गन्नों से सजाए जाते हैं।", "ಛಠ್ ಹಬ್ಬದಲ್ಲಿ ನದಿ ದಡಗಳನ್ನು ಎತ್ತರದ ಕಬ್ಬಿನಿಂದ ಅಲಂಕರಿಸುತ್ತಾರೆ."],
   ["In Madhubani art, fish stand for good luck and plenty.", "मधुबनी चित्रकला में मछली सौभाग्य और समृद्धि का प्रतीक है।", "ಮಧುಬನಿ ಚಿತ್ರಕಲೆಯಲ್ಲಿ ಮೀನು ಶುಭ ಮತ್ತು ಸಮೃದ್ಧಿಯ ಸಂಕೇತ."],
   ["Shahi litchi from Muzaffarpur has its own GI tag.", "मुज़फ़्फ़रपुर की शाही लीची को अपना जीआई टैग मिला है।", "ಮುಜಫ್ಫರ್‌ಪುರದ ಶಾಹಿ ಲಿಚಿಗೆ ಭೌಗೋಳಿಕ ಗುರುತು ಸಿಕ್ಕಿದೆ."],
   ["Most of India's makhana grows in the ponds of Mithila.", "भारत का ज़्यादातर मखाना मिथिला के तालाबों में उगता है।", "ಭಾರತದ ಹೆಚ್ಚಿನ ಮಖಾನಾ ಮಿಥಿಲೆಯ ಕೊಳಗಳಲ್ಲಿ ಬೆಳೆಯುತ್ತದೆ."],
   ["Litti is roasted over a fire and eaten with mashed chokha.", "लिट्टी आग पर सेंकी जाती है और चोखे के साथ खाई जाती है।", "ಲಿಟ್ಟಿಯನ್ನು ಬೆಂಕಿಯ ಮೇಲೆ ಸುಟ್ಟು ಚೋಖಾ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Sikki baskets are woven from golden wild grass.", "सिक्की की टोकरियाँ सुनहरी जंगली घास से बुनी जाती हैं।", "ಸಿಕ್ಕಿ ಬುಟ್ಟಿಗಳನ್ನು ಚಿನ್ನದ ಬಣ್ಣದ ಕಾಡು ಹುಲ್ಲಿನಿಂದ ಹೆಣೆಯುತ್ತಾರೆ."],
   ["At Chhath, fruits and thekua are offered to the Sun in a bamboo soop.", "छठ में बाँस के सूप में फल और ठेकुआ रखकर सूर्य को अर्घ्य दिया जाता है।", "ಛಠ್ ಹಬ್ಬದಲ್ಲಿ ಬಿದಿರಿನ ಮೊರದಲ್ಲಿ ಹಣ್ಣು, ಠೇಕುವಾ ಇಟ್ಟು ಸೂರ್ಯನಿಗೆ ಅರ್ಪಿಸುತ್ತಾರೆ."],
   ["The Buddha found enlightenment under a peepal tree at Bodh Gaya.", "बुद्ध को बोधगया में पीपल के पेड़ के नीचे ज्ञान मिला।", "ಬುದ್ಧನಿಗೆ ಬೋಧಗಯಾದಲ್ಲಿ ಅರಳಿ ಮರದ ಕೆಳಗೆ ಜ್ಞಾನೋದಯವಾಯಿತು."],
   ["The Mahabodhi Temple at Bodh Gaya is a UNESCO World Heritage Site.", "बोधगया का महाबोधि मंदिर यूनेस्को विश्व धरोहर स्थल है।", "ಬೋಧಗಯಾದ ಮಹಾಬೋಧಿ ದೇವಾಲಯ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣ."],
   ["In Madhubani paintings, the tortoise is a sign of long life.", "मधुबनी चित्रों में कछुआ लंबी उम्र का प्रतीक माना जाता है।", "ಮಧುಬನಿ ಚಿತ್ರಗಳಲ್ಲಿ ಆಮೆ ದೀರ್ಘಾಯುಷ್ಯದ ಸಂಕೇತ."],
   ["Parrots in Madhubani paintings stand for love and happiness.", "मधुबनी चित्रों में तोता प्रेम और ख़ुशी का प्रतीक है।", "ಮಧುಬನಿ ಚಿತ್ರಗಳಲ್ಲಿ ಗಿಳಿ ಪ್ರೀತಿ ಮತ್ತು ಸಂತೋಷದ ಸಂಕೇತ."],
   ["Madhubani artists often draw the sun and moon with faces.", "मधुबनी कलाकार अक्सर सूरज और चाँद को चेहरे वाला बनाते हैं।", "ಮಧುಬನಿ ಕಲಾವಿದರು ಸೂರ್ಯ ಚಂದ್ರರಿಗೆ ಮುಖ ಬಿಡಿಸುತ್ತಾರೆ."],
   ["At Chhath, sugarcane stalks are tied into a canopy over the offerings.", "छठ पूजा में गन्नों को बाँधकर अर्घ्य के ऊपर मंडप बनाया जाता है।", "ಛಠ್ ಪೂಜೆಯಲ್ಲಿ ಕಬ್ಬಿನ ಜಲ್ಲೆಗಳನ್ನು ಕಟ್ಟಿ ಮಂಟಪ ಮಾಡುತ್ತಾರೆ."],
   ["Sujini quilts are stitched from old saris and embroidered with stories.", "सुजनी रज़ाई पुरानी साड़ियों से बनती है और उस पर कहानियाँ कढ़ी होती हैं।", "ಸುಜನಿ ಹೊದಿಕೆಯನ್ನು ಹಳೆಯ ಸೀರೆಗಳಿಂದ ಹೊಲಿದು ಕಥೆಗಳನ್ನು ಕಸೂತಿ ಮಾಡುತ್ತಾರೆ."],
   ["Manjusha art from Bhagalpur tells the story of Bihula and the snake goddess.", "भागलपुर की मंजूषा कला बिहुला और नाग देवी की कथा कहती है।", "ಭಾಗಲ್ಪುರದ ಮಂಜೂಷಾ ಕಲೆ ಬಿಹುಲಾ ಮತ್ತು ನಾಗದೇವತೆಯ ಕಥೆ ಹೇಳುತ್ತದೆ."],
   ["Bhagalpur is called the Silk City for its tussar silk.", "टसर रेशम के कारण भागलपुर को रेशम नगरी कहते हैं।", "ಟಸರ್ ರೇಷ್ಮೆಯಿಂದಾಗಿ ಭಾಗಲ್ಪುರವನ್ನು ರೇಷ್ಮೆ ನಗರಿ ಎನ್ನುತ್ತಾರೆ."],
   ["Nalanda was one of the world's first great universities, over 1,500 years ago.", "नालंदा 1,500 साल से भी पहले दुनिया के पहले बड़े विश्वविद्यालयों में से एक था।", "ನಾಲಂದಾ 1,500 ವರ್ಷಗಳ ಹಿಂದೆಯೇ ಜಗತ್ತಿನ ಮೊದಲ ದೊಡ್ಡ ವಿಶ್ವವಿದ್ಯಾಲಯಗಳಲ್ಲಿ ಒಂದು."],
   ["Patna's Golghar was built in 1786 to store grain.", "पटना का गोलघर 1786 में अनाज रखने के लिए बना।", "ಪಟ್ನಾದ ಗೋಲ್‌ಘರ್ ಅನ್ನು 1786ರಲ್ಲಿ ಧಾನ್ಯ ಸಂಗ್ರಹಕ್ಕಾಗಿ ಕಟ್ಟಲಾಯಿತು."],
   ["The Ganga flows right through Bihar, past Patna.", "गंगा बिहार के बीचोंबीच पटना के पास से बहती है।", "ಗಂಗಾ ನದಿ ಬಿಹಾರದ ನಡುವೆ ಪಟ್ನಾದ ಪಕ್ಕದಲ್ಲೇ ಹರಿಯುತ್ತದೆ."],
   ["Thekua is a crunchy sweet of wheat flour and jaggery, made as the Chhath offering.", "ठेकुआ गेहूँ के आटे और गुड़ से बनी कुरकुरी मिठाई है, जो छठ का प्रसाद है।", "ಠೇಕುವಾ ಗೋಧಿ ಹಿಟ್ಟು ಮತ್ತು ಬೆಲ್ಲದಿಂದ ಮಾಡುವ ಗರಿಗರಿ ಸಿಹಿ; ಛಠ್ ಹಬ್ಬದ ಪ್ರಸಾದ."],
   ["Sattu, made from roasted gram, becomes a cooling summer drink.", "भुने चने का सत्तू गर्मियों में ठंडक देने वाला शरबत बनता है।", "ಹುರಿದ ಕಡಲೆಯ ಸತ್ತು ಹಿಟ್ಟು ಬೇಸಿಗೆಯಲ್ಲಿ ತಂಪು ಪಾನೀಯವಾಗುತ್ತದೆ."],
   ["The red Mithila paag is a cap worn with pride at weddings and festivals.", "लाल मिथिला पाग शादियों और त्योहारों में गर्व से पहनी जाती है।", "ಕೆಂಪು ಮಿಥಿಲಾ ಪಾಗ್ ಟೋಪಿಯನ್ನು ಮದುವೆ, ಹಬ್ಬಗಳಲ್ಲಿ ಹೆಮ್ಮೆಯಿಂದ ತೊಡುತ್ತಾರೆ."],
   ["Tea in a clay kulhad smells of earth, and the cup goes back to the soil.", "मिट्टी के कुल्हड़ की चाय में सोंधी ख़ुशबू आती है, और कुल्हड़ फिर मिट्टी में मिल जाता है।", "ಮಣ್ಣಿನ ಕುಲ್ಹಡ್‌ನ ಚಹಾಕ್ಕೆ ಮಣ್ಣಿನ ಘಮ; ಲೋಟ ಮತ್ತೆ ಮಣ್ಣಿಗೇ ಸೇರುತ್ತದೆ."],
   ["Bamboo grows very fast, and Bihar uses it for soops and baskets.", "बाँस बहुत तेज़ बढ़ता है; बिहार में इससे सूप और टोकरियाँ बनती हैं।", "ಬಿದಿರು ಬಹಳ ವೇಗವಾಗಿ ಬೆಳೆಯುತ್ತದೆ; ಬಿಹಾರದಲ್ಲಿ ಇದರಿಂದ ಮೊರ, ಬುಟ್ಟಿ ಮಾಡುತ್ತಾರೆ."],
   ["Peahens are brown so they can hide while caring for their chicks.", "मोरनी भूरी होती है ताकि बच्चों की देखभाल करते समय छिप सके।", "ಹೆಣ್ಣು ನವಿಲು ಕಂದು ಬಣ್ಣದ್ದು; ಮರಿಗಳನ್ನು ಕಾಯುವಾಗ ಅಡಗಿಕೊಳ್ಳಲು ಸುಲಭ."]],
  mh:[["In the tarpa dance, Warli villagers dance in a circle around the tarpa player.", "तारपा नृत्य में वारली लोग तारपा वादक के चारों ओर घेरे में नाचते हैं।", "ತಾರ್ಪಾ ಕುಣಿತದಲ್ಲಿ ವಾರ್ಲಿ ಜನರು ತಾರ್ಪಾ ವಾದಕನ ಸುತ್ತ ವೃತ್ತವಾಗಿ ಕುಣಿಯುತ್ತಾರೆ."],
   ["Modak is Lord Ganesha's favourite sweet, made in every home at Ganeshotsav.", "मोदक गणेश जी की प्रिय मिठाई है, गणेशोत्सव में हर घर में बनती है।", "ಮೋದಕ ಗಣೇಶನ ಪ್ರಿಯ ಸಿಹಿ, ಗಣೇಶೋತ್ಸವದಲ್ಲಿ ಪ್ರತಿ ಮನೆಯಲ್ಲೂ ಮಾಡುತ್ತಾರೆ."],
   ["Vada pav, a spicy potato fritter in a soft bun, is Mumbai's favourite snack.", "वड़ा पाव, नरम पाव में मसालेदार आलू वड़ा, मुंबई का सबसे पसंदीदा नाश्ता है।", "ಮೆತ್ತನೆಯ ಪಾವ್ ರೊಟ್ಟಿಯೊಳಗೆ ಖಾರದ ಆಲೂ ವಡೆ, ಇದೇ ಮುಂಬೈಯ ನೆಚ್ಚಿನ ತಿಂಡಿ ವಡಾ ಪಾವ್."],
   ["Paithani sarees are woven with silk and gold thread, often with peacock borders.", "पैठणी साड़ियाँ रेशम और सुनहरे धागे से बुनी जाती हैं, अक्सर मोर वाले किनारे के साथ।", "ಪೈಠಣಿ ಸೀರೆಗಳನ್ನು ರೇಷ್ಮೆ ಮತ್ತು ಚಿನ್ನದ ಜರಿಯಿಂದ ನೇಯುತ್ತಾರೆ, ಅಂಚಿನಲ್ಲಿ ನವಿಲುಗಳಿರುತ್ತವೆ."],
   ["Kolhapuri chappals are handmade from leather and have a GI tag.", "कोल्हापुरी चप्पलें हाथ से चमड़े से बनती हैं और उन्हें जीआई टैग मिला है।", "ಕೊಲ್ಹಾಪುರಿ ಚಪ್ಪಲಿಗಳನ್ನು ಚರ್ಮದಿಂದ ಕೈಯಲ್ಲೇ ಮಾಡುತ್ತಾರೆ, ಅವಕ್ಕೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಇದೆ."],
   ["Dhol-tasha groups drum through the streets at Ganeshotsav.", "गणेशोत्सव में ढोल-ताशा दल सड़कों पर बजाते निकलते हैं।", "ಗಣೇಶೋತ್ಸವದಲ್ಲಿ ಡೋಲು-ತಾಶಾ ತಂಡಗಳು ಬೀದಿಗಳಲ್ಲಿ ಬಾರಿಸುತ್ತಾ ಸಾಗುತ್ತವೆ."],
   ["In Pune, special guests are honoured with a Puneri pagadi.", "पुणे में ख़ास मेहमानों का सम्मान पुणेरी पगड़ी से किया जाता है।", "ಪುಣೆಯಲ್ಲಿ ವಿಶೇಷ ಅತಿಥಿಗಳನ್ನು ಪುಣೇರಿ ಪೇಟ ತೊಡಿಸಿ ಗೌರವಿಸುತ್ತಾರೆ."],
   ["The Gateway of India faces the Arabian Sea and was completed in 1924.", "गेटवे ऑफ़ इंडिया अरब सागर की ओर है, यह 1924 में पूरा हुआ।", "ಗೇಟ್‌ವೇ ಆಫ್ ಇಂಡಿಯಾ ಅರಬ್ಬೀ ಸಮುದ್ರಕ್ಕೆ ಮುಖ ಮಾಡಿದೆ, 1924ರಲ್ಲಿ ಪೂರ್ಣಗೊಂಡಿತು."],
   ["Shivaji Maharaj built and guarded many hill forts across the Sahyadri mountains.", "शिवाजी महाराज ने सह्याद्रि पहाड़ों में कई किले बनवाए और उनकी रक्षा की।", "ಶಿವಾಜಿ ಮಹಾರಾಜರು ಸಹ್ಯಾದ್ರಿ ಬೆಟ್ಟಗಳಲ್ಲಿ ಅನೇಕ ಕೋಟೆಗಳನ್ನು ಕಟ್ಟಿಸಿ ಕಾಪಾಡಿದರು."],
   ["Nashik is called India's grape capital.", "नासिक को भारत की अंगूर राजधानी कहते हैं।", "ನಾಸಿಕ್‌ ಅನ್ನು ಭಾರತದ ದ್ರಾಕ್ಷಿ ರಾಜಧಾನಿ ಎನ್ನುತ್ತಾರೆ."],
   ["Bullock carts still carry crops along Maharashtra's village roads.", "महाराष्ट्र के गाँवों की सड़कों पर आज भी बैलगाड़ियाँ फसल ढोती हैं।", "ಮಹಾರಾಷ್ಟ್ರದ ಹಳ್ಳಿ ರಸ್ತೆಗಳಲ್ಲಿ ಇಂದಿಗೂ ಎತ್ತಿನ ಗಾಡಿಗಳು ಬೆಳೆ ಸಾಗಿಸುತ್ತವೆ."],
   ["Mumbai's dabbawalas deliver lakhs of home-cooked lunches every day, almost never mixing one up.", "मुंबई के डब्बावाले रोज़ लाखों घर के बने खाने पहुँचाते हैं, और लगभग कभी गलती नहीं करते।", "ಮುಂಬೈಯ ಡಬ್ಬಾವಾಲಾಗಳು ಪ್ರತಿದಿನ ಲಕ್ಷಾಂತರ ಮನೆ ಊಟದ ಡಬ್ಬಿಗಳನ್ನು ತಲುಪಿಸುತ್ತಾರೆ, ಬಹುತೇಕ ಒಂದೂ ತಪ್ಪದೆ."],
   ["In the Warli tarpa dance, people circle around the tarpa player.", "वारली तारपा नृत्य में लोग तारपा बजाने वाले के चारों ओर घेरा बनाकर नाचते हैं।", "ವಾರ್ಲಿ ತಾರ್ಪಾ ನೃತ್ಯದಲ್ಲಿ ಜನರು ತಾರ್ಪಾ ನುಡಿಸುವವನ ಸುತ್ತ ಸುತ್ತುತ್ತಾ ಕುಣಿಯುತ್ತಾರೆ."],
   ["Modak, Ganpati's favourite sweet, is offered 21 at a time.", "गणपति के प्रिय मोदक 21 की संख्या में चढ़ाए जाते हैं।", "ಗಣಪತಿಗೆ ಇಷ್ಟವಾದ ಮೋದಕವನ್ನು 21ರ ಸಂಖ್ಯೆಯಲ್ಲಿ ನೈವೇದ್ಯ ಮಾಡುತ್ತಾರೆ."],
   ["Misal pav is a spicy sprout curry topped with crunchy farsan.", "मिसल पाव मसालेदार अंकुरित दालों की तरी है, ऊपर कुरकुरा फ़रसाण।", "ಮಿಸಳ್ ಪಾವ್ ಮೊಳಕೆ ಕಾಳಿನ ಖಾರದ ಸಾರು, ಮೇಲೆ ಗರಿಗರಿ ಖಾರ."],
   ["Paithani sarees have peacock borders woven in silk and gold.", "पैठणी साड़ियों के किनारों पर रेशम और सोने से मोर बुने जाते हैं।", "ಪೈಠಣಿ ಸೀರೆಯ ಅಂಚಿನಲ್ಲಿ ರೇಷ್ಮೆ ಮತ್ತು ಚಿನ್ನದ ನವಿಲುಗಳನ್ನು ನೇಯುತ್ತಾರೆ."],
   ["Kolhapuri chappals are handmade leather sandals with a GI tag.", "कोल्हापुरी चप्पलें हाथ से बनी चमड़े की चप्पलें हैं, जिन्हें जीआई टैग मिला है।", "ಕೊಲ್ಹಾಪುರಿ ಚಪ್ಪಲಿ ಕೈಯಲ್ಲೇ ಮಾಡಿದ ಚರ್ಮದ ಚಪ್ಪಲಿ; ಭೌಗೋಳಿಕ ಗುರುತು ಪಡೆದಿದೆ."],
   ["Dhol-tasha troupes of hundreds play in Pune's Ganesh processions.", "पुणे की गणेश शोभायात्राओं में सैकड़ों लोगों के ढोल-ताशा दल बजाते हैं।", "ಪುಣೆಯ ಗಣೇಶ ಮೆರವಣಿಗೆಯಲ್ಲಿ ನೂರಾರು ಜನರ ಢೋಲ್-ತಾಶಾ ತಂಡಗಳು ಬಾರಿಸುತ್ತವೆ."],
   ["A saffron pheta is tied on special days like Gudi Padwa.", "गुढी पाडवा जैसे ख़ास दिनों पर केसरिया फेटा बाँधा जाता है।", "ಗುಡಿ ಪಾಡ್ವಾದಂತಹ ವಿಶೇಷ ದಿನಗಳಲ್ಲಿ ಕೇಸರಿ ಫೇಟಾ ಕಟ್ಟುತ್ತಾರೆ."],
   ["The Gateway of India was completed by the Mumbai sea in 1924.", "गेटवे ऑफ़ इंडिया 1924 में मुंबई में समुद्र किनारे बनकर तैयार हुआ।", "ಗೇಟ್‌ವೇ ಆಫ್ ಇಂಡಿಯಾ 1924ರಲ್ಲಿ ಮುಂಬೈ ಕಡಲ ತೀರದಲ್ಲಿ ಪೂರ್ಣಗೊಂಡಿತು."],
   ["Shivaji Maharaj's hill forts are now a UNESCO World Heritage Site.", "शिवाजी महाराज के पहाड़ी किले अब यूनेस्को विश्व धरोहर हैं।", "ಶಿವಾಜಿ ಮಹಾರಾಜರ ಬೆಟ್ಟದ ಕೋಟೆಗಳು ಈಗ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣ."],
   ["Nashik grows so many grapes it is called India's grape capital.", "नासिक में इतने अंगूर उगते हैं कि उसे भारत की अंगूर राजधानी कहते हैं।", "ನಾಸಿಕ್‌ನಲ್ಲಿ ಅಷ್ಟು ದ್ರಾಕ್ಷಿ ಬೆಳೆಯುವುದರಿಂದ ಅದನ್ನು ಭಾರತದ ದ್ರಾಕ್ಷಿ ರಾಜಧಾನಿ ಎನ್ನುತ್ತಾರೆ."],
   ["On Bail Pola, farmers decorate their bullocks and thank them for their work.", "बैल पोळा पर किसान अपने बैलों को सजाकर उनका धन्यवाद करते हैं।", "ಬೈಲ್ ಪೋಳಾ ಹಬ್ಬದಲ್ಲಿ ರೈತರು ಎತ್ತುಗಳನ್ನು ಸಿಂಗರಿಸಿ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸುತ್ತಾರೆ."],
   ["Mumbai's dabbawalas deliver about two lakh tiffins a day and almost never go wrong.", "मुंबई के डब्बावाले रोज़ लगभग दो लाख टिफ़िन पहुँचाते हैं, और शायद ही कभी गलती करते हैं।", "ಮುಂಬೈನ ಡಬ್ಬಾವಾಲಾಗಳು ದಿನಕ್ಕೆ ಸುಮಾರು ಎರಡು ಲಕ್ಷ ಊಟದ ಡಬ್ಬಿ ತಲುಪಿಸುತ್ತಾರೆ, ತಪ್ಪುವುದೇ ಅಪರೂಪ."],
   ["Warli paintings were made on hut walls with white rice paste.", "वारली चित्र झोपड़ियों की दीवारों पर चावल के सफ़ेद लेप से बनते थे।", "ವಾರ್ಲಿ ಚಿತ್ರಗಳನ್ನು ಗುಡಿಸಲಿನ ಗೋಡೆಗಳ ಮೇಲೆ ಅಕ್ಕಿ ಹಿಟ್ಟಿನ ಬಿಳಿ ಲೇಪದಿಂದ ಬಿಡಿಸುತ್ತಿದ್ದರು."],
   ["The tarpa is made from a dried gourd and bamboo.", "तारपा सूखी लौकी और बाँस से बनता है।", "ತಾರ್ಪಾ ವಾದ್ಯವನ್ನು ಒಣ ಸೋರೆಕಾಯಿ ಮತ್ತು ಬಿದಿರಿನಿಂದ ಮಾಡುತ್ತಾರೆ."],
   ["Puran poli is a sweet flatbread stuffed with chana dal and jaggery.", "पूरनपोळी चने की दाल और गुड़ भरी मीठी रोटी है।", "ನಮ್ಮ ಹೋಳಿಗೆಯಂತೆಯೇ ಪೂರಣ್ ಪೋಳಿಯಲ್ಲಿ ಕಡಲೆಬೇಳೆ, ಬೆಲ್ಲದ ಹೂರಣ ತುಂಬುತ್ತಾರೆ."],
   ["The nauvari saree is nine yards long and draped like a dhoti.", "नौवारी साड़ी नौ गज़ लंबी होती है और धोती की तरह बाँधी जाती है।", "ನೌವಾರಿ ಸೀರೆ ಒಂಬತ್ತು ಗಜ ಉದ್ದ; ಕಚ್ಚೆಯಂತೆ ಉಡುತ್ತಾರೆ."],
   ["Lezim is a folk dance with a jingling wooden instrument.", "लेज़िम एक लोकनृत्य है, जिसमें झनझनाने वाला लकड़ी का वाद्य होता है।", "ಲೇಜಿಮ್ ಒಂದು ಜಾನಪದ ನೃತ್ಯ; ಗಿಲಗಿಲ ಸದ್ದು ಮಾಡುವ ಮರದ ಸಾಧನ ಹಿಡಿದು ಕುಣಿಯುತ್ತಾರೆ."],
   ["Mumbai's local trains carry over 70 lakh people every day.", "मुंबई की लोकल ट्रेनें रोज़ 70 लाख से ज़्यादा लोगों को ले जाती हैं।", "ಮುಂಬೈ ಲೋಕಲ್ ರೈಲುಗಳಲ್ಲಿ ದಿನಕ್ಕೆ 70 ಲಕ್ಷಕ್ಕೂ ಹೆಚ್ಚು ಜನ ಪ್ರಯಾಣಿಸುತ್ತಾರೆ."],
   ["In the Wari, lakhs of pilgrims walk to Pandharpur singing abhangs.", "वारी में लाखों वारकरी अभंग गाते हुए पंढरपुर तक पैदल जाते हैं।", "ವಾರಿಯಲ್ಲಿ ಲಕ್ಷಾಂತರ ಭಕ್ತರು ಅಭಂಗ ಹಾಡುತ್ತಾ ಪಂಢರಪುರಕ್ಕೆ ನಡೆದು ಹೋಗುತ್ತಾರೆ."],
   ["Star-shaped akash kandil lanterns light up homes at Diwali.", "दिवाली पर तारे जैसे आकाश कंदील घरों को रोशन करते हैं।", "ದೀಪಾವಳಿಯಲ್ಲಿ ನಕ್ಷತ್ರಾಕಾರದ ಆಕಾಶ ಕಂದೀಲುಗಳು ಮನೆಗಳನ್ನು ಬೆಳಗುತ್ತವೆ."],
   ["Konkan fishermen offer a coconut to the sea on Narali Purnima.", "कोंकण के मछुआरे नारळी पूर्णिमा पर समुद्र को नारियल चढ़ाते हैं।", "ಕೊಂಕಣದ ಮೀನುಗಾರರು ನಾರಳಿ ಹುಣ್ಣಿಮೆಯಂದು ಸಮುದ್ರಕ್ಕೆ ತೆಂಗಿನಕಾಯಿ ಅರ್ಪಿಸುತ್ತಾರೆ."],
   ["Pink kokum sherbet keeps people cool in the hot Konkan summer.", "गुलाबी कोकम शरबत कोंकण की गर्मी में ठंडक देता है।", "ಗುಲಾಬಿ ಬಣ್ಣದ ಮುರುಗಲ ಪಾನಕ ಕೊಂಕಣದ ಬಿಸಿಲಲ್ಲಿ ತಂಪು ನೀಡುತ್ತದೆ."],
   ["The Ajanta caves have paintings made about 2,000 years ago.", "अजंता की गुफाओं में लगभग 2,000 साल पुराने चित्र हैं।", "ಅಜಂತಾ ಗುಹೆಗಳಲ್ಲಿ ಸುಮಾರು 2,000 ವರ್ಷ ಹಳೆಯ ಚಿತ್ರಗಳಿವೆ."],
   ["Alphonso mangoes from Ratnagiri and Devgad have a GI tag.", "रत्नागिरी और देवगड के हापुस आमों को जीआई टैग मिला है।", "ರತ್ನಾಗಿರಿ ಮತ್ತು ದೇವಗಡದ ಆಪೂಸ್ ಮಾವಿಗೆ ಭೌಗೋಳಿಕ ಗುರುತು ಸಿಕ್ಕಿದೆ."]],
  ap:[["Etikoppaka toys are turned from soft ankudu wood and coloured with natural lac dyes; they have a GI tag.", "एटिकोप्पाका खिलौने नरम अंकुडु लकड़ी से बनते हैं और प्राकृतिक लाख रंगों से रंगे जाते हैं; इन्हें जीआई टैग मिला है।", "ಏಟಿಕೊಪ್ಪಾಕ ಗೊಂಬೆಗಳನ್ನು ಮೆತ್ತನೆಯ ಅಂಕುಡು ಮರದಿಂದ ಮಾಡಿ, ನೈಸರ್ಗಿಕ ಅರಗಿನ ಬಣ್ಣ ಹಚ್ಚುತ್ತಾರೆ; ಇವಕ್ಕೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಇದೆ."],
   ["Kondapalli dolls are carved from light 'tella poniki' wood and painted in bright colours.", "कोंडापल्ली गुड़ियाँ हल्की 'तेल्ला पोनिकी' लकड़ी से तराशी और चटक रंगों से रंगी जाती हैं।", "ಕೊಂಡಪಲ್ಲಿ ಗೊಂಬೆಗಳನ್ನು ಹಗುರವಾದ 'ತೆಲ್ಲ ಪೊನಿಕಿ' ಮರದಿಂದ ಕೆತ್ತಿ ಗಾಢ ಬಣ್ಣ ಹಚ್ಚುತ್ತಾರೆ."],
   ["Araku coffee is grown by tribal farmers on the misty hills of the Eastern Ghats.", "अराकू कॉफ़ी पूर्वी घाट की धुंध भरी पहाड़ियों पर आदिवासी किसान उगाते हैं।", "ಅರಕು ಕಾಫಿಯನ್ನು ಪೂರ್ವ ಘಟ್ಟಗಳ ಮಂಜಿನ ಬೆಟ್ಟಗಳಲ್ಲಿ ಆದಿವಾಸಿ ರೈತರು ಬೆಳೆಯುತ್ತಾರೆ."],
   ["Guntur has one of the biggest chilli markets in Asia.", "गुंटूर में एशिया के सबसे बड़े मिर्च बाज़ारों में से एक है।", "ಗುಂಟೂರಿನಲ್ಲಿ ಏಷ್ಯಾದ ಅತಿ ದೊಡ್ಡ ಮೆಣಸಿನಕಾಯಿ ಮಾರುಕಟ್ಟೆಗಳಲ್ಲೊಂದಿದೆ."],
   ["Each Bobbili veena is carved from a single block of jackfruit wood.", "हर बोब्बिली वीणा कटहल की लकड़ी के एक ही टुकड़े से तराशी जाती है।", "ಪ್ರತಿ ಬೊಬ್ಬಿಲಿ ವೀಣೆಯನ್ನು ಹಲಸಿನ ಮರದ ಒಂದೇ ತುಂಡಿನಿಂದ ಕೆತ್ತುತ್ತಾರೆ."],
   ["Tholu Bommalata puppets are cut from leather and glow with colour when a lamp shines behind them.", "तोलु बोम्मलाटा की कठपुतलियाँ चमड़े से बनती हैं; पीछे दीया जलाने पर रंग चमक उठते हैं।", "ತೊಗಲು ಗೊಂಬೆಗಳನ್ನು ಚರ್ಮದಿಂದ ಮಾಡುತ್ತಾರೆ; ಹಿಂದೆ ದೀಪ ಬೆಳಗಿದಾಗ ಅವುಗಳ ಬಣ್ಣ ಹೊಳೆಯುತ್ತದೆ."],
   ["Artisans of Udayagiri carve spoons and forks with delicate lattice handles.", "उदयगिरि के कारीगर जालीदार हत्थे वाले चम्मच और काँटे तराशते हैं।", "ಉದಯಗಿರಿಯ ಕುಶಲಕರ್ಮಿಗಳು ಜಾಲರಿ ಹಿಡಿಯಿರುವ ಚಮಚ, ಮುಳ್ಳುಚಮಚಗಳನ್ನು ಕೆತ್ತುತ್ತಾರೆ."],
   ["The Lepakshi Nandi, carved from a single rock, is one of the biggest stone Nandis in India.", "एक ही चट्टान से तराशा लेपाक्षी नंदी भारत की सबसे बड़ी पत्थर की नंदी मूर्तियों में से एक है।", "ಒಂದೇ ಬಂಡೆಯಿಂದ ಕೆತ್ತಿದ ಲೇಪಾಕ್ಷಿ ನಂದಿ ಭಾರತದ ಅತಿ ದೊಡ್ಡ ಕಲ್ಲಿನ ನಂದಿಗಳಲ್ಲೊಂದು."],
   ["The Tirupati laddu has its own GI tag.", "तिरुपति लड्डू को अपना जीआई टैग मिला है।", "ತಿರುಪತಿ ಲಡ್ಡುವಿಗೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಇದೆ."],
   ["'Kalam' means pen: Kalamkari artists draw on cloth with a bamboo pen and natural dyes.", "'कलम' यानी पेन: कलमकारी कलाकार बाँस की कलम और प्राकृतिक रंगों से कपड़े पर चित्र बनाते हैं।", "'ಕಲಂ' ಅಂದರೆ ಲೇಖನಿ: ಕಲಂಕಾರಿ ಕಲಾವಿದರು ಬಿದಿರಿನ ಲೇಖನಿ ಮತ್ತು ನೈಸರ್ಗಿಕ ಬಣ್ಣಗಳಿಂದ ಬಟ್ಟೆಯ ಮೇಲೆ ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾರೆ."],
   ["Kuchipudi dance takes its name from a village in Andhra Pradesh.", "कुचिपुड़ी नृत्य का नाम आंध्र प्रदेश के एक गाँव से आया है।", "ಕೂಚಿಪುಡಿ ನೃತ್ಯಕ್ಕೆ ಆಂಧ್ರಪ್ರದೇಶದ ಒಂದು ಹಳ್ಳಿಯ ಹೆಸರು ಬಂದಿದೆ."],
   ["Banganapalle mangoes are sweet, golden and have a GI tag.", "बंगनपल्ली आम मीठे और सुनहरे होते हैं, इन्हें जीआई टैग मिला है।", "ಬನಗಾನಪಲ್ಲಿ ಮಾವು ಸಿಹಿ, ಹೊಂಬಣ್ಣದ್ದು; ಅದಕ್ಕೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಇದೆ."],
   ["Etikoppaka toys are coloured with natural dyes from seeds, bark and leaves.", "एटिकोप्पका के खिलौने बीज, छाल और पत्तियों के प्राकृतिक रंगों से रंगे जाते हैं।", "ಏಟಿಕೊಪ್ಪಾಕ ಬೊಂಬೆಗಳಿಗೆ ಬೀಜ, ತೊಗಟೆ, ಎಲೆಗಳ ಸಹಜ ಬಣ್ಣ ಹಚ್ಚುತ್ತಾರೆ."],
   ["Kondapalli toys are carved from a soft, light wood called tella poniki.", "कोंडापल्ली खिलौने तेल्ला पोनिकी नाम की हल्की, नरम लकड़ी से बनते हैं।", "ಕೊಂಡಪಲ್ಲಿ ಬೊಂಬೆಗಳನ್ನು ತೆಲ್ಲ ಪೊನಿಕಿ ಎಂಬ ಹಗುರ ಮೃದು ಮರದಿಂದ ಕೆತ್ತುತ್ತಾರೆ."],
   ["Araku Valley coffee is grown by tribal farmers in the Eastern Ghats.", "अराकू घाटी की कॉफ़ी पूर्वी घाट के आदिवासी किसान उगाते हैं।", "ಅರಕು ಕಣಿವೆಯ ಕಾಫಿಯನ್ನು ಪೂರ್ವ ಘಟ್ಟದ ಆದಿವಾಸಿ ರೈತರು ಬೆಳೆಯುತ್ತಾರೆ."],

   ["Tholu bommalata puppets are made of leather and glow when lit from behind.", "तोलु बोम्मलाटा की कठपुतलियाँ चमड़े की होती हैं और पीछे से रोशनी पड़ने पर चमकती हैं।", "ತೊಲು ಬೊಮ್ಮಲಾಟದ ಗೊಂಬೆಗಳು ಚರ್ಮದವು; ಹಿಂದಿನಿಂದ ಬೆಳಕು ಬಿದ್ದಾಗ ಹೊಳೆಯುತ್ತವೆ."],
   ["Udayagiri craftsmen carve spoons and forks from a single piece of wood.", "उदयगिरि के कारीगर लकड़ी के एक टुकड़े से चम्मच-काँटे तराशते हैं।", "ಉದಯಗಿರಿಯ ಕುಶಲಕರ್ಮಿಗಳು ಒಂದೇ ಮರದ ತುಂಡಿನಿಂದ ಚಮಚ, ಮುಳ್ಳುಚಮಚ ಕೆತ್ತುತ್ತಾರೆ."],
   ["The Lepakshi Nandi is one of India's largest carved from a single stone.", "लेपाक्षी का नंदी एक ही पत्थर से बने भारत के सबसे बड़े नंदियों में है।", "ಲೇಪಾಕ್ಷಿಯ ನಂದಿ ಒಂದೇ ಕಲ್ಲಿನಲ್ಲಿ ಕೆತ್ತಿದ ಭಾರತದ ಅತಿದೊಡ್ಡ ನಂದಿಗಳಲ್ಲಿ ಒಂದು."],
   ["The Tirupati laddu has its own GI tag.", "तिरुपति लड्डू को अपना जीआई टैग मिला है।", "ತಿರುಪತಿ ಲಡ್ಡುವಿಗೆ ಭೌಗೋಳಿಕ ಗುರುತು ಸಿಕ್ಕಿದೆ."],
   ["Kalamkari means 'pen work': artists draw with a bamboo pen and natural dyes.", "कलमकारी का अर्थ है 'कलम का काम'; कलाकार बाँस की कलम और प्राकृतिक रंगों से चित्र बनाते हैं।", "ಕಲಂಕಾರಿ ಎಂದರೆ 'ಲೇಖನಿಯ ಕೆಲಸ'; ಬಿದಿರಿನ ಲೇಖನಿ, ಸಹಜ ಬಣ್ಣಗಳಿಂದ ಬಿಡಿಸುತ್ತಾರೆ."],
   ["In Kuchipudi, a dancer sometimes dances on the rim of a brass plate.", "कुचिपुड़ी में नर्तकी कभी-कभी पीतल की थाली के किनारे पर नाचती है।", "ಕೂಚಿಪುಡಿಯಲ್ಲಿ ನರ್ತಕಿ ಕೆಲವೊಮ್ಮೆ ಹಿತ್ತಾಳೆ ತಟ್ಟೆಯ ಅಂಚಿನ ಮೇಲೆ ನರ್ತಿಸುತ್ತಾಳೆ."],
   ["Every summer, raw mangoes are cut and pickled to make avakaya.", "हर गर्मी में कच्चे आम काटकर आवकाया अचार बनाया जाता है।", "ಪ್ರತಿ ಬೇಸಿಗೆಯಲ್ಲಿ ಮಾವಿನಕಾಯಿ ಹೆಚ್ಚಿ ಆವಕಾಯ ಉಪ್ಪಿನಕಾಯಿ ಹಾಕುತ್ತಾರೆ."],
   ["Pootharekulu are paper-thin rice sheets rolled with sugar and ghee.", "पूतरेकुलु कागज़ जैसी पतली चावल की परतें हैं, जिनमें चीनी और घी लपेटा जाता है।", "ಪೂತರೇಕುಲು ಕಾಗದದಂತೆ ತೆಳ್ಳಗಿನ ಅಕ್ಕಿ ಪದರಗಳಿಗೆ ಸಕ್ಕರೆ, ತುಪ್ಪ ಸವರಿ ಸುತ್ತಿದ ಸಿಹಿ."],
   ["Kakinada kaja is crisp outside and full of sweet syrup inside.", "काकीनाडा खाजा बाहर से कुरकुरा और अंदर मीठी चाशनी से भरा होता है।", "ಕಾಕಿನಾಡ ಖಾಜಾ ಹೊರಗೆ ಗರಿಗರಿ, ಒಳಗೆ ಸಿಹಿ ಪಾಕ ತುಂಬಿರುತ್ತದೆ."],
   ["Bandar laddu from Machilipatnam has a GI tag.", "मछलीपट्टनम के बंदर लड्डू को जीआई टैग मिला है।", "ಮಚಲಿಪಟ್ಟಣದ ಬಂದರ್ ಲಡ್ಡುವಿಗೆ ಭೌಗೋಳಿಕ ಗುರುತು ಸಿಕ್ಕಿದೆ."],
   ["Ariselu, rice-and-jaggery discs with sesame, are a Sankranti must.", "अरिसेलु, तिल लगी चावल-गुड़ की टिकियाँ, संक्रांति पर ज़रूर बनती हैं।", "ಎಳ್ಳು ಹಚ್ಚಿದ ಅಕ್ಕಿ ಬೆಲ್ಲದ ಅರಿಸೆಲು ಸಂಕ್ರಾಂತಿಗೆ ಮಾಡಲೇಬೇಕಾದ ಸಿಹಿ."],
   ["Bobbatlu is Andhra's sweet flatbread, just like Karnataka's holige.", "बोब्बट्लु आंध्र की मीठी रोटी है, कर्नाटक की होळिगे जैसी।", "ಬೊಬ್ಬಟ್ಲು ಆಂಧ್ರದ ಸಿಹಿ ರೊಟ್ಟಿ, ನಮ್ಮ ಹೋಳಿಗೆಯಂತೆಯೇ."],
   ["Sunnundalu are laddus of roasted urad dal and jaggery.", "सुन्नुंडलु भुनी उड़द दाल और गुड़ से बने लड्डू हैं।", "ಸುನ್ನುಂಡಲು ಹುರಿದ ಉದ್ದಿನಬೇಳೆ, ಬೆಲ್ಲದ ಉಂಡೆಗಳು."],
   ["Palakova is made by slowly stirring milk until it turns into soft fudge.", "पालकोवा दूध को धीरे-धीरे चलाते हुए मुलायम खोया बनने तक पकाकर बनता है।", "ಹಾಲನ್ನು ನಿಧಾನವಾಗಿ ಕೈಯಾಡಿಸುತ್ತಾ ಮೃದು ಖೋವಾ ಆಗುವವರೆಗೆ ಕಾಯಿಸಿ ಪಾಲ್ಕೋವಾ ಮಾಡುತ್ತಾರೆ."],
   ["Pulihora, tamarind rice, is a temple prasadam that keeps well on journeys.", "पुलिहोरा, इमली वाला चावल, मंदिर का प्रसाद है और सफ़र में ख़राब नहीं होता।", "ನಮ್ಮ ಪುಳಿಯೊಗರೆಯಂತಹ ಪುಳಿಹೋರಾ ದೇವಸ್ಥಾನದ ಪ್ರಸಾದ; ಪ್ರಯಾಣದಲ್ಲೂ ಬೇಗ ಕೆಡುವುದಿಲ್ಲ."],
   ["Pesarattu is a green dosa made from whole moong.", "पेसरट्टु साबुत मूँग से बना हरा डोसा है।", "ಪೆಸರಟ್ಟು ಹೆಸರುಕಾಳಿನಿಂದ ಮಾಡುವ ಹಸಿರು ದೋಸೆ."],
   ["Avakaya is a fiery mango pickle with mustard and red chilli.", "आवकाया सरसों और लाल मिर्च वाला तीखा आम का अचार है।", "ಆವಕಾಯ ಸಾಸಿವೆ, ಕೆಂಪು ಮೆಣಸಿನ ಖಾರ ಖಾರ ಮಾವಿನ ಉಪ್ಪಿನಕಾಯಿ."],
   ["Sour gongura leaves make a pickle Andhra loves.", "गोंगुरा की खट्टी पत्तियों से बना यह अचार आंध्र में बहुत पसंद किया जाता है।", "ಪುಂಡಿ ಸೊಪ್ಪಿನ (ಗೋಂಗೂರ) ಹುಳಿ ಉಪ್ಪಿನಕಾಯಿ ಆಂಧ್ರದವರಿಗೆ ಬಲು ಪ್ರೀತಿ."],
   ["An Andhra meal on a banana leaf starts with hot rice, ghee and pappu.", "केले के पत्ते पर आंध्र का भोजन गरम चावल, घी और पप्पु से शुरू होता है।", "ಬಾಳೆಎಲೆಯ ಆಂಧ್ರ ಊಟ ಬಿಸಿ ಅನ್ನ, ತುಪ್ಪ ಮತ್ತು ಪಪ್ಪು (ಬೇಳೆ) ಇಂದ ಶುರು."],
   ["Uppada jamdani sarees are woven so fine they feel feather-light.", "उप्पाडा जामदानी साड़ियाँ इतनी बारीक बुनी जाती हैं कि पंख जैसी हल्की लगती हैं।", "ಉಪ್ಪಾಡ ಜಾಮದಾನಿ ಸೀರೆಗಳು ಎಷ್ಟು ನಯವೆಂದರೆ ಗರಿಯಷ್ಟು ಹಗುರ."],
   ["Mangalagiri cotton sarees are known for plain bodies and zari borders.", "मंगलगिरि सूती साड़ियाँ सादे बीच और ज़री किनारी के लिए जानी जाती हैं।", "ಮಂಗಳಗಿರಿ ಹತ್ತಿ ಸೀರೆಗಳು ಸರಳ ಒಡಲು ಮತ್ತು ಜರಿ ಅಂಚಿಗೆ ಹೆಸರುವಾಸಿ."],
   ["Narsapur lace is crocheted by hand by women, a craft over 100 years old.", "नरसापुर की क्रोशिया लेस महिलाएँ हाथ से बनाती हैं, यह कला 100 साल से पुरानी है।", "ನರಸಾಪುರದ ಕಸೂತಿ ಲೇಸ್ ಅನ್ನು ಮಹಿಳೆಯರು ಕೈಯಲ್ಲೇ ಹೆಣೆಯುತ್ತಾರೆ; ಇದು 100 ವರ್ಷ ಹಳೆಯ ಕಲೆ."],
   ["Budithi village makes shiny bell-metal and brass pots by hand.", "बुडिथि गाँव में हाथ से चमचमाते काँसे और पीतल के बर्तन बनते हैं।", "ಬುಡಿತಿ ಹಳ್ಳಿಯಲ್ಲಿ ಹೊಳೆಯುವ ಕಂಚು, ಹಿತ್ತಾಳೆ ಪಾತ್ರೆಗಳನ್ನು ಕೈಯಲ್ಲೇ ಮಾಡುತ್ತಾರೆ."],
   ["In Kolatam, dancers tap painted sticks in rhythm as they circle.", "कोलाटम में नर्तक घेरे में घूमते हुए रंगीन डंडियाँ ताल में टकराते हैं।", "ಕೋಲಾಟದಲ್ಲಿ ಕುಣಿಯುವವರು ಸುತ್ತುತ್ತಾ ಬಣ್ಣದ ಕೋಲುಗಳನ್ನು ತಾಳಕ್ಕೆ ತಟ್ಟುತ್ತಾರೆ."],
   ["Konaseema, in the Godavari delta, is full of coconut groves.", "गोदावरी डेल्टा का कोनसीमा नारियल के बाग़ों से भरा है।", "ಗೋದಾವರಿ ಮುಖಜಭೂಮಿಯ ಕೋನಸೀಮಾ ತೆಂಗಿನ ತೋಟಗಳಿಂದ ತುಂಬಿದೆ."],
   ["Dhimsa is a dance of the Araku tribes, with drums and linked arms.", "धिम्सा अराकू के आदिवासियों का नृत्य है, जिसमें ढोल बजते हैं और लोग बाँहें जोड़कर नाचते हैं।", "ಧಿಮ್ಸಾ ಅರಕುವಿನ ಆದಿವಾಸಿಗಳ ನೃತ್ಯ; ಡೋಲು ಬಾರಿಸುತ್ತಾ ಕೈ ಕೈ ಹಿಡಿದು ಕುಣಿಯುತ್ತಾರೆ."],
   ["Boats cruise the Godavari through the Papi Hills gorge.", "नावें पापी पहाड़ियों के बीच गोदावरी में सैर कराती हैं।", "ದೋಣಿಗಳು ಪಾಪಿಕೊಂಡಲು ಬೆಟ್ಟಗಳ ನಡುವೆ ಗೋದಾವರಿಯಲ್ಲಿ ಸಾಗುತ್ತವೆ."]],
  od:[["New wooden chariots are built every year for Rath Yatra in Puri.", "पुरी की रथ यात्रा के लिए हर साल नए लकड़ी के रथ बनाए जाते हैं।", "ಪುರಿಯ ರಥಯಾತ್ರೆಗೆ ಪ್ರತಿ ವರ್ಷ ಹೊಸ ಮರದ ರಥಗಳನ್ನು ಕಟ್ಟುತ್ತಾರೆ."],
   ["The Konark wheels also work as sundials: their shadows tell the time!", "कोणार्क के पहिए धूपघड़ी भी हैं: उनकी छाया से समय पता चलता है!", "ಕೋನಾರ್ಕ್ ಚಕ್ರಗಳು ಸೂರ್ಯಗಡಿಯಾರಗಳೂ ಹೌದು: ಅವುಗಳ ನೆರಳು ಸಮಯ ತೋರಿಸುತ್ತದೆ!"],
   ["Odissi is one of India's oldest classical dances, born in Odisha's temples.", "ओडिसी भारत के सबसे पुराने शास्त्रीय नृत्यों में से है, जो ओडिशा के मंदिरों में जन्मा।", "ಒಡಿಸ್ಸಿ ಭಾರತದ ಅತ್ಯಂತ ಹಳೆಯ ಶಾಸ್ತ್ರೀಯ ನೃತ್ಯಗಳಲ್ಲೊಂದು, ಒಡಿಶಾದ ದೇವಾಲಯಗಳಲ್ಲಿ ಹುಟ್ಟಿದ್ದು."],
   ["Odisha's rasagola got its own GI tag in 2019.", "ओडिशा के रसगोले को 2019 में अपना जीआई टैग मिला।", "ಒಡಿಶಾದ ರಸಗೋಲಾಕ್ಕೆ 2019ರಲ್ಲಿ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಸಿಕ್ಕಿತು."],
   ["For Sambalpuri sarees the threads are tie-dyed first, so the pattern appears as the cloth is woven.", "संबलपुरी साड़ी में धागे पहले बाँधकर रंगे जाते हैं, बुनते समय डिज़ाइन उभर आता है।", "ಸಂಬಲ್ಪುರಿ ಸೀರೆಗೆ ಮೊದಲು ದಾರಗಳನ್ನು ಕಟ್ಟಿ ಬಣ್ಣ ಹಾಕುತ್ತಾರೆ, ನೇಯುವಾಗ ವಿನ್ಯಾಸ ಮೂಡುತ್ತದೆ."],
   ["Cuttack artists twist fine silver wire into lacy shapes called tarakasi.", "कटक के कलाकार चाँदी के महीन तार मोड़कर जालीदार तारकशी बनाते हैं।", "ಕಟಕ್‌ನ ಕಲಾವಿದರು ಬೆಳ್ಳಿಯ ನವಿರಾದ ತಂತಿಯನ್ನು ತಿರುಚಿ ಜಾಲರಿಯಂತಹ ತಾರಕಸಿ ಆಕೃತಿ ಮಾಡುತ್ತಾರೆ."],
   ["Pipili artisans stitch bright cloth cut-outs to make appliqué umbrellas.", "पिपली के कारीगर रंगीन कपड़े के टुकड़े सिलकर एप्लिक छतरियाँ बनाते हैं।", "ಪಿಪಿಲಿಯ ಕುಶಲಕರ್ಮಿಗಳು ಬಣ್ಣದ ಬಟ್ಟೆಯ ತುಂಡುಗಳನ್ನು ಹೊಲಿದು ಕೊಡೆಗಳನ್ನು ಮಾಡುತ್ತಾರೆ."],
   ["Olive Ridley turtles come ashore together in huge groups to nest on Odisha's beaches.", "ऑलिव रिडले कछुए बड़े झुंडों में एक साथ ओडिशा के तटों पर अंडे देने आते हैं।", "ಆಲಿವ್ ರಿಡ್ಲಿ ಆಮೆಗಳು ದೊಡ್ಡ ಗುಂಪುಗಳಲ್ಲಿ ಒಟ್ಟಿಗೆ ಒಡಿಶಾದ ಕಡಲತೀರಕ್ಕೆ ಮೊಟ್ಟೆ ಇಡಲು ಬರುತ್ತವೆ."],
   ["Shy Irrawaddy dolphins live in Chilika Lake.", "शर्मीली इरावदी डॉल्फ़िन चिलिका झील में रहती हैं।", "ನಾಚಿಕೆಯ ಇರಾವದಿ ಡಾಲ್ಫಿನ್‌ಗಳು ಚಿಲಿಕಾ ಸರೋವರದಲ್ಲಿ ವಾಸಿಸುತ್ತವೆ."],
   ["Long ago, books in Odisha were written by scratching palm leaves with an iron stylus.", "पुराने समय में ओडिशा में लोहे की कलम से ताड़पत्र पर खुरचकर किताबें लिखी जाती थीं।", "ಹಿಂದೆ ಒಡಿಶಾದಲ್ಲಿ ಕಬ್ಬಿಣದ ಲೇಖನಿಯಿಂದ ತಾಳೆಗರಿಯ ಮೇಲೆ ಕೆತ್ತಿ ಪುಸ್ತಕ ಬರೆಯುತ್ತಿದ್ದರು."],
   ["Dhokra figures are cast in metal using wax moulds, a method over 4,000 years old.", "ढोकरा मूर्तियाँ मोम के साँचे से धातु में ढाली जाती हैं, यह तरीका 4,000 साल से भी पुराना है।", "ಢೋಕ್ರಾ ಆಕೃತಿಗಳನ್ನು ಮೇಣದ ಅಚ್ಚಿನಿಂದ ಲೋಹದಲ್ಲಿ ಎರಕ ಹೊಯ್ಯುತ್ತಾರೆ, ಈ ವಿಧಾನ 4,000 ವರ್ಷಕ್ಕಿಂತ ಹಳೆಯದು."],
   ["Pakhala, rice soaked in water, keeps people cool in summer. Odisha even has a Pakhala Day!", "पखाल, पानी में भिगोया भात, गर्मी में ठंडक देता है। ओडिशा में पखाल दिवस भी मनता है!", "ಪಖಾಳ ಅಂದರೆ ನೀರಿನಲ್ಲಿ ನೆನೆಸಿದ ಅನ್ನ, ಬೇಸಿಗೆಯಲ್ಲಿ ತಂಪು ಕೊಡುತ್ತದೆ. ಒಡಿಶಾದಲ್ಲಿ ಪಖಾಳ ದಿನವನ್ನೂ ಆಚರಿಸುತ್ತಾರೆ!"],
   ["Balabhadra's chariot, Taladhwaja, has 14 wheels.", "बलभद्र के रथ तालध्वज में 14 पहिए होते हैं।", "ಬಲಭದ್ರನ ತಾಲಧ್ವಜ ರಥಕ್ಕೆ 14 ಚಕ್ರಗಳಿವೆ."],
   ["Konark's stone wheels work like sundials and tell the time.", "कोणार्क के पत्थर के पहिए धूपघड़ी की तरह समय बताते हैं।", "ಕೋನಾರ್ಕ್‌ನ ಕಲ್ಲಿನ ಚಕ್ರಗಳು ಸೂರ್ಯಗಡಿಯಾರದಂತೆ ಸಮಯ ತೋರಿಸುತ್ತವೆ."],
   ["Odissi is one of India's oldest classical dances, carved even on temple walls.", "ओडिसी भारत के सबसे पुराने शास्त्रीय नृत्यों में है, जो मंदिरों की दीवारों पर भी उकेरा गया है।", "ಒಡಿಸ್ಸಿ ಭಾರತದ ಅತಿ ಹಳೆಯ ಶಾಸ್ತ್ರೀಯ ನೃತ್ಯಗಳಲ್ಲಿ ಒಂದು; ದೇವಾಲಯದ ಗೋಡೆಗಳಲ್ಲೂ ಕೆತ್ತಲಾಗಿದೆ."],
   ["Chhena poda means 'burnt cheese': it is baked till caramel brown.", "छेना पोड़ा का मतलब है 'जला हुआ छेना', जिसे भूरा होने तक सेंका जाता है।", "ಛೇನಾ ಪೋಡಾ ಎಂದರೆ 'ಸುಟ್ಟ ಪನೀರ್'; ಕಂದು ಬಣ್ಣ ಬರುವವರೆಗೆ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["In Sambalpuri ikat, threads are tie-dyed before weaving.", "संबलपुरी इकत में धागों को बुनने से पहले बाँधकर रंगा जाता है।", "ಸಂಬಲ್ಪುರಿ ಇಕತ್‌ನಲ್ಲಿ ನೇಯುವ ಮೊದಲೇ ನೂಲನ್ನು ಕಟ್ಟಿ ಬಣ್ಣ ಹಾಕುತ್ತಾರೆ."],
   ["Cuttack's silver filigree is made from very fine silver wire.", "कटक की चाँदी की तारकशी बेहद बारीक तारों से बनती है।", "ಕಟಕ್‌ನ ಬೆಳ್ಳಿಯ ತಾರಕಸಿ ಕೆಲಸವನ್ನು ತುಂಬಾ ಸಣ್ಣ ತಂತಿಗಳಿಂದ ಮಾಡುತ್ತಾರೆ."],
   ["Pipili's colourful umbrellas and canopies decorate the Rath Yatra.", "पिपली के रंगीन छत्र और चँदोवे रथयात्रा को सजाते हैं।", "ಪಿಪಿಲಿಯ ಬಣ್ಣದ ಛತ್ರಿ, ಚಪ್ಪರಗಳು ರಥಯಾತ್ರೆಯನ್ನು ಅಲಂಕರಿಸುತ್ತವೆ."],
   ["Lakhs of Olive Ridley turtles nest together on Odisha's beaches.", "लाखों ओलिव रिडले कछुए ओडिशा के तटों पर एक साथ अंडे देते हैं।", "ಲಕ್ಷಾಂತರ ಆಲಿವ್ ರಿಡ್ಲೆ ಆಮೆಗಳು ಒಡಿಶಾ ಕಡಲತೀರದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಮೊಟ್ಟೆ ಇಡುತ್ತವೆ."],
   ["Rare Irrawaddy dolphins live in Chilika Lake.", "दुर्लभ इरावदी डॉल्फ़िन चिलिका झील में रहती हैं।", "ಅಪರೂಪದ ಇರಾವಡಿ ಡಾಲ್ಫಿನ್‌ಗಳು ಚಿಲ್ಕಾ ಸರೋವರದಲ್ಲಿ ಇರುತ್ತವೆ."],
   ["Palm-leaf pictures are etched with a fine needle and filled with ink.", "ताड़पत्र चित्र बारीक सुई से उकेरकर स्याही भरकर बनाए जाते हैं।", "ತಾಳೆಗರಿ ಚಿತ್ರಗಳನ್ನು ಸೂಜಿಯಿಂದ ಕೊರೆದು ಮಸಿ ತುಂಬಿ ಮಾಡುತ್ತಾರೆ."],
   ["Dhokra is metal casting with a wax model, an art over 4,000 years old.", "ढोकरा मोम के साँचे से धातु ढालने की 4,000 साल से पुरानी कला है।", "ಡೋಕ್ರಾ ಮೇಣದ ಅಚ್ಚಿನಿಂದ ಲೋಹ ಎರಕ ಹೊಯ್ಯುವ 4,000 ವರ್ಷ ಹಳೆಯ ಕಲೆ."],
   ["Dalma is dal cooked with vegetables, an everyday Odia dish.", "दालमा सब्ज़ियों के साथ पकी दाल है, ओडिशा का रोज़ का खाना।", "ದಾಲ್ಮಾ ತರಕಾರಿ ಹಾಕಿ ಬೇಯಿಸಿದ ಬೇಳೆ; ಒಡಿಶಾದ ದಿನನಿತ್ಯದ ಅಡುಗೆ."],
   ["Chhena jhili, from Nimapada, are fried paneer balls soaked in syrup.", "छेना झिली निमापड़ा की मिठाई है, चाशनी में डूबे तले छेने के गोले।", "ಛೇನಾ ಝಿಲಿ ನಿಮಾಪಡದ ಸಿಹಿ; ಪಾಕದಲ್ಲಿ ಮುಳುಗಿಸಿದ ಕರಿದ ಪನೀರ್ ಉಂಡೆಗಳು."],
   ["Chhena gaja are crisp squares of paneer dipped in sugar syrup.", "छेना गजा चाशनी में डूबे छेने के कुरकुरे चौकोर टुकड़े हैं।", "ಛೇನಾ ಗಜಾ ಪಾಕದಲ್ಲಿ ಅದ್ದಿದ ಪನೀರ್‌ನ ಗರಿಗರಿ ಚೌಕಗಳು."],
   ["Flaky, layered khaja is a famous prasad of the Puri temple.", "परतदार मिठाई खाजा पुरी मंदिर का प्रसिद्ध प्रसाद है।", "ಪದರಪದರವಾದ ಖಾಜಾ ಪುರಿ ದೇವಾಲಯದ ಪ್ರಸಿದ್ಧ ಪ್ರಸಾದ."],
   ["Rasabali are fried paneer discs in thick milk, offered at Kendrapara.", "रसाबली गाढ़े दूध में डूबी तली छेना टिकिया है, जो केंद्रपाड़ा में चढ़ाई जाती है।", "ರಸಬಲಿ ಗಟ್ಟಿ ಹಾಲಿನಲ್ಲಿ ನೆನೆಸಿದ ಕರಿದ ಪನೀರ್ ತಟ್ಟೆಗಳು; ಕೇಂದ್ರಪಾಡಾದಲ್ಲಿ ನೈವೇದ್ಯ."],
   ["Chhena murki are tiny paneer cubes coated in sugar.", "छेना मुरकी चीनी में लिपटे छेने के छोटे टुकड़े हैं।", "ಛೇನಾ ಮುರ್ಕಿ ಸಕ್ಕರೆ ಲೇಪಿತ ಪುಟ್ಟ ಪನೀರ್ ತುಂಡುಗಳು."],
   ["Arisa pitha, of rice flour and jaggery, is a festival sweet.", "चावल के आटे और गुड़ से बना अरिसा पीठा त्योहारों की मिठाई है।", "ಅಕ್ಕಿ ಹಿಟ್ಟು, ಬೆಲ್ಲದ ಅರಿಸಾ ಪೀಠಾ ಹಬ್ಬದ ಸಿಹಿ."],
   ["Kakara pitha is a fried cake stuffed with coconut and jaggery.", "ककरा पीठा नारियल-गुड़ भरा तला हुआ पीठा है।", "ಕಾಕರಾ ಪೀಠಾ ತೆಂಗಿನಕಾಯಿ ಬೆಲ್ಲದ ಹೂರಣ ತುಂಬಿದ ಕರಿದ ತಿಂಡಿ."],
   ["Manda pitha are steamed rice dumplings, a lot like modak.", "मंडा पीठा भाप में पके चावल के पकवान हैं, मोदक जैसे।", "ಮಂಡಾ ಪೀಠಾ ಹಬೆಯಲ್ಲಿ ಬೇಯಿಸಿದ ಕಡುಬಿನಂತೆ."],
   ["Enduri pitha is steamed inside fragrant turmeric leaves.", "एंडुरी पीठा हल्दी के सुगंधित पत्तों में लपेटकर भाप में पकाया जाता है।", "ಎಂಡುರಿ ಪೀಠಾವನ್ನು ಅರಿಸಿನದ ಎಲೆಯಲ್ಲಿ ಸುತ್ತಿ ಹಬೆಯಲ್ಲಿ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["Poda pitha bakes slowly all night and is loved by Lord Jagannath.", "पोड़ा पीठा रात भर धीमी आँच पर पकता है और जगन्नाथ जी को प्रिय है।", "ಪೋಡಾ ಪೀಠಾ ರಾತ್ರಿಯಿಡೀ ನಿಧಾನವಾಗಿ ಬೇಯುತ್ತದೆ; ಜಗನ್ನಾಥನಿಗೆ ಇಷ್ಟವಾದದ್ದು."],
   ["Malpua is part of Lord Jagannath's morning offering at Puri.", "मालपुआ पुरी में जगन्नाथ जी के सुबह के भोग का हिस्सा है।", "ಮಾಲ್ಪುವಾ ಪುರಿಯ ಜಗನ್ನಾಥನ ಬೆಳಗಿನ ನೈವೇದ್ಯದ ಭಾಗ."],
   ["Khiri, rice cooked in milk, is offered at many Odia festivals.", "खीरी, दूध में पका चावल, कई ओड़िया त्योहारों पर चढ़ाया जाता है।", "ಹಾಲಿನಲ್ಲಿ ಬೇಯಿಸಿದ ಅಕ್ಕಿಯ ಖೀರಿ ಒಡಿಶಾದ ಅನೇಕ ಹಬ್ಬಗಳಲ್ಲಿ ನೈವೇದ್ಯ."],
   ["Odisha's chhena jalebi is made with paneer, so it is extra soft.", "ओडिशा की छेना जलेबी छेने से बनती है, इसलिए बहुत नरम होती है।", "ಒಡಿಶಾದ ಛೇನಾ ಜಿಲೇಬಿಯನ್ನು ಪನೀರ್‌ನಿಂದ ಮಾಡುವುದರಿಂದ ತುಂಬಾ ಮೃದು."],
   ["Rabidi is milk simmered for hours until thick and creamy.", "रबड़ी दूध को घंटों पकाकर गाढ़ा करके बनती है।", "ರಬ್ಡಿಯನ್ನು ಹಾಲನ್ನು ಗಂಟೆಗಟ್ಟಲೆ ಕುದಿಸಿ ಗಟ್ಟಿಯಾಗಿಸಿ ಮಾಡುತ್ತಾರೆ."],
   ["Sarapuli is built from layers of milk cream and takes great patience.", "सरपुली दूध की मलाई की परतों से बनती है, इसमें बहुत धीरज लगता है।", "ಸರಪುಳಿಯನ್ನು ಹಾಲಿನ ಕೆನೆಯ ಪದರಗಳಿಂದ ಮಾಡುತ್ತಾರೆ; ತುಂಬಾ ತಾಳ್ಮೆ ಬೇಕು."],
   ["Kora khai is puffed rice coated in jaggery, a popular Puri sweet.", "कोरा खाई गुड़ में लिपटे मुरमुरे हैं, पुरी की लोकप्रिय मिठाई।", "ಕೋರಾ ಖಾಯಿ ಬೆಲ್ಲ ಲೇಪಿತ ಅರಳು; ಪುರಿಯ ಜನಪ್ರಿಯ ಸಿಹಿ."],
   ["The conch is blown in Odia temples and homes during prayers.", "ओडिशा के मंदिरों और घरों में पूजा के समय शंख बजाया जाता है।", "ಒಡಿಶಾದ ದೇವಾಲಯ, ಮನೆಗಳಲ್ಲಿ ಪೂಜೆಯ ವೇಳೆ ಶಂಖ ಊದುತ್ತಾರೆ."],
   ["Sabai grass is twisted into rope and woven into baskets and mats.", "सबई घास को रस्सी बनाकर टोकरियाँ और चटाइयाँ बुनी जाती हैं।", "ಸಬಾಯಿ ಹುಲ್ಲನ್ನು ಹಗ್ಗವಾಗಿ ಹೊಸೆದು ಬುಟ್ಟಿ, ಚಾಪೆ ಹೆಣೆಯುತ್ತಾರೆ."],
   ["Puri beach is famous for giant sand sculptures.", "पुरी का तट विशाल रेत की मूर्तियों के लिए प्रसिद्ध है।", "ಪುರಿಯ ಕಡಲತೀರ ದೊಡ್ಡ ಮರಳು ಶಿಲ್ಪಗಳಿಗೆ ಹೆಸರುವಾಸಿ."],
   ["At Boita Bandana, children float little boats to remember sailors who traded with far lands.", "बोइता बंदाण पर बच्चे छोटी नावें तैराकर उन नाविकों को याद करते हैं जो दूर देशों तक व्यापार करते थे।", "ಬೋಯಿತಾ ಬಂದಾಣದಂದು ಮಕ್ಕಳು ಪುಟ್ಟ ದೋಣಿ ತೇಲಿಬಿಟ್ಟು ದೂರ ದೇಶಗಳಿಗೆ ವ್ಯಾಪಾರಕ್ಕೆ ಹೋಗುತ್ತಿದ್ದ ನಾವಿಕರನ್ನು ನೆನೆಯುತ್ತಾರೆ."]],
  rj:[["Kathputli string puppets have told stories of Rajasthani kings and heroes for hundreds of years.", "कठपुतलियाँ सैकड़ों सालों से राजस्थान के राजाओं और वीरों की कहानियाँ सुनाती आई हैं।", "ಕಠಪುತ್ಲಿ ಸೂತ್ರದ ಗೊಂಬೆಗಳು ನೂರಾರು ವರ್ಷಗಳಿಂದ ರಾಜಸ್ಥಾನದ ರಾಜರು ಮತ್ತು ವೀರರ ಕತೆಗಳನ್ನು ಹೇಳುತ್ತಿವೆ."],
   ["Hawa Mahal was built in 1799 by Maharaja Sawai Pratap Singh, in the shape of Lord Krishna's crown.", "हवा महल 1799 में महाराजा सवाई प्रताप सिंह ने बनवाया था, भगवान कृष्ण के मुकुट के आकार में।", "ಹವಾ ಮಹಲ್ ಅನ್ನು 1799ರಲ್ಲಿ ಮಹಾರಾಜ ಸವಾಯಿ ಪ್ರತಾಪ್ ಸಿಂಗ್ ಕೃಷ್ಣನ ಕಿರೀಟದ ಆಕಾರದಲ್ಲಿ ಕಟ್ಟಿಸಿದರು."],
   ["The camel is the ship of the desert and Rajasthan's state animal; it can go for days without water.", "ऊँट रेगिस्तान का जहाज़ और राजस्थान का राज्य पशु है; यह कई दिन बिना पानी के रह सकता है।", "ಒಂಟೆ ಮರುಭೂಮಿಯ ಹಡಗು ಮತ್ತು ರಾಜಸ್ಥಾನದ ರಾಜ್ಯ ಪ್ರಾಣಿ; ನೀರಿಲ್ಲದೆ ಹಲವು ದಿನ ಇರಬಲ್ಲದು."],
   ["Ghevar is a honeycomb-shaped sweet made specially for the Teej festival in the rainy season.", "घेवर मधुमक्खी के छत्ते जैसी मिठाई है, जो खास तौर पर बारिश के मौसम में तीज के लिए बनती है।", "ಘೇವರ್ ಜೇನುಗೂಡಿನ ಆಕಾರದ ಸಿಹಿ; ಮಳೆಗಾಲದ ತೀಜ್ ಹಬ್ಬಕ್ಕೆ ವಿಶೇಷವಾಗಿ ಮಾಡುತ್ತಾರೆ."],
   ["Jaipur blue pottery is made from quartz powder instead of clay, and painted with cobalt blue.", "जयपुर की ब्लू पॉटरी मिट्टी से नहीं, क्वार्ट्ज़ के चूर्ण से बनती है और कोबाल्ट नीले रंग से रंगी जाती है।", "ಜೈಪುರದ ನೀಲಿ ಮಡಿಕೆಗಳನ್ನು ಮಣ್ಣಿನಿಂದಲ್ಲ, ಸ್ಫಟಿಕದ ಪುಡಿಯಿಂದ ಮಾಡಿ ಕೋಬಾಲ್ಟ್ ನೀಲಿ ಬಣ್ಣ ಹಚ್ಚುತ್ತಾರೆ."],
   ["In bandhani, tiny knots are tied in the cloth before dyeing, so each knot leaves a dot. A turban can be about 9 metres long!", "बांधनी में रंगने से पहले कपड़े में छोटी-छोटी गाँठें बाँधते हैं, हर गाँठ एक बिंदु छोड़ती है। एक पगड़ी लगभग 9 मीटर लंबी हो सकती है!", "ಬಾಂಧನಿಯಲ್ಲಿ ಬಣ್ಣ ಹಾಕುವ ಮೊದಲು ಬಟ್ಟೆಗೆ ಪುಟ್ಟ ಗಂಟುಗಳನ್ನು ಕಟ್ಟುತ್ತಾರೆ; ಪ್ರತಿ ಗಂಟು ಒಂದು ಚುಕ್ಕೆ ಬಿಡುತ್ತದೆ. ಒಂದು ಪೇಟ ಸುಮಾರು 9 ಮೀಟರ್ ಉದ್ದವಿರಬಹುದು!"],
   ["Baati are hard wheat balls once baked under hot desert sand; with dal and sweet churma they make Rajasthan's favourite meal.", "बाटी गेहूँ के कड़े गोले हैं, जो कभी रेगिस्तान की गर्म रेत में सेंके जाते थे; दाल और मीठे चूरमे के साथ यह राजस्थान का प्यारा खाना है।", "ಬಾಟಿ ಎಂದರೆ ಗೋಧಿಯ ಗಟ್ಟಿ ಉಂಡೆಗಳು; ಹಿಂದೆ ಮರುಭೂಮಿಯ ಬಿಸಿ ಮರಳಿನಲ್ಲಿ ಬೇಯಿಸುತ್ತಿದ್ದರು. ದಾಲ್ ಮತ್ತು ಸಿಹಿ ಚೂರ್ಮಾ ಜೊತೆ ಇದು ರಾಜಸ್ಥಾನದ ನೆಚ್ಚಿನ ಊಟ."],
   ["The Ravanhatha is one of the oldest bowed string instruments; Bhopa singers play it while singing hero stories.", "रावणहत्था सबसे पुराने गज वाले वाद्यों में से एक है; भोपा गायक वीरों की कथा गाते हुए इसे बजाते हैं।", "ರಾವಣಹತ್ಥ ಬಿಲ್ಲಿನಿಂದ ನುಡಿಸುವ ಅತಿ ಹಳೆಯ ತಂತಿ ವಾದ್ಯಗಳಲ್ಲಿ ಒಂದು; ಭೋಪಾ ಹಾಡುಗಾರರು ವೀರರ ಕತೆ ಹಾಡುತ್ತಾ ಇದನ್ನು ನುಡಿಸುತ್ತಾರೆ."],
   ["Mojaris are handmade leather shoes, stitched with colourful thread, beads and mirrors.", "मोजड़ी हाथ से बने चमड़े के जूते हैं, जिन पर रंगीन धागे, मोती और शीशे टाँके जाते हैं।", "ಮೋಜಡಿ ಕೈಯಿಂದ ಮಾಡಿದ ಚರ್ಮದ ಚಪ್ಪಲಿ; ಬಣ್ಣದ ದಾರ, ಮಣಿ ಮತ್ತು ಕನ್ನಡಿಗಳಿಂದ ಹೊಲಿಯುತ್ತಾರೆ."],
   ["In Ghoomar, women twirl round and round so their wide ghagra skirts spread like flowers.", "घूमर में महिलाएँ गोल-गोल घूमती हैं, जिससे उनके चौड़े घाघरे फूल की तरह फैल जाते हैं।", "ಘೂಮರ್ ನೃತ್ಯದಲ್ಲಿ ಮಹಿಳೆಯರು ಸುತ್ತಿ ಸುತ್ತಿ ಕುಣಿದಾಗ ಅವರ ಅಗಲವಾದ ಘಾಗ್ರಾ ಲಂಗಗಳು ಹೂವಿನಂತೆ ಅರಳುತ್ತವೆ."],
   ["The Vijay Stambh at Chittorgarh is a 9-storey tower about 37 metres tall, covered in carvings of gods.", "चित्तौड़गढ़ का विजय स्तंभ लगभग 37 मीटर ऊँचा नौ मंज़िला स्तंभ है, जिस पर देवताओं की नक्काशी है।", "ಚಿತ್ತೋಡ್‌ಗಢದ ವಿಜಯ ಸ್ತಂಭ ಸುಮಾರು 37 ಮೀಟರ್ ಎತ್ತರದ ಒಂಬತ್ತು ಅಂತಸ್ತಿನ ಗೋಪುರ; ಅದರ ತುಂಬ ದೇವರ ಕೆತ್ತನೆಗಳಿವೆ."],
   ["Bikaneri bhujia is a crunchy snack of moth-bean flour and spices, and it has a GI tag.", "बीकानेरी भुजिया मोठ के आटे और मसालों से बना कुरकुरा नमकीन है, और इसे जीआई टैग मिला है।", "ಬೀಕಾನೇರಿ ಭುಜಿಯಾ ಮಡಕೆಕಾಳಿನ ಹಿಟ್ಟು ಮತ್ತು ಮಸಾಲೆಯಿಂದ ಮಾಡಿದ ಗರಿಗರಿ ತಿಂಡಿ; ಇದಕ್ಕೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಇದೆ."],
   ["Rajasthan's kathputli puppets act out stories of brave kings.", "राजस्थान की कठपुतलियाँ वीर राजाओं की कहानियाँ दिखाती हैं।", "ರಾಜಸ್ಥಾನದ ಕಠಪುತ್ಲಿ ಗೊಂಬೆಗಳು ವೀರ ರಾಜರ ಕಥೆಗಳನ್ನು ಆಡಿ ತೋರಿಸುತ್ತವೆ."],
   ["Jaipur's Jal Mahal stands in the middle of Man Sagar Lake.", "जयपुर का जल महल मान सागर झील के बीच में है।", "ಜೈಪುರದ ಜಲಮಹಲ್ ಮಾನ್ ಸಾಗರ ಸರೋವರದ ನಡುವೆ ಇದೆ."],
   ["Marwari horses have ears that curl inward until the tips touch.", "मारवाड़ी घोड़ों के कान अंदर की ओर मुड़कर सिरों पर मिल जाते हैं।", "ಮಾರ್ವಾಡಿ ಕುದುರೆಗಳ ಕಿವಿಗಳು ಒಳಕ್ಕೆ ಬಾಗಿ ತುದಿಗಳು ತಾಕುತ್ತವೆ."],
   ["Jodhpur's mawa kachori is a sweet kachori filled with khoya and dipped in syrup.", "जोधपुर की मावा कचौरी मावे से भरी, चाशनी में डूबी मीठी कचौरी है।", "ಜೋಧಪುರದ ಮಾವಾ ಕಚೋರಿ ಖೋವಾ ತುಂಬಿ ಪಾಕದಲ್ಲಿ ಅದ್ದಿದ ಸಿಹಿ ಕಚೋರಿ."],
   ["Jaipur blue pottery is made from quartz powder, not clay.", "जयपुर की नीली पॉटरी मिट्टी से नहीं, क्वार्ट्ज़ के चूर्ण से बनती है।", "ಜೈಪುರದ ನೀಲಿ ಕುಂಬಾರಿಕೆಯನ್ನು ಮಣ್ಣಿನಿಂದಲ್ಲ, ಸ್ಫಟಿಕ ಶಿಲೆಯ ಪುಡಿಯಿಂದ ಮಾಡುತ್ತಾರೆ."],
   ["Lehariya means 'waves': the cloth is rolled and dyed in wavy stripes.", "लहरिया का अर्थ है लहरें; कपड़े को लपेटकर लहरदार धारियों में रंगा जाता है।", "ಲಹರಿಯಾ ಎಂದರೆ ಅಲೆಗಳು; ಬಟ್ಟೆಯನ್ನು ಸುತ್ತಿ ಅಲೆಅಲೆಯ ಪಟ್ಟೆಗಳಲ್ಲಿ ಬಣ್ಣ ಹಾಕುತ್ತಾರೆ."],
   ["Onion kachori is a favourite Rajasthani breakfast.", "प्याज़ कचौरी राजस्थान में नाश्ते की पसंदीदा चीज़ है।", "ಈರುಳ್ಳಿ ಕಚೋರಿ ರಾಜಸ್ಥಾನದ ಮೆಚ್ಚಿನ ಬೆಳಗಿನ ತಿಂಡಿ."],
   ["The kamaicha is a bowed instrument played by the Manganiyar musicians of the desert.", "कमायचा गज़ से बजने वाला वाद्य है, जिसे रेगिस्तान के मांगणियार संगीतकार बजाते हैं।", "ಕಮಾಯಚಾ ಬಿಲ್ಲಿನಿಂದ ನುಡಿಸುವ ವಾದ್ಯ; ಮರುಭೂಮಿಯ ಮಾಂಗಣಿಯಾರ್ ಸಂಗೀತಗಾರರು ನುಡಿಸುತ್ತಾರೆ."],
   ["Lac bangles are made from a natural resin produced by tiny insects.", "लाख की चूड़ियाँ छोटे कीड़ों से मिलने वाली प्राकृतिक राल से बनती हैं।", "ಅರಗಿನ ಬಳೆಗಳನ್ನು ಪುಟ್ಟ ಕೀಟಗಳು ಮಾಡುವ ಸಹಜ ಅಂಟಿನಿಂದ ಮಾಡುತ್ತಾರೆ."],
   ["Kalbeliya dance, with swirling black skirts, is on UNESCO's heritage list.", "घूमते काले घाघरे वाला कालबेलिया नृत्य यूनेस्को की धरोहर सूची में है।", "ಸುತ್ತುವ ಕಪ್ಪು ಲಂಗದ ಕಾಲ್ಬೇಲಿಯಾ ನೃತ್ಯ ಯುನೆಸ್ಕೋ ಪರಂಪರೆಯ ಪಟ್ಟಿಯಲ್ಲಿದೆ."],
   ["Chhatris are domed pavilions built in memory of kings and heroes.", "छतरियाँ गुंबद वाले मंडप हैं, जो राजाओं और वीरों की याद में बनाए गए।", "ಛತ್ರಿಗಳು ರಾಜರು, ವೀರರ ನೆನಪಿಗೆ ಕಟ್ಟಿದ ಗುಮ್ಮಟದ ಮಂಟಪಗಳು."],
   ["Ker berries and sangri beans grow wild in the desert and are cooked together.", "केर और सांगरी रेगिस्तान में अपने आप उगते हैं और साथ पकाए जाते हैं।", "ಕೇರ್ ಹಣ್ಣು, ಸಾಂಗ್ರಿ ಕಾಯಿ ಮರುಭೂಮಿಯಲ್ಲಿ ತಾನಾಗೇ ಬೆಳೆಯುತ್ತವೆ; ಎರಡನ್ನೂ ಸೇರಿಸಿ ಪಲ್ಯ ಮಾಡುತ್ತಾರೆ."],
   ["Mohanthal is a fudge of roasted gram flour, ghee and sugar.", "मोहनथाल भुने बेसन, घी और चीनी की बर्फ़ी है।", "ಮೋಹನ್ಥಾಲ್ ಹುರಿದ ಕಡಲೆಹಿಟ್ಟು, ತುಪ್ಪ, ಸಕ್ಕರೆಯ ಬರ್ಫಿ."],
   ["Rabri is thick sweet milk with layers of cream.", "रबड़ी मलाई की परतों वाला गाढ़ा मीठा दूध है।", "ರಬ್ಡಿ ಕೆನೆಯ ಪದರಗಳಿರುವ ಗಟ್ಟಿ ಸಿಹಿ ಹಾಲು."],
   ["Pushkar's malpuas are fried in ghee and soaked in syrup.", "पुष्कर के मालपुए घी में तले और चाशनी में डूबे होते हैं।", "ಪುಷ್ಕರದ ಮಾಲ್ಪುವಾಗಳನ್ನು ತುಪ್ಪದಲ್ಲಿ ಕರಿದು ಪಾಕದಲ್ಲಿ ಅದ್ದುತ್ತಾರೆ."],
   ["Ajmer's sohan halwa is so firm it is cut into pieces.", "अजमेर का सोहन हलवा इतना सख़्त होता है कि टुकड़ों में काटा जाता है।", "ಅಜ್ಮೀರದ ಸೋಹನ್ ಹಲ್ವಾ ಎಷ್ಟು ಗಟ್ಟಿಯೆಂದರೆ ತುಂಡುಗಳಾಗಿ ಕತ್ತರಿಸುತ್ತಾರೆ."],
   ["Alwar's milk cake is grainy, with a caramel-brown middle.", "अलवर का मिल्क केक दानेदार होता है, बीच में भूरा।", "ಅಲ್ವರ್‌ನ ಮಿಲ್ಕ್ ಕೇಕ್ ಹರಳುಹರಳಾಗಿದ್ದು ನಡುವೆ ಕಂದು ಬಣ್ಣದ್ದು."],
   ["Moong dal halwa is stirred for a long time, a winter wedding favourite.", "मूँग दाल का हलवा देर तक भूनकर बनता है, सर्दियों की शादियों में ख़ास।", "ಹೆಸರುಬೇಳೆ ಹಲ್ವಾವನ್ನು ತುಂಬಾ ಹೊತ್ತು ಹುರಿದು ಮಾಡುತ್ತಾರೆ; ಚಳಿಗಾಲದ ಮದುವೆಗಳಲ್ಲಿ ವಿಶೇಷ."],
   ["Mirchi vada is a big green chilli stuffed with potato and fried in batter.", "मिर्ची वड़ा बड़ी हरी मिर्च में आलू भरकर बेसन में तला जाता है।", "ಮಿರ್ಚಿ ವಡಾ ದೊಡ್ಡ ಮೆಣಸಿನಕಾಯಿಗೆ ಆಲೂಗಡ್ಡೆ ತುಂಬಿ ಕಡಲೆಹಿಟ್ಟಿನಲ್ಲಿ ಕರಿದ ತಿಂಡಿ."],
   ["Gatte are gram-flour dumplings, made where fresh vegetables were hard to find.", "गट्टे बेसन के टुकड़े हैं, जो वहाँ बने जहाँ ताज़ी सब्ज़ियाँ कम मिलती थीं।", "ಗಟ್ಟೆ ಕಡಲೆಹಿಟ್ಟಿನ ತುಂಡುಗಳು; ತಾಜಾ ತರಕಾರಿ ಸಿಗದ ಮರುಭೂಮಿಯಲ್ಲಿ ಹುಟ್ಟಿದ ಅಡುಗೆ."],
   ["Sanganer printers stamp cloth by hand with carved wooden blocks.", "सांगानेर के कारीगर नक़्क़ाशीदार लकड़ी के ठप्पों से हाथ से कपड़ा छापते हैं।", "ಸಾಂಗಾನೇರಿನ ಕುಶಲಕರ್ಮಿಗಳು ಕೆತ್ತಿದ ಮರದ ಅಚ್ಚುಗಳಿಂದ ಕೈಯಲ್ಲೇ ಬಟ್ಟೆ ಮುದ್ರಿಸುತ್ತಾರೆ."],
   ["In kundan jewellery, stones are set in pure gold foil.", "कुंदन के गहनों में नग शुद्ध सोने की पन्नी में जड़े जाते हैं।", "ಕುಂದನ್ ಆಭರಣದಲ್ಲಿ ಹರಳುಗಳನ್ನು ಶುದ್ಧ ಚಿನ್ನದ ಹಾಳೆಯಲ್ಲಿ ಕೂರಿಸುತ್ತಾರೆ."],
   ["Bandhani is made by tying thousands of tiny knots before dyeing.", "बांधनी में रंगने से पहले हज़ारों छोटी गाँठें बाँधी जाती हैं।", "ಬಾಂಧನಿಯಲ್ಲಿ ಬಣ್ಣ ಹಾಕುವ ಮೊದಲು ಸಾವಿರಾರು ಪುಟ್ಟ ಗಂಟುಗಳನ್ನು ಕಟ್ಟುತ್ತಾರೆ."],
   ["Pichwai paintings hang behind Shrinathji at Nathdwara and show his cows.", "पिछवाई चित्र नाथद्वारा में श्रीनाथजी के पीछे टँगते हैं और उनकी गायें दिखाते हैं।", "ಪಿಚ್ವಾಯಿ ಚಿತ್ರಗಳು ನಾಥದ್ವಾರದಲ್ಲಿ ಶ್ರೀನಾಥಜಿಯ ಹಿಂದೆ ತೂಗಿದ್ದು ಅವನ ಹಸುಗಳನ್ನು ತೋರಿಸುತ್ತವೆ."],
   ["Molela potters make clay plaques of local folk gods.", "मोलेला के कुम्हार लोक देवताओं की मिट्टी की तख्तियाँ बनाते हैं।", "ಮೊಲೇಲಾದ ಕುಂಬಾರರು ಗ್ರಾಮದೇವತೆಗಳ ಮಣ್ಣಿನ ಫಲಕಗಳನ್ನು ಮಾಡುತ್ತಾರೆ."],
   ["The morchang is a tiny metal mouth harp with a twangy sound.", "मोरचंग धातु का छोटा मुँह से बजने वाला वाद्य है, जिससे टंकार निकलती है।", "ಮೋರ್ಚಂಗ್ ಬಾಯಲ್ಲಿಟ್ಟು ನುಡಿಸುವ ಪುಟ್ಟ ಲೋಹದ ವಾದ್ಯ; ಠಂಗ್ ಠಂಗ್ ಸದ್ದು ಮಾಡುತ್ತದೆ."],
   ["The dhol is played at every Rajasthani wedding and fair.", "हर राजस्थानी शादी और मेले में ढोल बजता है।", "ರಾಜಸ್ಥಾನದ ಪ್ರತಿ ಮದುವೆ, ಜಾತ್ರೆಯಲ್ಲಿ ಢೋಲ್ ಬಾರಿಸುತ್ತಾರೆ."],
   ["The Great Indian Bustard is Rajasthan's state bird, and very few are left.", "गोडावण राजस्थान का राज्य पक्षी है, और अब बहुत कम बचे हैं।", "ಹೆಬ್ಬಕ (ಗೋಡಾವಣ್) ರಾಜಸ್ಥಾನದ ರಾಜ್ಯ ಪಕ್ಷಿ; ಈಗ ಕೆಲವೇ ಉಳಿದಿವೆ."],
   ["Ranthambore's tigers are often seen near the ruins of an old fort.", "रणथंभौर के बाघ अक्सर पुराने किले के खंडहरों के पास दिखते हैं।", "ರಣಥಂಬೋರಿನ ಹುಲಿಗಳು ಹಳೆಯ ಕೋಟೆಯ ಅವಶೇಷಗಳ ಬಳಿ ಹೆಚ್ಚಾಗಿ ಕಾಣಸಿಗುತ್ತವೆ."],
   ["In 1730, Bishnoi villagers hugged Khejri trees to save them.", "1730 में बिश्नोई गाँववालों ने खेजड़ी के पेड़ों से लिपटकर उन्हें बचाया।", "1730ರಲ್ಲಿ ಬಿಷ್ಣೋಯಿ ಹಳ್ಳಿಗರು ಖೇಜ್ಡಿ ಮರಗಳನ್ನು ಅಪ್ಪಿಕೊಂಡು ಉಳಿಸಿದರು."],
   ["Sojat's henna has a GI tag and gives a deep red colour.", "सोजत की मेहंदी को जीआई टैग मिला है और यह गहरा लाल रंग देती है।", "ಸೋಜತ್‌ನ ಮದರಂಗಿಗೆ ಭೌಗೋಳಿಕ ಗುರುತು ಸಿಕ್ಕಿದ್ದು, ಗಾಢ ಕೆಂಪು ಬಣ್ಣ ಕೊಡುತ್ತದೆ."],
   ["Phad scrolls are long cloth paintings sung aloud by storytellers at night.", "फड़ लंबे कपड़े पर बने चित्र हैं, जिन्हें कथावाचक रात में गाकर सुनाते हैं।", "ಫಡ್ ಉದ್ದ ಬಟ್ಟೆಯ ಮೇಲಿನ ಚಿತ್ರ; ಕಥೆಗಾರರು ರಾತ್ರಿ ಹಾಡುತ್ತಾ ಕಥೆ ಹೇಳುತ್ತಾರೆ."]],
  gj:[["Patan Patola is double ikat silk: both sets of threads are dyed in the pattern before weaving, so one saree can take months.", "पाटन पटोला दोहरी इकत रेशम है: बुनाई से पहले दोनों तरफ़ के धागे डिज़ाइन में रंगे जाते हैं, इसलिए एक साड़ी में महीनों लगते हैं।", "ಪಾಟನ್ ಪಟೋಲಾ ಎರಡು ಬದಿಯ ಇಕತ್ ರೇಷ್ಮೆ: ನೇಯುವ ಮೊದಲೇ ಉದ್ದ ಮತ್ತು ಅಡ್ಡ ದಾರಗಳೆರಡಕ್ಕೂ ವಿನ್ಯಾಸದಂತೆ ಬಣ್ಣ ಹಾಕುತ್ತಾರೆ; ಒಂದು ಸೀರೆಗೆ ತಿಂಗಳುಗಟ್ಟಲೆ ಬೇಕು."],
