/* Match Journey: tap free tiles into a 7-slot tray; three alike vanish. Board above, tray and boosters below; built for phones first. */

}

  story:[
   {img:'img/match/ga/story_1.jpg',en:"Ajji's map glows over Goa. Honk, honk! It is the poder, the village bread man, on his bicycle. Diya and her new friend Sonali buy warm poi bread in front of a yellow house with a shady front porch, while coconut palms sway overhead.",

   {img:'img/match/ga/story_2.jpg',at:6,en:"A little ferry carries Diya and Sonali across the wide Mandovi river. Mangroves line the banks, white egrets fish in the shallows, and far away the towers of Old Goa's churches rise above the palms.",

   {img:'img/match/ga/story_3.jpg',at:12,en:"It is Shigmo, Goa's spring festival! Drums boom, flags swirl and painted floats roll down the street. Diya dances with Sonali in the crowd. The painting is complete, glowing red and white like a Kaavi temple wall! Ajji's map lights up again, north up the coast to Maharashtra, where people dance in circles like white Warli figures.",

    kn:"ಇದು ಶಿಗ್ಮೋ, ಗೋವಾದ ವಸಂತ ಹಬ್ಬ! ಡೋಲುಗಳು ಮೊಳಗುತ್ತವೆ, ಬಾವುಟಗಳು ಸುತ್ತುತ್ತವೆ, ಬಣ್ಣದ ತೇರುಗಳು ಬೀದಿಯಲ್ಲಿ ಸಾಗುತ್ತವೆ. ದಿಯಾ ಜನಸಂದಣಿಯಲ್ಲಿ ಸೋನಾಲಿಯ ಜೊತೆ ಕುಣಿಯುತ್ತಾಳೆ. ಚಿತ್ರ ಪೂರ್ಣವಾಯಿತು, ಕಾವಿ ಕಲೆಯ ದೇವಾಲಯದ ಗೋಡೆಯಂತೆ ಕೆಂಪು-ಬಿಳುಪಿನಲ್ಲಿ ಹೊಳೆಯುತ್ತಿದೆ! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಕಡಲತೀರದ ಉದ್ದಕ್ಕೂ ಉತ್ತರಕ್ಕೆ ಮಹಾರಾಷ್ಟ್ರದತ್ತ, ಅಲ್ಲಿ ಜನರು ಬಿಳಿ ವಾರ್ಲಿ ಚಿತ್ರಗಳಂತೆ ವೃತ್ತದಲ್ಲಿ ಕುಣಿಯುತ್ತಾರೆ."}]},

   {img:'img/match/mh/story_3.jpg',at:12,en:"The painting dances with white Warli figures! Ajji's map lights up again, north along the coast to Daman, Diu and Dadra and Nagar Haveli.",

    kn:"ಚಿತ್ರ ಬಿಳಿ ವಾರ್ಲಿ ಆಕೃತಿಗಳೊಂದಿಗೆ ಕುಣಿಯುತ್ತಿದೆ! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಕಡಲತೀರದ ಉದ್ದಕ್ಕೂ ಉತ್ತರಕ್ಕೆ ದಮನ್, ದೀವ್ ಮತ್ತು ದಾದರಾ ನಗರ ಹವೇಲಿಯತ್ತ."}]},

  look:["Casuarina tree","Ghangri","Warli wedding chauk","St Paul's Church","Panikotha sea fort","Pomfret fry","Bamboo fish trap","Blackbuck","Ferry launch","Blue-and-white plate","Rice bhakri","Conch shell"],
  more:["Asiatic lion","Daman lighthouse","St Jerome gateway","INS Khukri model","Five Shiva lingas","Naida Caves","Bebinca","Prawn curry","Hoka fruit","Mangroves","Tribal mask","Warli hut","Tur and thali","Portuguese house","Mando dancers","Dudhni boat","Leather sandals","Palm-leaf mat","Ubadiyu pot","Zampa Gateway"],
  story:[
   {img:'img/match/dd/story_1.jpg',en:"Ajji's map glows over the sea. Diya lands in Diu, an island where blue-and-white tiles shine on old walls. Her new friend Ana takes her up Diu Fort to see the sea fort Panikotha, and they share a hard, sweet hoka fruit under the branching palms.",
    hi:"अज्जी का नक्शा समुद्र पर चमका। दीया दीव पहुँचती है, एक ऐसा द्वीप जहाँ पुरानी दीवारों पर नीली-सफ़ेद टाइलें चमकती हैं। उसकी नई सहेली आना उसे दीव के किले पर ले जाती है, जहाँ से समुद्र में पानीकोठा किला दिखता है, और दोनों शाखाओं वाले ताड़ों के नीचे सख़्त, मीठा होका फल बाँटकर खाती हैं।",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ಕಡಲಿನ ಮೇಲೆ ಹೊಳೆಯಿತು. ದಿಯಾ ದಿಯು ದ್ವೀಪಕ್ಕೆ ಬಂದಿಳಿಯುತ್ತಾಳೆ; ಅಲ್ಲಿ ಹಳೆಯ ಗೋಡೆಗಳ ಮೇಲೆ ನೀಲಿ-ಬಿಳಿ ಬಿಲ್ಲೆಗಳು ಹೊಳೆಯುತ್ತವೆ. ಹೊಸ ಗೆಳತಿ ಆನಾ ಅವಳನ್ನು ದಿಯು ಕೋಟೆಯ ಮೇಲೆ ಕರೆದೊಯ್ದು ಕಡಲ ನಡುವಿನ ಪಾನಿಕೋಠಾ ಕೋಟೆಯನ್ನು ತೋರಿಸುತ್ತಾಳೆ. ಕೊಂಬೆಕೊಂಬೆಯಾಗಿ ಹರಡಿದ ತಾಳೆಮರಗಳ ಕೆಳಗೆ ಇಬ್ಬರೂ ಗಟ್ಟಿಯಾದ, ಸಿಹಿಯಾದ ಹೋಕಾ ಹಣ್ಣನ್ನು ಹಂಚಿಕೊಂಡು ತಿನ್ನುತ್ತಾರೆ."},
   {img:'img/match/dd/story_2.jpg',at:6,en:"At sunset in Daman, colourful fishing boats sail home to the jetty at Nani Daman. Diya and Ana watch the old lighthouse blink on, while fishermen pull in nets full of silvery bombil.",
    hi:"दमण में सूरज ढल रहा है और रंग-बिरंगी नावें नानी दमण की जेटी पर लौट रही हैं। दीया और आना पुराने लाइटहाउस की बत्ती जलते देखती हैं, और मछुआरे चाँदी जैसी बोंबिल मछलियों से भरे जाल खींचते हैं।",
    kn:"ದಮನ್‌ನಲ್ಲಿ ಸಂಜೆ ಸೂರ್ಯ ಮುಳುಗುತ್ತಿದ್ದಾನೆ; ಬಣ್ಣಬಣ್ಣದ ಮೀನುಗಾರರ ದೋಣಿಗಳು ನಾನಿ ದಮನ್‌ನ ದೋಣಿಕಟ್ಟೆಗೆ ಮರಳುತ್ತಿವೆ. ಹಳೆಯ ದೀಪಸ್ತಂಭದ ದೀಪ ಬೆಳಗುವುದನ್ನು ದಿಯಾ ಮತ್ತು ಆನಾ ನೋಡುತ್ತಾರೆ; ಮೀನುಗಾರರು ಬೆಳ್ಳಿಯಂತೆ ಹೊಳೆಯುವ ಬೊಂಬಿಲ್ ಮೀನು ತುಂಬಿದ ಬಲೆಗಳನ್ನು ಎಳೆಯುತ್ತಾರೆ."},
   {img:'img/match/dd/story_3.jpg',at:12,en:"In a Warli village near Silvassa, the harvest is in! A grandfather plays the tarpa, and Diya joins the dancers in a big circle, arms linked. The painting is complete: blue Azulejo tiles framing dancing Warli figures! Ajji's map lights up again, north to Gujarat, land of kites and the white Rann.",
    hi:"सिलवासा के पास एक वारली गाँव में फ़सल घर आ गई है! एक दादाजी तारपा बजाते हैं और दीया हाथ में हाथ डाले नर्तकों के बड़े घेरे में शामिल हो जाती है। पेंटिंग पूरी हुई: नीली अज़ुलेजो टाइलों के बीच नाचते वारली चित्र! अज्जी का नक्शा फिर चमका, उत्तर में गुजरात की ओर, पतंगों और सफ़ेद रण की धरती।",
    kn:"ಸಿಲ್ವಾಸಾ ಬಳಿಯ ಒಂದು ವಾರ್ಲಿ ಹಳ್ಳಿಯಲ್ಲಿ ಸುಗ್ಗಿ ಮನೆಗೆ ಬಂದಿದೆ! ಒಬ್ಬ ಅಜ್ಜ ತಾರ್ಪಾ ಊದುತ್ತಾರೆ; ದಿಯಾ ಕೈಗೆ ಕೈ ಬೆಸೆದು ಕುಣಿಯುವವರ ದೊಡ್ಡ ವೃತ್ತದಲ್ಲಿ ಸೇರುತ್ತಾಳೆ. ಚಿತ್ರ ಪೂರ್ಣವಾಯಿತು: ನೀಲಿ ಅಜುಲೆಜೊ ಬಿಲ್ಲೆಗಳ ನಡುವೆ ಕುಣಿಯುವ ವಾರ್ಲಿ ಚಿತ್ರಗಳು! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಉತ್ತರಕ್ಕೆ ಗುಜರಾತ್‌ನತ್ತ, ಗಾಳಿಪಟಗಳು ಮತ್ತು ಬಿಳಿ ರಣದ ನಾಡು."}]},

  story:[
   {img:'img/match/gj/story_1.jpg',en:"Ajji's map glows over Gujarat. It is Uttarayan morning in Ahmedabad! Diya flies a kite from a rooftop with her new friend Kavya, while families shout \"Kai po che!\" and share undhiyu and jalebi.",
    hi:"अज्जी का नक्शा गुजरात पर चमका। अहमदाबाद में उत्तरायण की सुबह है! दीया अपनी नई सहेली काव्या के साथ छत से पतंग उड़ाती है, लोग \"काई पो छे!\" चिल्लाते हैं और उंधियू-जलेबी बाँटते हैं।",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ಗುಜರಾತ್‌ನ ಮೇಲೆ ಹೊಳೆಯಿತು. ಅಹಮದಾಬಾದ್‌ನಲ್ಲಿ ಉತ್ತರಾಯಣದ ಬೆಳಗು! ದಿಯಾ ತನ್ನ ಹೊಸ ಗೆಳತಿ ಕಾವ್ಯಾಳ ಜೊತೆ ಮಾಳಿಗೆಯಿಂದ ಗಾಳಿಪಟ ಹಾರಿಸುತ್ತಾಳೆ; ಎಲ್ಲರೂ \"ಕಾಯ್ ಪೋ ಛೇ!\" ಎಂದು ಕೂಗುತ್ತಾ ಉಂಧಿಯೂ, ಜಿಲೇಬಿ ಹಂಚಿಕೊಳ್ಳುತ್ತಾರೆ."},
   {img:'img/match/gj/story_2.jpg',at:6,en:"At Dhordo, the White Rann shines like snow under the full moon. Diya steps into a round bhunga hut, where a Kutchi grandmother shows her how to stitch tiny mirrors onto bright cloth.",
    hi:"धोरडो में पूरे चाँद के नीचे सफ़ेद रण बर्फ़ की तरह चमकता है। दीया एक गोल भूंगा झोपड़ी में जाती है, जहाँ एक कच्छी दादी उसे रंगीन कपड़े पर छोटे-छोटे शीशे टाँकना सिखाती हैं।",
    kn:"ಧೋರ್ಡೋದಲ್ಲಿ ಹುಣ್ಣಿಮೆಯ ಬೆಳದಿಂಗಳಲ್ಲಿ ಬಿಳಿ ರಣ ಹಿಮದಂತೆ ಹೊಳೆಯುತ್ತದೆ. ದಿಯಾ ಒಂದು ದುಂಡನೆಯ ಭೂಂಗಾ ಗುಡಿಸಲಿಗೆ ಹೋಗುತ್ತಾಳೆ; ಅಲ್ಲಿ ಕಚ್ಛ್‌ನ ಅಜ್ಜಿಯೊಬ್ಬರು ಬಣ್ಣದ ಬಟ್ಟೆಗೆ ಪುಟ್ಟ ಕನ್ನಡಿಗಳನ್ನು ಹೊಲಿಯುವುದನ್ನು ಕಲಿಸುತ್ತಾರೆ."},
   {img:'img/match/gj/story_3.jpg',at:12,en:"It is Navratri! Diya twirls in the Garba circle around a glowing garbo lamp, dandiya sticks clicking all around. The painting is complete, full of Pithora horses! Ajji's map lights up again, north to Rajasthan, land of Phad scroll paintings.",
    hi:"नवरात्रि है! दीया जगमगाते गरबो दीपक के चारों ओर गरबा के घेरे में घूमती है, चारों तरफ़ डांडिया खनकते हैं। पिथोरा घोड़ों से भरी पेंटिंग पूरी हुई! अज्जी का नक्शा फिर जगमगाया, उत्तर में राजस्थान की ओर, फड़ चित्रों की धरती।",
    kn:"ನವರಾತ್ರಿ ಬಂತು! ದಿಯಾ ಬೆಳಗುವ ಗರ್ಬೋ ದೀಪದ ಸುತ್ತ ಗರ್ಬಾ ವೃತ್ತದಲ್ಲಿ ಸುತ್ತಿ ಕುಣಿಯುತ್ತಾಳೆ, ಸುತ್ತಲೂ ದಾಂಡಿಯಾ ಕೋಲುಗಳ ಸದ್ದು. ಪಿಥೋರಾ ಕುದುರೆಗಳಿಂದ ತುಂಬಿದ ಚಿತ್ರ ಪೂರ್ಣವಾಯಿತು! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಉತ್ತರಕ್ಕೆ ರಾಜಸ್ಥಾನದತ್ತ, ಫಡ್ ಚಿತ್ರಗಳ ನಾಡು."}]},

  story:[
   {img:'img/match/rj/story_1.jpg',en:"Ajji's map glows over Rajasthan. In Jaipur's Pink City, under the windows of Hawa Mahal, Diya watches a Kathputli show: the puppet king and queen dance on strings while the puppeteer's wife beats a dholak and sings.",
    hi:"अज्जी का नक्शा राजस्थान पर चमका। जयपुर के गुलाबी शहर में, हवा महल की खिड़कियों के नीचे, दीया कठपुतली का खेल देखती है: धागों पर राजा-रानी नाचते हैं और कठपुतली वाले की पत्नी ढोलक बजाकर गाती है।",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ರಾಜಸ್ಥಾನದ ಮೇಲೆ ಹೊಳೆಯಿತು. ಜೈಪುರದ ಗುಲಾಬಿ ನಗರದಲ್ಲಿ, ಹವಾ ಮಹಲ್‌ನ ಕಿಟಕಿಗಳ ಕೆಳಗೆ ದಿಯಾ ಕಠಪುತ್ಲಿ ಆಟ ನೋಡುತ್ತಾಳೆ: ದಾರಗಳ ಮೇಲೆ ರಾಜ-ರಾಣಿ ಕುಣಿಯುತ್ತಾರೆ, ಗೊಂಬೆಯಾಟದವನ ಹೆಂಡತಿ ಢೋಲಕ್ ಬಾರಿಸುತ್ತಾ ಹಾಡುತ್ತಾಳೆ."},
   {img:'img/match/rj/story_2.jpg',at:6,en:"Night falls on the Thar desert near Jaisalmer. Diya rides a camel over the dunes under a big moon, and a Manganiyar family sings by the fire, playing the kamaicha and the clacking khartal.",
    hi:"जैसलमेर के पास थार रेगिस्तान में रात हुई। दीया बड़े चाँद के नीचे ऊँट पर टीलों की सैर करती है, और एक मांगणियार परिवार आग के पास कमायचा और खड़ताल बजाकर गाता है।",
    kn:"ಜೈಸಲ್ಮೇರ್ ಬಳಿಯ ಥಾರ್ ಮರುಭೂಮಿಯಲ್ಲಿ ರಾತ್ರಿಯಾಯಿತು. ದೊಡ್ಡ ಚಂದ್ರನ ಕೆಳಗೆ ದಿಯಾ ಒಂಟೆಯ ಮೇಲೆ ಮರಳು ದಿಬ್ಬಗಳನ್ನು ದಾಟುತ್ತಾಳೆ; ಬೆಂಕಿಯ ಬಳಿ ಮಾಂಗಣಿಯಾರ್ ಕುಟುಂಬ ಕಮಾಯಚಾ ಮತ್ತು ಖಡ್ತಾಲ್ ಬಾರಿಸುತ್ತಾ ಹಾಡುತ್ತದೆ."},
   {img:'img/match/rj/story_3.jpg',at:12,en:"In a Bhilwara courtyard, a Bhopa singer plays his Ravanhatha and sings the story of the hero Pabuji, while his wife lifts a lamp to each scene of the long Phad scroll. The painting is complete! Ajji's map lights up again, north-east to Haryana, land of golden mustard fields.",
    hi:"भीलवाड़ा के एक आँगन में भोपा गायक रावणहत्था बजाकर वीर पाबूजी की कथा गाता है, और उसकी पत्नी लंबे फड़ चित्र के हर दृश्य पर दीया उठाती है। पेंटिंग पूरी हुई! अज्जी का नक्शा फिर जगमगाया, उत्तर-पूर्व में हरियाणा की ओर, सरसों के सुनहरे खेतों की धरती।",
    kn:"ಭೀಲ್ವಾಡಾದ ಒಂದು ಅಂಗಳದಲ್ಲಿ ಭೋಪಾ ಹಾಡುಗಾರ ರಾವಣಹತ್ಥ ನುಡಿಸುತ್ತಾ ವೀರ ಪಾಬೂಜಿಯ ಕತೆ ಹಾಡುತ್ತಾನೆ; ಅವನ ಹೆಂಡತಿ ಉದ್ದದ ಫಡ್ ಚಿತ್ರಪಟದ ಒಂದೊಂದು ದೃಶ್ಯಕ್ಕೂ ದೀಪ ಹಿಡಿಯುತ್ತಾಳೆ. ಚಿತ್ರ ಪೂರ್ಣವಾಯಿತು! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಈಶಾನ್ಯಕ್ಕೆ ಹರಿಯಾಣದತ್ತ, ಸಾಸಿವೆಯ ಹೊಂಬಣ್ಣದ ಹೊಲಗಳ ನಾಡು."}]},
 {key:'br',name:{en:'Bihar',hi:'बिहार',kn:'ಬಿಹಾರ'},art:{en:'Madhubani painting',hi:'मधुबनी चित्रकला',kn:'ಮಧುಬನಿ ಚಿತ್ರಕಲೆ'},

  story:[
   {img:'img/match/br/story_1.jpg',en:"Ajji's map leads Diya to Mithila in Bihar. Here women paint fish, lotus and the sun on mud walls, for luck and for love. Match three to bring the colours home!",
    hi:"अज्जी का नक्शा दीया को बिहार के मिथिला ले आया। यहाँ औरतें मिट्टी की दीवारों पर मछली, कमल और सूरज बनाती हैं, शुभ और प्रेम के लिए। तीन मिलाओ और रंग घर ले चलो!",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ದಿಯಾಳನ್ನು ಬಿಹಾರದ ಮಿಥಿಲೆಗೆ ಕರೆತಂದಿತು. ಇಲ್ಲಿ ಹೆಂಗಸರು ಮಣ್ಣಿನ ಗೋಡೆಗಳ ಮೇಲೆ ಮೀನು, ಕಮಲ, ಸೂರ್ಯನನ್ನು ಬಿಡಿಸುತ್ತಾರೆ, ಶುಭಕ್ಕಾಗಿ, ಪ್ರೀತಿಗಾಗಿ. ಮೂರು ಜೋಡಿಸಿ, ಬಣ್ಣಗಳನ್ನು ಮನೆಗೆ ಒಯ್ಯಿರಿ!"},
   {img:'img/match/br/story_2.jpg',at:6,en:"Diya learns where the colours come from: yellow from turmeric, red from flowers, black from soot, green from leaves. \"Nature gives every colour,\" says the painter.",
    hi:"दीया सीखती है कि रंग कहाँ से आते हैं: हल्दी से पीला, फूलों से लाल, कालिख से काला, पत्तों से हरा। \"प्रकृति हर रंग देती है,\" चित्रकार कहती हैं।",
    kn:"ಬಣ್ಣಗಳು ಎಲ್ಲಿಂದ ಬರುತ್ತವೆ ಎಂದು ದಿಯಾ ಕಲಿಯುತ್ತಾಳೆ: ಅರಿಶಿನದಿಂದ ಹಳದಿ, ಹೂವಿನಿಂದ ಕೆಂಪು, ಮಸಿಯಿಂದ ಕಪ್ಪು, ಎಲೆಯಿಂದ ಹಸಿರು. \"ಪ್ರಕೃತಿ ಎಲ್ಲ ಬಣ್ಣ ಕೊಡುತ್ತದೆ,\" ಎನ್ನುತ್ತಾರೆ ಚಿತ್ರಕಾರ್ತಿ."},
   {img:'img/match/br/story_3.jpg',at:12,en:"The painting glows with Madhubani colours! Ajji's map lights up again, south to Jharkhand, land of forests and Sohrai wall paintings.",
    hi:"पेंटिंग मधुबनी रंगों से चमक उठी! अज्जी का नक्शा फिर जगमगाया, दक्षिण में झारखंड की ओर, जंगलों और सोहराय भित्तिचित्रों की धरती।",
    kn:"ಚಿತ್ರ ಮಧುಬನಿ ಬಣ್ಣಗಳಿಂದ ಹೊಳೆಯುತ್ತಿದೆ! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ದಕ್ಷಿಣಕ್ಕೆ ಜಾರ್ಖಂಡ್‌ನತ್ತ, ಕಾಡುಗಳು ಮತ್ತು ಸೊಹ್ರಾಯ್ ಗೋಡೆಚಿತ್ರಗಳ ನಾಡು."}]},

   {img:'img/match/od/story_1.jpg',en:"Ajji's map glows over Odisha. In Raghurajpur, Diya meets an old chitrakar who paints gods and stories on cloth with colours made from stones, shells and lamp soot.",
    hi:"अज्जी का नक्शा ओडिशा पर चमका। रघुराजपुर में दीया एक बूढ़े चित्रकार से मिलती है, जो पत्थर, सीप और दीये की कालिख से बने रंगों से कपड़े पर देवताओं और कहानियों के चित्र बनाते हैं।",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ಒಡಿಶಾದ ಮೇಲೆ ಹೊಳೆಯಿತು. ರಘುರಾಜಪುರದಲ್ಲಿ ದಿಯಾ ಒಬ್ಬ ಹಿರಿಯ ಚಿತ್ರಕಾರರನ್ನು ಭೇಟಿಯಾಗುತ್ತಾಳೆ. ಅವರು ಕಲ್ಲು, ಕಪ್ಪೆಚಿಪ್ಪು ಮತ್ತು ದೀಪದ ಮಸಿಯಿಂದ ಮಾಡಿದ ಬಣ್ಣಗಳಿಂದ ಬಟ್ಟೆಯ ಮೇಲೆ ದೇವರ ಮತ್ತು ಕಥೆಗಳ ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾರೆ."},
   {img:'img/match/od/story_2.jpg',at:6,en:"It's Rath Yatra in Puri! Diya grabs the thick rope with thousands of others and pulls Lord Jagannath's giant chariot. \"When everyone pulls together, the chariot moves,\" laughs the drummer.",
    hi:"पुरी में रथ यात्रा है! दीया हज़ारों लोगों के साथ मोटी रस्सी पकड़कर भगवान जगन्नाथ का विशाल रथ खींचती है। \"सब मिलकर खींचें तो रथ चल पड़ता है,\" ढोल वाला हँसकर कहता है।",
    kn:"ಪುರಿಯಲ್ಲಿ ರಥಯಾತ್ರೆ! ದಿಯಾ ಸಾವಿರಾರು ಜನರೊಂದಿಗೆ ದಪ್ಪ ಹಗ್ಗ ಹಿಡಿದು ಜಗನ್ನಾಥನ ಭವ್ಯ ರಥವನ್ನು ಎಳೆಯುತ್ತಾಳೆ. \"ಎಲ್ಲರೂ ಸೇರಿ ಎಳೆದರೆ ರಥ ಮುಂದೆ ಸಾಗುತ್ತದೆ,\" ಎಂದು ಡೋಲು ಬಾರಿಸುವವನು ನಗುತ್ತಾ ಹೇಳುತ್ತಾನೆ."},
   {img:'img/match/od/story_3.jpg',at:12,en:"On Puri beach at sunset the painting glows in Pattachitra reds and golds. Ajji's map lights up again, west to Chhattisgarh, land of Dhokra metal craft.",
    hi:"सूर्यास्त के समय पुरी के तट पर पेंटिंग पट्टचित्र के लाल और सुनहरे रंगों में चमक उठी। अज्जी का नक्शा फिर जगमगाया, पश्चिम में छत्तीसगढ़ की ओर, ढोकरा धातु शिल्प की धरती।",
    kn:"ಸಂಜೆ ಪುರಿಯ ಕಡಲತೀರದಲ್ಲಿ ಚಿತ್ರ ಪಟ್ಟಚಿತ್ರದ ಕೆಂಪು, ಚಿನ್ನದ ಬಣ್ಣಗಳಲ್ಲಿ ಹೊಳೆಯುತ್ತಿದೆ. ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಪಶ್ಚಿಮಕ್ಕೆ ಛತ್ತೀಸ್‌ಗಢದತ್ತ, ಢೋಕ್ರಾ ಲೋಹಶಿಲ್ಪದ ನಾಡು."}]},

  story:[
   {img:'img/match/ap/story_1.jpg',en:"Ajji's map glows over Andhra Pradesh. In Etikoppaka, Diya watches a toy-maker spin soft wood on a turning machine and colour it with lac and natural dyes from seeds, bark and turmeric.",
    hi:"अज्जी का नक्शा आंध्र प्रदेश पर चमका। एटिकोप्पाका में दीया एक खिलौना कारीगर को देखती है, जो खराद पर नरम लकड़ी घुमाकर बीज, छाल और हल्दी के प्राकृतिक रंगों वाली लाख से रंगता है।",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ಆಂಧ್ರಪ್ರದೇಶದ ಮೇಲೆ ಹೊಳೆಯಿತು. ಏಟಿಕೊಪ್ಪಾಕದಲ್ಲಿ ಒಬ್ಬ ಗೊಂಬೆ ತಯಾರಕ ಮೆತ್ತನೆಯ ಮರವನ್ನು ತಿರುಗುವ ಯಂತ್ರದಲ್ಲಿ ಕಡೆದು, ಬೀಜ, ತೊಗಟೆ, ಅರಿಶಿನದ ನೈಸರ್ಗಿಕ ಬಣ್ಣದ ಅರಗಿನಿಂದ ಬಣ್ಣ ಹಚ್ಚುವುದನ್ನು ದಿಯಾ ನೋಡುತ್ತಾಳೆ."},
   {img:'img/match/ap/story_2.jpg',at:6,en:"Up in misty Araku Valley, Diya helps a tribal family pick ripe red coffee cherries. In the evening everyone joins hands for the Dhimsa dance.",
    hi:"धुंध भरी अराकू घाटी में दीया एक आदिवासी परिवार के साथ पकी लाल कॉफ़ी चेरी तोड़ती है। शाम को सब हाथ पकड़कर धिमसा नृत्य करते हैं।",
    kn:"ಮಂಜು ಮುಸುಕಿದ ಅರಕು ಕಣಿವೆಯಲ್ಲಿ ದಿಯಾ ಒಂದು ಆದಿವಾಸಿ ಕುಟುಂಬದ ಜೊತೆ ಕೆಂಪಾಗಿ ಹಣ್ಣಾದ ಕಾಫಿ ಹಣ್ಣುಗಳನ್ನು ಕೀಳುತ್ತಾಳೆ. ಸಂಜೆ ಎಲ್ಲರೂ ಕೈ ಕೈ ಹಿಡಿದು ಧಿಮ್ಸಾ ಕುಣಿತ ಕುಣಿಯುತ್ತಾರೆ."},
   {img:'img/match/ap/story_3.jpg',at:12,en:"The painting blooms in Kalamkari colours, drawn with a bamboo pen. Ajji's map lights up again, south along the coast to Puducherry, land of yellow French streets and terracotta horses.",
    hi:"पेंटिंग बाँस की कलम से बने कलमकारी रंगों में खिल उठी। अज्जी का नक्शा फिर जगमगाया, तट के साथ दक्षिण में पुडुचेरी की ओर, पीली फ़्रांसीसी गलियों और टेराकोटा घोड़ों की धरती।",
    kn:"ಬಿದಿರಿನ ಲೇಖನಿಯಿಂದ ಬಿಡಿಸಿದ ಕಲಂಕಾರಿ ಬಣ್ಣಗಳಲ್ಲಿ ಚಿತ್ರ ಅರಳಿತು. ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಕರಾವಳಿಯ ಉದ್ದಕ್ಕೂ ದಕ್ಷಿಣಕ್ಕೆ ಪುದುಚೇರಿಯತ್ತ, ಫ್ರೆಂಚರ ಕಾಲದ ಹಳದಿ ಬೀದಿಗಳು ಮತ್ತು ಮಣ್ಣಿನ ಕುದುರೆಗಳ ನಾಡು."}]},
 {key:'py',name:{en:'Puducherry',hi:'पुडुचेरी',kn:'ಪುದುಚೇರಿ'},art:{en:'Villianur terracotta',hi:'विल्लियनूर टेराकोटा',kn:'ವಿಲ್ಲಿಯನೂರು ಸುಟ್ಟಮಣ್ಣಿನ ಕಲೆ'},

   hi:["फ़्रांसीसी मोहल्ले का घर","पुराना लाइटहाउस","टेराकोटा घोड़ा","बोगनवेलिया","बैगेट ब्रेड","कट्टुमरम बेड़ा","लाल पुलिस केपी टोपी","सेक्रेड हार्ट बेसिलिका","रोमन मटका","कराईकल आम","हाथ से बना काग़ज़","कागज़ की लुगदी की गुड़िया"],
   kn:["ಫ್ರೆಂಚ್ ಬೀದಿಯ ಮನೆ","ಹಳೆಯ ದೀಪಸ್ತಂಭ","ಸುಟ್ಟಮಣ್ಣಿನ ಕುದುರೆ","ಕಾಗದದ ಹೂವು","ಫ್ರೆಂಚ್ ರೊಟ್ಟಿ","ಕಟ್ಟುಮರ ತೆಪ್ಪ","ಕೆಂಪು ಪೊಲೀಸ್ ಟೊಪ್ಪಿ","ಸೇಕ್ರೆಡ್ ಹಾರ್ಟ್ ಇಗರ್ಜಿ","ರೋಮನ್ ಹೂಜಿ","ಕಾರೈಕಲ್ ಮಾವಿನಹಣ್ಣು","ಕೈಕಾಗದ","ಕಾಗದದ ತಿರುಳಿನ ಗೊಂಬೆ"]},
  look:["Tamil house with thinnai","New lighthouse","Terracotta pot","Hibiscus","Bun","Motor fishing boat","Sun hat","Small chapel","Clay lamp","Papaya","Paper lantern","Clay doll"],

  story:[
   {img:'img/match/py/story_1.jpg',en:"Ajji's map glows over Puducherry. Diya and her new friend Kayal ride bicycles down quiet yellow streets with tall shuttered windows and pink bougainvillea, carrying a long fresh baguette in the basket!",
    hi:"अज्जी का नक्शा पुडुचेरी पर चमका। दीया और उसकी नई सहेली कायल ऊँची खिड़कियों और गुलाबी बोगनवेलिया वाली शांत पीली गलियों में साइकिल चलाती हैं, टोकरी में लंबी ताज़ा बैगेट ब्रेड रखे हुए!",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ಪುದುಚೇರಿಯ ಮೇಲೆ ಹೊಳೆಯಿತು. ದಿಯಾ ಮತ್ತು ಅವಳ ಹೊಸ ಗೆಳತಿ ಕಯಲ್ ಎತ್ತರದ ಕಿಟಕಿಗಳು, ಗುಲಾಬಿ ಕಾಗದದ ಹೂವುಗಳಿರುವ ಶಾಂತ ಹಳದಿ ಬೀದಿಗಳಲ್ಲಿ ಸೈಕಲ್ ತುಳಿಯುತ್ತಾರೆ; ಬುಟ್ಟಿಯಲ್ಲಿ ಉದ್ದದ ತಾಜಾ ಫ್ರೆಂಚ್ ರೊಟ್ಟಿ!"},
   {img:'img/match/py/story_2.jpg',at:6,en:"In Villianur, Kayal's uncle shapes clay on a spinning potter's wheel. Diya and Kayal help press patterns into a big terracotta horse, which will be baked in a hot kiln until it turns a warm red-brown.",
    hi:"विल्लियनूर में कायल के चाचा घूमते चाक पर मिट्टी को आकार देते हैं। दीया और कायल एक बड़े टेराकोटा घोड़े पर नमूने दबाने में मदद करती हैं, जिसे गर्म भट्ठी में तब तक पकाया जाएगा जब तक वह गहरा लाल-भूरा न हो जाए।",
    kn:"ವಿಲ್ಲಿಯನೂರಿನಲ್ಲಿ ಕಯಲ್‌ಳ ಚಿಕ್ಕಪ್ಪ ತಿರುಗುವ ಚಕ್ರದ ಮೇಲೆ ಮಣ್ಣಿಗೆ ಆಕಾರ ಕೊಡುತ್ತಾರೆ. ದಿಯಾ ಮತ್ತು ಕಯಲ್ ದೊಡ್ಡ ಮಣ್ಣಿನ ಕುದುರೆಯ ಮೇಲೆ ಚಿತ್ತಾರ ಒತ್ತಲು ಸಹಾಯ ಮಾಡುತ್ತಾರೆ; ಆಮೇಲೆ ಅದನ್ನು ಬಿಸಿ ಆವಿಗೆಯಲ್ಲಿ ಕೆಂಪು-ಕಂದು ಬಣ್ಣ ಬರುವವರೆಗೆ ಸುಡುತ್ತಾರೆ."},
   {img:'img/match/py/story_3.jpg',at:12,en:"It is the Mango Festival in Karaikal! As the procession passes, people throw ripe mangoes from the rooftops, and Diya and Kayal catch them in a basket, laughing. The painting is complete, warm as baked terracotta! Ajji's map lights up again, next door to Tamil Nadu, land of golden Tanjore paintings.",
    hi:"कराईकल में आम उत्सव है! जुलूस गुज़रते समय लोग छतों से पके आम फेंकते हैं, और दीया व कायल हँसते हुए उन्हें टोकरी में पकड़ती हैं। पेंटिंग पूरी हुई, पकी हुई टेराकोटा जैसी गर्म रंगों वाली! अज्जी का नक्शा फिर चमका, पास ही तमिलनाडु की ओर, सुनहरे तंजौर चित्रों की धरती।",
    kn:"ಕಾರೈಕಲ್‌ನಲ್ಲಿ ಮಾವಿನಹಣ್ಣಿನ ಹಬ್ಬ! ಮೆರವಣಿಗೆ ಸಾಗುವಾಗ ಜನ ಮಾಳಿಗೆಗಳಿಂದ ಮಾಗಿದ ಮಾವಿನಹಣ್ಣು ಎಸೆಯುತ್ತಾರೆ; ದಿಯಾ ಮತ್ತು ಕಯಲ್ ನಗುತ್ತಾ ಬುಟ್ಟಿಯಲ್ಲಿ ಹಿಡಿಯುತ್ತಾರೆ. ಚಿತ್ರ ಪೂರ್ಣವಾಯಿತು, ಸುಟ್ಟ ಮಣ್ಣಿನಂತೆ ಬೆಚ್ಚನೆಯ ಬಣ್ಣಗಳಲ್ಲಿ! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಪಕ್ಕದ ತಮಿಳುನಾಡಿನ ಕಡೆಗೆ, ಚಿನ್ನದ ತಂಜಾವೂರು ಚಿತ್ರಗಳ ನಾಡು."}]},
 {key:'tn',name:{en:'Tamil Nadu',hi:'तमिलनाडु',kn:'ತಮಿಳುನಾಡು'},art:{en:'Tanjore painting',hi:'तंजौर चित्रकला',kn:'ತಂಜಾವೂರು ಚಿತ್ರಕಲೆ'},

   hi:["मंदिर गोपुरम","तंजौर चित्र","भरतनाट्यम नर्तकी","पोंगल का बर्तन","कोलम","ताड़ का पेड़","नीलगिरि खिलौना रेल","वीणा","कांचीपुरम रेशम","तंजावुर नाचती गुड़िया","फ़िल्टर कॉफ़ी","मदुरै चमेली"],
   kn:["ದೇವಾಲಯ ಗೋಪುರ","ತಂಜಾವೂರು ಚಿತ್ರ","ಭರತನಾಟ್ಯ ನರ್ತಕಿ","ಪೊಂಗಲ್ ಮಡಕೆ","ಅಕ್ಕಿಹಿಟ್ಟಿನ ರಂಗೋಲಿ","ತಾಳೆ ಮರ","ನೀಲಗಿರಿ ಆಟಿಕೆ ರೈಲು","ವೀಣೆ","ಕಂಚಿ ರೇಷ್ಮೆ ಸೀರೆ","ತಲೆಯಾಡಿಸುವ ಗೊಂಬೆ","ಡಬರಾ ಕಾಫಿ","ಮಧುರೈ ಮಲ್ಲಿಗೆ"]},
  look:["Temple chariot","Glass painting","Kuchipudi dancer","Clay water pot","Flower kolam","Banana plant","Bullock cart","Violin","Chettinad cotton saree","Marapachi dolls","Tea glass","Kanakambaram flowers"],
  more:["Shore Temple","Arjuna's Penance","Five Rathas","Brihadeeswarar Temple","Vivekananda Rock","Thiruvalluvar statue","Pamban Bridge","Nilgiri tahr","Emerald dove","Gloriosa lily","Chettinad mansion","Dosa","Idli","Jigarthanda","Mridangam","Nadaswaram","Karagattam dancer","Silambam","Pearl oyster","Tamil yeoman butterfly"],
  story:[
   {img:'img/match/tn/story_1.jpg',en:"Ajji's map glows over Tamil Nadu. Diya and her new friend Meena ride the little blue Nilgiri toy train, puffing slowly up through tea gardens, tunnels and misty hills towards Ooty.",
    hi:"अज्जी का नक्शा तमिलनाडु पर चमका। दीया और उसकी नई सहेली मीना नीली नीलगिरि खिलौना रेल में बैठी हैं, जो चाय बाग़ानों, सुरंगों और धुंध भरी पहाड़ियों से धीरे-धीरे ऊटी की ओर चढ़ती है।",
    kn:"ಅಜ್ಜಿಯ ನಕ್ಷೆ ತಮಿಳುನಾಡಿನ ಮೇಲೆ ಹೊಳೆಯಿತು. ದಿಯಾ ಮತ್ತು ಅವಳ ಹೊಸ ಗೆಳತಿ ಮೀನಾ ಪುಟ್ಟ ನೀಲಿ ನೀಲಗಿರಿ ಆಟಿಕೆ ರೈಲಿನಲ್ಲಿ ಕುಳಿತಿದ್ದಾರೆ; ರೈಲು ಚಹಾ ತೋಟ, ಸುರಂಗ, ಮಂಜು ಮುಸುಕಿದ ಬೆಟ್ಟಗಳ ಮೂಲಕ ನಿಧಾನವಾಗಿ ಊಟಿಯ ಕಡೆ ಏರುತ್ತದೆ."},
   {img:'img/match/tn/story_2.jpg',at:6,en:"In the courtyard of a great stone temple, Meena's dance teacher shows the girls Bharatanatyam steps. Ankle bells jingle, a mridangam drum keeps the beat, and Diya tries to make her hands into a lotus.",
    hi:"एक विशाल पत्थर के मंदिर के आँगन में मीना की नृत्य गुरु लड़कियों को भरतनाट्यम के कदम सिखाती हैं। घुँघरू छनकते हैं, मृदंगम ताल देता है, और दीया अपने हाथों से कमल बनाने की कोशिश करती है।",
    kn:"ಭವ್ಯವಾದ ಕಲ್ಲಿನ ದೇವಾಲಯದ ಅಂಗಳದಲ್ಲಿ ಮೀನಾಳ ನೃತ್ಯ ಗುರುಗಳು ಹುಡುಗಿಯರಿಗೆ ಭರತನಾಟ್ಯದ ಹೆಜ್ಜೆ ಕಲಿಸುತ್ತಾರೆ. ಗೆಜ್ಜೆ ಘಲ್ಲೆನ್ನುತ್ತದೆ, ಮೃದಂಗ ತಾಳ ಹಾಕುತ್ತದೆ, ದಿಯಾ ತನ್ನ ಕೈಗಳಿಂದ ಕಮಲ ಮಾಡಲು ಪ್ರಯತ್ನಿಸುತ್ತಾಳೆ."},
   {img:'img/match/tn/story_3.jpg',at:12,en:"It is Pongal! Diya and Meena draw a big kolam, and everyone shouts 'Pongalo Pongal!' as the sweet rice boils over the clay pot. The decorated cows get garlands too. The painting is complete, shining with gold like a Tanjore painting! Ajji's map lights up again, west over the hills to Kerala, land of temple murals.",
    hi:"पोंगल आ गया! दीया और मीना बड़ा कोलम बनाती हैं, और जब मिट्टी के बर्तन में मीठे चावल उफनकर बाहर आते हैं, सब चिल्लाते हैं 'पोंगलो पोंगल!' सजी हुई गायों को भी मालाएँ पहनाई जाती हैं। पेंटिंग पूरी हुई, तंजौर चित्र जैसी सोने से चमकती! अज्जी का नक्शा फिर चमका, पश्चिम में पहाड़ों के पार केरल की ओर, मंदिर भित्तिचित्रों की धरती।",
    kn:"ಪೊಂಗಲ್ ಬಂತು! ದಿಯಾ ಮತ್ತು ಮೀನಾ ದೊಡ್ಡ ರಂಗೋಲಿ ಹಾಕುತ್ತಾರೆ; ಮಣ್ಣಿನ ಮಡಕೆಯಲ್ಲಿ ಸಿಹಿ ಅನ್ನ ಉಕ್ಕಿ ಬಂದಾಗ ಎಲ್ಲರೂ 'ಪೊಂಗಲೋ ಪೊಂಗಲ್!' ಎಂದು ಕೂಗುತ್ತಾರೆ. ಸಿಂಗರಿಸಿದ ಹಸುಗಳಿಗೂ ಹಾರ ಹಾಕುತ್ತಾರೆ. ಚಿತ್ರ ಪೂರ್ಣವಾಯಿತು, ತಂಜಾವೂರು ಚಿತ್ರದಂತೆ ಚಿನ್ನದ ಬಣ್ಣದಲ್ಲಿ ಹೊಳೆಯುತ್ತಿದೆ! ಅಜ್ಜಿಯ ನಕ್ಷೆ ಮತ್ತೆ ಬೆಳಗಿತು, ಪಶ್ಚಿಮಕ್ಕೆ ಬೆಟ್ಟಗಳಾಚೆಯ ಕೇರಳದ ಕಡೆಗೆ, ದೇವಾಲಯದ ಗೋಡೆಚಿತ್ರಗಳ ನಾಡು."}]},

  story:[
   {img:'img/match/kl/story_1.jpg',en:"Ajji's map glows over Kerala. Diya and her new friend Ammu glide along the green backwaters on a wooden houseboat. Coconut palms lean over the water, a row of ducks paddles past, and a fisherman throws his net from a little canoe.",
    hi:"अज्जी का नक्शा केरल पर चमका। दीया और उसकी नई सहेली अम्मू लकड़ी की हाउसबोट में हरे बैकवॉटर पर धीरे-धीरे तैरती हैं। नारियल के पेड़ पानी पर झुके हैं, बत्तखों की कतार पास से तैरती है, और एक मछुआरा छोटी डोंगी से जाल फेंकता है।",

["🛕","Puri · Jagannath Temple","पुरी · जगन्नाथ मंदिर","ಪುರಿ · ಜಗನ್ನಾಥ ದೇವಾಲಯ","At Rath Yatra, devotees pull three giant chariots for Jagannath, Balabhadra and Subhadra.","रथ यात्रा में भक्त जगन्नाथ, बलभद्र और सुभद्रा के तीन विशाल रथ खींचते हैं।","ರಥಯಾತ್ರೆಯಲ್ಲಿ ಭಕ್ತರು ಜಗನ್ನಾಥ, ಬಲಭದ್ರ ಮತ್ತು ಸುಭದ್ರೆಯರ ಮೂರು ಭವ್ಯ ರಥಗಳನ್ನು ಎಳೆಯುತ್ತಾರೆ."],
["☸️","Konark · Sun Temple","कोणार्क · सूर्य मंदिर","ಕೋನಾರ್ಕ್ · ಸೂರ್ಯ ದೇವಾಲಯ","A stone chariot of the Sun with 24 carved wheels, built in the 13th century.","सूर्य का पत्थर का रथ, 24 नक्काशीदार पहियों वाला, 13वीं सदी में बना।","24 ಕೆತ್ತಿದ ಚಕ್ರಗಳಿರುವ ಸೂರ್ಯನ ಕಲ್ಲಿನ ರಥ, 13ನೇ ಶತಮಾನದಲ್ಲಿ ಕಟ್ಟಿದ್ದು."],
["🎨","Raghurajpur","रघुराजपुर","ರಘುರಾಜಪುರ","A village where almost every home is a Pattachitra painter's studio.","एक गाँव जहाँ लगभग हर घर पट्टचित्र चित्रकार का कलाघर है।","ಬಹುತೇಕ ಪ್ರತಿ ಮನೆಯೂ ಪಟ್ಟಚಿತ್ರ ಕಲಾವಿದರ ಕಲಾಮನೆಯಾಗಿರುವ ಹಳ್ಳಿ."],
["🛕","Bhubaneswar · Lingaraj","भुवनेश्वर · लिंगराज","ಭುವನೇಶ್ವರ · ಲಿಂಗರಾಜ","The \"Temple City\", with hundreds of old stone temples.","\"मंदिरों का शहर\", जहाँ सैकड़ों पुराने पत्थर के मंदिर हैं।","\"ದೇವಾಲಯಗಳ ನಗರ\", ಇಲ್ಲಿ ನೂರಾರು ಹಳೆಯ ಕಲ್ಲಿನ ದೇವಾಲಯಗಳಿವೆ."],
["🍮","Pahala","पहाला","ಪಹಾಲಾ","Rows of roadside sweet shops sell soft, juicy rasagola.","सड़क किनारे मिठाई की दुकानों की कतारें नरम, रसीले रसगोले बेचती हैं।","ರಸ್ತೆಬದಿಯ ಸಿಹಿ ಅಂಗಡಿಗಳ ಸಾಲು ಮೆತ್ತನೆಯ, ರಸಭರಿತ ರಸಗೋಲಾ ಮಾರುತ್ತವೆ."],
["🐢","Gahirmatha","गहिरमाथा","ಗಹಿರ್‌ಮಾಥಾ","Lakhs of Olive Ridley turtles come ashore together to lay eggs.","लाखों ऑलिव रिडले कछुए एक साथ अंडे देने तट पर आते हैं।","ಲಕ್ಷಾಂತರ ಆಲಿವ್ ರಿಡ್ಲಿ ಆಮೆಗಳು ಒಟ್ಟಿಗೆ ಮೊಟ್ಟೆ ಇಡಲು ದಡಕ್ಕೆ ಬರುತ್ತವೆ."],
["🦚","Cuttack","कटक","ಕಟಕ್","City of silver filigree; Bali Jatra remembers sailors who sailed to Bali.","चाँदी की तारकशी का शहर; बाली जात्रा बाली तक गए नाविकों की याद है।","ಬೆಳ್ಳಿಯ ತಾರಕಸಿ ಕಲೆಯ ನಗರ; ಬಾಲಿ ಜಾತ್ರೆ ಬಾಲಿಗೆ ನೌಕಾಯಾನ ಮಾಡಿದ ನಾವಿಕರ ನೆನಪು."],
["🗿","Udayagiri Caves","उदयगिरि गुफाएँ","ಉದಯಗಿರಿ ಗುಹೆಗಳು","Caves carved for Jain monks over 2,000 years ago.","2,000 साल से भी पहले जैन मुनियों के लिए काटी गई गुफाएँ।","2,000 ವರ್ಷಗಳಿಗೂ ಹಿಂದೆ ಜೈನ ಮುನಿಗಳಿಗಾಗಿ ಕೊರೆದ ಗುಹೆಗಳು."],
["☂️","Pipili","पिपली","ಪಿಪಿಲಿ","Bright appliqué umbrellas and lanterns, stitched for Rath Yatra.","रथ यात्रा के लिए सिली चमकीली एप्लिक छतरियाँ और लालटेनें।","ರಥಯಾತ್ರೆಗಾಗಿ ಬಟ್ಟೆಯ ತುಂಡುಗಳನ್ನು ಹೊಲಿದು ಮಾಡಿದ ಬಣ್ಣಬಣ್ಣದ ಕೊಡೆಗಳು ಮತ್ತು ಲಾಂದ್ರಗಳು."],
["🐬","Chilika Lake","चिलिका झील","ಚಿಲಿಕಾ ಸರೋವರ","Asia's largest brackish lagoon: shy Irrawaddy dolphins, and boatmen selling pearls and gems.","एशिया की सबसे बड़ी खारे पानी की झील: शर्मीली इरावदी डॉल्फ़िन, और मोती व रत्न बेचते नाविक।","ಏಷ್ಯಾದ ಅತಿ ದೊಡ್ಡ ಉಪ್ಪುನೀರಿನ ಸರೋವರ: ನಾಚಿಕೆಯ ಇರಾವದಿ ಡಾಲ್ಫಿನ್‌ಗಳು, ಮುತ್ತು-ರತ್ನ ಮಾರುವ ದೋಣಿಯವರು."],
["🧁","Nayagarh","नयागढ़","ನಯಾಗಢ","Birthplace of chhena poda, a cottage-cheese sweet baked till golden brown.","छेना पोड़ा की जन्मभूमि, जिसे सुनहरा भूरा होने तक सेंका जाता है।","ಛೇನಾ ಪೋಡಾದ ತವರು, ಹೊಂಬಣ್ಣ ಬರುವವರೆಗೆ ಬೇಯಿಸುವ ಪನೀರ್ ಸಿಹಿ."],
["🥻","Sambalpur","संबलपुर","ಸಂಬಲ್ಪುರ","Famous for ikat sarees, where threads are tie-dyed before weaving.","इकत साड़ियों के लिए मशहूर, जिनमें बुनाई से पहले धागे रंगे जाते हैं।","ಇಕತ್ ಸೀರೆಗಳಿಗೆ ಹೆಸರುವಾಸಿ, ಇಲ್ಲಿ ನೇಯುವ ಮೊದಲೇ ದಾರಗಳಿಗೆ ಬಣ್ಣ ಹಾಕುತ್ತಾರೆ."]
],
ap:[
["🪆","Etikoppaka","एटिकोप्पाका","ಏಟಿಕೊಪ್ಪಾಕ","A toy village on the Varaha river; its lacquer toys have a GI tag.","वराह नदी किनारे खिलौनों का गाँव; यहाँ के लाख के खिलौनों को जीआई टैग मिला है।","ವರಾಹ ನದಿಯ ದಂಡೆಯ ಗೊಂಬೆಗಳ ಹಳ್ಳಿ; ಇಲ್ಲಿನ ಅರಗಿನ ಗೊಂಬೆಗಳಿಗೆ ಭೌಗೋಳಿಕ ಸೂಚಕ (GI) ಮಾನ್ಯತೆ ಇದೆ."],
["🏖️","Visakhapatnam · RK Beach","विशाखापत्तनम · आरके बीच","ವಿಶಾಖಪಟ್ಟಣ · ಆರ್.ಕೆ. ಕಡಲತೀರ","A long sunny beach where you can walk through a real submarine, INS Kursura.","एक लंबा धूप वाला तट, जहाँ असली पनडुब्बी आईएनएस कुरसुरा के अंदर घूम सकते हो।","ಉದ್ದನೆಯ ಕಡಲತೀರ; ಇಲ್ಲಿ ನಿಜವಾದ ಜಲಾಂತರ್ಗಾಮಿ ಐಎನ್‌ಎಸ್ ಕುರ್ಸುರಾ ಒಳಗೆ ನಡೆದು ನೋಡಬಹುದು."],
["🎻","Bobbili","बोब्बिली","ಬೊಬ್ಬಿಲಿ","Veenas here are carved from a single block of jackfruit wood.","यहाँ वीणाएँ कटहल की लकड़ी के एक ही टुकड़े से तराशी जाती हैं।","ಇಲ್ಲಿ ವೀಣೆಗಳನ್ನು ಹಲಸಿನ ಮರದ ಒಂದೇ ತುಂಡಿನಿಂದ ಕೆತ್ತುತ್ತಾರೆ."],
["⛰️","Borra Caves","बोर्रा गुफाएँ","ಬೊರ್ರಾ ಗುಹೆಗಳು","Huge limestone caves full of strange rock shapes, deep in the Eastern Ghats.","पूर्वी घाट में गहरी, अजीब आकारों वाली विशाल चूना-पत्थर की गुफाएँ।","ಪೂರ್ವ ಘಟ್ಟಗಳ ಆಳದಲ್ಲಿ ವಿಚಿತ್ರ ಆಕಾರಗಳ ಭವ್ಯ ಸುಣ್ಣದಕಲ್ಲಿನ ಗುಹೆಗಳು."],
["☕","Araku Valley","अराकू घाटी","ಅರಕು ಕಣಿವೆ","Tribal farmers grow coffee on these misty hill slopes.","आदिवासी किसान इन धुंध भरी ढलानों पर कॉफ़ी उगाते हैं।","ಆದಿವಾಸಿ ರೈತರು ಈ ಮಂಜಿನ ಬೆಟ್ಟದ ಇಳಿಜಾರುಗಳಲ್ಲಿ ಕಾಫಿ ಬೆಳೆಯುತ್ತಾರೆ."],
["🍬","Atreyapuram","आत्रेयपुरम","ಆತ್ರೇಯಪುರಂ","Home of pootharekulu: paper-thin rice sheets rolled with sugar and ghee.","पूतरेकुलु का घर: कागज़ जैसी पतली चावल की परतें, शक्कर और घी के साथ लपेटी हुई।","ಪೂತರೇಕುಲುವಿನ ತವರು: ಕಾಗದದಷ್ಟು ತೆಳುವಾದ ಅಕ್ಕಿಯ ಹಾಳೆಗಳಲ್ಲಿ ಸಕ್ಕರೆ, ತುಪ್ಪ ಸುತ್ತಿದ ಸಿಹಿ."],
["🌴","Konaseema","कोनसीमा","ಕೋನಸೀಮ","Coconut groves and green canals where the Godavari meets the sea.","नारियल के बाग़ और हरी नहरें, जहाँ गोदावरी समुद्र से मिलती है।","ಗೋದಾವರಿ ಸಮುದ್ರ ಸೇರುವಲ್ಲಿ ತೆಂಗಿನ ತೋಟಗಳು ಮತ್ತು ಹಸಿರು ಕಾಲುವೆಗಳು."],
["🎨","Machilipatnam","मछलीपट्टनम","ಮಚಲಿಪಟ್ಟಣ","Kalamkari artists here print and paint cloth with natural dyes.","यहाँ कलमकारी कलाकार प्राकृतिक रंगों से कपड़े पर छपाई और चित्रकारी करते हैं।","ಇಲ್ಲಿನ ಕಲಂಕಾರಿ ಕಲಾವಿದರು ನೈಸರ್ಗಿಕ ಬಣ್ಣಗಳಿಂದ ಬಟ್ಟೆಯ ಮೇಲೆ ಅಚ್ಚು ಒತ್ತಿ ಚಿತ್ರಿಸುತ್ತಾರೆ."],
["🐘","Kondapalli","कोंडापल्ली","ಕೊಂಡಪಲ್ಲಿ","A toy village where light wood is carved into dolls and animals.","खिलौनों का गाँव, जहाँ हल्की लकड़ी से गुड़ियाँ और जानवर बनते हैं।","ಹಗುರ ಮರದಿಂದ ಗೊಂಬೆ, ಪ್ರಾಣಿಗಳನ್ನು ಕೆತ್ತುವ ಗೊಂಬೆಗಳ ಹಳ್ಳಿ."],
["🌶️","Guntur","गुंटूर","ಗುಂಟೂರು","One of the biggest chilli markets in Asia.","एशिया के सबसे बड़े मिर्च बाज़ारों में से एक।","ಏಷ್ಯಾದ ಅತಿ ದೊಡ್ಡ ಮೆಣಸಿನಕಾಯಿ ಮಾರುಕಟ್ಟೆಗಳಲ್ಲೊಂದು."],
["🛕","Tirupati","तिरुपति","ತಿರುಪತಿ","Lakhs of pilgrims climb the Tirumala hills to the Venkateswara temple.","लाखों तीर्थयात्री तिरुमला की पहाड़ियों पर वेंकटेश्वर मंदिर जाते हैं।","ಲಕ್ಷಾಂತರ ಭಕ್ತರು ತಿರುಮಲ ಬೆಟ್ಟ ಏರಿ ವೆಂಕಟೇಶ್ವರನ ದರ್ಶನ ಪಡೆಯುತ್ತಾರೆ."],
["🐂","Lepakshi","लेपाक्षी","ಲೇಪಾಕ್ಷಿ","A giant stone Nandi, and a temple pillar that barely touches the floor!","विशाल पत्थर का नंदी, और मंदिर का एक खंभा जो ज़मीन को मुश्किल से छूता है!","ಭವ್ಯ ಕಲ್ಲಿನ ನಂದಿ, ಮತ್ತು ನೆಲವನ್ನು ಅಷ್ಟೇನೂ ಮುಟ್ಟದ ದೇವಾಲಯದ ಕಂಬ!"]
],
rj:[
["🏰","Jaipur · Hawa Mahal","जयपुर · हवा महल","ಜೈಪುರ · ಹವಾ ಮಹಲ್","Hawa Mahal has 953 small windows, so royal women could watch street festivals without being seen.","हवा महल में 953 छोटी खिड़कियाँ हैं, ताकि रानियाँ बिना दिखे सड़क के उत्सव देख सकें।","ಹವಾ ಮಹಲ್‌ನಲ್ಲಿ 953 ಚಿಕ್ಕ ಕಿಟಕಿಗಳಿವೆ; ರಾಣಿಯರು ಯಾರಿಗೂ ಕಾಣದಂತೆ ಬೀದಿಯ ಉತ್ಸವಗಳನ್ನು ನೋಡುತ್ತಿದ್ದರು."],
["🐅","Ranthambore","रणथंभौर","ರಣಥಂಬೋರ್","Tigers in Ranthambore often walk past the ruins of a fort that is about a thousand years old.","रणथंभौर में बाघ अक्सर लगभग एक हज़ार साल पुराने किले के खंडहरों के पास घूमते दिखते हैं।","ರಣಥಂಬೋರ್‌ನಲ್ಲಿ ಹುಲಿಗಳು ಸುಮಾರು ಸಾವಿರ ವರ್ಷ ಹಳೆಯ ಕೋಟೆಯ ಅವಶೇಷಗಳ ಪಕ್ಕದಲ್ಲೇ ಓಡಾಡುತ್ತವೆ."],
["💧","Bundi","बूंदी","ಬೂಂದಿ","Bundi has more than 50 stepwells. Raniji ki Baori goes down about 46 metres, with carved elephants on the way.","बूंदी में 50 से ज़्यादा बावड़ियाँ हैं। रानीजी की बावड़ी लगभग 46 मीटर गहरी है, और रास्ते में नक्काशीदार हाथी हैं।","ಬೂಂದಿಯಲ್ಲಿ 50ಕ್ಕೂ ಹೆಚ್ಚು ಮೆಟ್ಟಿಲು ಬಾವಿಗಳಿವೆ. ರಾಣೀಜಿ ಕೀ ಬಾವಡಿ ಸುಮಾರು 46 ಮೀಟರ್ ಆಳವಿದ್ದು, ದಾರಿಯಲ್ಲಿ ಕೆತ್ತಿದ ಆನೆಗಳಿವೆ."],
["🎪","Pushkar","पुष्कर","ಪುಷ್ಕರ್","Pushkar has one of the very few temples of Lord Brahma, and every November thousands of camels come for the Pushkar fair.","पुष्कर में भगवान ब्रह्मा के बहुत कम मंदिरों में से एक है, और हर नवंबर पुष्कर मेले में हज़ारों ऊँट आते हैं।","ಪುಷ್ಕರ್‌ನಲ್ಲಿ ಬ್ರಹ್ಮನ ಅಪರೂಪದ ದೇವಾಲಯಗಳಲ್ಲಿ ಒಂದಿದೆ; ಪ್ರತಿ ನವೆಂಬರ್‌ನಲ್ಲಿ ಪುಷ್ಕರ್ ಜಾತ್ರೆಗೆ ಸಾವಿರಾರು ಒಂಟೆಗಳು ಬರುತ್ತವೆ."],
["🐪","Bikaner","बीकानेर","ಬೀಕಾನೇರ್","Bikaner has a national camel research centre where you can meet camel herds and taste camel-milk ice cream.","बीकानेर में ऊँटों का राष्ट्रीय अनुसंधान केंद्र है, जहाँ ऊँटों के झुंड देख सकते हैं और ऊँटनी के दूध की आइसक्रीम चख सकते हैं।","ಬೀಕಾನೇರ್‌ನಲ್ಲಿ ಒಂಟೆಗಳ ರಾಷ್ಟ್ರೀಯ ಸಂಶೋಧನಾ ಕೇಂದ್ರವಿದೆ; ಅಲ್ಲಿ ಒಂಟೆ ಹಿಂಡುಗಳನ್ನು ನೋಡಿ, ಒಂಟೆ ಹಾಲಿನ ಐಸ್‌ಕ್ರೀಂ ಸವಿಯಬಹುದು."],
["🏜️","Jaisalmer","जैसलमेर","ಜೈಸಲ್ಮೇರ್","Jaisalmer fort is built of yellow sandstone that glows gold at sunset, and people still live inside it.","जैसलमेर का किला पीले बलुआ पत्थर से बना है जो सूर्यास्त में सोने-सा चमकता है, और लोग आज भी इसके अंदर रहते हैं।","ಜೈಸಲ್ಮೇರ್ ಕೋಟೆಯನ್ನು ಹಳದಿ ಮರಳುಗಲ್ಲಿನಿಂದ ಕಟ್ಟಿದ್ದಾರೆ; ಸಂಜೆ ಅದು ಚಿನ್ನದಂತೆ ಹೊಳೆಯುತ್ತದೆ, ಇಂದಿಗೂ ಜನ ಅದರೊಳಗೆ ವಾಸಿಸುತ್ತಾರೆ."],
["🔵","Jodhpur · Blue City","जोधपुर · नीला शहर","ಜೋಧಪುರ · ನೀಲಿ ನಗರ","Mehrangarh fort stands on a rocky hill about 120 metres above the blue-painted houses of Jodhpur.","मेहरानगढ़ किला जोधपुर के नीले घरों से लगभग 120 मीटर ऊँची चट्टानी पहाड़ी पर खड़ा है।","ಮೆಹ್ರಾನ್‌ಗಢ ಕೋಟೆ ಜೋಧಪುರದ ನೀಲಿ ಮನೆಗಳಿಗಿಂತ ಸುಮಾರು 120 ಮೀಟರ್ ಎತ್ತರದ ಬಂಡೆ ಬೆಟ್ಟದ ಮೇಲಿದೆ."],
["🧱","Kumbhalgarh","कुंभलगढ़","ಕುಂಭಲ್‌ಗಢ","The walls of Kumbhalgarh fort run for about 36 km, among the longest walls in the world.","कुंभलगढ़ किले की दीवार लगभग 36 किलोमीटर लंबी है, दुनिया की सबसे लंबी दीवारों में से एक।","ಕುಂಭಲ್‌ಗಢ ಕೋಟೆಯ ಗೋಡೆ ಸುಮಾರು 36 ಕಿ.ಮೀ. ಉದ್ದ; ಜಗತ್ತಿನ ಅತಿ ಉದ್ದದ ಗೋಡೆಗಳಲ್ಲಿ ಒಂದು."],
["⛰️","Mount Abu · Dilwara","माउंट आबू · दिलवाड़ा","ಮೌಂಟ್ ಅಬು · ದಿಲ್ವಾರಾ","Rajasthan's only hill station has the Dilwara Jain temples, carved from white marble so fine it looks like lace.","राजस्थान के इकलौते हिल स्टेशन पर दिलवाड़ा जैन मंदिर हैं, जिनका सफ़ेद संगमरमर लेस जैसा बारीक तराशा गया है।","ರಾಜಸ್ಥಾನದ ಏಕೈಕ ಗಿರಿಧಾಮದಲ್ಲಿ ದಿಲ್ವಾರಾ ಜೈನ ದೇವಾಲಯಗಳಿವೆ; ಬಿಳಿ ಅಮೃತಶಿಲೆಯನ್ನು ಕಸೂತಿಯಷ್ಟು ನಾಜೂಕಾಗಿ ಕೆತ್ತಿದ್ದಾರೆ."],
["🛶","Udaipur","उदयपुर","ಉದಯಪುರ","Udaipur is the City of Lakes. The white Lake Palace seems to float in the middle of Lake Pichola.","उदयपुर झीलों का शहर है। सफ़ेद लेक पैलेस पिछोला झील के बीच तैरता-सा लगता है।","ಉದಯಪುರ ಸರೋವರಗಳ ನಗರ. ಬಿಳಿಯ ಲೇಕ್ ಪ್ಯಾಲೇಸ್ ಪಿಚೋಲಾ ಸರೋವರದ ನಡುವೆ ತೇಲುತ್ತಿರುವಂತೆ ಕಾಣುತ್ತದೆ."],
["🏯","Chittorgarh","चित्तौड़गढ़","ಚಿತ್ತೋಡ್‌ಗಢ","Chittorgarh is one of India's biggest forts, the home of brave Rani Padmini and the poet-saint Meerabai.","चित्तौड़गढ़ भारत के सबसे बड़े किलों में से एक है, वीर रानी पद्मिनी और संत कवयित्री मीराबाई का घर।","ಚಿತ್ತೋಡ್‌ಗಢ ಭಾರತದ ಅತಿ ದೊಡ್ಡ ಕೋಟೆಗಳಲ್ಲಿ ಒಂದು; ವೀರ ರಾಣಿ ಪದ್ಮಿನಿ ಮತ್ತು ಸಂತ ಕವಯಿತ್ರಿ ಮೀರಾಬಾಯಿಯ ನೆಲೆ."],
["🖼️","Bhilwara · Phad painters","भीलवाड़ा · फड़ चित्रकार","ಭೀಲ್ವಾಡಾ · ಫಡ್ ಚಿತ್ರಕಾರರು","Phad scrolls can be many metres long. The Joshi family of painters near Bhilwara has painted them for generations.","फड़ चित्र कई मीटर लंबे होते हैं। भीलवाड़ा के पास जोशी परिवार पीढ़ियों से इन्हें बनाता आ रहा है।","ಫಡ್ ಚಿತ್ರಪಟಗಳು ಹಲವು ಮೀಟರ್ ಉದ್ದ ಇರುತ್ತವೆ. ಭೀಲ್ವಾಡಾ ಬಳಿಯ ಜೋಶಿ ಕುಟುಂಬ ತಲೆಮಾರುಗಳಿಂದ ಇವನ್ನು ಬಿಡಿಸುತ್ತಿದೆ."]
],
gj:[
["🕊️","Ahmedabad · Sabarmati Ashram","अहमदाबाद · साबरमती आश्रम","ಅಹಮದಾಬಾದ್ · ಸಾಬರಮತಿ ಆಶ್ರಮ","Ahmedabad was India's first UNESCO World Heritage City. From Sabarmati Ashram here, Gandhiji set out on the Dandi Salt March in 1930.","अहमदाबाद भारत का पहला यूनेस्को विश्व धरोहर शहर है। यहीं साबरमती आश्रम से गांधीजी 1930 में दांडी नमक यात्रा पर निकले थे।","ಅಹಮದಾಬಾದ್ ಭಾರತದ ಮೊದಲ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ನಗರ. ಇಲ್ಲಿನ ಸಾಬರಮತಿ ಆಶ್ರಮದಿಂದಲೇ ಗಾಂಧೀಜಿ 1930ರಲ್ಲಿ ದಾಂಡಿ ಉಪ್ಪಿನ ಯಾತ್ರೆ ಹೊರಟರು."],
["☀️","Modhera Sun Temple","मोढेरा सूर्य मंदिर","ಮೊಢೇರಾ ಸೂರ್ಯ ದೇವಾಲಯ","Modhera's Sun Temple is about a thousand years old, with a huge stepped tank. Today Modhera is India's first village to run on solar power day and night.","मोढेरा का सूर्य मंदिर लगभग एक हज़ार साल पुराना है, जिसके आगे सीढ़ियों वाला विशाल कुंड है। आज मोढेरा दिन-रात सौर ऊर्जा से चलने वाला भारत का पहला गाँव है।","ಮೊಢೇರಾದ ಸೂರ್ಯ ದೇವಾಲಯಕ್ಕೆ ಸುಮಾರು ಸಾವಿರ ವರ್ಷ; ಅದರ ಮುಂದೆ ಮೆಟ್ಟಿಲುಗಳ ದೊಡ್ಡ ಕೊಳವಿದೆ. ಇಂದು ಮೊಢೇರಾ ಹಗಲು-ರಾತ್ರಿ ಸೌರಶಕ್ತಿಯಿಂದ ನಡೆಯುವ ಭಾರತದ ಮೊದಲ ಹಳ್ಳಿ."],
["🪜","Patan · Rani ki Vav","पाटन · रानी की वाव","ಪಾಟನ್ · ರಾಣಿ ಕೀ ವಾವ್","Rani ki Vav is a stepwell with more than 500 carved sculptures. It is a UNESCO site, and you can see it on the ₹100 note.","रानी की वाव 500 से ज़्यादा नक्काशीदार मूर्तियों वाली बावड़ी है। यह यूनेस्को धरोहर है और 100 रुपये के नोट पर छपी है।","ರಾಣಿ ಕೀ ವಾವ್ 500ಕ್ಕೂ ಹೆಚ್ಚು ಕೆತ್ತಿದ ಶಿಲ್ಪಗಳಿರುವ ಮೆಟ್ಟಿಲು ಬಾವಿ. ಇದು ಯುನೆಸ್ಕೋ ತಾಣ; 100 ರೂಪಾಯಿ ನೋಟಿನ ಮೇಲೂ ಇದರ ಚಿತ್ರವಿದೆ."],
["🏺","Dholavira","धोलावीरा","ಧೋಲಾವೀರಾ","Dholavira was a Harappan city in the Rann with clever tanks to save every drop of rain. It became a UNESCO World Heritage Site in 2021.","धोलावीरा रण में बसा हड़प्पा शहर था, जहाँ बारिश की हर बूँद बचाने के लिए चतुर टंकियाँ थीं। 2021 में यह यूनेस्को विश्व धरोहर बना।","ಧೋಲಾವೀರಾ ರಣದಲ್ಲಿದ್ದ ಹರಪ್ಪಾ ನಗರ; ಮಳೆಯ ಪ್ರತಿ ಹನಿಯನ್ನೂ ಉಳಿಸಲು ಜಾಣ್ಮೆಯ ತೊಟ್ಟಿಗಳಿದ್ದವು. 2021ರಲ್ಲಿ ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣವಾಯಿತು."],
["🌕","Dhordo · White Rann","धोरडो · सफ़ेद रण","ಧೋರ್ಡೋ · ಬಿಳಿ ರಣ","Dhordo is the gateway to the White Rann, a huge salt desert. In 2023 the UN named it a Best Tourism Village, and Rann Utsav is held here every winter.","धोरडो सफ़ेद रण, यानी विशाल नमक रेगिस्तान का द्वार है। 2023 में संयुक्त राष्ट्र ने इसे सर्वश्रेष्ठ पर्यटन गाँव चुना, और हर सर्दी यहाँ रण उत्सव होता है।","ಧೋರ್ಡೋ ಬಿಳಿ ರಣ ಎಂಬ ದೊಡ್ಡ ಉಪ್ಪಿನ ಮರುಭೂಮಿಯ ಹೆಬ್ಬಾಗಿಲು. 2023ರಲ್ಲಿ ವಿಶ್ವಸಂಸ್ಥೆ ಇದನ್ನು ಅತ್ಯುತ್ತಮ ಪ್ರವಾಸಿ ಹಳ್ಳಿ ಎಂದು ಆರಿಸಿತು; ಪ್ರತಿ ಚಳಿಗಾಲ ಇಲ್ಲಿ ರಣ ಉತ್ಸವ ನಡೆಯುತ್ತದೆ."],
["🎨","Nirona · Rogan art","निरोणा · रोगन कला","ನಿರೋಣಾ · ರೋಗನ್ ಕಲೆ","In Nirona village, a few families still paint Rogan art: thick castor-oil paint is pulled into thin threads with a metal stick.","निरोणा गाँव में कुछ परिवार आज भी रोगन कला बनाते हैं: अरंडी के तेल का गाढ़ा रंग धातु की सलाई से पतले धागों में खींचा जाता है।","ನಿರೋಣಾ ಹಳ್ಳಿಯಲ್ಲಿ ಕೆಲವು ಕುಟುಂಬಗಳು ಇಂದಿಗೂ ರೋಗನ್ ಕಲೆ ಮಾಡುತ್ತಾರೆ: ಹರಳೆಣ್ಣೆಯ ದಪ್ಪ ಬಣ್ಣವನ್ನು ಲೋಹದ ಕಡ್ಡಿಯಿಂದ ತೆಳು ದಾರದಂತೆ ಎಳೆಯುತ್ತಾರೆ."],
["🚩","Dwarka","द्वारका","ದ್ವಾರಕಾ","Dwarka is Lord Krishna's city. The flag on top of the Dwarkadhish temple is changed several times every day.","द्वारका भगवान कृष्ण की नगरी है। द्वारकाधीश मंदिर के शिखर का ध्वज रोज़ कई बार बदला जाता है।","ದ್ವಾರಕಾ ಶ್ರೀಕೃಷ್ಣನ ನಗರ. ದ್ವಾರಕಾಧೀಶ ದೇವಾಲಯದ ಶಿಖರದ ಧ್ವಜವನ್ನು ದಿನಕ್ಕೆ ಹಲವು ಬಾರಿ ಬದಲಿಸುತ್ತಾರೆ."],
["🦁","Gir","गिर","ಗಿರ್","Gir is the only wild home of Asiatic lions. The 2025 count found 891 lions in Gujarat.","गिर एशियाई शेरों का इकलौता जंगली घर है। 2025 की गिनती में गुजरात में 891 शेर मिले।","ಗಿರ್ ಏಷ್ಯಾದ ಸಿಂಹಗಳ ಏಕೈಕ ಕಾಡಿನ ಮನೆ. 2025ರ ಎಣಿಕೆಯಲ್ಲಿ ಗುಜರಾತ್‌ನಲ್ಲಿ 891 ಸಿಂಹಗಳು ಸಿಕ್ಕವು."],
["🌊","Somnath","सोमनाथ","ಸೋಮನಾಥ","Somnath is the first of the twelve Jyotirlingas. A pillar by the sea says there is no land in a straight line from here to the South Pole.","सोमनाथ बारह ज्योतिर्लिंगों में पहला है। समुद्र किनारे का एक स्तंभ बताता है कि यहाँ से दक्षिणी ध्रुव तक सीधी रेखा में कोई ज़मीन नहीं है।","ಸೋಮನಾಥ ಹನ್ನೆರಡು ಜ್ಯೋತಿರ್ಲಿಂಗಗಳಲ್ಲಿ ಮೊದಲನೆಯದು. ಇಲ್ಲಿಂದ ದಕ್ಷಿಣ ಧ್ರುವದವರೆಗೆ ನೇರ ರೇಖೆಯಲ್ಲಿ ಎಲ್ಲೂ ನೆಲವಿಲ್ಲ ಎಂದು ಕಡಲ ತೀರದ ಒಂದು ಕಂಬ ಹೇಳುತ್ತದೆ."],
["⚓","Lothal","लोथल","ಲೋಥಲ್","Over 4,000 years ago, Lothal was a Harappan port town with one of the oldest dockyards in the world.","4,000 साल से भी पहले लोथल हड़प्पा काल का बंदरगाह शहर था, जहाँ दुनिया की सबसे पुरानी गोदियों में से एक थी।","4,000 ವರ್ಷಗಳಿಗೂ ಹಿಂದೆ ಲೋಥಲ್ ಹರಪ್ಪಾ ಕಾಲದ ಬಂದರು ಪಟ್ಟಣ; ಜಗತ್ತಿನ ಅತಿ ಹಳೆಯ ಹಡಗುಕಟ್ಟೆಗಳಲ್ಲಿ ಒಂದು ಇಲ್ಲಿತ್ತು."],
["🏰","Champaner-Pavagadh","चांपानेर-पावागढ़","ಚಾಂಪಾನೇರ್-ಪಾವಾಗಢ","Champaner-Pavagadh is a UNESCO site with old mosques and forts, and the Kalika Mata temple on top of Pavagadh hill.","चांपानेर-पावागढ़ यूनेस्को धरोहर है, जहाँ पुरानी मस्जिदें, किले और पावागढ़ पहाड़ी पर कालिका माता मंदिर है।","ಚಾಂಪಾನೇರ್-ಪಾವಾಗಢ ಯುನೆಸ್ಕೋ ತಾಣ; ಇಲ್ಲಿ ಹಳೆಯ ಮಸೀದಿಗಳು, ಕೋಟೆಗಳು ಮತ್ತು ಪಾವಾಗಢ ಬೆಟ್ಟದ ತುದಿಯಲ್ಲಿ ಕಾಳಿಕಾ ಮಾತೆಯ ದೇವಾಲಯವಿದೆ."],
["🗽","Statue of Unity","स्टैच्यू ऑफ़ यूनिटी","ಏಕತಾ ಪ್ರತಿಮೆ","The Statue of Unity of Sardar Vallabhbhai Patel is 182 metres tall, the tallest statue in the world.","सरदार वल्लभभाई पटेल की स्टैच्यू ऑफ़ यूनिटी 182 मीटर ऊँची है, दुनिया की सबसे ऊँची प्रतिमा।","ಸರ್ದಾರ್ ವಲ್ಲಭಭಾಯಿ ಪಟೇಲರ ಏಕತಾ ಪ್ರತಿಮೆ 182 ಮೀಟರ್ ಎತ್ತರ; ಜಗತ್ತಿನ ಅತಿ ಎತ್ತರದ ಪ್ರತಿಮೆ."]
],
 dd:[
['🏰','Diu Fort','दीव का किला','ದಿಯು ಕೋಟೆ','The Portuguese built this fort in 1535 at the edge of the sea. From its walls you can see waves on three sides and the Panikotha sea fort in the creek.','पुर्तगालियों ने यह किला 1535 में समुद्र के किनारे बनाया। इसकी दीवारों से तीन तरफ़ लहरें और खाड़ी में पानीकोठा किला दिखता है।','ಪೋರ್ಚುಗೀಸರು ಈ ಕೋಟೆಯನ್ನು 1535ರಲ್ಲಿ ಕಡಲಂಚಿನಲ್ಲಿ ಕಟ್ಟಿದರು. ಇದರ ಗೋಡೆಗಳ ಮೇಲಿಂದ ಮೂರು ಕಡೆ ಅಲೆಗಳು ಮತ್ತು ಹಿನ್ನೀರಿನಲ್ಲಿರುವ ಪಾನಿಕೋಠಾ ಕೋಟೆ ಕಾಣುತ್ತವೆ.'],
['🔱','Gangeshwar Temple','गंगेश्वर मंदिर','ಗಂಗೇಶ್ವರ ದೇವಾಲಯ','Five Shiva lingas sit among the seaside rocks here and are washed by the waves at high tide. Legend says the Pandavas worshipped here.','यहाँ समुद्र किनारे की चट्टानों में पाँच शिवलिंग हैं, जिन्हें ज्वार के समय लहरें धो जाती हैं। मान्यता है कि पांडवों ने यहाँ पूजा की थी।','ಇಲ್ಲಿ ಕಡಲಂಚಿನ ಬಂಡೆಗಳ ನಡುವೆ ಐದು ಶಿವಲಿಂಗಗಳಿವೆ; ಉಬ್ಬರದ ಸಮಯದಲ್ಲಿ ಅಲೆಗಳು ಅವನ್ನು ತೊಳೆಯುತ್ತವೆ. ಪಾಂಡವರು ಇಲ್ಲಿ ಪೂಜಿಸಿದರು ಎಂಬ ನಂಬಿಕೆ ಇದೆ.'],
['🏖️','Nagoa Beach','नागोआ बीच','ನಾಗೋವಾ ಕಡಲತೀರ','A horseshoe-shaped beach lined with hoka palms. Diu is the only place in India where these African palms grow.','घोड़े की नाल जैसा समुद्र तट, जिसके किनारे होका ताड़ लगे हैं। भारत में ये अफ़्रीकी ताड़ सिर्फ़ दीव में उगते हैं।','ಕುದುರೆ ಲಾಳದ ಆಕಾರದ ಕಡಲತೀರ, ಸುತ್ತ ಹೋಕಾ ತಾಳೆಮರಗಳು. ಭಾರತದಲ್ಲಿ ಈ ಆಫ್ರಿಕಾದ ತಾಳೆ ಬೆಳೆಯುವುದು ದಿಯುವಿನಲ್ಲಿ ಮಾತ್ರ.'],
['🪨','Naida Caves','नायडा गुफाएँ','ನಾಯ್ಡಾ ಗುಹೆಗಳು','A maze of rock tunnels and square-cut steps just outside Diu\'s town walls. Sunlight pours in through holes in the roof.','दीव शहर की दीवारों के ठीक बाहर चट्टानों में बनी सुरंगों और चौकोर सीढ़ियों की भूलभुलैया। छत के छेदों से धूप अंदर आती है।','ದಿಯು ಪಟ್ಟಣದ ಗೋಡೆಯ ಹೊರಗೇ ಬಂಡೆಯಲ್ಲಿ ಕೊರೆದ ಸುರಂಗಗಳು ಮತ್ತು ಚೌಕ ಮೆಟ್ಟಿಲುಗಳ ಜಟಿಲ ದಾರಿ. ಮೇಲ್ಛಾವಣಿಯ ತೂತುಗಳಿಂದ ಬಿಸಿಲು ಒಳಗೆ ಸುರಿಯುತ್ತದೆ.'],
['⚓','Nani Daman · St Jerome Fort','नानी दमण · सेंट जेरोम किला','ನಾನಿ ದಮನ್ · ಸಂತ ಜೆರೋಮ್ ಕೋಟೆ','Across the Damanganga river, this smaller fort has a giant gateway with a statue of St Jerome. Fishing boats tie up at the jetty nearby.','दमणगंगा नदी के उस पार यह छोटा किला है, जिसके बड़े दरवाज़े पर सेंट जेरोम की मूर्ति है। पास की जेटी पर मछुआरों की नावें बँधती हैं।','ದಮನ್‌ಗಂಗಾ ನದಿಯ ಆಚೆ ಇರುವ ಈ ಚಿಕ್ಕ ಕೋಟೆಯ ದೊಡ್ಡ ಹೆಬ್ಬಾಗಿಲಲ್ಲಿ ಸಂತ ಜೆರೋಮರ ಪ್ರತಿಮೆ ಇದೆ. ಹತ್ತಿರದ ದೋಣಿಕಟ್ಟೆಯಲ್ಲಿ ಮೀನುಗಾರರ ದೋಣಿಗಳು ನಿಲ್ಲುತ್ತವೆ.'],
['⛪','Moti Daman Fort','मोटी दमण किला','ಮೋಟಿ ದಮನ್ ಕೋಟೆ','The Portuguese began this big fort in 1559. Inside its walls are the Church of Bom Jesus, old houses and a lighthouse.','पुर्तगालियों ने यह बड़ा किला 1559 में बनाना शुरू किया। इसकी दीवारों के अंदर बॉम जीसस चर्च, पुराने घर और एक लाइटहाउस है।','ಪೋರ್ಚುಗೀಸರು ಈ ದೊಡ್ಡ ಕೋಟೆಯನ್ನು 1559ರಲ್ಲಿ ಕಟ್ಟಲು ಆರಂಭಿಸಿದರು. ಇದರ ಗೋಡೆಗಳ ಒಳಗೆ ಬಾಮ್ ಜೀಸಸ್ ಇಗರ್ಜಿ, ಹಳೆಯ ಮನೆಗಳು ಮತ್ತು ಒಂದು ದೀಪಸ್ತಂಭ ಇವೆ.'],
['🌲','Jampore Beach','जामपोर बीच','ಜಾಂಪೋರ್ ಕಡಲತೀರ','A quiet, sandy beach south of Moti Daman, shaded by tall casuarina trees.','मोटी दमण के दक्षिण में एक शांत, रेतीला समुद्र तट, जहाँ ऊँचे सरू जैसे कैज़ुअरीना पेड़ छाया देते हैं।','ಮೋಟಿ ದಮನ್‌ನ ದಕ್ಷಿಣಕ್ಕಿರುವ ಶಾಂತ, ಮರಳಿನ ಕಡಲತೀರ; ಎತ್ತರದ ಗಾಳಿಮರಗಳು ನೆರಳು ಕೊಡುತ್ತವೆ.'],
['🌸','Vanganga Lake Garden','वनगंगा झील उद्यान','ವನಗಂಗಾ ಸರೋವರ ಉದ್ಯಾನ','A lake garden near Silvassa with wooden bridges, little islands and boats, laid out like a Japanese garden.','सिलवासा के पास झील वाला बगीचा, जिसमें लकड़ी के पुल, छोटे टापू और नावें हैं; इसे जापानी बगीचे की तरह सजाया गया है।','ಸಿಲ್ವಾಸಾ ಬಳಿಯ ಸರೋವರದ ಉದ್ಯಾನ; ಮರದ ಸೇತುವೆಗಳು, ಪುಟ್ಟ ದ್ವೀಪಗಳು ಮತ್ತು ದೋಣಿಗಳಿವೆ. ಇದನ್ನು ಜಪಾನಿನ ಉದ್ಯಾನದಂತೆ ರೂಪಿಸಲಾಗಿದೆ.'],
['🪘','Silvassa · Tribal Museum','सिलवासा · आदिवासी संग्रहालय','ಸಿಲ್ವಾಸಾ · ಬುಡಕಟ್ಟು ವಸ್ತುಸಂಗ್ರಹಾಲಯ','This museum shows the masks, musical instruments, jewellery and tools of the Warli, Kokna and Dhodia people of Dadra and Nagar Haveli.','यह संग्रहालय दादरा और नागर हवेली के वारली, कोकना और धोड़िया लोगों के मुखौटे, वाद्य, गहने और औज़ार दिखाता है।','ಈ ವಸ್ತುಸಂಗ್ರಹಾಲಯದಲ್ಲಿ ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿಯ ವಾರ್ಲಿ, ಕೋಕ್ನಾ ಮತ್ತು ಧೋಡಿಯಾ ಜನರ ಮುಖವಾಡಗಳು, ವಾದ್ಯಗಳು, ಆಭರಣಗಳು ಮತ್ತು ಉಪಕರಣಗಳಿವೆ.'],
['🦁','Vasona Lion Safari','वासोना लायन सफ़ारी','ವಾಸೋನಾ ಸಿಂಹಧಾಮ','Part of the Dadra and Nagar Haveli Wildlife Sanctuary, set up to protect Asiatic lions and raise their cubs.','दादरा और नागर हवेली वन्यजीव अभयारण्य का हिस्सा, जो एशियाई शेरों की रक्षा और उनके शावकों की देखभाल के लिए बना है।','ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿ ವನ್ಯಜೀವಿ ಅಭಯಾರಣ್ಯದ ಭಾಗ; ಏಷ್ಯಾದ ಸಿಂಹಗಳನ್ನು ಕಾಪಾಡಲು ಮತ್ತು ಅವುಗಳ ಮರಿಗಳನ್ನು ಬೆಳೆಸಲು ಇದನ್ನು ಆರಂಭಿಸಲಾಯಿತು.'],
['🦌','Satmaliya Deer Park','सतमालिया हिरण उद्यान','ಸತ್ಮಾಲಿಯಾ ಜಿಂಕೆ ವನ','Chital, sambar, blackbuck and nilgai roam here, with peacocks and woodpeckers in the trees.','यहाँ चीतल, सांभर, काला हिरण और नीलगाय घूमते हैं, और पेड़ों पर मोर व कठफोड़वे दिखते हैं।','ಇಲ್ಲಿ ಚುಕ್ಕೆ ಜಿಂಕೆ, ಕಡವೆ, ಕೃಷ್ಣಮೃಗ ಮತ್ತು ನೀಲಗಾಯ್ ಓಡಾಡುತ್ತವೆ; ಮರಗಳಲ್ಲಿ ನವಿಲು, ಮರಕುಟಿಗಗಳು ಕಾಣುತ್ತವೆ.'],
['🛶','Dudhni Lake','दूधनी झील','ದೂಧ್ನಿ ಸರೋವರ','A wide lake on the Madhuban dam reservoir of the Damanganga river, with green hills all around and boats to ride.','दमणगंगा नदी पर बने मधुबन बाँध के जलाशय की चौड़ी झील, चारों ओर हरी पहाड़ियाँ और सैर के लिए नावें।','ದಮನ್‌ಗಂಗಾ ನದಿಯ ಮಧುಬನ್ ಅಣೆಕಟ್ಟಿನ ಜಲಾಶಯದ ವಿಶಾಲ ಸರೋವರ; ಸುತ್ತಲೂ ಹಸಿರು ಬೆಟ್ಟಗಳು, ವಿಹಾರಕ್ಕೆ ದೋಣಿಗಳು.']
],
 ga:[
['🏰','Chapora Fort','चापोरा किला','ಚಾಪೋರಾ ಕೋಟೆ','A red laterite fort on a hill above the Chapora river, first built by the Adil Shahi rulers. From its walls you see beaches stretching north and south.','चापोरा नदी के ऊपर पहाड़ी पर लाल लेटराइट पत्थर का किला, जिसे पहले आदिलशाही शासकों ने बनाया था। इसकी दीवारों से उत्तर और दक्षिण तक फैले समुद्र तट दिखते हैं।','ಚಾಪೋರಾ ನದಿಯ ಮೇಲಿನ ಗುಡ್ಡದಲ್ಲಿರುವ ಕೆಂಪು ಮುರಕಲ್ಲಿನ ಕೋಟೆ; ಮೊದಲು ಆದಿಲ್‌ಶಾಹಿ ಅರಸರು ಕಟ್ಟಿದರು. ಇದರ ಗೋಡೆಗಳಿಂದ ಉತ್ತರ-ದಕ್ಷಿಣಕ್ಕೆ ಹರಡಿದ ಕಡಲತೀರಗಳು ಕಾಣುತ್ತವೆ.'],
['🏖️','Calangute Beach','कलंगुट बीच','ಕಲಂಗುಟ್ ಕಡಲತೀರ','One of Goa\'s longest and busiest beaches, lined with fishing boats, beach shacks and coconut palms.','गोवा के सबसे लंबे और चहल-पहल वाले समुद्र तटों में से एक, जहाँ मछली पकड़ने की नावें, छोटे भोजनालय और नारियल के पेड़ हैं।','ಗೋವಾದ ಅತಿ ಉದ್ದದ, ಜನಜಂಗುಳಿಯ ಕಡಲತೀರಗಳಲ್ಲಿ ಒಂದು; ಮೀನುಗಾರರ ದೋಣಿಗಳು, ಸಣ್ಣ ಹೋಟೆಲುಗಳು ಮತ್ತು ತೆಂಗಿನ ಮರಗಳ ಸಾಲು ಇಲ್ಲಿದೆ.'],
['🗼','Fort Aguada','अगुआड़ा किला','ಅಗುವಾಡಾ ಕೋಟೆ','Built by the Portuguese in 1612. Ships stopped here for fresh water from its spring, which gave it the name Aguada. Its 1864 lighthouse is one of the oldest of its kind in Asia.','पुर्तगालियों ने इसे 1612 में बनाया। जहाज़ यहाँ के झरने से मीठा पानी भरने रुकते थे, इसी से नाम पड़ा अगुआड़ा। इसका 1864 का लाइटहाउस एशिया में अपनी तरह के सबसे पुराने लाइटहाउसों में से है।','ಪೋರ್ಚುಗೀಸರು ಇದನ್ನು 1612ರಲ್ಲಿ ಕಟ್ಟಿದರು. ಇಲ್ಲಿನ ಒರತೆಯಿಂದ ಸಿಹಿನೀರು ತುಂಬಿಕೊಳ್ಳಲು ಹಡಗುಗಳು ನಿಲ್ಲುತ್ತಿದ್ದವು; ಅದರಿಂದಲೇ ಅಗುವಾಡಾ ಎಂಬ ಹೆಸರು. ಇದರ 1864ರ ದೀಪಸ್ತಂಭ ಏಷ್ಯಾದ ಅತಿ ಹಳೆಯವುಗಳಲ್ಲಿ ಒಂದು.'],
['🏘️','Panaji · Fontainhas','पणजी · फ़ॉन्टेनहास','ಪಣಜಿ · ಫೊಂಟೈನ್ಹಾಸ್','Panaji\'s old quarter of narrow lanes and colourful houses with red-tiled roofs. It is named after an old spring that once gave the area its water.','पणजी का पुराना मोहल्ला, जहाँ तंग गलियाँ और लाल खपरैल वाले रंग-बिरंगे घर हैं। इसका नाम एक पुराने झरने पर पड़ा, जिससे कभी यहाँ पानी आता था।','ಪಣಜಿಯ ಹಳೆಯ ಬಡಾವಣೆ; ಕಿರಿದಾದ ಬೀದಿಗಳು, ಕೆಂಪು ಹೆಂಚಿನ ಬಣ್ಣಬಣ್ಣದ ಮನೆಗಳು. ಹಿಂದೆ ಈ ಪ್ರದೇಶಕ್ಕೆ ನೀರು ಕೊಡುತ್ತಿದ್ದ ಒಂದು ಹಳೆಯ ಒರತೆಯ ಹೆಸರೇ ಇದಕ್ಕೆ ಬಂದಿದೆ.'],
['🦩','Salim Ali Bird Sanctuary','सालिम अली पक्षी अभयारण्य','ಸಲೀಂ ಅಲಿ ಪಕ್ಷಿಧಾಮ','Goa\'s only bird sanctuary, on Chorao island in the Mandovi river, covered with mangroves where herons, kingfishers and egrets live.','मांडवी नदी के चोराव द्वीप पर गोवा का अकेला पक्षी अभयारण्य, जो मैंग्रोव से ढका है और जहाँ बगुले, किलकिला और बगले रहते हैं।','ಮಾಂಡವಿ ನದಿಯ ಚೋರಾವ್ ದ್ವೀಪದಲ್ಲಿರುವ ಗೋವಾದ ಏಕೈಕ ಪಕ್ಷಿಧಾಮ; ಕಾಂಡ್ಲಾ ಕಾಡಿನಿಂದ ತುಂಬಿದ್ದು, ಇಲ್ಲಿ ಬಕ, ಮಿಂಚುಳ್ಳಿ, ಬೆಳ್ಳಕ್ಕಿಗಳು ವಾಸಿಸುತ್ತವೆ.'],
['⛪','Old Goa · Bom Jesus','पुराना गोवा · बॉम जीसस','ಹಳೆಯ ಗೋವಾ · ಬಾಮ್ ಜೀಸಸ್','The Basilica of Bom Jesus was begun in 1594 and consecrated in 1605. It holds the relics of St Francis Xavier and is part of a UNESCO World Heritage Site.','बॉम जीसस बेसिलिका का काम 1594 में शुरू हुआ और 1605 में इसका अभिषेक हुआ। इसमें संत फ़्रांसिस ज़ेवियर के अवशेष रखे हैं, और यह यूनेस्को विश्व धरोहर स्थल का हिस्सा है।','ಬಾಮ್ ಜೀಸಸ್ ಬೆಸಿಲಿಕಾದ ಕೆಲಸ 1594ರಲ್ಲಿ ಶುರುವಾಗಿ 1605ರಲ್ಲಿ ಪ್ರತಿಷ್ಠಾಪನೆಯಾಯಿತು. ಇದರಲ್ಲಿ ಸಂತ ಫ್ರಾನ್ಸಿಸ್ ಝೇವಿಯರರ ಅವಶೇಷಗಳಿವೆ; ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆಯ ತಾಣದ ಭಾಗ.'],
['🪔','Mangueshi Temple','मंगेशी मंदिर','ಮಂಗೇಶಿ ದೇವಾಲಯ','A famous Shiva temple near Ponda, with a tall white lamp tower that glows with rows of little oil lamps on festival nights.','पोंडा के पास प्रसिद्ध शिव मंदिर, जिसकी ऊँची सफ़ेद दीप-मीनार त्योहार की रातों में छोटे-छोटे दीयों की कतारों से जगमगाती है।','ಪೋಂಡಾ ಬಳಿಯ ಪ್ರಸಿದ್ಧ ಶಿವ ದೇವಾಲಯ; ಇದರ ಎತ್ತರದ ಬಿಳಿ ದೀಪಸ್ತಂಭ ಹಬ್ಬದ ರಾತ್ರಿಗಳಲ್ಲಿ ಸಾಲು ಸಾಲು ಹಣತೆಗಳಿಂದ ಬೆಳಗುತ್ತದೆ.'],
['🌿','Ponda · spice farms','पोंडा · मसाला बागान','ಪೋಂಡಾ · ಸಾಂಬಾರ ತೋಟಗಳು','In the green hills around Ponda, farms grow pepper, cardamom, nutmeg and cinnamon in the shade of areca and coconut palms.','पोंडा के आसपास की हरी पहाड़ियों में सुपारी और नारियल की छाँव में काली मिर्च, इलायची, जायफल और दालचीनी उगाई जाती है।','ಪೋಂಡಾ ಸುತ್ತಲಿನ ಹಸಿರು ಬೆಟ್ಟಗಳಲ್ಲಿ ಅಡಿಕೆ, ತೆಂಗಿನ ನೆರಳಿನಲ್ಲಿ ಮೆಣಸು, ಏಲಕ್ಕಿ, ಜಾಯಿಕಾಯಿ ಮತ್ತು ಚಕ್ಕೆ ಬೆಳೆಯುತ್ತಾರೆ.'],
['🛕','Tambdi Surla Temple','ताम्बडी सुरला मंदिर','ತಾಂಬ್ಡಿ ಸುರ್ಲಾ ದೇವಾಲಯ','A small stone Shiva temple from the 12th century, hidden deep in the forest. It is the oldest temple still standing in Goa.','घने जंगल में छिपा 12वीं सदी का पत्थर का छोटा शिव मंदिर। यह गोवा का सबसे पुराना बचा हुआ मंदिर है।','ದಟ್ಟ ಕಾಡಿನೊಳಗೆ ಅಡಗಿರುವ 12ನೇ ಶತಮಾನದ ಪುಟ್ಟ ಕಲ್ಲಿನ ಶಿವ ದೇವಾಲಯ. ಗೋವಾದಲ್ಲಿ ಇಂದಿಗೂ ಉಳಿದಿರುವ ಅತಿ ಹಳೆಯ ದೇವಾಲಯ ಇದು.'],
['💧','Dudhsagar Falls','दूधसागर जलप्रपात','ದೂಧ್‌ಸಾಗರ್ ಜಲಪಾತ','A four-step waterfall about 310 metres tall on the Mandovi river. Its name means sea of milk, and trains pass right in front of it.','मांडवी नदी पर लगभग 310 मीटर ऊँचा चार चरणों वाला जलप्रपात। इसके नाम का अर्थ है दूध का सागर, और रेलगाड़ियाँ ठीक इसके सामने से गुज़रती हैं।','ಮಾಂಡವಿ ನದಿಯ ಮೇಲಿನ ಸುಮಾರು 310 ಮೀಟರ್ ಎತ್ತರದ ನಾಲ್ಕು ಹಂತದ ಜಲಪಾತ. ಹೆಸರಿನ ಅರ್ಥ ಹಾಲಿನ ಸಮುದ್ರ; ರೈಲುಗಳು ಇದರ ಎದುರಿನಲ್ಲೇ ಹಾದು ಹೋಗುತ್ತವೆ.'],
['🐚','Palolem Beach','पालोलेम बीच','ಪಾಲೊಳೆಂ ಕಡಲತೀರ','A calm, crescent-shaped beach in Canacona, with palm trees and wooden fishing boats pulled up on the sand.','काणकोण का शांत, आधे चाँद जैसा समुद्र तट, जहाँ ताड़ के पेड़ हैं और रेत पर लकड़ी की नावें खींचकर रखी जाती हैं।','ಕಾಣಕೋಣದ ಶಾಂತ, ಅರ್ಧಚಂದ್ರಾಕಾರದ ಕಡಲತೀರ; ತೆಂಗಿನ ಮರಗಳು, ಮರಳಿನ ಮೇಲೆ ಎಳೆದಿಟ್ಟ ಮರದ ದೋಣಿಗಳು.'],
['🏯','Cabo de Rama Fort','काबो दे रामा किला','ಕಾಬೋ ದೆ ರಾಮಾ ಕೋಟೆ','A clifftop fort in south Goa, built before the Portuguese came. Its name comes from a legend that Lord Rama stayed here.','दक्षिण गोवा में चट्टान पर बना किला, जो पुर्तगालियों के आने से पहले बना था। इसका नाम एक कथा से आया है कि भगवान राम यहाँ ठहरे थे।','ದಕ್ಷಿಣ ಗೋವಾದ ಕಡಿದಾದ ಬಂಡೆಯ ಮೇಲಿನ ಕೋಟೆ; ಪೋರ್ಚುಗೀಸರು ಬರುವ ಮೊದಲೇ ಕಟ್ಟಿದ್ದು. ಶ್ರೀರಾಮ ಇಲ್ಲಿ ತಂಗಿದ್ದ ಎಂಬ ಕಥೆಯಿಂದ ಈ ಹೆಸರು ಬಂದಿದೆ.']
],
 kl:[
['🏰','Bekal Fort','बेकल किला','ಬೇಕಲ ಕೋಟೆ','Kerala\'s largest fort, built of red laterite by Shivappa Nayaka of Keladi around 1650. Shaped like a keyhole, its walls rise straight out of the Arabian Sea.','केरल का सबसे बड़ा किला, जिसे केलदी के शिवप्पा नायक ने लगभग 1650 में लाल लेटराइट पत्थर से बनवाया। चाबी के छेद जैसे आकार वाली इसकी दीवारें सीधे अरब सागर से उठती हैं।','ಕೇರಳದ ಅತಿ ದೊಡ್ಡ ಕೋಟೆ; ಕೆಳದಿಯ ಶಿವಪ್ಪ ನಾಯಕ ಸುಮಾರು 1650ರಲ್ಲಿ ಕೆಂಪು ಮುರಕಲ್ಲಿನಿಂದ ಕಟ್ಟಿಸಿದ. ಬೀಗದ ಕೈ ತೂತಿನ ಆಕಾರದ ಇದರ ಗೋಡೆಗಳು ನೇರವಾಗಿ ಅರಬ್ಬೀ ಸಮುದ್ರದಿಂದ ಮೇಲೇಳುತ್ತವೆ.'],
['🔥','Kannur · Theyyam','कन्नूर · तेय्यम','ಕಣ್ಣೂರು · ತೆಯ್ಯಂ','In the villages of north Kerala, Theyyam dancers in giant red headdresses and painted faces perform at shrines through the night, from about October to May.','उत्तर केरल के गाँवों में विशाल लाल मुकुट और रंगे चेहरों वाले तेय्यम कलाकार लगभग अक्टूबर से मई तक मंदिरों में रात भर नृत्य करते हैं।','ಉತ್ತರ ಕೇರಳದ ಹಳ್ಳಿಗಳಲ್ಲಿ ದೊಡ್ಡ ಕೆಂಪು ಕಿರೀಟ ಮತ್ತು ಬಣ್ಣ ಬಳಿದ ಮುಖದ ತೆಯ್ಯಂ ಕಲಾವಿದರು ಸುಮಾರು ಅಕ್ಟೋಬರ್‌ನಿಂದ ಮೇವರೆಗೆ ದೈವಸ್ಥಾನಗಳಲ್ಲಿ ರಾತ್ರಿಯಿಡೀ ಕುಣಿಯುತ್ತಾರೆ.'],
['⛵','Kozhikode · Kappad Beach','कोझिकोड · कप्पड़ बीच','ಕೋಳಿಕ್ಕೋಡ್ · ಕಪ್ಪಾಡ್ ಕಡಲತೀರ','In 1498 the Portuguese sailor Vasco da Gama landed near here, after finding the sea route from Europe to India. Kozhikode was then a rich port for pepper and spices.','1498 में पुर्तगाली नाविक वास्को द गामा यूरोप से भारत का समुद्री रास्ता खोजकर यहीं पास उतरा था। कोझिकोड तब काली मिर्च और मसालों का समृद्ध बंदरगाह था।','1498ರಲ್ಲಿ ಪೋರ್ಚುಗೀಸ್ ನಾವಿಕ ವಾಸ್ಕೋ ಡ ಗಾಮಾ ಯುರೋಪಿನಿಂದ ಭಾರತಕ್ಕೆ ಕಡಲದಾರಿ ಕಂಡುಹಿಡಿದು ಇಲ್ಲೇ ಹತ್ತಿರ ಬಂದಿಳಿದ. ಆಗ ಕೋಳಿಕ್ಕೋಡ್ ಕಾಳುಮೆಣಸು, ಸಾಂಬಾರ ಪದಾರ್ಥಗಳ ಶ್ರೀಮಂತ ಬಂದರು.'],
['🪨','Wayanad · Edakkal Caves','वायनाड · एडक्कल गुफाएँ','ವಯನಾಡು · ಎಡಕ್ಕಲ್ ಗುಹೆಗಳು','High on Ambukuthi hill, these rock shelters have Stone Age carvings of people, animals and symbols, some thousands of years old.','अंबुकुथी पहाड़ी पर ऊँचे बने इन चट्टानी आश्रयों में पाषाण युग की लोगों, जानवरों और चिह्नों की नक्काशी है, जिनमें से कुछ हज़ारों साल पुरानी है।','ಅಂಬುಕುತ್ತಿ ಬೆಟ್ಟದ ಮೇಲಿರುವ ಈ ಬಂಡೆಗುಹೆಗಳಲ್ಲಿ ಶಿಲಾಯುಗದ ಮನುಷ್ಯರು, ಪ್ರಾಣಿಗಳು, ಚಿಹ್ನೆಗಳ ಕೆತ್ತನೆಗಳಿವೆ; ಕೆಲವು ಸಾವಿರಾರು ವರ್ಷ ಹಳೆಯವು.'],
['🛕','Thrissur · Vadakkunnathan','त्रिशूर · वडक्कुनाथन','ತ್ರಿಶೂರ್ · ವಡಕ್ಕುನಾಥನ್','A grand old Shiva temple in the heart of Thrissur. Every year the Thrissur Pooram festival fills its grounds with decorated elephants, drums and colourful parasols.','त्रिशूर के बीचोंबीच एक भव्य पुराना शिव मंदिर। हर साल त्रिशूर पूरम उत्सव में इसका मैदान सजे हाथियों, ढोलों और रंगीन छतरियों से भर जाता है।','ತ್ರಿಶೂರಿನ ನಡುವಿನಲ್ಲಿರುವ ಭವ್ಯವಾದ ಹಳೆಯ ಶಿವ ದೇವಾಲಯ. ಪ್ರತಿ ವರ್ಷ ತ್ರಿಶೂರ್ ಪೂರಂ ಹಬ್ಬದಲ್ಲಿ ಇದರ ಮೈದಾನ ಸಿಂಗರಿಸಿದ ಆನೆಗಳು, ಚಂಡೆಗಳು, ಬಣ್ಣದ ಕೊಡೆಗಳಿಂದ ತುಂಬುತ್ತದೆ.'],
['🎣','Fort Kochi · fishing nets','फ़ोर्ट कोच्चि · मछली जाल','ಫೋರ್ಟ್ ಕೊಚ್ಚಿ · ಮೀನುಬಲೆಗಳು','Giant Chinese fishing nets stand along the shore. A team of fishermen lowers each net into the sea with ropes and heavy stones, then lifts it up full of fish.','किनारे पर विशाल चीनी मछली जाल खड़े हैं। मछुआरों की टोली रस्सियों और भारी पत्थरों से हर जाल को समुद्र में डुबोती है, फिर मछलियों से भरा उठा लेती है।','ಕಡಲತೀರದುದ್ದಕ್ಕೂ ದೊಡ್ಡ ಚೀನೀ ಮೀನುಬಲೆಗಳು ನಿಂತಿವೆ. ಬೆಸ್ತರ ತಂಡ ಹಗ್ಗ ಮತ್ತು ಭಾರದ ಕಲ್ಲುಗಳ ಸಹಾಯದಿಂದ ಪ್ರತಿ ಬಲೆಯನ್ನು ಸಮುದ್ರಕ್ಕೆ ಇಳಿಸಿ, ಮೀನು ತುಂಬಿದ ಬಲೆಯನ್ನು ಮೇಲೆತ್ತುತ್ತದೆ.'],
['💧','Athirappilly Falls','अथिरापल्ली जलप्रपात','ಅತಿರಪ್ಪಿಳ್ಳಿ ಜಲಪಾತ','Kerala\'s largest waterfall, about 80 feet tall and very wide, on the Chalakudy river. In the forest around it live all four kinds of hornbills of south India.','चालक्कुडी नदी पर केरल का सबसे बड़ा जलप्रपात, लगभग 80 फ़ुट ऊँचा और बहुत चौड़ा। इसके आसपास के जंगल में दक्षिण भारत के चारों तरह के धनेश पक्षी रहते हैं।','ಚಾಲಕ್ಕುಡಿ ನದಿಯ ಮೇಲಿನ ಕೇರಳದ ಅತಿ ದೊಡ್ಡ ಜಲಪಾತ; ಸುಮಾರು 80 ಅಡಿ ಎತ್ತರ, ತುಂಬಾ ಅಗಲ. ಇದರ ಸುತ್ತಲಿನ ಕಾಡಿನಲ್ಲಿ ದಕ್ಷಿಣ ಭಾರತದ ನಾಲ್ಕೂ ಬಗೆಯ ಮಂಗಟ್ಟೆ ಹಕ್ಕಿಗಳು ವಾಸಿಸುತ್ತವೆ.'],
['🍃','Munnar · tea hills','मुन्नार · चाय की पहाड़ियाँ','ಮುನ್ನಾರ್ · ಚಹಾ ಬೆಟ್ಟಗಳು','Rolling hills covered in neat rows of tea bushes, high in the Western Ghats. Nearby Eravikulam National Park is home to the shy Nilgiri tahr, a mountain goat.','पश्चिमी घाट में ऊँचाई पर चाय की झाड़ियों की सुघड़ कतारों से ढकी लहराती पहाड़ियाँ। पास का एरविकुलम राष्ट्रीय उद्यान शर्मीले नीलगिरि तहर, एक पहाड़ी बकरी, का घर है।','ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಎತ್ತರದಲ್ಲಿ ಚಹಾ ಗಿಡಗಳ ಅಚ್ಚುಕಟ್ಟಾದ ಸಾಲುಗಳಿಂದ ಮುಚ್ಚಿದ ಅಲೆಅಲೆಯಾದ ಬೆಟ್ಟಗಳು. ಹತ್ತಿರದ ಇರವಿಕುಳಂ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನ ನಾಚಿಕೆಯ ಬೆಟ್ಟದ ಆಡು ನೀಲಗಿರಿ ತಾರ್‌ನ ನೆಲೆ.'],
['🐅','Thekkady · Periyar','थेक्कडी · पेरियार','ತೇಕ್ಕಡಿ · ಪೆರಿಯಾರ್','Periyar Tiger Reserve has a big forest lake. From a boat you can often see wild elephants, gaur and deer coming down to drink, and the hills smell of cardamom and pepper.','पेरियार टाइगर रिज़र्व में जंगल के बीच एक बड़ी झील है। नाव से अक्सर जंगली हाथी, गौर और हिरण पानी पीने आते दिखते हैं, और पहाड़ियों से इलायची और काली मिर्च की महक आती है।','ಪೆರಿಯಾರ್ ಹುಲಿ ಮೀಸಲು ಕಾಡಿನ ನಡುವೆ ದೊಡ್ಡ ಸರೋವರವಿದೆ. ದೋಣಿಯಿಂದ ಆಗಾಗ ಕಾಡಾನೆಗಳು, ಕಾಡುಕೋಣಗಳು, ಜಿಂಕೆಗಳು ನೀರು ಕುಡಿಯಲು ಬರುವುದನ್ನು ನೋಡಬಹುದು; ಬೆಟ್ಟಗಳಲ್ಲಿ ಏಲಕ್ಕಿ, ಕಾಳುಮೆಣಸಿನ ಘಮ.'],
['🦆','Kumarakom · Vembanad Lake','कुमारकोम · वेम्बनाड झील','ಕುಮರಕಂ · ವೇಂಬನಾಡ್ ಸರೋವರ','On the shore of Vembanad, India\'s longest lake, a bird sanctuary shelters herons, cormorants and kingfishers among mangroves and coconut groves.','भारत की सबसे लंबी झील वेम्बनाड के किनारे एक पक्षी अभयारण्य है, जहाँ मैंग्रोव और नारियल के बाग़ों में बगुले, जलकौवे और किलकिला रहते हैं।','ಭಾರತದ ಅತಿ ಉದ್ದದ ಸರೋವರ ವೇಂಬನಾಡ್‌ನ ದಡದಲ್ಲಿ ಪಕ್ಷಿಧಾಮವಿದೆ; ಕಾಂಡ್ಲಾ ಕಾಡು, ತೆಂಗಿನ ತೋಪುಗಳ ನಡುವೆ ಬಕ, ನೀರುಕಾಗೆ, ಮಿಂಚುಳ್ಳಿಗಳು ವಾಸಿಸುತ್ತವೆ.'],
['🚣','Alappuzha · backwaters','अलप्पुझा · बैकवॉटर','ಆಲಪ್ಪುಳ · ಹಿನ್ನೀರು','A maze of canals, rivers and paddy fields lying below sea level. Houseboats drift here, and on Punnamada Lake snake boats race for the Nehru Trophy every August.','नहरों, नदियों और समुद्र तल से नीचे बसे धान के खेतों की भूलभुलैया। यहाँ हाउसबोट धीरे-धीरे चलती हैं, और हर अगस्त पुन्नमडा झील पर सर्प नौकाएँ नेहरू ट्रॉफ़ी के लिए दौड़ती हैं।','ಕಾಲುವೆಗಳು, ನದಿಗಳು, ಸಮುದ್ರಮಟ್ಟಕ್ಕಿಂತ ತಗ್ಗಿನ ಗದ್ದೆಗಳ ಜಾಲ. ಇಲ್ಲಿ ದೋಣಿಮನೆಗಳು ನಿಧಾನವಾಗಿ ತೇಲುತ್ತವೆ; ಪ್ರತಿ ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಪುನ್ನಮಡ ಸರೋವರದಲ್ಲಿ ಹಾವುದೋಣಿಗಳು ನೆಹರೂ ಟ್ರೋಫಿಗಾಗಿ ಸ್ಪರ್ಧಿಸುತ್ತವೆ.'],
['🪷','Thiruvananthapuram · Padmanabhaswamy','तिरुवनंतपुरम · पद्मनाभस्वामी','ತಿರುವನಂತಪುರ · ಪದ್ಮನಾಭಸ್ವಾಮಿ','The capital\'s great temple shows Lord Vishnu lying on the serpent Ananta. The city\'s name means the city of Lord Ananta.','राजधानी का यह बड़ा मंदिर शेषनाग अनंत पर लेटे भगवान विष्णु को दिखाता है। शहर के नाम का अर्थ है भगवान अनंत का नगर।','ರಾಜಧಾನಿಯ ಈ ದೊಡ್ಡ ದೇವಾಲಯದಲ್ಲಿ ಅನಂತ ಸರ್ಪದ ಮೇಲೆ ಮಲಗಿರುವ ವಿಷ್ಣುವಿದ್ದಾನೆ. ನಗರದ ಹೆಸರಿನ ಅರ್ಥ ಅನಂತನ ಊರು.']
],
 ld:[
['✈️','Agatti','अगत्ती','ಅಗತ್ತಿ','Home to Lakshadweep\'s only airport. Small planes from Kochi land on a runway with lagoons on both sides. Agatti is also a busy tuna-fishing island.','लक्षद्वीप का अकेला हवाई अड्डा यहीं है। कोच्चि से आने वाले छोटे विमान ऐसी हवाई पट्टी पर उतरते हैं जिसके दोनों ओर लैगून हैं। अगत्ती टूना मछली पकड़ने का भी बड़ा द्वीप है।','ಲಕ್ಷದ್ವೀಪದ ಏಕೈಕ ವಿಮಾನ ನಿಲ್ದಾಣ ಇಲ್ಲಿದೆ. ಕೊಚ್ಚಿಯಿಂದ ಬರುವ ಪುಟ್ಟ ವಿಮಾನಗಳು ಎರಡೂ ಬದಿಗೆ ಕಡಲಕೊಳವಿರುವ ಓಡುದಾರಿಯಲ್ಲಿ ಇಳಿಯುತ್ತವೆ. ಅಗತ್ತಿ ಕೇದರ್ ಮೀನು ಹಿಡಿಯುವ ದೊಡ್ಡ ದ್ವೀಪವೂ ಹೌದು.'],
['🏝️','Bangaram','बंगारम','ಬಂಗಾರಂ','A teardrop-shaped island ringed by a wide, shallow lagoon. Officially nobody lives here, but visitors come to swim among corals in the clear water.','चौड़े, उथले लैगून से घिरा आँसू की बूँद जैसा द्वीप। आधिकारिक तौर पर यहाँ कोई नहीं रहता, पर सैलानी साफ़ पानी में मूँगों के बीच तैरने आते हैं।','ಅಗಲವಾದ, ಆಳವಿಲ್ಲದ ಕಡಲಕೊಳ ಸುತ್ತುವರಿದ ಕಣ್ಣೀರ ಹನಿಯಾಕಾರದ ದ್ವೀಪ. ಅಧಿಕೃತವಾಗಿ ಇಲ್ಲಿ ಯಾರೂ ವಾಸಿಸುವುದಿಲ್ಲ; ಆದರೆ ಪ್ರವಾಸಿಗರು ತಿಳಿನೀರಿನಲ್ಲಿ ಹವಳಗಳ ನಡುವೆ ಈಜಲು ಬರುತ್ತಾರೆ.'],
['🏠','Bitra','बित्रा','ಬಿತ್ರಾ','The smallest island where people live in Lakshadweep, only about 0.1 square kilometres, with a few hundred people. Its lagoon is hundreds of times bigger than the island!','लक्षद्वीप का सबसे छोटा बसा हुआ द्वीप, सिर्फ़ लगभग 0.1 वर्ग किलोमीटर, जहाँ कुछ सौ लोग रहते हैं। इसका लैगून द्वीप से सैकड़ों गुना बड़ा है!','ಲಕ್ಷದ್ವೀಪದಲ್ಲಿ ಜನ ವಾಸಿಸುವ ಅತಿ ಚಿಕ್ಕ ದ್ವೀಪ; ಸುಮಾರು 0.1 ಚದರ ಕಿಲೋಮೀಟರ್ ಮಾತ್ರ, ಕೆಲವು ನೂರು ಜನ. ಇದರ ಕಡಲಕೊಳ ದ್ವೀಪಕ್ಕಿಂತ ನೂರಾರು ಪಟ್ಟು ದೊಡ್ಡದು!'],
['🌴','Chetlat','चेतलात','ಚೆತ್ಲಾತ್','One of the northern Amindivi islands, a long, narrow strip of coconut palms beside a calm lagoon.','उत्तरी अमीनदीवी द्वीपों में से एक, शांत लैगून के किनारे नारियल के पेड़ों की लंबी, पतली पट्टी।','ಉತ್ತರದ ಅಮೀನ್‌ದೀವಿ ದ್ವೀಪಗಳಲ್ಲಿ ಒಂದು; ಶಾಂತ ಕಡಲಕೊಳದ ಪಕ್ಕದ ತೆಂಗಿನ ಮರಗಳ ಉದ್ದ, ಕಿರಿದಾದ ಪಟ್ಟಿ.'],
['⛵','Kiltan','किल्तान','ಕಿಲ್ತಾನ್','A quiet island of the Amindivi group, covered in coconut groves, with a sheltered lagoon where fishing boats rest.','अमीनदीवी समूह का शांत द्वीप, नारियल के बाग़ों से ढका, जिसके सुरक्षित लैगून में मछली की नावें आराम करती हैं।','ಅಮೀನ್‌ದೀವಿ ಗುಂಪಿನ ಶಾಂತ ದ್ವೀಪ; ತೆಂಗಿನ ತೋಪುಗಳಿಂದ ಮುಚ್ಚಿದೆ, ಇದರ ಸುರಕ್ಷಿತ ಕಡಲಕೊಳದಲ್ಲಿ ಮೀನುಗಾರರ ದೋಣಿಗಳು ತಂಗುತ್ತವೆ.'],
['🤿','Kadmat','कदमत','ಕಡ್ಮತ್','A long, slender island loved by snorkellers and divers for its clear lagoon full of coral and colourful fish.','एक लंबा, पतला द्वीप, जिसे मूँगों और रंगीन मछलियों से भरे साफ़ लैगून के कारण स्नॉर्कल और गोताखोरी करने वाले बहुत पसंद करते हैं।','ಹವಳ ಮತ್ತು ಬಣ್ಣಬಣ್ಣದ ಮೀನುಗಳಿಂದ ತುಂಬಿದ ತಿಳಿ ಕಡಲಕೊಳಕ್ಕಾಗಿ ಮುಳುಗುಈಜುಗಾರರು ಮೆಚ್ಚುವ ಉದ್ದವಾದ, ತೆಳು ದ್ವೀಪ.'],
['🥥','Amini','अमिनी','ಅಮಿನಿ','The main island of the northern Amindivi group, thick with coconut palms. It sits on the same big sunken coral bank as tiny Pitti island.','उत्तरी अमीनदीवी समूह का मुख्य द्वीप, घने नारियल के पेड़ों वाला। यह नन्हे पिट्टी द्वीप के साथ एक ही बड़े डूबे हुए मूँगा तट पर है।','ಉತ್ತರದ ಅಮೀನ್‌ದೀವಿ ಗುಂಪಿನ ಮುಖ್ಯ ದ್ವೀಪ, ದಟ್ಟ ತೆಂಗಿನ ಮರಗಳು. ಪುಟ್ಟ ಪಿಟ್ಟಿ ದ್ವೀಪದ ಜೊತೆ ಇದೂ ಒಂದೇ ದೊಡ್ಡ ಮುಳುಗಿದ ಹವಳದ ದಿಬ್ಬದ ಮೇಲಿದೆ.'],
['🐦','Pitti Bird Sanctuary','पिट्टी पक्षी अभयारण्य','ಪಿಟ್ಟಿ ಪಕ್ಷಿಧಾಮ','A tiny bare coral islet, about the size of a few football fields, where thousands of sooty terns and noddies nest. Pitti simply means bird.','मूँगे का एक छोटा, सूना टापू, कुछ फ़ुटबॉल मैदानों जितना, जहाँ हज़ारों सूटी टर्न और नॉडी पक्षी घोंसले बनाते हैं। पिट्टी का मतलब ही है पक्षी।','ಕೆಲವು ಫುಟ್‌ಬಾಲ್ ಮೈದಾನಗಳಷ್ಟು ದೊಡ್ಡದಾದ ಬರಿಯ ಹವಳದ ಪುಟ್ಟ ದಿಬ್ಬ; ಇಲ್ಲಿ ಸಾವಿರಾರು ಸೂಟಿ ಕಡಲಹಕ್ಕಿಗಳು, ನಾಡಿ ಹಕ್ಕಿಗಳು ಗೂಡು ಕಟ್ಟುತ್ತವೆ. ಪಿಟ್ಟಿ ಎಂದರೆ ಹಕ್ಕಿ ಎಂದೇ ಅರ್ಥ.'],
['🕌','Kavaratti','कवरत्ती','ಕವರತ್ತಿ','The capital of Lakshadweep since 1964. Its Ujra Mosque is famous for its beautifully carved wooden ceiling.','1964 से लक्षद्वीप की राजधानी। इसकी उजरा मस्जिद अपनी सुंदर नक्काशीदार लकड़ी की छत के लिए प्रसिद्ध है।','1964ರಿಂದ ಲಕ್ಷದ್ವೀಪದ ರಾಜಧಾನಿ. ಇಲ್ಲಿನ ಉಜ್ರಾ ಮಸೀದಿ ಸುಂದರವಾಗಿ ಕೆತ್ತಿದ ಮರದ ಛಾವಣಿಗೆ ಹೆಸರುವಾಸಿ.'],
['🗺️','Andrott','आन्द्रोत','ಆಂಡ್ರೋತ್','The largest island of Lakshadweep and the closest to the mainland. Unlike the others, it lies east to west instead of north to south.','लक्षद्वीप का सबसे बड़ा द्वीप और मुख्य भूमि के सबसे पास। बाक़ी द्वीपों से अलग, यह उत्तर-दक्षिण नहीं, पूर्व-पश्चिम दिशा में फैला है।','ಲಕ್ಷದ್ವೀಪದ ಅತಿ ದೊಡ್ಡ ದ್ವೀಪ, ಮುಖ್ಯಭೂಮಿಗೆ ಅತಿ ಹತ್ತಿರದ್ದು. ಉಳಿದವುಗಳಂತೆ ಉತ್ತರ-ದಕ್ಷಿಣವಾಗಿ ಅಲ್ಲ, ಪೂರ್ವ-ಪಶ್ಚಿಮವಾಗಿ ಹರಡಿದೆ.'],
['🏖️','Kalpeni','कल्पेनी','ಕಲ್ಪೇನಿ','An island with a large lagoon and little islets around it. Heaps of broken coral, thrown up by old storms, line its eastern shore.','बड़े लैगून और आसपास छोटे-छोटे टापुओं वाला द्वीप। पुराने तूफ़ानों से उछलकर आए टूटे मूँगों के ढेर इसके पूर्वी किनारे पर लगे हैं।','ದೊಡ್ಡ ಕಡಲಕೊಳ ಮತ್ತು ಸುತ್ತ ಪುಟ್ಟ ದಿಬ್ಬಗಳಿರುವ ದ್ವೀಪ. ಹಳೆಯ ಚಂಡಮಾರುತಗಳು ಎಸೆದ ಒಡೆದ ಹವಳದ ರಾಶಿಗಳು ಇದರ ಪೂರ್ವ ತೀರದುದ್ದಕ್ಕೂ ಇವೆ.'],
['🗼','Minicoy','मिनिकॉय','ಮಿನಿಕಾಯ್','The southernmost island, far across the Nine Degree Channel. People here speak Mahl, close to the language of the Maldives, and a tall lighthouse built in 1885 still guides ships.','सबसे दक्षिणी द्वीप, नौ डिग्री चैनल के पार दूर। यहाँ लोग माल भाषा बोलते हैं, जो मालदीव की भाषा के क़रीब है, और 1885 में बना ऊँचा लाइटहाउस आज भी जहाज़ों को रास्ता दिखाता है।','ಒಂಬತ್ತು ಡಿಗ್ರಿ ಕಾಲುವೆಯ ಆಚೆ ದೂರದಲ್ಲಿರುವ ಅತಿ ದಕ್ಷಿಣದ ದ್ವೀಪ. ಇಲ್ಲಿನ ಜನ ಮಾಲ್ದೀವ್ಸ್‌ನ ಭಾಷೆಗೆ ಹತ್ತಿರವಾದ ಮಹಲ್ ಭಾಷೆ ಮಾತಾಡುತ್ತಾರೆ; 1885ರಲ್ಲಿ ಕಟ್ಟಿದ ಎತ್ತರದ ದೀಪಸ್ತಂಭ ಇಂದಿಗೂ ಹಡಗುಗಳಿಗೆ ದಾರಿ ತೋರಿಸುತ್ತದೆ.']
],
 tn:[
['🚂','Ooty · Nilgiri railway','ऊटी · नीलगिरि रेल','ಊಟಿ · ನೀಲಗಿರಿ ರೈಲು','The little Nilgiri Mountain Railway climbs from the plains up to Ooty, using a toothed middle rail on the steepest part. It is a UNESCO World Heritage Site.','छोटी नीलगिरि पर्वतीय रेल मैदानों से ऊटी तक चढ़ती है, और सबसे खड़ी चढ़ाई पर बीच की दाँतेदार पटरी का सहारा लेती है। यह यूनेस्को विश्व धरोहर है।','ಪುಟ್ಟ ನೀಲಗಿರಿ ಬೆಟ್ಟದ ರೈಲು ಬಯಲಿನಿಂದ ಊಟಿಯವರೆಗೆ ಏರುತ್ತದೆ; ಅತಿ ಕಡಿದಾದ ಭಾಗದಲ್ಲಿ ನಡುವಿನ ಹಲ್ಲಿನ ಹಳಿಯ ಸಹಾಯ ಪಡೆಯುತ್ತದೆ. ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣ.'],
['⛰️','Kodaikanal','कोडैकनाल','ಕೊಡೈಕೆನಾಲ್','A cool hill town in the Palani Hills with a big star-shaped lake made in 1863. Families row boats and ride bicycles all around it.','पलनी पहाड़ियों में एक ठंडा पहाड़ी शहर, जहाँ 1863 में बनी सितारे के आकार की बड़ी झील है। परिवार इसमें नाव चलाते हैं और चारों ओर साइकिल चलाते हैं।','ಪಳನಿ ಬೆಟ್ಟಗಳಲ್ಲಿರುವ ತಂಪಾದ ಗಿರಿಧಾಮ; 1863ರಲ್ಲಿ ನಿರ್ಮಿಸಿದ ನಕ್ಷತ್ರಾಕಾರದ ದೊಡ್ಡ ಕೆರೆ ಇಲ್ಲಿದೆ. ಕುಟುಂಬಗಳು ಅದರಲ್ಲಿ ದೋಣಿ ಹುಟ್ಟು ಹಾಕುತ್ತಾರೆ, ಸುತ್ತಲೂ ಸೈಕಲ್ ತುಳಿಯುತ್ತಾರೆ.'],
['🛕','Madurai · Meenakshi Temple','मदुरै · मीनाक्षी मंदिर','ಮಧುರೈ · ಮೀನಾಕ್ಷಿ ದೇವಾಲಯ','A huge temple city with 14 gateway towers covered in thousands of painted figures. The tallest tower is about 52 metres high.','विशाल मंदिर-नगरी, जिसके 14 द्वार-गोपुरम हज़ारों रंगीन मूर्तियों से ढके हैं। सबसे ऊँचा गोपुरम लगभग 52 मीटर ऊँचा है।','ಹದಿನಾಲ್ಕು ಗೋಪುರಗಳಿರುವ ಬೃಹತ್ ದೇವಾಲಯ ನಗರ; ಗೋಪುರಗಳ ತುಂಬಾ ಸಾವಿರಾರು ಬಣ್ಣದ ಮೂರ್ತಿಗಳು. ಅತಿ ಎತ್ತರದ ಗೋಪುರ ಸುಮಾರು 52 ಮೀಟರ್.'],
['🌅','Kanniyakumari','कन्याकुमारी','ಕನ್ಯಾಕುಮಾರಿ','The southern tip of mainland India, where three seas meet. Out on the rocks stand the Vivekananda memorial and a 133-foot statue of the poet Thiruvalluvar.','मुख्य भूमि भारत का दक्षिणी छोर, जहाँ तीन समुद्र मिलते हैं। समुद्र की चट्टानों पर विवेकानंद स्मारक और कवि तिरुवल्लुवर की 133 फ़ुट ऊँची मूर्ति खड़ी है।','ಮುಖ್ಯಭೂಮಿ ಭಾರತದ ದಕ್ಷಿಣ ತುದಿ, ಇಲ್ಲಿ ಮೂರು ಸಮುದ್ರಗಳು ಸೇರುತ್ತವೆ. ಕಡಲ ಬಂಡೆಗಳ ಮೇಲೆ ವಿವೇಕಾನಂದ ಸ್ಮಾರಕ ಮತ್ತು ಕವಿ ತಿರುವಳ್ಳುವರ್‌ರ 133 ಅಡಿ ಎತ್ತರದ ಪ್ರತಿಮೆ ನಿಂತಿವೆ.'],
['🌉','Rameswaram · Pamban Bridge','रामेश्वरम · पम्बन पुल','ರಾಮೇಶ್ವರಂ · ಪಾಂಬನ್ ಸೇತುವೆ','A railway bridge about 2 km long crosses the sea to Rameswaram island. Its middle part lifts straight up so ships can pass under it, the first sea bridge of this kind in India, opened in 2025.','लगभग 2 किलोमीटर लंबा रेल पुल समुद्र पार करके रामेश्वरम द्वीप तक जाता है। इसका बीच का हिस्सा सीधा ऊपर उठता है ताकि जहाज़ नीचे से निकल सकें; 2025 में खुला यह भारत का पहला ऐसा समुद्री पुल है।','ಸುಮಾರು 2 ಕಿಲೋಮೀಟರ್ ಉದ್ದದ ರೈಲು ಸೇತುವೆ ಸಮುದ್ರ ದಾಟಿ ರಾಮೇಶ್ವರಂ ದ್ವೀಪ ತಲುಪುತ್ತದೆ. ಇದರ ನಡುಭಾಗ ನೇರವಾಗಿ ಮೇಲೆ ಏರುತ್ತದೆ, ಹಡಗುಗಳು ಕೆಳಗಿನಿಂದ ಸಾಗುತ್ತವೆ; 2025ರಲ್ಲಿ ತೆರೆದ ಇದು ಭಾರತದಲ್ಲಿ ಈ ಬಗೆಯ ಮೊದಲ ಸಮುದ್ರ ಸೇತುವೆ.'],
['🏛️','Chettinad · Karaikudi','चेट्टिनाड · कराइकुडी','ಚೆಟ್ಟಿನಾಡ್ · ಕಾರೈಕುಡಿ','Villages of grand old mansions built by merchant families, with pillared halls, big courtyards and colourful handmade Athangudi floor tiles.','व्यापारी परिवारों की बनाई भव्य पुरानी हवेलियों के गाँव, जिनमें खंभों वाले बड़े कक्ष, बड़े आँगन और हाथ से बनी रंगीन अथंगुडी फ़र्श टाइलें हैं।','ವ್ಯಾಪಾರಿ ಕುಟುಂಬಗಳು ಕಟ್ಟಿದ ಭವ್ಯ ಹಳೆಯ ಮಹಲುಗಳ ಹಳ್ಳಿಗಳು; ಕಂಬಗಳ ಸಭಾಂಗಣ, ದೊಡ್ಡ ಅಂಗಳ, ಕೈಯಿಂದ ಮಾಡಿದ ಬಣ್ಣಬಣ್ಣದ ಅತ್ತಂಗುಡಿ ನೆಲದ ಹಾಸುಗಲ್ಲುಗಳು.'],
['🪨','Tiruchirappalli · Rockfort','तिरुचिरापल्ली · रॉकफ़ोर्ट','ತಿರುಚಿರಾಪಳ್ಳಿ · ರಾಕ್‌ಫೋರ್ಟ್','A temple sits on top of a giant ancient rock in the middle of the city. Visitors climb more than 400 steps cut into the rock for a view over the Kaveri river.','शहर के बीच एक विशाल प्राचीन चट्टान की चोटी पर मंदिर है। लोग चट्टान में कटी 400 से ज़्यादा सीढ़ियाँ चढ़कर कावेरी नदी का नज़ारा देखते हैं।','ನಗರದ ನಡುವಿನ ದೈತ್ಯ ಪುರಾತನ ಬಂಡೆಯ ತುದಿಯಲ್ಲಿ ದೇವಾಲಯವಿದೆ. ಬಂಡೆಯಲ್ಲಿ ಕೆತ್ತಿದ 400ಕ್ಕೂ ಹೆಚ್ಚು ಮೆಟ್ಟಿಲು ಹತ್ತಿದರೆ ಕಾವೇರಿ ನದಿ ಕಾಣುತ್ತದೆ.'],
['🏯','Thanjavur · Big Temple','तंजावुर · बड़ा मंदिर','ತಂಜಾವೂರು · ಬೃಹದೀಶ್ವರ ದೇವಾಲಯ','King Rajaraja Chola I completed this granite temple in 1010. Its tower rises about 66 metres, and a single huge stone sits on its top.','राजा राजराज चोल प्रथम ने यह ग्रेनाइट मंदिर 1010 में पूरा किया। इसका शिखर लगभग 66 मीटर ऊँचा है, और इसकी चोटी पर एक ही विशाल पत्थर रखा है।','ರಾಜರಾಜ ಚೋಳ I ಈ ಗ್ರಾನೈಟ್ ದೇವಾಲಯವನ್ನು 1010ರಲ್ಲಿ ಪೂರ್ಣಗೊಳಿಸಿದ. ಇದರ ಶಿಖರ ಸುಮಾರು 66 ಮೀಟರ್ ಎತ್ತರ, ತುದಿಯಲ್ಲಿ ಒಂದೇ ದೈತ್ಯ ಕಲ್ಲು ಕುಳಿತಿದೆ.'],
['🔥','Chidambaram · Nataraja','चिदंबरम · नटराज','ಚಿದಂಬರಂ · ನಟರಾಜ','This temple honours Shiva as Nataraja, the cosmic dancer. Its gateway towers are carved with 108 dance poses, and its inner shrine has a golden roof.','यह मंदिर शिव के नटराज रूप, ब्रह्मांडीय नर्तक, को समर्पित है। इसके द्वार-गोपुरम पर नृत्य की 108 मुद्राएँ खुदी हैं, और भीतरी गर्भगृह की छत सोने की है।','ಈ ದೇವಾಲಯ ಶಿವನ ನಟರಾಜ ರೂಪಕ್ಕೆ ಮೀಸಲು. ಇದರ ಗೋಪುರಗಳಲ್ಲಿ ನೃತ್ಯದ 108 ಭಂಗಿಗಳ ಕೆತ್ತನೆಯಿದೆ, ಒಳಗಿನ ಗರ್ಭಗುಡಿಯ ಛಾವಣಿ ಚಿನ್ನದ್ದು.'],
['🧵','Kanchipuram','कांचीपुरम','ಕಾಂಚೀಪುರಂ','Called the city of a thousand temples, it is also famous for its rich silk saris, woven on handlooms with gold thread borders.','इसे हज़ार मंदिरों का शहर कहते हैं, और यह हथकरघे पर बुनी, सुनहरे धागे के किनारे वाली भारी रेशमी साड़ियों के लिए भी मशहूर है।','ಸಾವಿರ ದೇವಾಲಯಗಳ ನಗರ ಎನ್ನುತ್ತಾರೆ; ಕೈಮಗ್ಗದಲ್ಲಿ ನೇಯ್ದ, ಚಿನ್ನದ ಎಳೆಯ ಅಂಚಿನ ಭಾರಿ ರೇಷ್ಮೆ ಸೀರೆಗಳಿಗೂ ಹೆಸರುವಾಸಿ.'],
['🗿','Mahabalipuram','महाबलीपुरम','ಮಹಾಬಲಿಪುರಂ','Pallava kings had temples carved from rock here about 1,300 years ago, including the Shore Temple by the sea and a giant stone carving called Arjuna\'s Penance.','लगभग 1,300 साल पहले पल्लव राजाओं ने यहाँ चट्टानों से मंदिर तराशवाए, जिनमें समुद्र किनारे का शोर मंदिर और अर्जुन की तपस्या नाम की विशाल पत्थर नक्काशी शामिल है।','ಸುಮಾರು 1,300 ವರ್ಷಗಳ ಹಿಂದೆ ಪಲ್ಲವ ರಾಜರು ಇಲ್ಲಿ ಬಂಡೆಗಳಲ್ಲಿ ದೇವಾಲಯ ಕೆತ್ತಿಸಿದರು; ಕಡಲತೀರದ ತೀರ ದೇವಾಲಯ ಮತ್ತು ಅರ್ಜುನನ ತಪಸ್ಸು ಎಂಬ ದೈತ್ಯ ಶಿಲ್ಪ ಸೇರಿ.'],
['🏖️','Chennai · Marina Beach','चेन्नई · मरीना बीच','ಚೆನ್ನೈ · ಮರೀನಾ ಕಡಲತೀರ','The capital\'s long sandy beach stretches for kilometres along the Bay of Bengal. In the evening families come to fly kites, eat roasted corn and paddle in the waves.','राजधानी का लंबा रेतीला तट बंगाल की खाड़ी के साथ किलोमीटरों तक फैला है। शाम को परिवार पतंग उड़ाने, भुना भुट्टा खाने और लहरों में पैर भिगोने आते हैं।','ರಾಜಧಾನಿಯ ಉದ್ದದ ಮರಳು ತೀರ ಬಂಗಾಳಕೊಲ್ಲಿಯುದ್ದಕ್ಕೂ ಕಿಲೋಮೀಟರ್‌ಗಟ್ಟಲೆ ಹರಡಿದೆ. ಸಂಜೆ ಕುಟುಂಬಗಳು ಗಾಳಿಪಟ ಹಾರಿಸಲು, ಸುಟ್ಟ ಜೋಳ ತಿನ್ನಲು, ಅಲೆಗಳಲ್ಲಿ ಕಾಲಾಡಿಸಲು ಬರುತ್ತಾರೆ.']
],
 py:[
['🛶','Kalapet','कालापेट','ಕಾಳಾಪೇಟ್','A fishing village beach north of the city. Fishers here still go to sea on kattumaram rafts made of tied logs, and the English word catamaran comes from this Tamil name.','शहर के उत्तर में मछुआरों के गाँव का तट। यहाँ के मछुआरे आज भी बँधे लट्ठों से बने कट्टुमरम बेड़ों पर समुद्र में जाते हैं, और अंग्रेज़ी शब्द कैटामरन इसी तमिल नाम से आया है।','ನಗರದ ಉತ್ತರಕ್ಕಿರುವ ಬೆಸ್ತರ ಹಳ್ಳಿಯ ಕಡಲತೀರ. ಇಲ್ಲಿನ ಬೆಸ್ತರು ಇಂದಿಗೂ ಮರದ ದಿಮ್ಮಿಗಳನ್ನು ಕಟ್ಟಿ ಮಾಡಿದ ಕಟ್ಟುಮರ ತೆಪ್ಪದಲ್ಲಿ ಸಮುದ್ರಕ್ಕೆ ಹೋಗುತ್ತಾರೆ; ಇಂಗ್ಲಿಷ್‌ನ ಕ್ಯಾಟಮರಾನ್ ಪದ ಈ ತಮಿಳು ಹೆಸರಿನಿಂದಲೇ ಬಂತು.'],
['🗼','White Town · Promenade','व्हाइट टाउन · समुद्र तट सैरगाह','ವೈಟ್ ಟೌನ್ · ಕಡಲತೀರದ ವಿಹಾರ ಪಥ','The old French quarter has neat straight streets of yellow and white houses. On the seaside promenade stands the old lighthouse, first lit in 1836.','पुराने फ़्रांसीसी मोहल्ले में पीले और सफ़ेद घरों की सीधी सुघड़ गलियाँ हैं। समुद्र किनारे की सैरगाह पर पुराना लाइटहाउस खड़ा है, जो पहली बार 1836 में जला था।','ಹಳೆಯ ಫ್ರೆಂಚ್ ಬಡಾವಣೆಯಲ್ಲಿ ಹಳದಿ-ಬಿಳಿ ಮನೆಗಳ ಅಚ್ಚುಕಟ್ಟಾದ ನೇರ ಬೀದಿಗಳಿವೆ. ಕಡಲತೀರದ ವಿಹಾರ ಪಥದಲ್ಲಿ 1836ರಲ್ಲಿ ಮೊದಲ ಬಾರಿ ಬೆಳಗಿದ ಹಳೆಯ ದೀಪಸ್ತಂಭ ನಿಂತಿದೆ.'],
['🏖️','Paradise Beach','पैराडाइज़ बीच','ಪ್ಯಾರಡೈಸ್ ಕಡಲತೀರ','A golden sand beach you reach by boat from the Chunnambar boat house, gliding through calm backwaters lined with mangroves.','सुनहरी रेत का तट, जहाँ चुन्नाम्बर बोट हाउस से नाव में मैंग्रोव से घिरे शांत बैकवॉटर से होकर पहुँचते हैं।','ಚುನ್ನಾಂಬರ್ ದೋಣಿಮನೆಯಿಂದ ಕಾಂಡ್ಲಾ ಕಾಡಿನ ನಡುವಿನ ಶಾಂತ ಹಿನ್ನೀರಿನಲ್ಲಿ ದೋಣಿಯಲ್ಲಿ ಸಾಗಿ ತಲುಪುವ ಹೊನ್ನಿನ ಮರಳಿನ ಕಡಲತೀರ.'],
['🏺','Arikamedu','अरिकमेडु','ಅರಿಕಮೇಡು','More than 2,000 years ago this riverside spot was a busy port that traded with Rome. Archaeologists have found pieces of Roman wine jars, beads and pottery here.','2,000 से भी ज़्यादा साल पहले नदी किनारे की यह जगह रोम से व्यापार करने वाला व्यस्त बंदरगाह थी। पुरातत्वविदों को यहाँ रोमन शराब के मटकों के टुकड़े, मनके और बर्तन मिले हैं।','2,000 ವರ್ಷಗಳಿಗೂ ಹಿಂದೆ ನದಿಯ ದಡದ ಈ ಜಾಗ ರೋಮ್ ಜೊತೆ ವ್ಯಾಪಾರ ಮಾಡುತ್ತಿದ್ದ ಗದ್ದಲದ ಬಂದರಾಗಿತ್ತು. ಪುರಾತತ್ವಜ್ಞರಿಗೆ ಇಲ್ಲಿ ರೋಮನ್ ಹೂಜಿಗಳ ತುಣುಕುಗಳು, ಮಣಿಗಳು, ಮಡಕೆ ಸಿಕ್ಕಿವೆ.'],
['🦩','Ousteri Lake','ऊस्तेरी झील','ಊಸ್ಟೇರಿ ಕೆರೆ','A large lake on the border with Tamil Nadu where pelicans, herons, storks and many winter visitors come to feed among the reeds.','तमिलनाडु की सीमा पर एक बड़ी झील, जहाँ पेलिकन, बगुले, सारस और सर्दियों में आने वाले कई पक्षी नरकट के बीच भोजन ढूँढते हैं।','ತಮಿಳುನಾಡಿನ ಗಡಿಯಲ್ಲಿರುವ ದೊಡ್ಡ ಕೆರೆ; ಹೆಜ್ಜಾರ್ಲೆ, ಬಕ, ಕೊಕ್ಕರೆ ಮತ್ತು ಚಳಿಗಾಲದ ಅನೇಕ ವಲಸೆ ಹಕ್ಕಿಗಳು ಜೊಂಡಿನ ನಡುವೆ ಆಹಾರ ಹುಡುಕುತ್ತವೆ.'],

 {ty:100,la:16.23,lo:80.97,n:['Kuchipudi dance','कुचिपुड़ी नृत्य','ಕೂಚಿಪುಡಿ ನೃತ್ಯ'],f:['Kuchipudi dance is named after Kuchipudi village in Krishna district. Dancers sometimes dance standing on the rim of a brass plate!','कुचिपुड़ी नृत्य का नाम कृष्णा ज़िले के कुचिपुड़ी गाँव से आया है। नर्तक कभी-कभी पीतल की थाली के किनारे पर खड़े होकर नाचते हैं!','ಕೂಚಿಪುಡಿ ನೃತ್ಯಕ್ಕೆ ಕೃಷ್ಣಾ ಜಿಲ್ಲೆಯ ಕೂಚಿಪುಡಿ ಹಳ್ಳಿಯ ಹೆಸರು ಬಂದಿದೆ. ನರ್ತಕರು ಕೆಲವೊಮ್ಮೆ ಹಿತ್ತಾಳೆ ತಟ್ಟೆಯ ಅಂಚಿನ ಮೇಲೆ ನಿಂತು ಕುಣಿಯುತ್ತಾರೆ!']},
 {ty:101,la:16.575,lo:80.358,n:['Amaravati Stupa','अमरावती स्तूप','ಅಮರಾವತಿ ಸ್ತೂಪ'],f:["More than 2,000 years ago, the Great Stupa at Amaravati was covered in white stone carvings of the Buddha's life.",'2,000 साल से भी पहले अमरावती के महास्तूप पर बुद्ध के जीवन की सफ़ेद पत्थर की नक्काशियाँ बनी थीं।','ಎರಡು ಸಾವಿರ ವರ್ಷಗಳ ಹಿಂದೆಯೇ ಅಮರಾವತಿಯ ಮಹಾಸ್ತೂಪದ ಮೇಲೆ ಬುದ್ಧನ ಜೀವನದ ಕತೆಗಳನ್ನು ಬಿಳಿ ಕಲ್ಲಿನಲ್ಲಿ ಕೆತ್ತಿದ್ದರು.']},
 {ty:102,la:17.766,lo:83.25,n:['Simhachalam Temple','सिंहाचलम मंदिर','ಸಿಂಹಾಚಲಂ ದೇವಸ್ಥಾನ'],f:['On a hill near Visakhapatnam, the god of Simhachalam temple stays covered in sandalwood paste all year, except on one day, Chandanotsavam.','विशाखापत्तनम के पास पहाड़ी पर सिंहाचलम मंदिर के भगवान साल भर चंदन के लेप से ढके रहते हैं, बस चंदनोत्सवम के एक दिन को छोड़कर।','ವಿಶಾಖಪಟ್ಟಣದ ಬಳಿಯ ಬೆಟ್ಟದ ಮೇಲಿರುವ ಸಿಂಹಾಚಲಂ ದೇವಸ್ಥಾನದ ದೇವರು ವರ್ಷವಿಡೀ ಗಂಧದಿಂದ ಮುಚ್ಚಿರುತ್ತಾನೆ; ಚಂದನೋತ್ಸವದ ಒಂದು ದಿನ ಮಾತ್ರ ಪೂರ್ಣ ದರ್ಶನ.']},
 {ty:103,la:17.08,lo:82.33,n:['Handloom sarees','हथकरघा साड़ियाँ','ಕೈಮಗ್ಗದ ಸೀರೆಗಳು'],f:['Andhra weavers make Uppada silk, Mangalagiri cotton, Venkatagiri cotton, Dharmavaram silk and Ponduru khadi, all woven by hand on wooden looms.','आंध्र के बुनकर लकड़ी के हथकरघे पर उप्पाडा रेशम, मंगलगिरि सूती, वेंकटगिरि सूती, धर्मावरम रेशम और पोंडुरु खादी बुनते हैं।','ಆಂಧ್ರದ ನೇಕಾರರು ಮರದ ಕೈಮಗ್ಗಗಳಲ್ಲಿ ಉಪ್ಪಾಡ ರೇಷ್ಮೆ, ಮಂಗಳಗಿರಿ ಹತ್ತಿ, ವೆಂಕಟಗಿರಿ ಹತ್ತಿ, ಧರ್ಮಾವರಂ ರೇಷ್ಮೆ ಮತ್ತು ಪೊಂದೂರು ಖಾದಿ ನೇಯುತ್ತಾರೆ.']},
 {ty:104,la:15.5,lo:79.9,n:['Burrakatha storyteller','बुर्रकथा कथाकार','ಬುರ್ರಕಥೆ ಕಥೆಗಾರ'],f:['In Burrakatha, one storyteller sings the tale with a tambura while two friends play drums and crack jokes.','बुर्रकथा में एक कथाकार तंबूरा लेकर गाते हुए कहानी सुनाता है, और दो साथी ढोल बजाकर चुटकुले सुनाते हैं।','ಬುರ್ರಕಥೆಯಲ್ಲಿ ಕಥೆಗಾರನು ತಂಬೂರಿ ಹಿಡಿದು ಹಾಡುತ್ತಾ ಕತೆ ಹೇಳುತ್ತಾನೆ; ಜೊತೆಗಿನ ಇಬ್ಬರು ಡೋಲು ಬಾರಿಸುತ್ತಾ ತಮಾಷೆ ಮಾಡುತ್ತಾರೆ.']},
 {ty:105,la:18.11,lo:83.4,n:['Garagalu pot dance','गरगलु घड़ा नृत्य','ಗರಗಲು ಕೊಡ ನೃತ್ಯ'],f:['In the Garagalu dance, dancers balance decorated pots on their heads while dancing at village festivals.','गरगलु नृत्य में नर्तक गाँव के उत्सवों में सिर पर सजे हुए घड़े संभालकर नाचते हैं।','ಗರಗಲು ನೃತ್ಯದಲ್ಲಿ ಹಳ್ಳಿ ಜಾತ್ರೆಗಳಲ್ಲಿ ತಲೆಯ ಮೇಲೆ ಅಲಂಕರಿಸಿದ ಕೊಡಗಳನ್ನು ಇಟ್ಟುಕೊಂಡು ಕುಣಿಯುತ್ತಾರೆ.']},
 {ty:106,la:16.52,lo:79.24,n:['Nagarjunakonda','नागार्जुनकोंडा','ನಾಗಾರ್ಜುನಕೊಂಡ'],f:['Nagarjunakonda was a great Buddhist city. When the Nagarjuna Sagar dam was built, its old stupas were moved to an island in the lake, where a museum keeps them.','नागार्जुनकोंडा एक बड़ा बौद्ध नगर था। नागार्जुन सागर बाँध बनने पर इसके पुराने स्तूप झील के एक टापू पर ले जाए गए, जहाँ आज संग्रहालय है।','ನಾಗಾರ್ಜುನಕೊಂಡ ಒಂದು ದೊಡ್ಡ ಬೌದ್ಧ ನಗರವಾಗಿತ್ತು. ನಾಗಾರ್ಜುನ ಸಾಗರ ಅಣೆಕಟ್ಟು ಕಟ್ಟಿದಾಗ ಅದರ ಹಳೆಯ ಸ್ತೂಪಗಳನ್ನು ಸರೋವರದ ನಡುವಿನ ದ್ವೀಪಕ್ಕೆ ಸ್ಥಳಾಂತರಿಸಿದರು; ಅಲ್ಲಿ ಈಗ ವಸ್ತುಸಂಗ್ರಹಾಲಯವಿದೆ.']},
 {ty:107,la:18.1,lo:83.42,n:['Harikatha storyteller','हरिकथा कथावाचक','ಹರಿಕಥೆ ದಾಸರು'],f:['In Harikatha, one storyteller tells stories from the Ramayana and Mahabharata with songs, jokes and a little dance. Adibhatla Narayana Dasu of Vizianagaram made it famous in Telugu.','हरिकथा में एक कथावाचक गीत, चुटकुलों और थोड़े नृत्य के साथ रामायण-महाभारत की कहानियाँ सुनाता है। विजयनगरम के आदिभट्ल नारायण दास ने इसे तेलुगु में प्रसिद्ध किया।','ಹರಿಕಥೆಯಲ್ಲಿ ದಾಸರು ಹಾಡು, ತಮಾಷೆ ಮತ್ತು ಸ್ವಲ್ಪ ಕುಣಿತದೊಂದಿಗೆ ರಾಮಾಯಣ, ಮಹಾಭಾರತದ ಕತೆಗಳನ್ನು ಹೇಳುತ್ತಾರೆ. ವಿಜಯನಗರದ ಆದಿಭಟ್ಲ ನಾರಾಯಣದಾಸರು ತೆಲುಗಿನಲ್ಲಿ ಇದನ್ನು ಪ್ರಸಿದ್ಧಗೊಳಿಸಿದರು.']}],
