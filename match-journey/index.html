   ["The Thanjavur dancing doll has a heavy round bottom, so it never falls over. Touch it and its head and body keep nodding and swaying for a long time.", "तंजावुर की नाचती गुड़िया का निचला हिस्सा भारी और गोल होता है, इसलिए यह कभी नहीं गिरती। छूते ही इसका सिर और शरीर देर तक हिलते-डुलते रहते हैं।", "ತಲೆಯಾಡಿಸುವ ತಂಜಾವೂರು ಗೊಂಬೆಯ ತಳ ಭಾರವಾಗಿ ದುಂಡಗಿರುತ್ತದೆ, ಹಾಗಾಗಿ ಅದು ಎಂದೂ ಬೀಳುವುದಿಲ್ಲ. ಮುಟ್ಟಿದರೆ ಅದರ ತಲೆ, ಮೈ ಬಹಳ ಹೊತ್ತು ತೂಗಾಡುತ್ತಲೇ ಇರುತ್ತದೆ."],
   ["South Indian filter coffee is made with a slow-dripping metal filter, then poured from high up between a tumbler and a bowl called a dabara to make it frothy.", "दक्षिण भारतीय फ़िल्टर कॉफ़ी धीरे-धीरे टपकने वाले धातु के फ़िल्टर से बनती है, फिर झाग के लिए गिलास और 'डबरा' नाम की कटोरी के बीच ऊँचाई से उड़ेली जाती है।", "ದಕ್ಷಿಣ ಭಾರತದ ಕಾಫಿಗೆ ನಿಧಾನವಾಗಿ ಸೋರುವ ಲೋಹದ ಸೋಸುಪಾತ್ರೆಯಲ್ಲಿ ಕಷಾಯ ಇಳಿಸಿ, ಹಾಲು ಬೆರೆಸಿ, ನೊರೆ ಬರಲೆಂದು ಲೋಟ ಮತ್ತು 'ಡಬರಾ' ಬಟ್ಟಲಿನ ನಡುವೆ ಎತ್ತರದಿಂದ ಸುರಿಯುತ್ತಾರೆ."],
   ["Madurai jasmine is famous for its strong sweet smell and has its own GI tag. Strings of it are woven into braids and offered at temples every day.", "मदुरै चमेली अपनी तेज़ मीठी ख़ुशबू के लिए मशहूर है और इसे अपना जीआई टैग मिला है। इसकी लड़ियाँ रोज़ चोटियों में गूँथी जाती हैं और मंदिरों में चढ़ाई जाती हैं।", "ಮಧುರೈ ಮಲ್ಲಿಗೆ ತನ್ನ ಗಾಢ ಸಿಹಿ ಪರಿಮಳಕ್ಕೆ ಹೆಸರುವಾಸಿ, ಅದಕ್ಕೆ ತನ್ನದೇ ಜಿಐ ಗುರುತಿದೆ. ಇದರ ದಂಡೆಯನ್ನು ಪ್ರತಿದಿನ ಜಡೆಗೆ ಮುಡಿಯುತ್ತಾರೆ, ದೇವಾಲಯಗಳಿಗೆ ಅರ್ಪಿಸುತ್ತಾರೆ."],
   ["On festival days the temple deity is taken around the streets on a huge wooden chariot, and hundreds of people pull it with thick ropes.", "उत्सव के दिनों में मंदिर के देवता को विशाल लकड़ी के रथ पर गलियों में घुमाया जाता है, और सैकड़ों लोग मोटी रस्सियों से उसे खींचते हैं।", "ಹಬ್ಬದ ದಿನಗಳಲ್ಲಿ ದೇವರನ್ನು ದೊಡ್ಡ ಮರದ ರಥದಲ್ಲಿ ಬೀದಿಗಳಲ್ಲಿ ಮೆರವಣಿಗೆ ಮಾಡುತ್ತಾರೆ; ನೂರಾರು ಜನ ದಪ್ಪ ಹಗ್ಗಗಳಿಂದ ರಥ ಎಳೆಯುತ್ತಾರೆ."],
   ["In glass painting, the artist paints on the back of a glass sheet in reverse order, adding the outlines first and the background last.", "काँच पर चित्रकारी में कलाकार काँच की पिछली तरफ़ उल्टे क्रम में रंग भरता है, पहले बाहरी रेखाएँ और सबसे आख़िर में पृष्ठभूमि।", "ಗಾಜಿನ ಮೇಲಿನ ಚಿತ್ರದಲ್ಲಿ ಕಲಾವಿದ ಗಾಜಿನ ಹಿಂಬದಿಯಲ್ಲಿ ತಿರುವು ಮುರುವಾದ ಕ್ರಮದಲ್ಲಿ ಬಣ್ಣ ಹಚ್ಚುತ್ತಾನೆ; ಮೊದಲು ಹೊರಗೆರೆ, ಕೊನೆಯಲ್ಲಿ ಹಿನ್ನೆಲೆ."],
   ["Kuchipudi comes from Andhra Pradesh. Its dancers sometimes dance on the rim of a brass plate, balancing a pot of water on their heads!", "कुचिपुड़ी आंध्र प्रदेश का नृत्य है। इसके नर्तक कभी-कभी सिर पर पानी का घड़ा सँभालते हुए पीतल की थाली के किनारे पर नाचते हैं!", "ಕೂಚಿಪುಡಿ ಆಂಧ್ರಪ್ರದೇಶದ ನೃತ್ಯ. ಅದರ ನರ್ತಕರು ಕೆಲವೊಮ್ಮೆ ತಲೆಯ ಮೇಲೆ ನೀರಿನ ಕೊಡ ಸಮತೋಲನ ಮಾಡುತ್ತಾ ಹಿತ್ತಾಳೆ ತಟ್ಟೆಯ ಅಂಚಿನ ಮೇಲೆ ಕುಣಿಯುತ್ತಾರೆ!"],
   ["Water stored in a clay pot stays cool even on hot days, because a little water seeps through the clay and dries off the outside.", "मिट्टी के घड़े में रखा पानी गर्म दिनों में भी ठंडा रहता है, क्योंकि थोड़ा पानी मिट्टी से रिसकर बाहर सूखता रहता है।", "ಮಣ್ಣಿನ ಕೊಡದಲ್ಲಿಟ್ಟ ನೀರು ಬಿಸಿಲಿನ ದಿನಗಳಲ್ಲೂ ತಣ್ಣಗಿರುತ್ತದೆ; ಸ್ವಲ್ಪ ನೀರು ಮಣ್ಣಿನ ಮೂಲಕ ಜಿನುಗಿ ಹೊರಗೆ ಆರುತ್ತಿರುತ್ತದೆ."],
   ["A flower kolam is made with petals instead of rice flour. At festivals, families fill bright rings of marigold, rose and chrysanthemum petals.", "फूलों का कोलम चावल के आटे की जगह पंखुड़ियों से बनता है। त्योहारों पर परिवार गेंदा, गुलाब और गुलदाउदी की पंखुड़ियों से चटकीले घेरे भरते हैं।", "ಹೂವಿನ ರಂಗೋಲಿಯನ್ನು ಅಕ್ಕಿಹಿಟ್ಟಿನ ಬದಲು ಹೂದಳಗಳಿಂದ ಹಾಕುತ್ತಾರೆ. ಹಬ್ಬಗಳಲ್ಲಿ ಮನೆಯವರು ಚೆಂಡು ಹೂ, ಗುಲಾಬಿ, ಸೇವಂತಿಗೆ ದಳಗಳಿಂದ ಢಾಳ ಬಣ್ಣದ ಸುತ್ತುಗಳನ್ನು ತುಂಬುತ್ತಾರೆ."],
   ["Every part of the banana plant is used in Tamil Nadu: the fruit, the flower as a vegetable, and the big leaves as plates for festival meals.", "तमिलनाडु में केले के पौधे का हर हिस्सा काम आता है: फल, सब्ज़ी के रूप में फूल, और त्योहार के भोजन के लिए थाली बनते बड़े पत्ते।", "ತಮಿಳುನಾಡಿನಲ್ಲಿ ಬಾಳೆ ಗಿಡದ ಪ್ರತಿ ಭಾಗವೂ ಉಪಯೋಗಕ್ಕೆ ಬರುತ್ತದೆ: ಹಣ್ಣು, ಪಲ್ಯಕ್ಕೆ ಬಾಳೆಹೂವು, ಹಬ್ಬದೂಟಕ್ಕೆ ತಟ್ಟೆಯಾಗುವ ದೊಡ್ಡ ಎಲೆಗಳು."],
   ["On Mattu Pongal, the day after Pongal, farmers wash their bulls, paint their horns in bright colours and decorate their carts to thank them for their work.", "पोंगल के अगले दिन मट्टू पोंगल पर किसान अपने बैलों को नहलाते हैं, उनके सींग चटक रंगों से रंगते हैं और उनकी मेहनत के लिए धन्यवाद देते हुए गाड़ियाँ सजाते हैं।", "ಪೊಂಗಲ್‌ನ ಮರುದಿನ ಮಾಟ್ಟು ಪೊಂಗಲ್‌ನಲ್ಲಿ ರೈತರು ಎತ್ತುಗಳನ್ನು ತೊಳೆದು, ಕೊಂಬುಗಳಿಗೆ ಗಾಢ ಬಣ್ಣ ಹಚ್ಚಿ, ಅವುಗಳ ದುಡಿಮೆಗೆ ಕೃತಜ್ಞತೆಯಾಗಿ ಗಾಡಿಗಳನ್ನು ಸಿಂಗರಿಸುತ್ತಾರೆ."],
   ["The violin came to India from Europe about 200 years ago and became a key instrument in Carnatic music. Carnatic violinists play it sitting cross-legged, resting it on the chest and foot.", "वायलिन लगभग 200 साल पहले यूरोप से भारत आया और कर्नाटक संगीत का अहम वाद्य बन गया। कर्नाटक वायलिन वादक पालथी मारकर बैठते हैं और इसे सीने और पैर के बीच टिकाकर बजाते हैं।", "ಪಿಟೀಲು ಸುಮಾರು 200 ವರ್ಷಗಳ ಹಿಂದೆ ಯುರೋಪಿನಿಂದ ಭಾರತಕ್ಕೆ ಬಂದು ಕರ್ನಾಟಕ ಸಂಗೀತದ ಮುಖ್ಯ ವಾದ್ಯವಾಯಿತು. ಕರ್ನಾಟಕ ಪಿಟೀಲು ವಾದಕರು ಚಕ್ಕಳ ಮಕ್ಕಳ ಹಾಕಿ ಕುಳಿತು, ಅದನ್ನು ಎದೆ ಮತ್ತು ಪಾದದ ನಡುವೆ ಆನಿಸಿ ನುಡಿಸುತ್ತಾರೆ."],
   ["Chettinad cotton saris have bold checks and stripes in bright colours. They are light and cool to wear in the hot weather.", "चेट्टिनाड की सूती साड़ियों में चटक रंगों के बड़े चेक और धारियाँ होती हैं। गर्म मौसम में ये हल्की और ठंडी रहती हैं।", "ಚೆಟ್ಟಿನಾಡ್ ಹತ್ತಿ ಸೀರೆಗಳಲ್ಲಿ ಗಾಢ ಬಣ್ಣದ ದೊಡ್ಡ ಚೌಕಳಿ, ಪಟ್ಟೆಗಳಿರುತ್ತವೆ. ಬಿಸಿಲಿನಲ್ಲಿ ಉಡಲು ಇವು ಹಗುರ, ತಂಪು."],
   ["Marapachi dolls are a pair of wooden dolls, a boy and a girl, often given to brides and dressed up for the Navaratri golu display.", "मरप्पाची गुड़ियाँ लकड़ी की गुड़ियों की जोड़ी होती हैं, एक लड़का और एक लड़की, जो अक्सर दुल्हनों को दी जाती हैं और नवरात्रि के गोलू में सजाई जाती हैं।", "ಮರಪಾಚಿ ಗೊಂಬೆಗಳು ಮರದ ಗಂಡು-ಹೆಣ್ಣು ಗೊಂಬೆಗಳ ಜೋಡಿ; ಹೆಚ್ಚಾಗಿ ಮದುಮಗಳಿಗೆ ಕೊಡುತ್ತಾರೆ, ನವರಾತ್ರಿಯ ಬೊಂಬೆ ಹಬ್ಬದಲ್ಲಿ ಸಿಂಗರಿಸಿ ಇಡುತ್ತಾರೆ."],
   ["At roadside tea stalls, tea is poured from one cup to another from high up, making it frothy and cool enough to drink.", "सड़क किनारे की चाय की दुकानों पर चाय को ऊँचाई से एक प्याले से दूसरे में उड़ेला जाता है, जिससे वह झागदार और पीने लायक ठंडी हो जाती है।", "ರಸ್ತೆ ಬದಿಯ ಚಹಾ ಅಂಗಡಿಗಳಲ್ಲಿ ಚಹಾವನ್ನು ಒಂದು ಲೋಟದಿಂದ ಇನ್ನೊಂದಕ್ಕೆ ಎತ್ತರದಿಂದ ಸುರಿಯುತ್ತಾರೆ; ನೊರೆ ಬಂದು ಕುಡಿಯುವಷ್ಟು ತಣಿಯುತ್ತದೆ."],
   ["Bright orange kanakambaram flowers are strung together with jasmine into colourful hair garlands.", "चटक नारंगी कनकाम्बरम फूलों को चमेली के साथ पिरोकर रंगीन बालों की मालाएँ बनाई जाती हैं।", "ಗಾಢ ಕೇಸರಿ ಕನಕಾಂಬರ ಹೂವುಗಳನ್ನು ಮಲ್ಲಿಗೆಯ ಜೊತೆ ಕಟ್ಟಿ ಬಣ್ಣದ ಹೂದಂಡೆ ಮಾಡುತ್ತಾರೆ."],
   ["The Shore Temple at Mahabalipuram has stood beside the waves for about 1,300 years. It is one of the oldest stone temples in South India.", "महाबलीपुरम का शोर मंदिर लगभग 1,300 सालों से लहरों के किनारे खड़ा है। यह दक्षिण भारत के सबसे पुराने पत्थर के मंदिरों में से एक है।", "ಮಹಾಬಲಿಪುರಂನ ತೀರ ದೇವಾಲಯ ಸುಮಾರು 1,300 ವರ್ಷಗಳಿಂದ ಅಲೆಗಳ ಪಕ್ಕದಲ್ಲೇ ನಿಂತಿದೆ. ದಕ್ಷಿಣ ಭಾರತದ ಅತಿ ಹಳೆಯ ಕಲ್ಲಿನ ದೇವಾಲಯಗಳಲ್ಲಿ ಇದೂ ಒಂದು."],
   ["Arjuna's Penance is a giant carving on two huge boulders, crowded with gods, people, elephants and even a cat pretending to pray.", "अर्जुन की तपस्या दो विशाल चट्टानों पर बनी बड़ी नक्काशी है, जिसमें देवता, लोग, हाथी और प्रार्थना का नाटक करती एक बिल्ली तक है।", "ಅರ್ಜುನನ ತಪಸ್ಸು ಎರಡು ದೈತ್ಯ ಬಂಡೆಗಳ ಮೇಲಿನ ಬೃಹತ್ ಕೆತ್ತನೆ; ದೇವರು, ಜನ, ಆನೆಗಳು, ತಪಸ್ಸಿನ ನಾಟಕ ಮಾಡುವ ಬೆಕ್ಕೂ ಅದರಲ್ಲಿದೆ."],
   ["The Five Rathas are temples shaped like chariots, each carved from one single piece of rock, along with a life-size stone elephant.", "पाँच रथ रथों के आकार के मंदिर हैं, जिनमें से हर एक चट्टान के एक ही टुकड़े से तराशा गया है; साथ में असली आकार का पत्थर का हाथी भी है।", "ಪಂಚ ರಥಗಳು ರಥದಾಕಾರದ ದೇವಾಲಯಗಳು; ಪ್ರತಿಯೊಂದನ್ನೂ ಒಂದೇ ಬಂಡೆಯಿಂದ ಕೆತ್ತಲಾಗಿದೆ, ಜೊತೆಗೆ ನಿಜಗಾತ್ರದ ಕಲ್ಲಿನ ಆನೆಯೂ ಇದೆ."],
   ["The Big Temple at Thanjavur has a huge stone Nandi bull, carved from a single rock, sitting and facing the shrine.", "तंजावुर के बड़े मंदिर में एक ही चट्टान से तराशा गया विशाल पत्थर का नंदी बैल गर्भगृह की ओर मुँह करके बैठा है।", "ತಂಜಾವೂರಿನ ಬೃಹದೀಶ್ವರ ದೇವಾಲಯದಲ್ಲಿ ಒಂದೇ ಬಂಡೆಯಿಂದ ಕೆತ್ತಿದ ದೈತ್ಯ ಕಲ್ಲಿನ ನಂದಿ ಗರ್ಭಗುಡಿಯತ್ತ ಮುಖ ಮಾಡಿ ಕುಳಿತಿದೆ."],
   ["Swami Vivekananda swam out to this rock in 1892 and meditated on it. A memorial was built on the rock in 1970.", "स्वामी विवेकानंद 1892 में तैरकर इस चट्टान तक पहुँचे और इस पर ध्यान किया। 1970 में चट्टान पर स्मारक बनाया गया।", "ಸ್ವಾಮಿ ವಿವೇಕಾನಂದರು 1892ರಲ್ಲಿ ಈಜಿಕೊಂಡು ಈ ಬಂಡೆ ತಲುಪಿ ಧ್ಯಾನ ಮಾಡಿದರು. 1970ರಲ್ಲಿ ಬಂಡೆಯ ಮೇಲೆ ಸ್ಮಾರಕ ಕಟ್ಟಲಾಯಿತು."],
   ["The Thiruvalluvar statue is 133 feet tall, one foot for each of the 133 chapters of the Thirukkural, his famous book of wise couplets.", "तिरुवल्लुवर की मूर्ति 133 फ़ुट ऊँची है, उनकी प्रसिद्ध नीति-ग्रंथ तिरुक्कुरल के 133 अध्यायों में से हर एक के लिए एक फ़ुट।", "ತಿರುವಳ್ಳುವರ್ ಪ್ರತಿಮೆ 133 ಅಡಿ ಎತ್ತರ; ಅವರ ಪ್ರಸಿದ್ಧ ನೀತಿಗ್ರಂಥ ತಿರುಕ್ಕುರಳ್‌ನ 133 ಅಧ್ಯಾಯಗಳಿಗೆ ಒಂದೊಂದು ಅಡಿ."],
   ["The old Pamban bridge of 1914 had two halves that opened upwards like a pair of hands to let boats through.", "1914 के पुराने पम्बन पुल के दो हिस्से थे जो नावों को रास्ता देने के लिए हाथों की तरह ऊपर खुलते थे।", "1914ರ ಹಳೆಯ ಪಾಂಬನ್ ಸೇತುವೆಯ ಎರಡು ಭಾಗಗಳು ದೋಣಿಗಳಿಗೆ ದಾರಿ ಕೊಡಲು ಜೋಡಿ ಕೈಗಳಂತೆ ಮೇಲಕ್ಕೆ ತೆರೆಯುತ್ತಿದ್ದವು."],
   ["The Nilgiri tahr is Tamil Nadu's state animal. October 7 is celebrated as Nilgiri Tahr Day in the state.", "नीलगिरि तहर तमिलनाडु का राज्य पशु है। राज्य में 7 अक्टूबर को नीलगिरि तहर दिवस मनाया जाता है।", "ನೀಲಗಿರಿ ತಾರ್ ತಮಿಳುನಾಡಿನ ರಾಜ್ಯ ಪ್ರಾಣಿ. ರಾಜ್ಯದಲ್ಲಿ ಅಕ್ಟೋಬರ್ 7ನ್ನು ನೀಲಗಿರಿ ತಾರ್ ದಿನವಾಗಿ ಆಚರಿಸುತ್ತಾರೆ."],
   ["The emerald dove is Tamil Nadu's state bird. It has shiny green wings and usually walks quietly on the forest floor looking for seeds.", "पन्ना कबूतर तमिलनाडु का राज्य पक्षी है। इसके पंख चमकीले हरे होते हैं और यह अक्सर जंगल की ज़मीन पर चुपचाप दाने ढूँढता चलता है।", "ಪಚ್ಚೆ ಪಾರಿವಾಳ ತಮಿಳುನಾಡಿನ ರಾಜ್ಯ ಪಕ್ಷಿ. ಇದರ ರೆಕ್ಕೆಗಳು ಹೊಳೆಯುವ ಹಸಿರು; ಹೆಚ್ಚಾಗಿ ಕಾಡಿನ ನೆಲದಲ್ಲಿ ಮೌನವಾಗಿ ಕಾಳು ಹುಡುಕುತ್ತಾ ನಡೆಯುತ್ತದೆ."],
   ["The gloriosa lily is Tamil Nadu's state flower. Its red and yellow petals curl backwards like little flames.", "कलिहारी (ग्लोरियोसा लिली) तमिलनाडु का राज्य पुष्प है। इसकी लाल-पीली पंखुड़ियाँ छोटी लपटों की तरह पीछे की ओर मुड़ी होती हैं।", "ಅಗ್ನಿಶಿಖೆ ಹೂವು ತಮಿಳುನಾಡಿನ ರಾಜ್ಯ ಪುಷ್ಪ. ಇದರ ಕೆಂಪು-ಹಳದಿ ದಳಗಳು ಪುಟ್ಟ ಜ್ವಾಲೆಗಳಂತೆ ಹಿಂದಕ್ಕೆ ಸುರುಳಿ ಸುತ್ತಿರುತ್ತವೆ."],
   ["Chettinad mansions were built with Burma teak pillars and Italian marble brought by trader families who did business across South-East Asia.", "चेट्टिनाड की हवेलियाँ बर्मा सागौन के खंभों और इतालवी संगमरमर से बनीं, जिन्हें दक्षिण-पूर्व एशिया में व्यापार करने वाले परिवार लाए थे।", "ಚೆಟ್ಟಿನಾಡ್ ಮಹಲುಗಳನ್ನು ಆಗ್ನೇಯ ಏಷ್ಯಾದಾದ್ಯಂತ ವ್ಯಾಪಾರ ಮಾಡುತ್ತಿದ್ದ ಕುಟುಂಬಗಳು ತಂದ ಬರ್ಮಾ ತೇಗದ ಕಂಬಗಳು, ಇಟಲಿಯ ಅಮೃತಶಿಲೆಯಿಂದ ಕಟ್ಟಿದರು."],
   ["A crispy dosa is made from a fermented batter of rice and urad dal, spread thin on a hot griddle.", "कुरकुरा डोसा चावल और उड़द दाल के ख़मीर उठे घोल से बनता है, जिसे गर्म तवे पर पतला फैलाया जाता है।", "ಗರಿಗರಿ ದೋಸೆಯನ್ನು ಹುದುಗಿಸಿದ ಅಕ್ಕಿ-ಉದ್ದಿನಬೇಳೆ ಹಿಟ್ಟನ್ನು ಬಿಸಿ ಕಾವಲಿಯ ಮೇಲೆ ತೆಳುವಾಗಿ ಹರಡಿ ಮಾಡುತ್ತಾರೆ."],
   ["Soft, fluffy idlis are steamed in round moulds and eaten with coconut chutney and sambar for breakfast.", "नरम, फूली इडलियाँ गोल साँचों में भाप से पकाई जाती हैं और नाश्ते में नारियल चटनी और सांबर के साथ खाई जाती हैं।", "ಮೆತ್ತನೆಯ, ಉಬ್ಬಿದ ಇಡ್ಲಿಗಳನ್ನು ದುಂಡು ತಟ್ಟೆಗಳಲ್ಲಿ ಆವಿಯಲ್ಲಿ ಬೇಯಿಸಿ, ತಿಂಡಿಗೆ ತೆಂಗಿನ ಚಟ್ನಿ, ಸಾಂಬಾರಿನ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Jigarthanda is Madurai's famous cold drink made with milk, almond gum, syrup and ice cream. Its name means cool heart.", "जिगरठंडा मदुरै का मशहूर ठंडा पेय है, जो दूध, बादाम गोंद, शरबत और आइसक्रीम से बनता है। इसके नाम का मतलब है ठंडा दिल।", "ಜಿಗರ್‌ಠಂಡಾ ಮಧುರೈನ ಪ್ರಸಿದ್ಧ ತಂಪು ಪಾನೀಯ; ಹಾಲು, ಬಾದಾಮಿ ಅಂಟು, ಪಾಕ, ಐಸ್‌ಕ್ರೀಂನಿಂದ ಮಾಡುತ್ತಾರೆ. ಹೆಸರಿನ ಅರ್ಥ ತಂಪಾದ ಹೃದಯ."],
   ["The mridangam is a two-headed barrel drum played with the fingers and palms. It is the main drum of Carnatic music concerts.", "मृदंगम दोनों ओर से बजने वाला ढोल है, जिसे उँगलियों और हथेलियों से बजाते हैं। यह कर्नाटक संगीत समारोहों का मुख्य ढोल है।", "ಮೃದಂಗ ಎರಡೂ ಕಡೆ ಮುಖವಿರುವ ಡೋಲು; ಬೆರಳು, ಅಂಗೈಗಳಿಂದ ಬಾರಿಸುತ್ತಾರೆ. ಕರ್ನಾಟಕ ಸಂಗೀತ ಕಛೇರಿಗಳ ಮುಖ್ಯ ತಾಳವಾದ್ಯ ಇದು."],
   ["The nadaswaram is a long wind instrument with a very loud sound. It is played at temple festivals and weddings, along with the thavil drum.", "नादस्वरम बहुत तेज़ आवाज़ वाला लंबा फूँक वाद्य है। इसे मंदिर उत्सवों और शादियों में तविल ढोल के साथ बजाया जाता है।", "ನಾದಸ್ವರ ತುಂಬಾ ಜೋರು ಸದ್ದಿನ ಉದ್ದವಾದ ಊದುವ ವಾದ್ಯ. ದೇವಾಲಯದ ಉತ್ಸವ, ಮದುವೆಗಳಲ್ಲಿ ತವಿಲ್ ಡೋಲಿನ ಜೊತೆ ನುಡಿಸುತ್ತಾರೆ."],
   ["In Karagattam, dancers balance a decorated pot on their heads while they dance, twirl and even bend down without dropping it.", "करगट्टम में नर्तक सिर पर सजा हुआ घड़ा सँभालते हुए नाचते, घूमते और झुकते भी हैं, बिना उसे गिराए।", "ಕರಗಾಟದಲ್ಲಿ ನರ್ತಕರು ತಲೆಯ ಮೇಲೆ ಅಲಂಕರಿಸಿದ ಕೊಡ ಸಮತೋಲನ ಮಾಡುತ್ತಾ ಕುಣಿಯುತ್ತಾರೆ, ಗಿರಕಿ ಹೊಡೆಯುತ್ತಾರೆ, ಬಾಗುತ್ತಲೂ ಇರುತ್ತಾರೆ; ಕೊಡ ಮಾತ್ರ ಬೀಳುವುದಿಲ್ಲ."],
   ["Silambam is an old Tamil martial art with a long bamboo staff, spun so fast around the body that it whistles through the air.", "सिलम्बम बाँस की लंबी लाठी वाली पुरानी तमिल युद्ध कला है, जिसमें लाठी शरीर के चारों ओर इतनी तेज़ घुमाई जाती है कि हवा में सीटी जैसी आवाज़ आती है।", "ಸಿಲಂಬಂ ಉದ್ದ ಬಿದಿರು ಕೋಲಿನ ಹಳೆಯ ತಮಿಳು ಸಮರಕಲೆ; ಕೋಲನ್ನು ಮೈಸುತ್ತ ಎಷ್ಟು ವೇಗವಾಗಿ ತಿರುಗಿಸುತ್ತಾರೆಂದರೆ ಗಾಳಿಯಲ್ಲಿ ಸಿಳ್ಳೆಯ ಸದ್ದು ಬರುತ್ತದೆ."],
   ["Thoothukudi is called the Pearl City. For centuries divers there brought up oysters with pearls from the Gulf of Mannar.", "थूथुकुडी को मोतियों का शहर कहते हैं। सदियों तक वहाँ के गोताखोर मन्नार की खाड़ी से मोतियों वाली सीपें निकालते रहे।", "ತೂತುಕುಡಿಯನ್ನು ಮುತ್ತಿನ ನಗರ ಎನ್ನುತ್ತಾರೆ. ಶತಮಾನಗಳ ಕಾಲ ಅಲ್ಲಿನ ಮುಳುಗುಗಾರರು ಮನ್ನಾರ್ ಕೊಲ್ಲಿಯಿಂದ ಮುತ್ತಿನ ಚಿಪ್ಪುಗಳನ್ನು ಮೇಲೆತ್ತುತ್ತಿದ್ದರು."],
   ["The Tamil yeoman is Tamil Nadu's state butterfly. Its orange wings have dark zigzag edges, and its Tamil name means Tamil warrior.", "तमिल योमन तमिलनाडु की राज्य तितली है। इसके नारंगी पंखों के किनारे गहरे टेढ़े-मेढ़े होते हैं, और इसके तमिल नाम का अर्थ है तमिल योद्धा।", "ತಮಿಳು ಯೋಮನ್ ತಮಿಳುನಾಡಿನ ರಾಜ್ಯ ಚಿಟ್ಟೆ. ಇದರ ಕಿತ್ತಳೆ ರೆಕ್ಕೆಗಳಿಗೆ ಗಾಢ ಅಂಕುಡೊಂಕು ಅಂಚು; ತಮಿಳು ಹೆಸರಿನ ಅರ್ಥ ತಮಿಳು ವೀರ."]],
  py:[["The houses of the old French quarter are painted mustard yellow, white or pink, with tall wooden shutters, high walls and courtyards hidden inside.", "पुराने फ़्रांसीसी मोहल्ले के घर सरसों जैसे पीले, सफ़ेद या गुलाबी रंगे होते हैं, जिनमें ऊँचे लकड़ी के झिलमिलीदार किवाड़, ऊँची दीवारें और भीतर छिपे आँगन होते हैं।", "ಹಳೆಯ ಫ್ರೆಂಚ್ ಬಡಾವಣೆಯ ಮನೆಗಳಿಗೆ ಸಾಸಿವೆ ಹಳದಿ, ಬಿಳಿ ಅಥವಾ ಗುಲಾಬಿ ಬಣ್ಣ; ಎತ್ತರದ ಮರದ ಕಿಟಕಿಬಾಗಿಲುಗಳು, ಎತ್ತರದ ಗೋಡೆ, ಒಳಗೆ ಅಡಗಿದ ಅಂಗಳಗಳು."],
   ["Puducherry's old lighthouse is about 29 metres tall and was first lit in 1836. A new lighthouse took over its job in 1979.", "पुडुचेरी का पुराना लाइटहाउस लगभग 29 मीटर ऊँचा है और पहली बार 1836 में जला था। 1979 में एक नए लाइटहाउस ने इसका काम सँभाल लिया।", "ಪುದುಚೇರಿಯ ಹಳೆಯ ದೀಪಸ್ತಂಭ ಸುಮಾರು 29 ಮೀಟರ್ ಎತ್ತರ; 1836ರಲ್ಲಿ ಮೊದಲ ಬಾರಿ ಬೆಳಗಿತು. 1979ರಲ್ಲಿ ಹೊಸ ದೀಪಸ್ತಂಭ ಅದರ ಕೆಲಸ ವಹಿಸಿಕೊಂಡಿತು."],
   ["Villianur potters make big terracotta horses offered to the village guardian god Ayyanar. Some are so large they are built in parts and fitted together.", "विल्लियनूर के कुम्हार गाँव के रक्षक देवता अय्यनार को चढ़ाए जाने वाले बड़े टेराकोटा घोड़े बनाते हैं। कुछ इतने बड़े होते हैं कि हिस्सों में बनाकर जोड़े जाते हैं।", "ವಿಲ್ಲಿಯನೂರಿನ ಕುಂಬಾರರು ಗ್ರಾಮದ ಕಾವಲು ದೈವ ಅಯ್ಯನಾರ್‌ಗೆ ಅರ್ಪಿಸುವ ದೊಡ್ಡ ಮಣ್ಣಿನ ಕುದುರೆಗಳನ್ನು ಮಾಡುತ್ತಾರೆ. ಕೆಲವು ಎಷ್ಟು ದೊಡ್ಡವೆಂದರೆ ಭಾಗಭಾಗವಾಗಿ ಮಾಡಿ ಜೋಡಿಸುತ್ತಾರೆ."],
   ["Bougainvillea climbs over walls and gates all across Puducherry. Its bright pink parts are not really petals but colourful leaves around tiny white flowers.", "बोगनवेलिया पूरे पुडुचेरी में दीवारों और फाटकों पर चढ़ी रहती है। इसके चटक गुलाबी हिस्से असल में पंखुड़ियाँ नहीं, बल्कि नन्हे सफ़ेद फूलों के चारों ओर रंगीन पत्तियाँ हैं।", "ಕಾಗದದ ಹೂವು ಪುದುಚೇರಿಯಾದ್ಯಂತ ಗೋಡೆ, ಗೇಟುಗಳ ಮೇಲೆ ಹಬ್ಬಿರುತ್ತದೆ. ಇದರ ಗಾಢ ಗುಲಾಬಿ ಭಾಗಗಳು ನಿಜವಾಗಿ ದಳಗಳಲ್ಲ, ಪುಟ್ಟ ಬಿಳಿ ಹೂವುಗಳ ಸುತ್ತಲಿನ ಬಣ್ಣದ ಎಲೆಗಳು."],
   ["French-style bakeries in Puducherry bake long, crusty baguettes and croissants every morning, a taste left behind from French times.", "पुडुचेरी की फ़्रांसीसी ढंग की बेकरियाँ हर सुबह लंबी कुरकुरी बैगेट और क्रोसां सेंकती हैं, जो फ़्रांसीसी ज़माने की छोड़ी हुई निशानी है।", "ಪುದುಚೇರಿಯ ಫ್ರೆಂಚ್ ಶೈಲಿಯ ಬೇಕರಿಗಳು ಪ್ರತಿ ಮುಂಜಾನೆ ಉದ್ದದ ಗರಿಗರಿ ಫ್ರೆಂಚ್ ರೊಟ್ಟಿ ಸುಡುತ್ತವೆ; ಫ್ರೆಂಚರ ಕಾಲದ ಉಳಿದ ರುಚಿ ಇದು."],
   ["A kattumaram is made of a few logs tied together with rope. The English word catamaran comes from this Tamil word, which means tied wood.", "कट्टुमरम कुछ लट्ठों को रस्सी से बाँधकर बनता है। अंग्रेज़ी शब्द कैटामरन इसी तमिल शब्द से आया है, जिसका अर्थ है बँधी लकड़ी।", "ಕಟ್ಟುಮರವನ್ನು ಕೆಲವು ದಿಮ್ಮಿಗಳನ್ನು ಹಗ್ಗದಿಂದ ಕಟ್ಟಿ ಮಾಡುತ್ತಾರೆ. ಇಂಗ್ಲಿಷ್‌ನ ಕ್ಯಾಟಮರಾನ್ ಪದ 'ಕಟ್ಟಿದ ಮರ' ಎಂಬರ್ಥದ ಈ ತಮಿಳು ಪದದಿಂದಲೇ ಬಂತು."],
   ["Puducherry police officers wear a round red cap called a kepi, a style that comes from the French police.", "पुडुचेरी के पुलिसकर्मी 'केपी' नाम की गोल लाल टोपी पहनते हैं, जिसकी शैली फ़्रांसीसी पुलिस से आई है।", "ಪುದುಚೇರಿಯ ಪೊಲೀಸರು 'ಕೆಪಿ' ಎಂಬ ದುಂಡನೆಯ ಕೆಂಪು ಟೊಪ್ಪಿ ಧರಿಸುತ್ತಾರೆ; ಈ ಶೈಲಿ ಫ್ರೆಂಚ್ ಪೊಲೀಸರಿಂದ ಬಂದದ್ದು."],
   ["The Basilica of the Sacred Heart of Jesus is a tall Gothic church with pointed arches and colourful stained-glass windows that glow when the sun shines through.", "सेक्रेड हार्ट ऑफ़ जीसस बेसिलिका नुकीले मेहराबों वाला ऊँचा गोथिक गिरजाघर है, जिसकी रंगीन काँच की खिड़कियाँ धूप पड़ने पर जगमगा उठती हैं।", "ಸೇಕ್ರೆಡ್ ಹಾರ್ಟ್ ಆಫ್ ಜೀಸಸ್ ಬೆಸಿಲಿಕಾ ಚೂಪು ಕಮಾನುಗಳ ಎತ್ತರದ ಗೋಥಿಕ್ ಇಗರ್ಜಿ; ಇದರ ಬಣ್ಣದ ಗಾಜಿನ ಕಿಟಕಿಗಳು ಬಿಸಿಲು ಬಿದ್ದಾಗ ಹೊಳೆಯುತ್ತವೆ."],
   ["An amphora is a tall Roman jar with two handles and a pointed bottom, used to carry wine and oil on ships. Broken pieces of them were found at Arikamedu.", "एम्फ़ोरा दो हत्थों और नुकीले तले वाला ऊँचा रोमन मटका है, जिसमें जहाज़ों पर शराब और तेल ले जाते थे। अरिकमेडु में इनके टूटे टुकड़े मिले हैं।", "ಆಂಫೊರಾ ಎರಡು ಹಿಡಿಗಳು, ಚೂಪು ತಳವಿರುವ ಎತ್ತರದ ರೋಮನ್ ಹೂಜಿ; ಹಡಗುಗಳಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ, ಎಣ್ಣೆ ಸಾಗಿಸಲು ಬಳಸುತ್ತಿದ್ದರು. ಅರಿಕಮೇಡುವಿನಲ್ಲಿ ಇವುಗಳ ಒಡೆದ ತುಣುಕುಗಳು ಸಿಕ್ಕಿವೆ."],
   ["The Karaikal Mango Festival remembers a story in which the saint Karaikal Ammaiyar gave a mango to a hungry visitor, and a second mango appeared by a miracle.", "कराईकल आम उत्सव उस कहानी की याद में है जिसमें संत कराईकल अम्मैयार ने एक भूखे अतिथि को आम दिया, और चमत्कार से दूसरा आम प्रकट हो गया।", "ಕಾರೈಕಲ್ ಮಾವಿನಹಣ್ಣಿನ ಹಬ್ಬ ಒಂದು ಕಥೆಯ ನೆನಪು: ಸಂತ ಕವಯಿತ್ರಿ ಕಾರೈಕಲ್ ಅಮ್ಮೈಯಾರ್ ಹಸಿದ ಅತಿಥಿಗೆ ಮಾವಿನಹಣ್ಣು ಕೊಟ್ಟರು, ಪವಾಡದಿಂದ ಇನ್ನೊಂದು ಹಣ್ಣು ಕಾಣಿಸಿಕೊಂಡಿತು."],
   ["Puducherry is known for handmade paper made from cotton rags. Petals, leaves and threads are often pressed into the sheets as decoration.", "पुडुचेरी कपड़े की कतरनों से बने हाथ के काग़ज़ के लिए जाना जाता है। सजावट के लिए अक्सर इसकी परतों में पंखुड़ियाँ, पत्तियाँ और धागे दबाए जाते हैं।", "ಪುದುಚೇರಿ ಹತ್ತಿ ಬಟ್ಟೆಯ ಚಿಂದಿಯಿಂದ ಮಾಡುವ ಕೈಕಾಗದಕ್ಕೆ ಹೆಸರುವಾಸಿ. ಅಲಂಕಾರಕ್ಕೆಂದು ಹೆಚ್ಚಾಗಿ ಹೂದಳ, ಎಲೆ, ದಾರಗಳನ್ನು ಹಾಳೆಗಳಲ್ಲಿ ಒತ್ತಿರುತ್ತಾರೆ."],
   ["Thirukannur papier-mâché dolls are made from paper pulp pressed into moulds, then dried and brightly painted. The craft got its GI tag in 2011.", "तिरुक्कनूर की कागज़ की लुगदी वाली गुड़ियाँ साँचों में लुगदी दबाकर बनती हैं, फिर सुखाकर चटक रंगों से रंगी जाती हैं। इस शिल्प को 2011 में जीआई टैग मिला।", "ತಿರುಕ್ಕನೂರಿನ ಕಾಗದದ ತಿರುಳಿನ ಗೊಂಬೆಗಳನ್ನು ತಿರುಳನ್ನು ಅಚ್ಚುಗಳಲ್ಲಿ ಒತ್ತಿ, ಒಣಗಿಸಿ, ಗಾಢ ಬಣ್ಣ ಹಚ್ಚಿ ಮಾಡುತ್ತಾರೆ. ಈ ಕರಕುಶಲಕ್ಕೆ 2011ರಲ್ಲಿ ಜಿಐ ಗುರುತು ಸಿಕ್ಕಿತು."],
   ["Many old Tamil homes have a thinnai, a raised stone platform at the front where neighbours sit and chat in the evening.", "कई पुराने तमिल घरों के आगे 'तिन्नई' होती है, पत्थर का ऊँचा चबूतरा, जहाँ शाम को पड़ोसी बैठकर बातें करते हैं।", "ಅನೇಕ ಹಳೆಯ ತಮಿಳು ಮನೆಗಳ ಮುಂದೆ 'ತಿಣ್ಣೈ' ಎಂಬ ಎತ್ತರದ ಕಲ್ಲಿನ ಜಗಲಿ ಇರುತ್ತದೆ; ಸಂಜೆ ನೆರೆಹೊರೆಯವರು ಅಲ್ಲಿ ಕುಳಿತು ಹರಟುತ್ತಾರೆ."],
   ["Puducherry's new lighthouse started working in 1979. Its light flashes twice every 15 seconds so ships know which lighthouse it is.", "पुडुचेरी का नया लाइटहाउस 1979 में शुरू हुआ। इसकी रोशनी हर 15 सेकंड में दो बार चमकती है ताकि जहाज़ पहचान सकें कि यह कौन सा लाइटहाउस है।", "ಪುದುಚೇರಿಯ ಹೊಸ ದೀಪಸ್ತಂಭ 1979ರಲ್ಲಿ ಕೆಲಸ ಶುರುಮಾಡಿತು. ಹಡಗುಗಳು ಗುರುತಿಸಲೆಂದು ಇದರ ಬೆಳಕು ಪ್ರತಿ 15 ಸೆಕೆಂಡಿಗೆ ಎರಡು ಬಾರಿ ಮಿನುಗುತ್ತದೆ."],
   ["Terracotta means baked earth. Clay pots are fired in a kiln, which makes them hard and gives them their warm red-brown colour.", "टेराकोटा का अर्थ है पकी हुई मिट्टी। मिट्टी के बर्तन भट्ठी में पकाए जाते हैं, जिससे वे सख़्त होते हैं और उन्हें गर्म लाल-भूरा रंग मिलता है।", "ಟೆರಕೋಟಾ ಎಂದರೆ ಸುಟ್ಟ ಮಣ್ಣು. ಮಣ್ಣಿನ ಮಡಕೆಗಳನ್ನು ಆವಿಗೆಯಲ್ಲಿ ಸುಡುವುದರಿಂದ ಅವು ಗಟ್ಟಿಯಾಗಿ ಬೆಚ್ಚನೆಯ ಕೆಂಪು-ಕಂದು ಬಣ್ಣ ಪಡೆಯುತ್ತವೆ."],
   ["The red hibiscus is offered at temples every day. Its petals are also used to make a natural hair oil.", "लाल गुड़हल हर दिन मंदिरों में चढ़ाया जाता है। इसकी पंखुड़ियों से प्राकृतिक बालों का तेल भी बनता है।", "ಕೆಂಪು ದಾಸವಾಳವನ್ನು ಪ್ರತಿದಿನ ದೇವಾಲಯಗಳಿಗೆ ಅರ್ಪಿಸುತ್ತಾರೆ. ಇದರ ದಳಗಳಿಂದ ಸಹಜವಾದ ತಲೆಎಣ್ಣೆಯನ್ನೂ ಮಾಡುತ್ತಾರೆ."],
   ["Soft round buns from small local bakeries are a favourite tea-time snack across South India.", "छोटी स्थानीय बेकरियों के नरम गोल बन पूरे दक्षिण भारत में चाय के समय का पसंदीदा नाश्ता हैं।", "ಸಣ್ಣ ಊರ ಬೇಕರಿಗಳ ಮೆತ್ತನೆಯ ದುಂಡು ಬನ್ ದಕ್ಷಿಣ ಭಾರತದಾದ್ಯಂತ ಸಂಜೆ ಚಹಾದ ಇಷ್ಟದ ತಿಂಡಿ."],
   ["Today many fishers use fibreglass boats with motors, which can go further out to sea than the old log rafts.", "आज कई मछुआरे मोटर वाली फ़ाइबरग्लास नावें इस्तेमाल करते हैं, जो पुराने लट्ठों के बेड़ों से कहीं दूर समुद्र में जा सकती हैं।", "ಇಂದು ಅನೇಕ ಬೆಸ್ತರು ಯಂತ್ರವಿರುವ ಫೈಬರ್‌ಗ್ಲಾಸ್ ದೋಣಿಗಳನ್ನು ಬಳಸುತ್ತಾರೆ; ಇವು ಹಳೆಯ ದಿಮ್ಮಿ ತೆಪ್ಪಗಳಿಗಿಂತ ಬಹಳ ದೂರ ಸಮುದ್ರಕ್ಕೆ ಹೋಗಬಲ್ಲವು."],
   ["Wide-brimmed sun hats woven from palm leaves keep farmers and fishers cool under the hot coastal sun.", "ताड़ के पत्तों से बुनी चौड़े किनारे वाली धूप की टोपियाँ किसानों और मछुआरों को तटीय धूप में ठंडा रखती हैं।", "ತಾಳೆಗರಿಯಿಂದ ಹೆಣೆದ ಅಗಲ ಅಂಚಿನ ಬಿಸಿಲು ಟೋಪಿಗಳು ಕರಾವಳಿಯ ಉರಿಬಿಸಿಲಿನಲ್ಲಿ ರೈತರು, ಬೆಸ್ತರನ್ನು ತಂಪಾಗಿಡುತ್ತವೆ."],
   ["Puducherry has many churches, from grand cathedrals to small whitewashed chapels in fishing villages.", "पुडुचेरी में बड़े कैथेड्रल से लेकर मछुआरों के गाँवों के छोटे सफ़ेद गिरजाघरों तक, बहुत से गिरजाघर हैं।", "ಪುದುಚೇರಿಯಲ್ಲಿ ಭವ್ಯ ಕೆಥೆಡ್ರಲ್‌ಗಳಿಂದ ಬೆಸ್ತರ ಹಳ್ಳಿಗಳ ಪುಟ್ಟ ಸುಣ್ಣ ಬಳಿದ ಇಗರ್ಜಿಗಳವರೆಗೆ ಅನೇಕ ಇಗರ್ಜಿಗಳಿವೆ."],
   ["Small clay lamps called agal vilakku are lit in rows during Karthigai Deepam, the festival of lights in Tamil month Karthigai.", "'अगल विळक्कु' नाम के छोटे मिट्टी के दीये तमिल महीने कार्तिगई के दीपोत्सव कार्तिगई दीपम पर कतारों में जलाए जाते हैं।", "'ಅಗಲ್ ವಿಳಕ್ಕು' ಎಂಬ ಪುಟ್ಟ ಮಣ್ಣಿನ ಹಣತೆಗಳನ್ನು ತಮಿಳು ತಿಂಗಳು ಕಾರ್ತಿಗೈಯ ದೀಪದ ಹಬ್ಬ ಕಾರ್ತಿಗೈ ದೀಪಂನಲ್ಲಿ ಸಾಲಾಗಿ ಹಚ್ಚುತ್ತಾರೆ."],
   ["Papaya trees grow fast in coastal gardens. Ripe papayas are orange inside and full of little black seeds.", "तटीय बाग़ों में पपीते के पेड़ तेज़ी से बढ़ते हैं। पका पपीता अंदर से नारंगी और छोटे काले बीजों से भरा होता है।", "ಕರಾವಳಿಯ ತೋಟಗಳಲ್ಲಿ ಪರಂಗಿ ಗಿಡಗಳು ಬೇಗ ಬೆಳೆಯುತ್ತವೆ. ಮಾಗಿದ ಪರಂಗಿಹಣ್ಣು ಒಳಗೆ ಕಿತ್ತಳೆ ಬಣ್ಣ, ಪುಟ್ಟ ಕಪ್ಪು ಬೀಜಗಳಿಂದ ತುಂಬಿರುತ್ತದೆ."],
   ["Paper lanterns made from handmade paper glow softly when a light is placed inside, and are hung up for festivals.", "हाथ के काग़ज़ से बनी लालटेनें अंदर रोशनी रखने पर हल्की-हल्की चमकती हैं, और त्योहारों पर टाँगी जाती हैं।", "ಕೈಕಾಗದದಿಂದ ಮಾಡಿದ ಆಕಾಶಬುಟ್ಟಿಗಳು ಒಳಗೆ ದೀಪ ಇಟ್ಟಾಗ ಮೃದುವಾಗಿ ಹೊಳೆಯುತ್ತವೆ; ಹಬ್ಬಗಳಲ್ಲಿ ಇವನ್ನು ತೂಗುಹಾಕುತ್ತಾರೆ."],
   ["Clay dolls of gods, animals and village people are arranged on steps for the Navaratri golu display in many homes.", "नवरात्रि गोलू के लिए कई घरों में देवताओं, जानवरों और गाँव के लोगों की मिट्टी की गुड़ियाँ सीढ़ियों पर सजाई जाती हैं।", "ನವರಾತ್ರಿಯ ಬೊಂಬೆ ಹಬ್ಬಕ್ಕೆ ಅನೇಕ ಮನೆಗಳಲ್ಲಿ ದೇವರು, ಪ್ರಾಣಿ, ಹಳ್ಳಿಯ ಜನರ ಮಣ್ಣಿನ ಗೊಂಬೆಗಳನ್ನು ಮೆಟ್ಟಿಲುಗಳ ಮೇಲೆ ಜೋಡಿಸುತ್ತಾರೆ."],
   ["Aayi Mandapam was once the town's water fountain. Its carved panel shows Aayi holding a water pot.", "आयी मंडपम कभी शहर का पानी का फ़व्वारा था। इसकी नक्काशीदार पट्टी में आयी पानी का घड़ा पकड़े दिखती हैं।", "ಆಯಿ ಮಂಟಪ ಒಂದು ಕಾಲದಲ್ಲಿ ಊರಿನ ನೀರಿನ ಕಾರಂಜಿಯಾಗಿತ್ತು. ಇದರ ಕೆತ್ತನೆಯ ಫಲಕದಲ್ಲಿ ಆಯಿ ನೀರಿನ ಕೊಡ ಹಿಡಿದಿದ್ದಾಳೆ."],
   ["The French War Memorial on the seafront has a soldier statue and is lit with lights every year on 14 July.", "समुद्र तट पर बने फ़्रांसीसी युद्ध स्मारक में एक सैनिक की मूर्ति है, और हर साल 14 जुलाई को इसे रोशनी से सजाया जाता है।", "ಕಡಲತೀರದ ಫ್ರೆಂಚ್ ಯುದ್ಧ ಸ್ಮಾರಕದಲ್ಲಿ ಸೈನಿಕನ ಪ್ರತಿಮೆ ಇದೆ; ಪ್ರತಿ ವರ್ಷ ಜುಲೈ 14ರಂದು ಇದಕ್ಕೆ ದೀಪಾಲಂಕಾರ."],
   ["Sri Aurobindo Ashram was started in Puducherry in 1926. Visitors walk in silently to sit near the flower-covered shrine under a big tree.", "श्री अरविंद आश्रम 1926 में पुडुचेरी में शुरू हुआ। लोग चुपचाप अंदर जाकर बड़े पेड़ के नीचे फूलों से ढकी समाधि के पास बैठते हैं।", "ಶ್ರೀ ಅರವಿಂದ ಆಶ್ರಮ 1926ರಲ್ಲಿ ಪುದುಚೇರಿಯಲ್ಲಿ ಆರಂಭವಾಯಿತು. ಜನ ಮೌನವಾಗಿ ಒಳಹೋಗಿ ದೊಡ್ಡ ಮರದಡಿ ಹೂವಿನಿಂದ ಮುಚ್ಚಿದ ಸಮಾಧಿಯ ಬಳಿ ಕುಳಿತುಕೊಳ್ಳುತ್ತಾರೆ."],
   ["Pondicherry Museum shows pottery, beads and other finds from the ancient Roman trading port of Arikamedu.", "पुडुचेरी संग्रहालय में प्राचीन रोमन व्यापार बंदरगाह अरिकमेडु से मिले बर्तन, मनके और दूसरी चीज़ें दिखाई गई हैं।", "ಪುದುಚೇರಿ ವಸ್ತುಸಂಗ್ರಹಾಲಯದಲ್ಲಿ ಪುರಾತನ ರೋಮನ್ ವ್ಯಾಪಾರಿ ಬಂದರು ಅರಿಕಮೇಡುವಿನಲ್ಲಿ ಸಿಕ್ಕ ಮಡಕೆ, ಮಣಿ ಮತ್ತು ಇತರ ವಸ್ತುಗಳಿವೆ."],
   ["The Botanical Garden was laid out by the French in the 1820s, with rare trees from many countries and a little toy train for children.", "वनस्पति उद्यान फ़्रांसीसियों ने 1820 के दशक में बनाया था, जिसमें कई देशों के दुर्लभ पेड़ हैं और बच्चों के लिए एक छोटी खिलौना रेल है।", "ಸಸ್ಯೋದ್ಯಾನವನ್ನು ಫ್ರೆಂಚರು 1820ರ ದಶಕದಲ್ಲಿ ರೂಪಿಸಿದರು; ಅನೇಕ ದೇಶಗಳ ಅಪರೂಪದ ಮರಗಳು ಮತ್ತು ಮಕ್ಕಳಿಗೆ ಪುಟ್ಟ ಆಟಿಕೆ ರೈಲು ಇಲ್ಲಿದೆ."],
   ["In the old town, street signs are written in both Tamil and French, like Rue Dumas, Rue means street in French.", "पुराने शहर में सड़कों के नाम तमिल और फ़्रांसीसी दोनों में लिखे होते हैं, जैसे 'रू द्यूमा'; फ़्रांसीसी में 'रू' का अर्थ है सड़क।", "ಹಳೆಯ ಊರಿನಲ್ಲಿ ಬೀದಿ ಫಲಕಗಳು ತಮಿಳು ಮತ್ತು ಫ್ರೆಂಚ್ ಎರಡರಲ್ಲೂ ಇರುತ್ತವೆ, 'ರೂ ದ್ಯುಮಾ' ಹಾಗೆ; ಫ್ರೆಂಚ್‌ನಲ್ಲಿ 'ರೂ' ಎಂದರೆ ಬೀದಿ."],
   ["The flat, shady streets of the old town are perfect for exploring by bicycle, and cycles can be hired everywhere.", "पुराने शहर की समतल, छायादार गलियाँ साइकिल से घूमने के लिए बढ़िया हैं, और हर जगह किराए पर साइकिलें मिलती हैं।", "ಹಳೆಯ ಊರಿನ ಸಮತಟ್ಟಾದ, ನೆರಳಿನ ಬೀದಿಗಳನ್ನು ಸೈಕಲ್‌ನಲ್ಲಿ ಸುತ್ತಲು ಹೇಳಿಮಾಡಿಸಿದಂತಿವೆ; ಎಲ್ಲೆಡೆ ಬಾಡಿಗೆ ಸೈಕಲ್ ಸಿಗುತ್ತದೆ."],
   ["A potter's wheel spins fast while the potter's wet hands pull the clay upwards into a pot, all in just a few minutes.", "कुम्हार का चाक तेज़ी से घूमता है और कुम्हार अपने गीले हाथों से मिट्टी को ऊपर खींचकर कुछ ही मिनटों में घड़ा बना देता है।", "ಕುಂಬಾರನ ಚಕ್ರ ವೇಗವಾಗಿ ತಿರುಗುತ್ತಿರುವಾಗ ಕುಂಬಾರ ಒದ್ದೆ ಕೈಗಳಿಂದ ಮಣ್ಣನ್ನು ಮೇಲಕ್ಕೆಳೆದು ಕೆಲವೇ ನಿಮಿಷಗಳಲ್ಲಿ ಮಡಕೆ ಮಾಡುತ್ತಾನೆ."],
   ["The spot-billed pelican scoops up fish in the big pouch under its beak. Flocks fish together on lakes like Ousteri.", "चित्तीदार चोंच वाला पेलिकन अपनी चोंच के नीचे की बड़ी थैली में मछलियाँ भर लेता है। ऊस्तेरी जैसी झीलों पर झुंड मिलकर मछली पकड़ते हैं।", "ಚುಕ್ಕಿಕೊಕ್ಕಿನ ಹೆಜ್ಜಾರ್ಲೆ ತನ್ನ ಕೊಕ್ಕಿನ ಕೆಳಗಿನ ದೊಡ್ಡ ಚೀಲದಲ್ಲಿ ಮೀನನ್ನು ಬಾಚಿಕೊಳ್ಳುತ್ತದೆ. ಊಸ್ಟೇರಿಯಂಥ ಕೆರೆಗಳಲ್ಲಿ ಹಿಂಡುಗಳು ಒಟ್ಟಿಗೆ ಮೀನು ಹಿಡಿಯುತ್ತವೆ."],
   ["The painted stork has pink feathers near its tail as if painted with a brush, and a long yellow beak for catching fish.", "चितकबरे सारस की पूँछ के पास गुलाबी पंख होते हैं, मानो ब्रश से रंगे हों, और मछली पकड़ने के लिए लंबी पीली चोंच।", "ಬಣ್ಣದ ಕೊಕ್ಕರೆಯ ಬಾಲದ ಬಳಿ ಕುಂಚದಿಂದ ಬಳಿದಂತೆ ಗುಲಾಬಿ ಗರಿಗಳಿವೆ; ಮೀನು ಹಿಡಿಯಲು ಉದ್ದದ ಹಳದಿ ಕೊಕ್ಕು."],
   ["Olive ridley sea turtles come to beaches on India's east coast at night to lay their eggs in the sand.", "ऑलिव रिडले समुद्री कछुए रात में भारत के पूर्वी तट की रेत में अंडे देने आते हैं।", "ಆಲಿವ್ ರಿಡ್ಲಿ ಕಡಲಾಮೆಗಳು ರಾತ್ರಿ ಭಾರತದ ಪೂರ್ವ ಕರಾವಳಿಯ ಮರಳಿನಲ್ಲಿ ಮೊಟ್ಟೆ ಇಡಲು ಬರುತ್ತವೆ."],
   ["The crow is the animal of Shani, so many devotees at Tirunallar feed crows with rice.", "कौआ शनि का वाहन है, इसलिए तिरुनल्लार में कई भक्त कौओं को चावल खिलाते हैं।", "ಕಾಗೆ ಶನಿಯ ವಾಹನ; ಹಾಗಾಗಿ ತಿರುನಳ್ಳಾರಿನಲ್ಲಿ ಅನೇಕ ಭಕ್ತರು ಕಾಗೆಗಳಿಗೆ ಅನ್ನ ಹಾಕುತ್ತಾರೆ."],
   ["The bright blue kingfisher sits very still above the water, then dives in like an arrow to catch a fish.", "चमकीला नीला किलकिला पानी के ऊपर बिल्कुल शांत बैठता है, फिर तीर की तरह गोता लगाकर मछली पकड़ता है।", "ಹೊಳೆಯುವ ನೀಲಿ ಮಿಂಚುಳ್ಳಿ ನೀರಿನ ಮೇಲೆ ಅಲುಗಾಡದೆ ಕುಳಿತು, ಬಾಣದಂತೆ ಧುಮುಕಿ ಮೀನು ಹಿಡಿಯುತ್ತದೆ."],
   ["Fishers mend their nets on the beach every afternoon, sitting in the shade of their boats.", "मछुआरे हर दोपहर तट पर अपनी नावों की छाँव में बैठकर जाल सुधारते हैं।", "ಬೆಸ್ತರು ಪ್ರತಿ ಮಧ್ಯಾಹ್ನ ಕಡಲತೀರದಲ್ಲಿ ತಮ್ಮ ದೋಣಿಗಳ ನೆರಳಿನಲ್ಲಿ ಕುಳಿತು ಬಲೆ ಸರಿಪಡಿಸುತ್ತಾರೆ."],
   ["Mahe's riverside walk runs along the Mahe river, lined with coconut palms, before it meets the Arabian Sea.", "माहे का नदी किनारे का रास्ता नारियल के पेड़ों से घिरी माहे नदी के साथ चलता है, जहाँ तक वह अरब सागर से न मिल जाए।", "ಮಾಹೆಯ ನದಿದಂಡೆಯ ಹಾದಿ ತೆಂಗಿನ ಮರಗಳ ಸಾಲಿನ ಮಾಹೆ ನದಿಯುದ್ದಕ್ಕೂ, ಅದು ಅರಬ್ಬೀ ಸಮುದ್ರ ಸೇರುವವರೆಗೆ ಸಾಗುತ್ತದೆ."],
   ["The Godavari is one of India's longest rivers. Near Yanam it is very wide, and country boats ferry people and goods across it.", "गोदावरी भारत की सबसे लंबी नदियों में से एक है। यानम के पास यह बहुत चौड़ी है, और देसी नावें लोगों और सामान को पार ले जाती हैं।", "ಗೋದಾವರಿ ಭಾರತದ ಅತಿ ಉದ್ದದ ನದಿಗಳಲ್ಲಿ ಒಂದು. ಯಾನಂ ಬಳಿ ಅದು ತುಂಬಾ ಅಗಲ; ನಾಡದೋಣಿಗಳು ಜನ, ಸರಕನ್ನು ಆಚೆ ದಡಕ್ಕೆ ಸಾಗಿಸುತ್ತವೆ."],
   ["Coastal Puducherry loves fish curry made with tamarind, coconut and spices, eaten with rice.", "तटीय पुडुचेरी को इमली, नारियल और मसालों से बनी मछली करी बहुत पसंद है, जो चावल के साथ खाई जाती है।", "ಕರಾವಳಿ ಪುದುಚೇರಿಗೆ ಹುಣಸೆ, ತೆಂಗು, ಮಸಾಲೆಯಿಂದ ಮಾಡಿದ ಮೀನಿನ ಸಾರು ಅಂದರೆ ಪ್ರಾಣ; ಅನ್ನದ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Kuzhi paniyaram are little round dumplings made from dosa batter, cooked in a special pan with many small hollows.", "कुळि पणियारम डोसे के घोल से बनी छोटी गोल पकौड़ियाँ हैं, जो कई छोटे गड्ढों वाली ख़ास कड़ाही में पकती हैं।", "ಗುಳಿಯಪ್ಪವನ್ನು ದೋಸೆ ಹಿಟ್ಟಿನಿಂದ, ಹಲವು ಪುಟ್ಟ ಗುಳಿಗಳಿರುವ ವಿಶೇಷ ಕಾವಲಿಯಲ್ಲಿ ಮಾಡುವ ದುಂಡು ತಿಂಡಿ."],
   ["Coconut palms grow all along the coast. Fresh coconut is grated into chutneys, curries and sweets.", "नारियल के पेड़ पूरे तट पर उगते हैं। ताज़ा नारियल कसकर चटनी, करी और मिठाइयों में डाला जाता है।", "ತೆಂಗಿನ ಮರಗಳು ಕರಾವಳಿಯುದ್ದಕ್ಕೂ ಬೆಳೆಯುತ್ತವೆ. ತಾಜಾ ತೆಂಗಿನಕಾಯಿ ತುರಿದು ಚಟ್ನಿ, ಸಾರು, ಸಿಹಿತಿಂಡಿಗಳಿಗೆ ಹಾಕುತ್ತಾರೆ."],
   ["After high tide, children collect seashells of every shape on Puducherry's beaches: spirals, fans and tiny cowries.", "ज्वार उतरने के बाद बच्चे पुडुचेरी के तटों पर हर आकार की सीपियाँ बटोरते हैं: घुमावदार, पंखे जैसी और नन्ही कौड़ियाँ।", "ಕಡಲು ಇಳಿತವಾದ ಮೇಲೆ ಮಕ್ಕಳು ಪುದುಚೇರಿಯ ಕಡಲತೀರಗಳಲ್ಲಿ ಎಲ್ಲ ಆಕಾರದ ಚಿಪ್ಪುಗಳನ್ನು ಆರಿಸುತ್ತಾರೆ: ಸುರುಳಿ, ಬೀಸಣಿಗೆಯಾಕಾರ, ಪುಟ್ಟ ಕವಡೆಗಳು."]]}};

  overlay(`<h2>${o.title}</h2><img class="pcard" src="${url}" alt="${esc(o.line)}">
   ${canShare?`<button class="go" onclick="grownUp(()=>navigator.share({files:[__card.f],title:'Diya\\'s Bharat Yatra',text:inviteText(__card.line)}).catch(()=>{}))">📤 ${s2('share')}</button>`:''}
   <button class="go ${canShare?'alt':''}" onclick="saveCard()">⬇️ ${s2('save')}</button><button class="go alt" onclick="${o.back}">${s2('back')}</button>`)},'image/png')}

/* colouring: tap-to-fill on a line drawing; dark pixels are walls */
async function startColour(ci,fromMap){const ch=CH[ci],k=ch.key,im=await loadImg(A(`img/match/${k}/colour.png`));if(!im){toast('🎨 …',900);return}
  const pal=COLPAL[k]||COLPAL.ka;let cur=pal[0];const W=im.width,H=im.height;
  overlay(`<h2>🎨 ${r2('colT')}</h2><p class="muted" style="margin:0 0 6px">${r2('colP')}</p><canvas id="colc" class="colc" width="${W}" height="${H}"></canvas>
   <div class="pal">${pal.map((p,i)=>`<button data-c="${p}" class="${i?'':'on'}" style="background:${p}" aria-label="colour ${i+1}"></button>`).join('')}</div>
   <div class="colb"><button class="go alt" id="colu">↶ ${r2('undo')}</button><button class="go alt" id="colr">⟲ ${r2('clear')}</button></div>
   <button class="go" id="cols">⬇️ ${r2('saveC')}</button><button class="go alt" onclick="rewardCard(${ci},${fromMap})">${s2('back')}</button>`);
  const cv=$('#colc'),x=cv.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0);
  let d=x.getImageData(0,0,W,H);const px=d.data,wall=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){const l=.3*px[i*4]+.59*px[i*4+1]+.11*px[i*4+2];if(l<150){wall[i]=1;px[i*4]=px[i*4+1]=px[i*4+2]=25}else{px[i*4]=px[i*4+1]=px[i*4+2]=255}px[i*4+3]=255}
  x.putImageData(d,0,0);const base=x.getImageData(0,0,W,H),undo=[];
  function fill(sx,sy,hex){const i0=sy*W+sx;if(wall[i0])return false;const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
    const D=x.getImageData(0,0,W,H),p=D.data,tr=p[i0*4],tg=p[i0*4+1],tb=p[i0*4+2];if(tr===r&&tg===g&&tb===b)return false;
    undo.push(D);if(undo.length>8)undo.shift();const P=new Uint32Array(D.data.buffer),T=P[i0],seen=new Uint8Array(W*H),st=[i0];
    while(st.length){let i=st.pop();let y=(i/W)|0,xl=i-y*W;while(xl>0&&!wall[y*W+xl-1]&&P[y*W+xl-1]===T)xl--;let up=false,dn=false;
      for(let xx=xl;xx<W;xx++){const j=y*W+xx;if(wall[j]||P[j]!==T||seen[j])break;seen[j]=1;p[j*4]=r;p[j*4+1]=g;p[j*4+2]=b;
        if(y>0){const u=j-W;if(!wall[u]&&P[u]===T&&!seen[u]){if(!up){st.push(u);up=true}}else up=false}
        if(y<H-1){const v=j+W;if(!wall[v]&&P[v]===T&&!seen[v]){if(!dn){st.push(v);dn=true}}else dn=false}}}
    x.putImageData(D,0,0);return true}
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),sx=Math.floor((e.clientX-r.left)*W/r.width),sy=Math.floor((e.clientY-r.top)*H/r.height);
    if(sx<0||sy<0||sx>=W||sy>=H)return;if(fill(sx,sy,cur)){SFX.tap(3);vib(8)}});
  document.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{cur=b.dataset.c;document.querySelectorAll('.pal button').forEach(q=>q.classList.toggle('on',q===b));SFX.tap(1)});
  $('#colu').onclick=()=>{const u=undo.pop();if(u)x.putImageData(u,0,0)};$('#colr').onclick=()=>{undo.push(x.getImageData(0,0,W,H));x.putImageData(base,0,0)};
  $('#cols').onclick=()=>needMe(async()=>{const m=me(),o=document.createElement('canvas');o.width=W;o.height=H+90;const y=o.getContext('2d');y.fillStyle='#fbf3e0';y.fillRect(0,0,W,H+90);y.drawImage(cv,0,0);
    y.fillStyle='#5a2a14';y.font='bold 34px '+FONT;y.textAlign='center';y.fillText(r2('colLine')(m.name,ch.name[lang]),W/2,H+42);y.fillStyle='#c8364c';y.font='24px '+FONT;y.fillText("Diya's Bharat Yatra · worldofwondersstudio.com",W/2,H+76);
    window.__colKeep=x.getImageData(0,0,W,H);showCanvas(o,{title:'🎨 '+r2('colT'),line:r2('colLine')(m.name,ch.name[lang]),file:`diya-colouring-${k}.png`,back:`startColour(${ci},${fromMap})`})})}
/* ---- Ajji's quiz: once a day, from the player's own stickers ---- */
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){const pool=[...FOUND].map(k=>{const [key,ty]=k.split(':');const ci=CH.findIndex(c=>c.key===key);return ci<0||(+ty>=CH[ci].avail&&!xOf(ci,+ty))?null:[ci,+ty]}).filter(Boolean);
  if(pool.length<6){toast(s2('quizLock'),1900);return}
  if(store.get('quizDay','')===today()){toast(s2('quizTomorrow'),1900);return}
  const qs=shuf(pool).slice(0,3).map(([ci,ty],i)=>{const where=i===1||Math.random()<.3;
    if(where){const ans=CH[ci].name[lang];return{ci,ty,kind:'where',ans,opts:shuf([ans,...shuf(CH.filter((_,j)=>j!==ci).map(c=>c.name[lang])).slice(0,2)])}}
    const ans=iName(ci,ty);const others=ty>=100?shuf(XTRA[CH[ci].key].filter(x=>x.ty!==ty)).slice(0,2).map(x=>x.n[LI()]):shuf([...Array(CH[ci].avail).keys()].filter(j=>j!==ty&&j%12!==ty%12)).slice(0,2).map(j=>iName(ci,j));
    return{ci,ty,kind:'what',ans,opts:shuf([ans,...others])}});
  window.__Q={qs,i:0,score:0};
  overlay(`<div class="place">🧓</div><h2>${s2('quizT')}</h2><p>${s2('quizP')}</p><button class="go" onclick="quizStep()">${t('play')}</button><button class="go alt" onclick="showBook()">${s2('back')}</button>`)}
function quizStep(){const S=window.__Q;if(!S)return;
  if(S.i>=S.qs.length){const w=S.score*20;store.set('quizDay',today());if(w){give({diya:w});earn(0);celebrate(S.score===3)}
    overlay(`${cheerHTML()}<h2>${s2('quizT')}</h2><div class="bigstars">${[0,1,2].map(i=>i<S.score?'<span>★</span>':'<span class="off">★</span>').join('')}</div><p>${s2('quizDone')(w)}</p><button class="go" onclick="showBook()">📒 ${s2('book')}</button><button class="go alt" onclick="showMap()">${t('map')}</button>`);return}
  const q=S.qs[S.i];overlay(`<p class="muted">${S.i+1} / ${S.qs.length}</p><h2>${q.kind==='what'?s2('qWhat'):s2('qWhere')}</h2><div class="bigst"><img src="${iImg(q.ci,q.ty)}" alt=""></div>
   <div class="opts">${q.opts.map((o,j)=>`<button class="go alt" onclick="quizAns(${j})">${esc(o)}</button>`).join('')}</div>`)}
function quizAns(j){const S=window.__Q,q=S.qs[S.i];const ok=q.opts[j]===q.ans;if(ok){S.score++;SFX.match(2)}else SFX.tap(4);
  overlay(`<div class="place">${ok?'✅':'🤔'}</div><h2>${ok?s2('right'):s2('wrong')(esc(q.ans))}</h2><div class="bigst" style="width:110px"><img src="${iImg(q.ci,q.ty)}" alt=""></div><p><b>${esc(iName(q.ci,q.ty))}</b> · ${CH[q.ci].name[lang]}</p><div class="fact">💡 ${iFact(q.ci,q.ty)}</div><button class="go" onclick="__Q.i++;quizStep()">${s2('nextQ')}</button>`)}
