   ["Asiatic lions are a little smaller than African lions and have a long fold of skin along the belly.", "एशियाई शेर अफ़्रीकी शेरों से थोड़े छोटे होते हैं और उनके पेट के साथ त्वचा की एक लंबी तह होती है।", "ಏಷ್ಯಾದ ಸಿಂಹಗಳು ಆಫ್ರಿಕಾದ ಸಿಂಹಗಳಿಗಿಂತ ಸ್ವಲ್ಪ ಚಿಕ್ಕವು; ಹೊಟ್ಟೆಯ ಉದ್ದಕ್ಕೂ ಚರ್ಮದ ಒಂದು ಮಡಿಕೆ ಇರುತ್ತದೆ."],
   ["Dhokla is a soft, spongy snack steamed from a fermented batter of gram flour.", "ढोकला बेसन के ख़मीर वाले घोल को भाप में पकाकर बनाया गया नरम, स्पंजी नाश्ता है।", "ಢೋಕ್ಲಾ ಹುದುಗಿಸಿದ ಕಡಲೆಹಿಟ್ಟಿನ ಮಿಶ್ರಣವನ್ನು ಹಬೆಯಲ್ಲಿ ಬೇಯಿಸಿ ಮಾಡುವ ಮೃದುವಾದ ತಿಂಡಿ."],
   ["On Uttarayan, 14 January, the sky over Gujarat fills with kites, and Ahmedabad holds an international kite festival.", "14 जनवरी को उत्तरायण पर गुजरात का आसमान पतंगों से भर जाता है, और अहमदाबाद में अंतरराष्ट्रीय पतंग उत्सव होता है।", "ಜನವರಿ 14ರ ಉತ್ತರಾಯಣದಂದು ಗುಜರಾತ್‌ನ ಆಕಾಶ ಗಾಳಿಪಟಗಳಿಂದ ತುಂಬುತ್ತದೆ; ಅಹಮದಾಬಾದ್‌ನಲ್ಲಿ ಅಂತರರಾಷ್ಟ್ರೀಯ ಗಾಳಿಪಟ ಉತ್ಸವ ನಡೆಯುತ್ತದೆ."],
   ["During Navratri, people dance Garba in big circles around a lamp for nine nights.", "नवरात्रि में लोग नौ रातों तक दीपक के चारों ओर बड़े घेरों में गरबा करते हैं।", "ನವರಾತ್ರಿಯ ಒಂಬತ್ತು ರಾತ್ರಿ ಜನರು ದೀಪದ ಸುತ್ತ ದೊಡ್ಡ ವೃತ್ತಗಳಲ್ಲಿ ಗರ್ಬಾ ಕುಣಿಯುತ್ತಾರೆ."],
   ["Kutchi women stitch tiny mirrors into cloth with bright threads, a skill passed from mothers to daughters.", "कच्छ की महिलाएँ रंगीन धागों से कपड़े में छोटे-छोटे शीशे टाँकती हैं, यह हुनर माँ से बेटी को मिलता है।", "ಕಚ್ಛ್‌ನ ಮಹಿಳೆಯರು ಬಣ್ಣದ ದಾರಗಳಿಂದ ಬಟ್ಟೆಗೆ ಪುಟ್ಟ ಕನ್ನಡಿಗಳನ್ನು ಹೊಲಿಯುತ್ತಾರೆ; ಈ ಕಲೆ ತಾಯಿಯಿಂದ ಮಗಳಿಗೆ ಬರುತ್ತದೆ."],
   ["The Statue of Unity honours Sardar Patel, who brought more than 560 princely states together into one India.", "स्टैच्यू ऑफ़ यूनिटी सरदार पटेल के सम्मान में है, जिन्होंने 560 से ज़्यादा रियासतों को मिलाकर एक भारत बनाया।", "ಏಕತಾ ಪ್ರತಿಮೆ ಸರ್ದಾರ್ ಪಟೇಲರ ಗೌರವಾರ್ಥ; 560ಕ್ಕೂ ಹೆಚ್ಚು ಸಂಸ್ಥಾನಗಳನ್ನು ಒಂದುಗೂಡಿಸಿ ಒಂದೇ ಭಾರತ ಮಾಡಿದವರು ಅವರು."],
   ["Crunchy fafda with sweet jalebi is Gujarat's favourite breakfast on Dussehra morning.", "कुरकुरे फाफड़े और मीठी जलेबी दशहरे की सुबह गुजरात का सबसे प्यारा नाश्ता है।", "ಗರಿಗರಿ ಫಾಫ್ಡಾ ಮತ್ತು ಸಿಹಿ ಜಿಲೇಬಿ ದಸರೆಯ ಬೆಳಗ್ಗೆ ಗುಜರಾತ್‌ನ ನೆಚ್ಚಿನ ತಿಂಡಿ."],
   ["Rogan art uses thick castor-oil paint, and the cloth is often folded to print a mirror image on the other half.", "रोगन कला में अरंडी के तेल का गाढ़ा रंग लगता है, और अक्सर कपड़ा मोड़कर दूसरी तरफ़ उसी डिज़ाइन की छाप ली जाती है।", "ರೋಗನ್ ಕಲೆಯಲ್ಲಿ ಹರಳೆಣ್ಣೆಯ ದಪ್ಪ ಬಣ್ಣ ಬಳಸುತ್ತಾರೆ; ಬಟ್ಟೆಯನ್ನು ಮಡಚಿ ಇನ್ನೊಂದು ಬದಿಗೆ ಅದೇ ಚಿತ್ರದ ಪ್ರತಿಬಿಂಬ ಮೂಡಿಸುತ್ತಾರೆ."],
   ["Somnath temple stands by the Arabian Sea; it was rebuilt many times, and the temple we see today was built in 1951.", "सोमनाथ मंदिर अरब सागर के किनारे है; इसे कई बार फिर से बनाया गया, और आज का मंदिर 1951 में बना।", "ಸೋಮನಾಥ ದೇವಾಲಯ ಅರಬ್ಬೀ ಸಮುದ್ರದ ದಡದಲ್ಲಿದೆ; ಅದನ್ನು ಹಲವು ಬಾರಿ ಮರುನಿರ್ಮಿಸಲಾಯಿತು, ಇಂದಿನ ದೇವಾಲಯ 1951ರಲ್ಲಿ ಕಟ್ಟಿದ್ದು."],
   ["Rani ki Vav was built in the 11th century by Queen Udayamati in memory of King Bhimdev I.", "रानी की वाव 11वीं सदी में रानी उदयमती ने राजा भीमदेव प्रथम की याद में बनवाई थी।", "ರಾಣಿ ಕೀ ವಾವ್ ಅನ್ನು 11ನೇ ಶತಮಾನದಲ್ಲಿ ರಾಣಿ ಉದಯಮತಿ ರಾಜ ಒಂದನೇ ಭೀಮದೇವನ ನೆನಪಿಗಾಗಿ ಕಟ್ಟಿಸಿದಳು."],
   ["Undhiyu is a winter mix of vegetables, once cooked upside down in a clay pot buried under a fire. 'Undhu' means upside down!", "उंधियू सर्दियों की मिली-जुली सब्ज़ी है, जो पहले मिट्टी के घड़े में उल्टा रखकर आग के नीचे पकाई जाती थी। 'उंधु' का मतलब है उल्टा!", "ಉಂಧಿಯೂ ಚಳಿಗಾಲದ ಮಿಶ್ರ ತರಕಾರಿ ಪಲ್ಯ; ಹಿಂದೆ ಮಣ್ಣಿನ ಮಡಕೆಯನ್ನು ತಲೆಕೆಳಗಾಗಿಟ್ಟು ಬೆಂಕಿಯ ಕೆಳಗೆ ಬೇಯಿಸುತ್ತಿದ್ದರು. 'ಉಂಧು' ಎಂದರೆ ತಲೆಕೆಳಗೆ!"],
   ["Tangaliya weavers make dotted patterns by knotting tiny bits of wool into the cloth.", "तांगलिया बुनकर ऊन की छोटी गाँठें बुनकर बिंदियों वाले नमूने बनाते हैं।", "ತಂಗಾಲಿಯಾ ನೇಕಾರರು ಉಣ್ಣೆಯ ಪುಟ್ಟ ಗಂಟುಗಳನ್ನು ನೇಯ್ದು ಚುಕ್ಕೆ ಚಿತ್ತಾರ ಮಾಡುತ್ತಾರೆ."],
   ["Gujarat is the only place in the world where Asiatic lions live in the wild.", "गुजरात दुनिया की अकेली जगह है जहाँ एशियाई शेर जंगल में रहते हैं।", "ಏಷ್ಯಾದ ಸಿಂಹಗಳು ಕಾಡಿನಲ್ಲಿ ವಾಸಿಸುವ ಜಗತ್ತಿನ ಏಕೈಕ ತಾಣ ಗುಜರಾತ್."],
   ["Khandvi are thin rolls of gram flour, topped with mustard seeds and coconut.", "खांडवी बेसन के पतले रोल हैं, ऊपर राई और नारियल।", "ಖಾಂಡ್ವಿ ಕಡಲೆಹಿಟ್ಟಿನ ತೆಳು ಸುರುಳಿಗಳು, ಮೇಲೆ ಸಾಸಿವೆ ಒಗ್ಗರಣೆ, ಕಾಯಿತುರಿ."],
   ["Kite flyers wind their string on a wooden spool called a firki.", "पतंगबाज़ अपनी डोर लकड़ी की फिरकी पर लपेटते हैं।", "ಗಾಳಿಪಟ ಹಾರಿಸುವವರು ದಾರವನ್ನು ಮರದ ಫಿರ್ಕಿಗೆ ಸುತ್ತುತ್ತಾರೆ."],
   ["In dandiya raas, dancers strike pairs of sticks in rhythm.", "डांडिया रास में नर्तक ताल पर डंडियाँ टकराते हैं।", "ದಾಂಡಿಯಾ ರಾಸ್‌ನಲ್ಲಿ ಕುಣಿಯುವವರು ತಾಳಕ್ಕೆ ತಕ್ಕಂತೆ ಕೋಲು ತಟ್ಟುತ್ತಾರೆ."],
   ["Ajrakh cloth is printed with blocks and natural indigo, and washed many times.", "अजरख कपड़ा ठप्पों और प्राकृतिक नील से छपता है और कई बार धोया जाता है।", "ಅಜ್ರಖ್ ಬಟ್ಟೆಯನ್ನು ಅಚ್ಚು ಮತ್ತು ಸಹಜ ನೀಲಿಯಿಂದ ಮುದ್ರಿಸಿ ಹಲವು ಬಾರಿ ತೊಳೆಯುತ್ತಾರೆ."],
   ["Gandhiji began the Salt March from Sabarmati Ashram in 1930.", "गांधीजी ने 1930 में साबरमती आश्रम से दांडी यात्रा शुरू की।", "ಗಾಂಧೀಜಿ 1930ರಲ್ಲಿ ಸಾಬರಮತಿ ಆಶ್ರಮದಿಂದ ದಂಡಿ ಯಾತ್ರೆ ಆರಂಭಿಸಿದರು."],
   ["Bhavnagari gathiya are soft gram-flour sticks, a tea-time favourite.", "भावनगरी गाठिया बेसन की नरम लड़ियाँ हैं, चाय के साथ पसंदीदा।", "ಭಾವನಗರಿ ಗಾಠಿಯಾ ಕಡಲೆಹಿಟ್ಟಿನ ಮೃದು ಕಡ್ಡಿಗಳು; ಚಹಾ ಜೊತೆ ಮೆಚ್ಚಿನ ತಿಂಡಿ."],
   ["Rathwa families paint Pithora on their walls to bring blessings home.", "राठवा परिवार आशीर्वाद के लिए घर की दीवारों पर पिठोरा बनाते हैं।", "ರಾಠವಾ ಕುಟುಂಬಗಳು ಆಶೀರ್ವಾದಕ್ಕಾಗಿ ಮನೆಯ ಗೋಡೆಗಳ ಮೇಲೆ ಪಿಠೋರಾ ಬಿಡಿಸುತ್ತಾರೆ."],
   ["A new flag is raised on the Dwarkadhish temple several times every day.", "द्वारकाधीश मंदिर पर हर दिन कई बार नया ध्वज चढ़ाया जाता है।", "ದ್ವಾರಕಾಧೀಶ ದೇವಾಲಯದ ಮೇಲೆ ಪ್ರತಿದಿನ ಹಲವು ಬಾರಿ ಹೊಸ ಧ್ವಜ ಏರಿಸುತ್ತಾರೆ."],
   ["Adalaj stepwell goes five storeys down and stays cool even in summer.", "अडालज बावड़ी पाँच मंज़िल नीचे जाती है, गर्मी में भी ठंडी रहती है।", "ಅಡಾಲಜ್ ಮೆಟ್ಟಿಲುಬಾವಿ ಐದು ಅಂತಸ್ತು ಕೆಳಗಿಳಿಯುತ್ತದೆ; ಬೇಸಿಗೆಯಲ್ಲೂ ತಂಪು."],
   ["A Gujarati thali mixes sweet, salty and tangy dishes on one plate.", "गुजराती थाली में मीठे, नमकीन और खट्टे पकवान एक साथ होते हैं।", "ಗುಜರಾತಿ ಥಾಲಿಯಲ್ಲಿ ಸಿಹಿ, ಉಪ್ಪು, ಹುಳಿ ಎಲ್ಲ ರುಚಿಗಳು ಒಂದೇ ತಟ್ಟೆಯಲ್ಲಿ."],
   ["Surat's ghari is eaten on Chandani Padvo, the day after Sharad Purnima.", "सूरत की घारी चंदनी पड़वो पर खाई जाती है, शरद पूर्णिमा के अगले दिन।", "ಸೂರತ್‌ನ ಘಾರಿಯನ್ನು ಶರದ್ ಹುಣ್ಣಿಮೆಯ ಮರುದಿನ ಚಂದನಿ ಪಡವೋದಂದು ತಿನ್ನುತ್ತಾರೆ."],
   ["Basundi is milk boiled down with sugar, cardamom and nuts.", "बासुंदी चीनी के साथ गाढ़ा किया दूध है, इलायची और मेवों के साथ।", "ಬಾಸುಂದಿ ಸಕ್ಕರೆ ಹಾಕಿ ಗಟ್ಟಿಯಾಗಿಸಿದ ಹಾಲು; ಏಲಕ್ಕಿ, ಒಣಹಣ್ಣಿನ ಘಮ."],
   ["Shrikhand is made by hanging curd until thick, then adding sugar and saffron.", "श्रीखंड दही को टाँगकर गाढ़ा करके चीनी और केसर मिलाकर बनता है।", "ಮೊಸರನ್ನು ಬಟ್ಟೆಯಲ್ಲಿ ತೂಗಿಹಾಕಿ ಗಟ್ಟಿಯಾಗಿಸಿ ಸಕ್ಕರೆ, ಕೇಸರಿ ಸೇರಿಸಿ ಶ್ರೀಖಂಡ ಮಾಡುತ್ತಾರೆ."],
   ["Sukhdi, of wheat, ghee and jaggery, gives quick energy.", "गेहूँ, घी और गुड़ की सुखड़ी तुरंत ताक़त देती है।", "ಗೋಧಿ, ತುಪ್ಪ, ಬೆಲ್ಲದ ಸುಖಡಿ ತಕ್ಷಣ ಶಕ್ತಿ ಕೊಡುತ್ತದೆ."],
   ["Khakhra is a thin flatbread roasted slowly till crisp, and lasts for weeks.", "खाखरा पतली रोटी को धीरे-धीरे कुरकुरा सेंककर बनता है और हफ़्तों चलता है।", "ಖಾಖ್ರಾ ತೆಳು ರೊಟ್ಟಿಯನ್ನು ನಿಧಾನವಾಗಿ ಗರಿಗರಿಯಾಗಿ ಸುಟ್ಟು ಮಾಡುವುದು; ವಾರಗಟ್ಟಲೆ ಕೆಡುವುದಿಲ್ಲ."],
   ["Fenugreek theplas stay fresh for days, so travellers carry them.", "मेथी के थेपले कई दिन ताज़ा रहते हैं, इसलिए यात्री साथ ले जाते हैं।", "ಮೆಂತ್ಯೆ ಸೊಪ್ಪಿನ ಥೇಪ್ಲಾ ಹಲವು ದಿನ ಕೆಡುವುದಿಲ್ಲ, ಹಾಗಾಗಿ ಪ್ರಯಾಣಕ್ಕೆ ಒಯ್ಯುತ್ತಾರೆ."],
   ["Handvo is a savoury baked cake of rice, lentils and bottle gourd.", "हांडवो चावल, दाल और लौकी से बना नमकीन केक है।", "ಹಾಂಡ್ವೊ ಅಕ್ಕಿ, ಬೇಳೆ, ಸೋರೆಕಾಯಿಯಿಂದ ಮಾಡುವ ಖಾರದ ಕೇಕ್."],
   ["Dabeli was invented in Mandvi, Kutch, about 60 years ago.", "दाबेली लगभग 60 साल पहले कच्छ के मांडवी में बनी।", "ದಾಬೇಲಿ ಸುಮಾರು 60 ವರ್ಷಗಳ ಹಿಂದೆ ಕಚ್ಛ್‌ನ ಮಾಂಡ್ವಿಯಲ್ಲಿ ಹುಟ್ಟಿತು."],
   ["Gujarati brides often wear a red and white bandhani called gharchola.", "गुजराती दुल्हनें अक्सर लाल-सफ़ेद बांधनी घरचोला पहनती हैं।", "ಗುಜರಾತಿ ವಧುಗಳು ಹೆಚ್ಚಾಗಿ ಕೆಂಪು-ಬಿಳಿ ಬಾಂಧನಿ 'ಘರ್ಚೋಳಾ' ಉಡುತ್ತಾರೆ."],
   ["A beaded toran over the door welcomes guests and good luck.", "दरवाज़े पर मोतियों का तोरण मेहमानों और शुभ का स्वागत करता है।", "ಬಾಗಿಲಿನ ಮಣಿ ತೋರಣ ಅತಿಥಿಗಳನ್ನೂ ಶುಭವನ್ನೂ ಸ್ವಾಗತಿಸುತ್ತದೆ."],
   ["Kutch copper bells are shaped by hand and coated with mud before baking.", "कच्छ की तांबे की घंटियाँ हाथ से गढ़कर मिट्टी लगाकर पकाई जाती हैं।", "ಕಚ್ಛ್‌ನ ತಾಮ್ರದ ಗಂಟೆಗಳನ್ನು ಕೈಯಲ್ಲೇ ರೂಪಿಸಿ ಮಣ್ಣು ಮೆತ್ತಿ ಸುಡುತ್ತಾರೆ."],
   ["Sankheda furniture is teak wood coated with lacquer and bright colours.", "संखेड़ा फ़र्नीचर सागौन की लकड़ी पर लाख और चमकीले रंगों से बनता है।", "ಸಂಖೇಡಾ ಪೀಠೋಪಕರಣಗಳು ತೇಗದ ಮರಕ್ಕೆ ಅರಗು, ಹೊಳೆಯುವ ಬಣ್ಣ ಹಚ್ಚಿದವು."],
   ["The Khambhat area has made agate beads since Harappan times.", "खंभात के इलाके में हड़प्पा काल से अकीक के मनके बनते आए हैं।", "ಖಂಭಾತ್ ಪ್ರದೇಶದಲ್ಲಿ ಹರಪ್ಪಾ ಕಾಲದಿಂದಲೂ ಅಕೀಕ್ ಮಣಿಗಳನ್ನು ಮಾಡುತ್ತಿದ್ದಾರೆ."],
   ["The Indian wild ass of the Little Rann can run at about 70 km an hour.", "छोटे रण का घुड़खर लगभग 70 किमी प्रति घंटे की रफ़्तार से दौड़ सकता है।", "ಪುಟ್ಟ ರಣದ ಕಾಡುಕತ್ತೆ ಗಂಟೆಗೆ ಸುಮಾರು 70 ಕಿಮೀ ವೇಗದಲ್ಲಿ ಓಡಬಲ್ಲದು."],
   ["Flamingos are pink because of the tiny shrimp and algae they eat.", "राजहंस गुलाबी इसलिए होते हैं क्योंकि वे छोटे झींगे और शैवाल खाते हैं।", "ರಾಜಹಂಸಗಳು ತಿನ್ನುವ ಪುಟ್ಟ ಸಿಗಡಿ, ಪಾಚಿಯಿಂದಾಗಿ ಅವು ಗುಲಾಬಿ ಬಣ್ಣ."],
   ["The Gulf of Kutch has India's first marine national park.", "कच्छ की खाड़ी में भारत का पहला समुद्री राष्ट्रीय उद्यान है।", "ಕಚ್ಛ್ ಕೊಲ್ಲಿಯಲ್ಲಿ ಭಾರತದ ಮೊದಲ ಸಮುದ್ರ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವಿದೆ."],
   ["Dholavira had a signboard of ten big Harappan letters that no one can read even today.", "धोलावीरा में दस बड़े हड़प्पा अक्षरों वाला एक सूचना-पट मिला, जिसे आज तक कोई पढ़ नहीं पाया।", "ಧೋಲಾವೀರದಲ್ಲಿ ಹತ್ತು ದೊಡ್ಡ ಹರಪ್ಪಾ ಅಕ್ಷರಗಳ ಫಲಕ ಸಿಕ್ಕಿದೆ; ಇಂದಿಗೂ ಯಾರೂ ಓದಲಾಗಿಲ್ಲ."],
   ["Lothal had one of the world's oldest dockyards, about 4,000 years old.", "लोथल में दुनिया के सबसे पुराने गोदीबाड़ों में से एक था, लगभग 4,000 साल पुराना।", "ಲೋಥಲ್‌ನಲ್ಲಿ ಸುಮಾರು 4,000 ವರ್ಷ ಹಳೆಯ, ಜಗತ್ತಿನ ಅತಿ ಹಳೆಯ ಹಡಗುಕಟ್ಟೆಗಳಲ್ಲಿ ಒಂದಿತ್ತು."],
   ["The chhakda is a motorbike cart from Saurashtra, painted in bright colours.", "छकड़ा सौराष्ट्र की मोटरसाइकिल-गाड़ी है, चटक रंगों से सजी।", "ಛಕಡಾ ಸೌರಾಷ್ಟ್ರದ ಮೋಟಾರ್‌ಬೈಕ್ ಗಾಡಿ; ಗಾಢ ಬಣ್ಣಗಳಿಂದ ಸಿಂಗರಿಸಿರುತ್ತಾರೆ."],
   ["Garba gets its name from the garbo, a clay pot with holes and a lamp inside.", "गरबा का नाम गरबो से आया है, छेद वाला मिट्टी का घड़ा जिसमें दीया जलता है।", "ಗರ್ಬಾ ಎಂಬ ಹೆಸರು 'ಗರ್ಬೋ'ದಿಂದ ಬಂದಿದೆ; ತೂತುಗಳಿರುವ ಮಣ್ಣಿನ ಮಡಕೆಯೊಳಗೆ ದೀಪ."]],
  dd:[["Diu is the only place in India where the hoka palm grows. The Portuguese brought it from Africa, and its trunk splits into branches like a palm with many arms.", "भारत में होका ताड़ सिर्फ़ दीव में उगता है। पुर्तगाली इसे अफ़्रीका से लाए थे, और इसका तना शाखाओं में बँट जाता है, जैसे कई बाँहों वाला ताड़।", "ಭಾರತದಲ್ಲಿ ಹೋಕಾ ತಾಳೆ ಬೆಳೆಯುವುದು ದಿಯುವಿನಲ್ಲಿ ಮಾತ್ರ. ಪೋರ್ಚುಗೀಸರು ಇದನ್ನು ಆಫ್ರಿಕಾದಿಂದ ತಂದರು; ಇದರ ಕಾಂಡ ಕೊಂಬೆಗಳಾಗಿ ಒಡೆದು, ಹಲವು ತೋಳುಗಳಿರುವ ತಾಳೆಮರದಂತೆ ಕಾಣುತ್ತದೆ."],
   ["The tarpa is a Warli wind instrument made from a dried bottle gourd and bamboo. At harvest time, dancers move in a circle around the tarpa player.", "तारपा वारली लोगों का फूँककर बजाने वाला वाद्य है, जो सूखी लौकी और बाँस से बनता है। फ़सल के समय नर्तक तारपा बजाने वाले के चारों ओर घेरे में नाचते हैं।", "ತಾರ್ಪಾ ವಾರ್ಲಿ ಜನರ ಊದುವ ವಾದ್ಯ; ಒಣಗಿದ ಸೋರೆಕಾಯಿ ಮತ್ತು ಬಿದಿರಿನಿಂದ ಮಾಡುತ್ತಾರೆ. ಸುಗ್ಗಿಯ ಕಾಲದಲ್ಲಿ ಕುಣಿಯುವವರು ತಾರ್ಪಾ ಊದುವವನ ಸುತ್ತ ವೃತ್ತವಾಗಿ ಹೆಜ್ಜೆ ಹಾಕುತ್ತಾರೆ."],
   ["Warli artists paint with white rice paste on mud walls, drawing people and animals with just circles, triangles and lines.", "वारली कलाकार मिट्टी की दीवारों पर चावल के सफ़ेद लेप से चित्र बनाते हैं; लोग और जानवर सिर्फ़ गोले, त्रिकोण और रेखाओं से बनते हैं।", "ವಾರ್ಲಿ ಕಲಾವಿದರು ಮಣ್ಣಿನ ಗೋಡೆಯ ಮೇಲೆ ಬಿಳಿ ಅಕ್ಕಿಹಿಟ್ಟಿನ ಲೇಪದಿಂದ ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾರೆ; ಮನುಷ್ಯರು, ಪ್ರಾಣಿಗಳು ಎಲ್ಲವೂ ವೃತ್ತ, ತ್ರಿಕೋನ ಮತ್ತು ಗೆರೆಗಳಿಂದಲೇ ಮೂಡುತ್ತವೆ."],
   ["Work on Daman's Church of Bom Jesus began in 1559, and it was consecrated in 1603. Its carved wooden altar glows with gold.", "दमण के बॉम जीसस चर्च का काम 1559 में शुरू हुआ और 1603 में इसका अभिषेक हुआ। इसकी नक्काशीदार लकड़ी की वेदी सोने जैसी चमकती है।", "ದಮನ್‌ನ ಬಾಮ್ ಜೀಸಸ್ ಇಗರ್ಜಿಯ ಕೆಲಸ 1559ರಲ್ಲಿ ಶುರುವಾಗಿ 1603ರಲ್ಲಿ ಪ್ರತಿಷ್ಠಾಪನೆಯಾಯಿತು. ಇದರ ಕೆತ್ತನೆಯ ಮರದ ಬಲಿಪೀಠ ಚಿನ್ನದಂತೆ ಹೊಳೆಯುತ್ತದೆ."],
   ["Diu Fort was built in 1535. The sea guards it on three sides, and its builders used a creek as a moat.", "दीव का किला 1535 में बना। तीन तरफ़ से समुद्र इसकी रक्षा करता है, और बनाने वालों ने एक खाड़ी को खाई की तरह इस्तेमाल किया।", "ದಿಯು ಕೋಟೆ 1535ರಲ್ಲಿ ಕಟ್ಟಲ್ಪಟ್ಟಿತು. ಮೂರು ಕಡೆ ಕಡಲೇ ಇದಕ್ಕೆ ಕಾವಲು; ಕಟ್ಟಿದವರು ಹಿನ್ನೀರಿನ ಕಾಲುವೆಯನ್ನು ಕಂದಕವಾಗಿ ಬಳಸಿದರು."],
   ["Bombil, also called Bombay duck, is not a duck at all! It is a soft fish that cooks on this coast fry until crisp.", "बोंबिल को 'बॉम्बे डक' भी कहते हैं, पर यह बत्तख नहीं है! यह एक नरम मछली है, जिसे इस तट पर कुरकुरा तला जाता है।", "ಬೊಂಬಿಲ್ ಅನ್ನು 'ಬಾಂಬೆ ಡಕ್' ಎಂದೂ ಕರೆಯುತ್ತಾರೆ, ಆದರೆ ಇದು ಬಾತುಕೋಳಿಯಲ್ಲ! ಇದು ಮೃದುವಾದ ಮೀನು; ಈ ಕಡಲತೀರದಲ್ಲಿ ಇದನ್ನು ಗರಿಗರಿಯಾಗಿ ಹುರಿಯುತ್ತಾರೆ."],
   ["Tribal craftspeople of Dadra and Nagar Haveli weave baskets from bendy bamboo, from tiny boxes to big storage baskets called moti topli.", "दादरा और नागर हवेली के आदिवासी कारीगर लचीले बाँस से टोकरियाँ बुनते हैं, छोटी डिबियों से लेकर 'मोटी टोपली' कहलाने वाली बड़ी टोकरियों तक।", "ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿಯ ಬುಡಕಟ್ಟು ಕುಶಲಕರ್ಮಿಗಳು ಬಾಗುವ ಬಿದಿರಿನಿಂದ ಬುಟ್ಟಿ ಹೆಣೆಯುತ್ತಾರೆ; ಪುಟ್ಟ ಡಬ್ಬಿಗಳಿಂದ ಹಿಡಿದು 'ಮೋಟಿ ಟೋಪ್ಲಿ' ಎಂಬ ದೊಡ್ಡ ಕಣಜ ಬುಟ್ಟಿಗಳವರೆಗೆ."],
   ["Chital, the spotted deer, keep their white spots all their lives. Herds of them graze at Satmaliya Deer Park near Silvassa.", "चीतल यानी चित्तीदार हिरण के सफ़ेद धब्बे उम्र भर रहते हैं। सिलवासा के पास सतमालिया हिरण उद्यान में इनके झुंड चरते हैं।", "ಚುಕ್ಕೆ ಜಿಂಕೆಯ ಬಿಳಿ ಚುಕ್ಕೆಗಳು ಜೀವನವಿಡೀ ಉಳಿಯುತ್ತವೆ. ಸಿಲ್ವಾಸಾ ಬಳಿಯ ಸತ್ಮಾಲಿಯಾ ಜಿಂಕೆ ವನದಲ್ಲಿ ಇವುಗಳ ಹಿಂಡು ಮೇಯುತ್ತದೆ."],
   ["Daman's Koli fishing families sail out in colourful wooden boats and bring the catch home to the jetty at Nani Daman.", "दमण के कोली मछुआरे परिवार रंग-बिरंगी लकड़ी की नावों में समुद्र में जाते हैं और पकड़ी मछलियाँ नानी दमण की जेटी पर लाते हैं।", "ದಮನ್‌ನ ಕೋಲಿ ಮೀನುಗಾರ ಕುಟುಂಬಗಳು ಬಣ್ಣದ ಮರದ ದೋಣಿಗಳಲ್ಲಿ ಕಡಲಿಗೆ ಹೋಗಿ, ಹಿಡಿದ ಮೀನನ್ನು ನಾನಿ ದಮನ್‌ನ ದೋಣಿಕಟ್ಟೆಗೆ ತರುತ್ತಾರೆ."],
   ["Azulejos are painted tiles from Portugal, often blue and white. Their name comes from an Arabic word for a small polished stone.", "अज़ुलेजो पुर्तगाल की रंगी हुई टाइलें हैं, जो अक्सर नीली-सफ़ेद होती हैं। इनका नाम एक अरबी शब्द से आया है, जिसका मतलब है छोटा चिकना पत्थर।", "ಅಜುಲೆಜೊ ಎಂದರೆ ಪೋರ್ಚುಗಲ್‌ನ ಬಣ್ಣ ಬಳಿದ ಬಿಲ್ಲೆಗಳು; ಹೆಚ್ಚಾಗಿ ನೀಲಿ-ಬಿಳಿ. ಇವುಗಳ ಹೆಸರು 'ನುಣುಪಾದ ಪುಟ್ಟ ಕಲ್ಲು' ಎನ್ನುವ ಅರಬ್ಬೀ ಪದದಿಂದ ಬಂದಿದೆ."],
   ["Nagli is the local name for ragi, or finger millet. Tribal families of Dadra and Nagar Haveli eat thick nagli rotlas, often with kadhi.", "नागली रागी यानी मंडुए का स्थानीय नाम है। दादरा और नागर हवेली के आदिवासी परिवार मोटे नागली रोटले खाते हैं, अक्सर कढ़ी के साथ।", "ನಾಗ್ಲಿ ಎಂಬುದು ರಾಗಿಯ ಸ್ಥಳೀಯ ಹೆಸರು. ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿಯ ಬುಡಕಟ್ಟು ಕುಟುಂಬಗಳು ದಪ್ಪನೆಯ ನಾಗ್ಲಿ ರೊಟ್ಟಿಯನ್ನು, ಹೆಚ್ಚಾಗಿ ಮಜ್ಜಿಗೆ ಹುಳಿಯ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Diu's Sea Shell Museum near Nagoa holds about 3,000 shells and sea creatures from oceans around the world.", "नागोआ के पास दीव के सीपी संग्रहालय में दुनिया भर के समुद्रों से लाई गई लगभग 3,000 सीपियाँ और समुद्री जीव हैं।", "ನಾಗೋವಾ ಬಳಿಯ ದಿಯುವಿನ ಕಡಲ ಚಿಪ್ಪಿನ ವಸ್ತುಸಂಗ್ರಹಾಲಯದಲ್ಲಿ ಜಗತ್ತಿನ ಸಮುದ್ರಗಳಿಂದ ತಂದ ಸುಮಾರು 3,000 ಚಿಪ್ಪುಗಳು ಮತ್ತು ಕಡಲಜೀವಿಗಳಿವೆ."],
   ["Tall, feathery casuarina trees line Jampore Beach in Daman and hum softly in the sea breeze.", "दमण के जामपोर बीच पर ऊँचे, रोएँदार पत्तों वाले कैज़ुअरीना पेड़ कतार में खड़े हैं, जो समुद्री हवा में धीमे-धीमे सरसराते हैं।", "ದಮನ್‌ನ ಜಾಂಪೋರ್ ಕಡಲತೀರದುದ್ದಕ್ಕೂ ಎತ್ತರದ ಗಾಳಿಮರಗಳ ಸಾಲಿದೆ; ಕಡಲ ಗಾಳಿಯಲ್ಲಿ ಅವು ಮೆಲ್ಲಗೆ ಸುಯ್ಯೆನ್ನುತ್ತವೆ."],
   ["The ghangri is a string instrument made with gourds. Warli storytellers play it while they sing their stories.", "घांगरी लौकी से बना तार वाला वाद्य है। वारली कथावाचक अपनी कहानियाँ गाते हुए इसे बजाते हैं।", "ಘಾಂಗ್ರಿ ಸೋರೆಕಾಯಿಯಿಂದ ಮಾಡಿದ ತಂತಿ ವಾದ್ಯ. ವಾರ್ಲಿ ಕಥೆಗಾರರು ಕಥೆ ಹಾಡುತ್ತಾ ಇದನ್ನು ನುಡಿಸುತ್ತಾರೆ."],
   ["For weddings, Warli women paint a square called a chauk on the wall, with the mother goddess Palaghata in the middle.", "शादियों में वारली महिलाएँ दीवार पर 'चौक' नाम का चौकोर चित्र बनाती हैं, जिसके बीच में माँ देवी पालघाटा होती हैं।", "ಮದುವೆಗಳಲ್ಲಿ ವಾರ್ಲಿ ಹೆಣ್ಣುಮಕ್ಕಳು ಗೋಡೆಯ ಮೇಲೆ 'ಚೌಕ' ಎಂಬ ಚೌಕಾಕಾರದ ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾರೆ; ಅದರ ನಡುವೆ ತಾಯಿ ದೇವತೆ ಪಾಲಘಾಟಾ ಇರುತ್ತಾಳೆ."],
   ["St Paul's Church in Diu was finished in 1610. Of Diu's three old Portuguese churches, it is the only one still used for prayer.", "दीव का सेंट पॉल चर्च 1610 में पूरा हुआ। दीव के तीन पुराने पुर्तगाली गिरजों में सिर्फ़ इसी में आज भी प्रार्थना होती है।", "ದಿಯುವಿನ ಸಂತ ಪೌಲರ ಇಗರ್ಜಿ 1610ರಲ್ಲಿ ಪೂರ್ಣಗೊಂಡಿತು. ದಿಯುವಿನ ಮೂರು ಹಳೆಯ ಪೋರ್ಚುಗೀಸ್ ಇಗರ್ಜಿಗಳಲ್ಲಿ ಇಂದಿಗೂ ಪ್ರಾರ್ಥನೆ ನಡೆಯುವುದು ಇದರಲ್ಲಿ ಮಾತ್ರ."],
   ["Panikotha, the 'water fort', stands on a rock in the sea about one nautical mile from Diu's jetty, with a lighthouse and a small chapel.", "पानीकोठा यानी 'पानी का किला' दीव की जेटी से लगभग एक समुद्री मील दूर समुद्र में एक चट्टान पर खड़ा है, जिसमें एक लाइटहाउस और छोटा गिरजा है।", "ಪಾನಿಕೋಠಾ ಅಂದರೆ 'ನೀರಿನ ಕೋಟೆ'; ದಿಯುವಿನ ದೋಣಿಕಟ್ಟೆಯಿಂದ ಸುಮಾರು ಒಂದು ನಾವಿಕ ಮೈಲಿ ದೂರದ ಕಡಲ ಬಂಡೆಯ ಮೇಲಿದೆ, ಅದರಲ್ಲಿ ದೀಪಸ್ತಂಭ ಮತ್ತು ಪುಟ್ಟ ಪ್ರಾರ್ಥನಾ ಮಂದಿರವಿದೆ."],
   ["Silver pomfret is a flat, round fish that coastal cooks love to rub with spices and fry.", "सिल्वर पापलेट एक चपटी, गोल मछली है, जिसे तटीय रसोइए मसाला लगाकर तलना पसंद करते हैं।", "ಬೆಳ್ಳಿ ಮಾಂಜಿ ಚಪ್ಪಟೆಯಾದ, ದುಂಡನೆಯ ಮೀನು; ಕರಾವಳಿಯ ಅಡುಗೆಯವರು ಇದಕ್ಕೆ ಮಸಾಲೆ ಹಚ್ಚಿ ಹುರಿಯಲು ಇಷ್ಟಪಡುತ್ತಾರೆ."],
   ["A cone-shaped bamboo fish trap is easy for fish to swim into but very hard for them to find the way out.", "शंकु के आकार के बाँस के जाल में मछली आसानी से घुस जाती है, पर बाहर निकलने का रास्ता ढूँढना बहुत मुश्किल होता है।", "ಶಂಕುವಿನ ಆಕಾರದ ಬಿದಿರಿನ ಬಲೆಯೊಳಗೆ ಮೀನು ಸುಲಭವಾಗಿ ನುಗ್ಗುತ್ತದೆ, ಆದರೆ ಹೊರಬರುವ ದಾರಿ ಹುಡುಕುವುದು ತುಂಬಾ ಕಷ್ಟ."],
   ["Blackbucks are among the fastest antelopes in the world. The males have long spiral horns, and some live at Satmaliya Deer Park.", "काला हिरण दुनिया के सबसे तेज़ हिरणों में से एक है। नरों के लंबे घुमावदार सींग होते हैं, और कुछ सतमालिया हिरण उद्यान में रहते हैं।", "ಕೃಷ್ಣಮೃಗ ಜಗತ್ತಿನ ಅತಿ ವೇಗದ ಜಿಂಕೆಗಳಲ್ಲಿ ಒಂದು. ಗಂಡುಗಳಿಗೆ ಸುರುಳಿಯಾದ ಉದ್ದ ಕೊಂಬುಗಳಿರುತ್ತವೆ; ಕೆಲವು ಸತ್ಮಾಲಿಯಾ ಜಿಂಕೆ ವನದಲ್ಲಿ ಇವೆ."],
   ["Small motor launches carry visitors from Diu's jetty across the water to the Panikotha sea fort.", "छोटी मोटर नावें सैलानियों को दीव की जेटी से पानी पार पानीकोठा समुद्री किले तक ले जाती हैं।", "ಪುಟ್ಟ ಯಂತ್ರದೋಣಿಗಳು ಪ್ರವಾಸಿಗರನ್ನು ದಿಯುವಿನ ದೋಣಿಕಟ್ಟೆಯಿಂದ ನೀರು ದಾಟಿಸಿ ಪಾನಿಕೋಠಾ ಕಡಲ ಕೋಟೆಗೆ ಕರೆದೊಯ್ಯುತ್ತವೆ."],
   ["Blue-and-white plates are painted with cobalt blue, a colour that stays bright even after the plate is fired in a hot kiln.", "नीली-सफ़ेद प्लेटों पर कोबाल्ट नीले रंग से चित्र बनते हैं, जो गरम भट्ठी में पकने के बाद भी चटक बना रहता है।", "ನೀಲಿ-ಬಿಳಿ ತಟ್ಟೆಗಳ ಮೇಲೆ ಕೋಬಾಲ್ಟ್ ನೀಲಿ ಬಣ್ಣದಿಂದ ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾರೆ; ಬಿಸಿ ಆವಿಗೆಯಲ್ಲಿ ಸುಟ್ಟ ಮೇಲೂ ಆ ಬಣ್ಣ ಮಾಸುವುದಿಲ್ಲ."],
   ["Bhakri is a thick, round flatbread. Along this coast it is often made with rice flour and baked on a clay griddle.", "भाखरी मोटी, गोल रोटी है। इस तट पर इसे अक्सर चावल के आटे से बनाकर मिट्टी के तवे पर सेंका जाता है।", "ಭಾಕ್ರಿ ದಪ್ಪನೆಯ ದುಂಡು ರೊಟ್ಟಿ. ಈ ಕರಾವಳಿಯಲ್ಲಿ ಇದನ್ನು ಹೆಚ್ಚಾಗಿ ಅಕ್ಕಿಹಿಟ್ಟಿನಿಂದ ಮಾಡಿ ಮಣ್ಣಿನ ಹೆಂಚಿನ ಮೇಲೆ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["A conch shell is blown like a trumpet in temples and during prayers; it can be heard far away.", "शंख को मंदिरों में और पूजा के समय तुरही की तरह फूँका जाता है; इसकी आवाज़ दूर तक सुनाई देती है।", "ಶಂಖವನ್ನು ದೇವಾಲಯಗಳಲ್ಲಿ ಮತ್ತು ಪೂಜೆಯ ಸಮಯದಲ್ಲಿ ಕಹಳೆಯಂತೆ ಊದುತ್ತಾರೆ; ಅದರ ಸದ್ದು ದೂರದವರೆಗೂ ಕೇಳುತ್ತದೆ."],
   ["Vasona Lion Safari near Silvassa was set up to help Asiatic lions: cubs are fed and cared for until they can hunt on their own.", "सिलवासा के पास वासोना लायन सफ़ारी एशियाई शेरों की मदद के लिए बनी: शावकों को तब तक खिलाया और सँभाला जाता है, जब तक वे ख़ुद शिकार न करने लगें।", "ಸಿಲ್ವಾಸಾ ಬಳಿಯ ವಾಸೋನಾ ಸಿಂಹಧಾಮವನ್ನು ಏಷ್ಯಾದ ಸಿಂಹಗಳ ನೆರವಿಗಾಗಿ ಆರಂಭಿಸಲಾಯಿತು; ಮರಿಗಳು ತಾವೇ ಬೇಟೆಯಾಡುವವರೆಗೂ ಅವಕ್ಕೆ ಆಹಾರ, ಆರೈಕೆ ನೀಡುತ್ತಾರೆ."],
   ["Moti Daman has two lighthouses: the old one was built by the Portuguese and the newer one by the Government of India.", "मोटी दमण में दो लाइटहाउस हैं: पुराना पुर्तगालियों ने बनाया और नया भारत सरकार ने।", "ಮೋಟಿ ದಮನ್‌ನಲ್ಲಿ ಎರಡು ದೀಪಸ್ತಂಭಗಳಿವೆ: ಹಳೆಯದನ್ನು ಪೋರ್ಚುಗೀಸರು, ಹೊಸದನ್ನು ಭಾರತ ಸರ್ಕಾರ ಕಟ್ಟಿತು."],
   ["A giant statue of St Jerome stands at the river gate of Nani Daman's fort, with two huge figures on either side of the gateway.", "नानी दमण के किले के नदी वाले दरवाज़े पर सेंट जेरोम की बड़ी मूर्ति है, और दरवाज़े के दोनों ओर दो विशाल आकृतियाँ हैं।", "ನಾನಿ ದಮನ್ ಕೋಟೆಯ ನದಿ ಕಡೆಯ ಹೆಬ್ಬಾಗಿಲಲ್ಲಿ ಸಂತ ಜೆರೋಮರ ದೊಡ್ಡ ಪ್ರತಿಮೆ ಇದೆ; ಬಾಗಿಲಿನ ಎರಡೂ ಬದಿಗೆ ಎರಡು ದೈತ್ಯ ಆಕೃತಿಗಳಿವೆ."],
   ["The INS Khukri Memorial in Diu keeps a model of the warship in a glass house, looking out at the sea where the ship sank in 1971.", "दीव के आईएनएस खुकरी स्मारक में युद्धपोत का मॉडल शीशे के घर में रखा है, जो उसी समुद्र की ओर देखता है जहाँ 1971 में जहाज़ डूबा था।", "ದಿಯುವಿನ ಐಎನ್‌ಎಸ್ ಖುಕ್ರಿ ಸ್ಮಾರಕದಲ್ಲಿ ಯುದ್ಧನೌಕೆಯ ಮಾದರಿ ಗಾಜಿನ ಮನೆಯೊಳಗಿದೆ; 1971ರಲ್ಲಿ ಹಡಗು ಮುಳುಗಿದ ಕಡಲಿನತ್ತಲೇ ಅದು ನೋಡುತ್ತಿದೆ."],
   ["At Gangeshwar temple in Diu, five Shiva lingas sit among the rocks and the sea washes over them at high tide.", "दीव के गंगेश्वर मंदिर में पाँच शिवलिंग चट्टानों के बीच हैं, और ज्वार के समय समुद्र उन्हें धो जाता है।", "ದಿಯುವಿನ ಗಂಗೇಶ್ವರ ದೇವಾಲಯದಲ್ಲಿ ಬಂಡೆಗಳ ನಡುವೆ ಐದು ಶಿವಲಿಂಗಗಳಿವೆ; ಉಬ್ಬರದ ಸಮಯದಲ್ಲಿ ಕಡಲು ಅವುಗಳ ಮೇಲೆ ಹರಿಯುತ್ತದೆ."],
   ["The Naida Caves are a maze of tunnels and steps cut into the rock. Sunlight streams in through openings in the roof.", "नायडा गुफाएँ चट्टान में कटी सुरंगों और सीढ़ियों की भूलभुलैया हैं। छत के खुले हिस्सों से धूप की धारें अंदर आती हैं।", "ನಾಯ್ಡಾ ಗುಹೆಗಳು ಬಂಡೆಯಲ್ಲಿ ಕೊರೆದ ಸುರಂಗ, ಮೆಟ್ಟಿಲುಗಳ ಜಟಿಲ ದಾರಿ. ಮೇಲ್ಛಾವಣಿಯ ತೆರಪುಗಳಿಂದ ಬಿಸಿಲಿನ ಕೋಲುಗಳು ಒಳಗೆ ಇಳಿಯುತ್ತವೆ."],
   ["Bebinca is a layered sweet from Portuguese times, made with coconut milk, eggs and sugar and baked one thin layer at a time.", "बेबिंका पुर्तगाली दौर की परतदार मिठाई है, जो नारियल के दूध, अंडे और चीनी से बनती है और एक-एक पतली परत करके सेंकी जाती है।", "ಬೆಬಿಂಕಾ ಪೋರ್ಚುಗೀಸರ ಕಾಲದ ಪದರ ಪದರದ ಸಿಹಿ; ತೆಂಗಿನ ಹಾಲು, ಮೊಟ್ಟೆ, ಸಕ್ಕರೆಯಿಂದ ಮಾಡಿ ಒಂದೊಂದೇ ತೆಳು ಪದರವಾಗಿ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["Seafood curry made with fish, prawns or crab from the Arabian Sea is a favourite meal in Daman and Diu.", "अरब सागर की मछली, झींगे या केकड़े से बनी करी दमण और दीव का पसंदीदा खाना है।", "ಅರಬ್ಬೀ ಸಮುದ್ರದ ಮೀನು, ಸಿಗಡಿ ಅಥವಾ ಏಡಿಯ ಸಾರು ದಮನ್ ಮತ್ತು ದಿಯುವಿನ ಮೆಚ್ಚಿನ ಊಟ."],
   ["The hoka fruit is very hard to chew but tastes sweet. Baskets of this fruit were even found in Tutankhamun's tomb in Egypt.", "होका फल चबाने में बहुत सख़्त पर स्वाद में मीठा होता है। मिस्र में तूतनखामुन की क़ब्र में भी इस फल की टोकरियाँ मिली थीं।", "ಹೋಕಾ ಹಣ್ಣು ಅಗಿಯಲು ತುಂಬಾ ಗಟ್ಟಿ, ಆದರೆ ರುಚಿಗೆ ಸಿಹಿ. ಈಜಿಪ್ಟಿನ ತೂತನ್‌ಖಾಮುನ್ ಸಮಾಧಿಯಲ್ಲೂ ಈ ಹಣ್ಣಿನ ಬುಟ್ಟಿಗಳು ಸಿಕ್ಕಿದ್ದವು."],
   ["Mangroves grow in salty water on stilt-like roots. At Fudam in Diu, they give birds a safe place to feed and nest.", "मैंग्रोव खारे पानी में खंभों जैसी जड़ों पर उगते हैं। दीव के फुदम में ये पक्षियों को दाना चुगने और घोंसला बनाने की सुरक्षित जगह देते हैं।", "ಕಾಂಡ್ಲಾ ಮರಗಳು ಉಪ್ಪುನೀರಿನಲ್ಲಿ ಕಂಬದಂತಹ ಬೇರುಗಳ ಮೇಲೆ ಬೆಳೆಯುತ್ತವೆ. ದಿಯುವಿನ ಫುದಮ್‌ನಲ್ಲಿ ಇವು ಹಕ್ಕಿಗಳಿಗೆ ಆಹಾರ ಹುಡುಕಲು, ಗೂಡು ಕಟ್ಟಲು ಸುರಕ್ಷಿತ ತಾಣ."],
   ["Silvassa's Tribal Cultural Museum shows masks, musical instruments, jewellery and hunting tools of the local tribes.", "सिलवासा का आदिवासी सांस्कृतिक संग्रहालय यहाँ की जनजातियों के मुखौटे, वाद्य, गहने और शिकार के औज़ार दिखाता है।", "ಸಿಲ್ವಾಸಾದ ಬುಡಕಟ್ಟು ಸಾಂಸ್ಕೃತಿಕ ವಸ್ತುಸಂಗ್ರಹಾಲಯದಲ್ಲಿ ಇಲ್ಲಿನ ಬುಡಕಟ್ಟುಗಳ ಮುಖವಾಡ, ವಾದ್ಯ, ಆಭರಣ ಮತ್ತು ಬೇಟೆಯ ಉಪಕರಣಗಳಿವೆ."],
   ["Warli homes are built of mud, bamboo and cow dung, and their walls become canvases for white paintings.", "वारली घर मिट्टी, बाँस और गोबर से बनते हैं, और उनकी दीवारें सफ़ेद चित्रों का कैनवास बन जाती हैं।", "ವಾರ್ಲಿ ಮನೆಗಳನ್ನು ಮಣ್ಣು, ಬಿದಿರು ಮತ್ತು ಸಗಣಿಯಿಂದ ಕಟ್ಟುತ್ತಾರೆ; ಅವುಗಳ ಗೋಡೆಗಳೇ ಬಿಳಿ ಚಿತ್ರಗಳಿಗೆ ಹಾಳೆಯಾಗುತ್ತವೆ."],
   ["In the Tur and Thali dance of Dadra and Nagar Haveli, the beat of a drum and a brass plate keeps the dancers moving.", "दादरा और नागर हवेली के तूर और थाली नृत्य में ढोल और पीतल की थाली की थाप पर नर्तक थिरकते हैं।", "ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿಯ ತೂರ್ ಮತ್ತು ಥಾಲಿ ಕುಣಿತದಲ್ಲಿ ಡೋಲು ಮತ್ತು ಹಿತ್ತಾಳೆ ತಟ್ಟೆಯ ಬಡಿತಕ್ಕೆ ನರ್ತಕರು ಹೆಜ್ಜೆ ಹಾಕುತ್ತಾರೆ."],
   ["Old houses in Daman and Diu have tiled roofs, wooden balconies and bright painted walls from Portuguese times.", "दमण और दीव के पुराने घरों में खपरैल की छतें, लकड़ी के छज्जे और पुर्तगाली दौर की रंगीन दीवारें हैं।", "ದಮನ್ ಮತ್ತು ದಿಯುವಿನ ಹಳೆಯ ಮನೆಗಳಿಗೆ ಹೆಂಚಿನ ಮಾಡು, ಮರದ ಮೊಗಸಾಲೆ ಮತ್ತು ಪೋರ್ಚುಗೀಸರ ಕಾಲದ ಬಣ್ಣದ ಗೋಡೆಗಳಿವೆ."],
   ["Mando is a song-and-dance tradition of Diu, with gentle tunes that took shape in Portuguese times.", "मांडो दीव की गीत-नृत्य परंपरा है, जिसकी मधुर धुनें पुर्तगाली दौर में बनीं।", "ಮಾಂಡೋ ದಿಯುವಿನ ಹಾಡು-ಕುಣಿತದ ಪರಂಪರೆ; ಇದರ ಮೃದುವಾದ ರಾಗಗಳು ಪೋರ್ಚುಗೀಸರ ಕಾಲದಲ್ಲಿ ರೂಪುಗೊಂಡವು."],
   ["Dudhni Lake is part of the Madhuban dam reservoir, and visitors ride boats across its calm water.", "दूधनी झील मधुबन बाँध के जलाशय का हिस्सा है, जहाँ सैलानी शांत पानी पर नाव की सैर करते हैं।", "ದೂಧ್ನಿ ಸರೋವರ ಮಧುಬನ್ ಅಣೆಕಟ್ಟಿನ ಜಲಾಶಯದ ಭಾಗ; ಪ್ರವಾಸಿಗರು ಅದರ ಶಾಂತ ನೀರಿನಲ್ಲಿ ದೋಣಿ ವಿಹಾರ ಮಾಡುತ್ತಾರೆ."],
   ["Making leather slippers is one of the popular crafts of this region.", "चमड़े की चप्पलें बनाना इस इलाक़े के लोकप्रिय हस्तशिल्पों में से एक है।", "ಚರ್ಮದ ಚಪ್ಪಲಿ ಮಾಡುವುದು ಈ ಪ್ರದೇಶದ ಜನಪ್ರಿಯ ಕರಕುಶಲಗಳಲ್ಲಿ ಒಂದು."],
   ["Weaving mats from palm leaves and baskets from bamboo are old crafts in Dadra and Nagar Haveli.", "ताड़ के पत्तों से चटाई और बाँस से टोकरियाँ बुनना दादरा और नागर हवेली के पुराने हुनर हैं।", "ತಾಳೆಗರಿಯಿಂದ ಚಾಪೆ, ಬಿದಿರಿನಿಂದ ಬುಟ್ಟಿ ಹೆಣೆಯುವುದು ದಾದ್ರಾ ಮತ್ತು ನಗರ ಹವೇಲಿಯ ಹಳೆಯ ಕಲೆ."],
   ["Ubadiyu is a winter dish: beans and vegetables are packed into a clay pot, sealed, and slow-cooked upside down in a pit of fire.", "उबाड़ियू सर्दियों का पकवान है: फलियाँ और सब्ज़ियाँ मिट्टी की हाँडी में भरकर बंद की जाती हैं और उलटी करके आग के गड्ढे में धीमे-धीमे पकाई जाती हैं।", "ಉಬಾಡಿಯು ಚಳಿಗಾಲದ ಅಡುಗೆ: ಅವರೆ, ತರಕಾರಿಗಳನ್ನು ಮಣ್ಣಿನ ಮಡಕೆಯಲ್ಲಿ ತುಂಬಿ ಬಾಯಿ ಮುಚ್ಚಿ, ತಲೆಕೆಳಗಾಗಿ ಬೆಂಕಿಯ ಗುಂಡಿಯಲ್ಲಿ ನಿಧಾನವಾಗಿ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["Zampa Gateway is the main old entrance to Diu town, and it is painted bright red.", "ज़ाम्पा द्वार दीव शहर का पुराना मुख्य दरवाज़ा है, जिसे चटक लाल रंग से रंगा गया है।", "ಝಾಂಪಾ ಹೆಬ್ಬಾಗಿಲು ದಿಯು ಪಟ್ಟಣದ ಹಳೆಯ ಮುಖ್ಯ ಪ್ರವೇಶದ್ವಾರ; ಅದಕ್ಕೆ ಗಾಢ ಕೆಂಪು ಬಣ್ಣ ಬಳಿದಿದ್ದಾರೆ."]],
  ga:[["The cashew is Goa's state fruit. Each nut grows hanging below a juicy, bright cashew apple.", "काजू गोवा का राज्य फल है। हर काजू एक रसीले, चमकीले काजू-फल के नीचे लटककर उगता है।", "ಗೋಡಂಬಿ ಗೋವಾದ ರಾಜ್ಯ ಹಣ್ಣು. ಪ್ರತಿಯೊಂದು ಬೀಜವೂ ರಸಭರಿತ, ಬಣ್ಣದ ಗೇರುಹಣ್ಣಿನ ಕೆಳಗೆ ನೇತಾಡುತ್ತಾ ಬೆಳೆಯುತ್ತದೆ."],
   ["The ghumot is a drum made from a clay pot with a skin stretched over its mouth. It is played at Ganesh Chaturthi and in Goan folk songs.", "घुमट मिट्टी के घड़े से बना वाद्य है, जिसके मुँह पर चमड़ा कसा होता है। इसे गणेश चतुर्थी पर और गोवा के लोकगीतों में बजाया जाता है।", "ಘುಮಟ್ ಮಣ್ಣಿನ ಮಡಕೆಯಿಂದ ಮಾಡಿದ ವಾದ್ಯ; ಅದರ ಬಾಯಿಗೆ ಚರ್ಮ ಬಿಗಿದಿರುತ್ತಾರೆ. ಗಣೇಶ ಚತುರ್ಥಿಯಲ್ಲಿ ಮತ್ತು ಗೋವಾದ ಜಾನಪದ ಹಾಡುಗಳಲ್ಲಿ ಇದನ್ನು ನುಡಿಸುತ್ತಾರೆ."],
   ["Goans call fish curry with rice 'xitt-kodi', and for many families it is lunch almost every day.", "गोवा के लोग फ़िश करी और चावल को 'शीत-कोडी' कहते हैं, और कई परिवारों में यह लगभग रोज़ का दोपहर का खाना है।", "ಗೋವಾದವರು ಮೀನು ಸಾರು-ಅನ್ನವನ್ನು 'ಶೀತ್-ಕೋಡಿ' ಎನ್ನುತ್ತಾರೆ; ಅನೇಕ ಮನೆಗಳಲ್ಲಿ ಇದೇ ಬಹುತೇಕ ದಿನದ ಮಧ್ಯಾಹ್ನದ ಊಟ."],
   ["The Basilica of Bom Jesus is the only church in Goa whose outer walls are not plastered, so you can see its red laterite stone.", "बॉम जीसस बेसिलिका गोवा का अकेला गिरजाघर है जिसकी बाहरी दीवारों पर पलस्तर नहीं है, इसलिए इसका लाल लेटराइट पत्थर दिखता है।", "ಬಾಮ್ ಜೀಸಸ್ ಬೆಸಿಲಿಕಾ ಗೋವಾದಲ್ಲಿ ಹೊರಗೋಡೆಗೆ ಗಾರೆ ಹಚ್ಚದ ಏಕೈಕ ಇಗರ್ಜಿ; ಅದಕ್ಕೇ ಇದರ ಕೆಂಪು ಮುರಕಲ್ಲು ಕಾಣುತ್ತದೆ."],
   ["Almost every part of the coconut palm is used in Goa: the water to drink, the flesh in curries, the leaves for roofs and the shells for crafts.", "गोवा में नारियल के पेड़ का लगभग हर हिस्सा काम आता है: पानी पीने में, गिरी करी में, पत्ते छत में और खोल हस्तशिल्प में।", "ಗೋವಾದಲ್ಲಿ ತೆಂಗಿನ ಮರದ ಬಹುತೇಕ ಪ್ರತಿಯೊಂದು ಭಾಗವೂ ಉಪಯೋಗಕ್ಕೆ ಬರುತ್ತದೆ: ಎಳನೀರು ಕುಡಿಯಲು, ಕಾಯಿ ಸಾರಿಗೆ, ಗರಿ ಮಾಡಿಗೆ, ಚಿಪ್ಪು ಕರಕುಶಲಕ್ಕೆ."],
   ["Kaavi art uses just one colour, a maroon-red called kaav, made from laterite soil. Artists scratch designs into it while the lime plaster is wet, so the white shows through.", "कावी कला में सिर्फ़ एक रंग होता है, लेटराइट मिट्टी से बना 'काव' नाम का कत्थई-लाल। चूने का पलस्तर गीला रहते ही कलाकार उसमें खुरचकर डिज़ाइन बनाते हैं, जिससे नीचे का सफ़ेद दिखता है।", "ಕಾವಿ ಕಲೆಯಲ್ಲಿ ಒಂದೇ ಬಣ್ಣ: ಮುರಕಲ್ಲಿನ ಮಣ್ಣಿನಿಂದ ಮಾಡಿದ 'ಕಾವು' ಎಂಬ ಕಡುಗೆಂಪು. ಸುಣ್ಣದ ಗಾರೆ ಹಸಿಯಾಗಿರುವಾಗಲೇ ಕಲಾವಿದರು ಅದರ ಮೇಲೆ ಕೆರೆದು ಚಿತ್ತಾರ ಮೂಡಿಸುತ್ತಾರೆ; ಕೆಳಗಿನ ಬಿಳುಪು ಹೊರಗೆ ಕಾಣುತ್ತದೆ."],
   ["Bebinca, the queen of Goan sweets, is baked one thin layer at a time from coconut milk, eggs, sugar and ghee.", "बेबिंका, गोवा की मिठाइयों की रानी, नारियल के दूध, अंडे, चीनी और घी से एक-एक पतली परत करके सेंकी जाती है।", "ಗೋವಾದ ಸಿಹಿಗಳ ರಾಣಿ ಬೆಬಿಂಕಾವನ್ನು ತೆಂಗಿನ ಹಾಲು, ಮೊಟ್ಟೆ, ಸಕ್ಕರೆ, ತುಪ್ಪದಿಂದ ಒಂದೊಂದೇ ತೆಳು ಪದರವಾಗಿ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["Many old Goan houses have a balcão, a shady front porch with built-in seats where families chat in the evening.", "गोवा के कई पुराने घरों में 'बालकांव' होता है, बैठने की जगह वाला छायादार आगे का बरामदा, जहाँ परिवार शाम को बतियाते हैं।", "ಗೋವಾದ ಅನೇಕ ಹಳೆಯ ಮನೆಗಳಿಗೆ 'ಬಾಲ್ಕಾಂವ್' ಇರುತ್ತದೆ: ಕುಳಿತುಕೊಳ್ಳುವ ಕಟ್ಟೆಗಳಿರುವ ನೆರಳಿನ ಮುಂಜಗಲಿ; ಸಂಜೆ ಮನೆಯವರು ಅಲ್ಲಿ ಹರಟುತ್ತಾರೆ."],
   ["Goan potters shape red clay into pots, lamps and figures and bake them hard in a fire; this baked clay is called terracotta.", "गोवा के कुम्हार लाल मिट्टी से घड़े, दीये और मूर्तियाँ बनाकर आग में पकाते हैं; पकी हुई इस मिट्टी को टेराकोटा कहते हैं।", "ಗೋವಾದ ಕುಂಬಾರರು ಕೆಂಪು ಮಣ್ಣಿನಿಂದ ಮಡಕೆ, ಹಣತೆ, ಬೊಂಬೆಗಳನ್ನು ಮಾಡಿ ಬೆಂಕಿಯಲ್ಲಿ ಸುಡುತ್ತಾರೆ; ಹೀಗೆ ಸುಟ್ಟ ಮಣ್ಣೇ ಸುಟ್ಟಮಣ್ಣಿನ ಕಲೆ."],
   ["Goa Carnival begins when King Momo, a local person chosen each year, tells everyone to eat, drink and be merry. Then floats and masked dancers fill the streets.", "गोवा कार्निवल तब शुरू होता है जब हर साल चुने गए स्थानीय 'किंग मोमो' सबसे खाने, पीने और मौज करने को कहते हैं। फिर झाँकियाँ और मुखौटे पहने नर्तक सड़कों पर उतर आते हैं।", "ಪ್ರತಿ ವರ್ಷ ಆಯ್ಕೆಯಾಗುವ ಸ್ಥಳೀಯರೊಬ್ಬರು 'ಕಿಂಗ್ ಮೋಮೋ' ಆಗಿ 'ತಿನ್ನಿ, ಕುಡಿಯಿರಿ, ಸಂತೋಷಪಡಿ' ಎಂದು ಘೋಷಿಸಿದಾಗ ಗೋವಾದ ಕಾರ್ನಿವಲ್ ಹಬ್ಬ ಶುರು. ಆಮೇಲೆ ತೇರುಗಳು, ಮುಖವಾಡದ ನರ್ತಕರು ಬೀದಿ ತುಂಬುತ್ತಾರೆ."],
   ["Shigmo is Goa's spring festival. Towns hold parades with drums, huge painted floats and dancers twirling bright flags.", "शिग्मो गोवा का वसंत उत्सव है। कस्बों में ढोल, बड़ी रंगी हुई झाँकियों और चमकीले झंडे घुमाते नर्तकों के जुलूस निकलते हैं।", "ಶಿಗ್ಮೋ ಗೋವಾದ ವಸಂತ ಹಬ್ಬ. ಊರೂರುಗಳಲ್ಲಿ ಡೋಲು, ದೊಡ್ಡ ಬಣ್ಣದ ತೇರುಗಳು ಮತ್ತು ಹೊಳೆಯುವ ಬಾವುಟ ತಿರುಗಿಸುವ ನರ್ತಕರ ಮೆರವಣಿಗೆ ನಡೆಯುತ್ತದೆ."],
   ["Poi is a puffy wheat bread from Goan bakeries. The poder, the village bread man, still cycles round in the morning honking his horn.", "पोई गोवा की बेकरियों का फूला हुआ गेहूँ का पाव है। गाँव का पाव वाला 'पोदेर' आज भी सुबह साइकिल पर हॉर्न बजाता घूमता है।", "ಪೋಯಿ ಗೋವಾದ ಬೇಕರಿಗಳ ಉಬ್ಬಿದ ಗೋಧಿ ಪಾವ್. ಹಳ್ಳಿಯ ಪಾವ್ ಮಾರುವ 'ಪೋದೇರ್' ಇಂದಿಗೂ ಬೆಳಿಗ್ಗೆ ಸೈಕಲ್ಲಿನಲ್ಲಿ ಪೀಪಿ ಊದುತ್ತಾ ಸುತ್ತುತ್ತಾನೆ."],
   ["Kokum is a dark purple fruit of the Konkan coast. Its sour juice is mixed with coconut milk to make pink sol kadhi.", "कोकम कोंकण तट का गहरा बैंगनी फल है। इसके खट्टे रस को नारियल के दूध में मिलाकर गुलाबी सोल कढ़ी बनती है।", "ಪುನರ್ಪುಳಿ ಕೊಂಕಣ ಕರಾವಳಿಯ ಕಡುನೇರಳೆ ಹಣ್ಣು. ಇದರ ಹುಳಿ ರಸವನ್ನು ತೆಂಗಿನ ಹಾಲಿನೊಂದಿಗೆ ಬೆರೆಸಿ ಗುಲಾಬಿ ಬಣ್ಣದ ಸೋಲ್ ಕಢಿ ಮಾಡುತ್ತಾರೆ."],
   ["Big two-sided dhol drums lead the Shigmo parades, and their boom can be heard streets away.", "बड़े दो-मुँहे ढोल शिग्मो के जुलूसों में सबसे आगे चलते हैं, और उनकी गूँज कई गलियों दूर तक सुनाई देती है।", "ಎರಡು ಮುಖದ ದೊಡ್ಡ ಡೋಲುಗಳು ಶಿಗ್ಮೋ ಮೆರವಣಿಗೆಯ ಮುಂದೆ ಸಾಗುತ್ತವೆ; ಅವುಗಳ ಸದ್ದು ಹಲವು ಬೀದಿಗಳಾಚೆಗೂ ಕೇಳುತ್ತದೆ."],
   ["Prawn balchão is a spicy, tangy prawn dish from Portuguese times, cooked with vinegar so it keeps for days.", "झींगा बालशाओ पुर्तगाली दौर का तीखा-खट्टा व्यंजन है, जिसे सिरके में पकाया जाता है ताकि यह कई दिन चले।", "ಸಿಗಡಿ ಬಾಲ್ಶಾವೊ ಪೋರ್ಚುಗೀಸರ ಕಾಲದ ಖಾರ-ಹುಳಿ ಖಾದ್ಯ; ವಿನೆಗರ್‌ನಲ್ಲಿ ಬೇಯಿಸುವುದರಿಂದ ಹಲವು ದಿನ ಕೆಡದೆ ಉಳಿಯುತ್ತದೆ."],
   ["Se Cathedral in Old Goa is one of the largest churches in Asia, and its tower holds the Golden Bell, the biggest bell in Goa.", "पुराने गोवा का से कैथेड्रल एशिया के सबसे बड़े गिरजाघरों में से एक है, और इसकी मीनार में गोवा की सबसे बड़ी सुनहरी घंटी है।", "ಹಳೆಯ ಗೋವಾದ ಸೇ ಕ್ಯಾಥೆಡ್ರಲ್ ಏಷ್ಯಾದ ಅತಿ ದೊಡ್ಡ ಇಗರ್ಜಿಗಳಲ್ಲಿ ಒಂದು; ಇದರ ಗೋಪುರದಲ್ಲಿ ಗೋವಾದ ಅತಿ ದೊಡ್ಡ ಚಿನ್ನದ ಗಂಟೆ ಇದೆ."],
   ["Areca palms grow tall and very thin. Their nuts, called supari, are dried and sliced.", "सुपारी के पेड़ बहुत ऊँचे और पतले होते हैं। इनके फल, यानी सुपारी, सुखाकर काटे जाते हैं।", "ಅಡಿಕೆ ಮರಗಳು ತುಂಬಾ ಎತ್ತರ, ತೆಳ್ಳಗೆ ಬೆಳೆಯುತ್ತವೆ. ಇವುಗಳ ಕಾಯಿಯನ್ನು ಒಣಗಿಸಿ ಕತ್ತರಿಸುತ್ತಾರೆ."],
   ["Kaavi artists decorate temple ceilings and pillars with round medallions made of circles, petals and stars.", "कावी कलाकार मंदिरों की छतों और खंभों को गोलों, पंखुड़ियों और सितारों से बने गोल चित्रों से सजाते हैं।", "ಕಾವಿ ಕಲಾವಿದರು ದೇವಾಲಯದ ಛಾವಣಿ, ಕಂಬಗಳನ್ನು ವೃತ್ತ, ದಳ, ನಕ್ಷತ್ರಗಳಿಂದ ಮಾಡಿದ ದುಂಡು ಚಿತ್ತಾರಗಳಿಂದ ಅಲಂಕರಿಸುತ್ತಾರೆ."],
   ["Dodol is a dark, chewy Goan sweet of jaggery, coconut milk and rice flour, stirred for hours in a big pan.", "दोदोल गुड़, नारियल के दूध और चावल के आटे की गहरी रंग की, चबाने वाली गोवा की मिठाई है, जिसे बड़ी कड़ाही में घंटों चलाया जाता है।", "ದೊದೊಲ್ ಬೆಲ್ಲ, ತೆಂಗಿನ ಹಾಲು, ಅಕ್ಕಿಹಿಟ್ಟಿನ ಕಪ್ಪು ಬಣ್ಣದ, ಅಗಿಯುವ ಗೋವಾದ ಸಿಹಿ; ದೊಡ್ಡ ಬಾಣಲೆಯಲ್ಲಿ ಗಂಟೆಗಟ್ಟಲೆ ತಿರುವುತ್ತಾರೆ."],
   ["Houses in Fontainhas are painted yellow, blue, green and red, with tiled roofs and wooden windows.", "फ़ॉन्टेनहास के घर पीले, नीले, हरे और लाल रंग के हैं, जिनकी खपरैल छतें और लकड़ी की खिड़कियाँ हैं।", "ಫೊಂಟೈನ್ಹಾಸ್‌ನ ಮನೆಗಳಿಗೆ ಹಳದಿ, ನೀಲಿ, ಹಸಿರು, ಕೆಂಪು ಬಣ್ಣ; ಹೆಂಚಿನ ಮಾಡು, ಮರದ ಕಿಟಕಿಗಳು."],
   ["Little clay lamps are lit in rows on doorsteps and temple walls during Diwali and other festivals.", "दीवाली और दूसरे त्योहारों पर दरवाज़ों और मंदिर की दीवारों पर मिट्टी के छोटे दीयों की कतारें जलाई जाती हैं।", "ದೀಪಾವಳಿ ಮತ್ತು ಇತರ ಹಬ್ಬಗಳಲ್ಲಿ ಹೊಸ್ತಿಲು, ದೇವಾಲಯದ ಗೋಡೆಗಳ ಮೇಲೆ ಸಾಲು ಸಾಲು ಮಣ್ಣಿನ ಹಣತೆಗಳನ್ನು ಹಚ್ಚುತ್ತಾರೆ."],
   ["Carnival floats are built for weeks before the parade, with giant figures, music and dancers riding on top.", "कार्निवल की झाँकियाँ परेड से हफ़्तों पहले बनती हैं, जिन पर बड़ी आकृतियाँ, संगीत और नाचते कलाकार सवार होते हैं।", "ಕಾರ್ನಿವಲ್ ತೇರುಗಳನ್ನು ಮೆರವಣಿಗೆಗೆ ವಾರಗಟ್ಟಲೆ ಮೊದಲೇ ಕಟ್ಟುತ್ತಾರೆ; ಅವುಗಳ ಮೇಲೆ ದೈತ್ಯ ಆಕೃತಿಗಳು, ಸಂಗೀತ, ಕುಣಿಯುವವರು ಇರುತ್ತಾರೆ."],
   ["Shigmo floats show scenes from stories and village life, painted in bright colours and lit up at night.", "शिग्मो की झाँकियों में कथाओं और गाँव के जीवन के दृश्य चटक रंगों में बने होते हैं, जो रात में रोशनी से जगमगाते हैं।", "ಶಿಗ್ಮೋ ತೇರುಗಳಲ್ಲಿ ಕಥೆಗಳ ಮತ್ತು ಹಳ್ಳಿ ಬದುಕಿನ ದೃಶ್ಯಗಳು ಢಾಳ ಬಣ್ಣಗಳಲ್ಲಿರುತ್ತವೆ; ರಾತ್ರಿ ದೀಪಗಳಿಂದ ಬೆಳಗುತ್ತವೆ."],
   ["Kankonn is a crunchy Goan bread shaped like a ring; its name comes from the Konkani word for bangle.", "कांकोण गोवा का कुरकुरा, अंगूठी जैसा पाव है; इसका नाम कोंकणी में चूड़ी के शब्द से आया है।", "ಕಾಂಕೋಣ ಉಂಗುರದ ಆಕಾರದ ಗರಿಗರಿ ಗೋವಾದ ಪಾವ್; ಇದರ ಹೆಸರು ಕೊಂಕಣಿಯಲ್ಲಿ ಬಳೆ ಎಂಬ ಪದದಿಂದ ಬಂದಿದೆ."],
   ["Dudhsagar Falls, about 310 metres tall, is one of India's tallest waterfalls. Its name means sea of milk.", "लगभग 310 मीटर ऊँचा दूधसागर भारत के सबसे ऊँचे जलप्रपातों में से एक है। इसके नाम का अर्थ है दूध का सागर।", "ಸುಮಾರು 310 ಮೀಟರ್ ಎತ್ತರದ ದೂಧ್‌ಸಾಗರ್ ಭಾರತದ ಅತಿ ಎತ್ತರದ ಜಲಪಾತಗಳಲ್ಲಿ ಒಂದು. ಹೆಸರಿನ ಅರ್ಥ ಹಾಲಿನ ಸಮುದ್ರ."],
   ["The four-storey lighthouse at Fort Aguada was built in 1864 and once flashed its light every seven minutes.", "अगुआड़ा किले का चार मंज़िला लाइटहाउस 1864 में बना था और कभी हर सात मिनट में रोशनी चमकाता था।", "ಅಗುವಾಡಾ ಕೋಟೆಯ ನಾಲ್ಕು ಅಂತಸ್ತಿನ ದೀಪಸ್ತಂಭ 1864ರಲ್ಲಿ ಕಟ್ಟಿದ್ದು; ಹಿಂದೆ ಪ್ರತಿ ಏಳು ನಿಮಿಷಕ್ಕೊಮ್ಮೆ ಬೆಳಕು ಮಿನುಗಿಸುತ್ತಿತ್ತು."],
   ["Chapora Fort was built on the ruins of an older fort of the Adil Shahi rulers and rebuilt by the Portuguese in 1717.", "चापोरा किला आदिलशाही शासकों के एक पुराने किले के खंडहर पर बना और पुर्तगालियों ने इसे 1717 में फिर से बनाया।", "ಚಾಪೋರಾ ಕೋಟೆಯನ್ನು ಆದಿಲ್‌ಶಾಹಿ ಅರಸರ ಹಳೆಯ ಕೋಟೆಯ ಅವಶೇಷಗಳ ಮೇಲೆ ಕಟ್ಟಲಾಯಿತು; ಪೋರ್ಚುಗೀಸರು 1717ರಲ್ಲಿ ಮತ್ತೆ ಕಟ್ಟಿದರು."],
   ["Olive ridley sea turtles come ashore at night on quiet Goan beaches to dig nests and lay their eggs in the sand.", "ऑलिव रिडले समुद्री कछुए रात में गोवा के शांत तटों पर आकर रेत में गड्ढा खोदते हैं और अंडे देते हैं।", "ಆಲಿವ್ ರಿಡ್ಲೀ ಕಡಲಾಮೆಗಳು ರಾತ್ರಿ ಗೋವಾದ ಶಾಂತ ತೀರಗಳಿಗೆ ಬಂದು ಮರಳಿನಲ್ಲಿ ಗುಂಡಿ ತೋಡಿ ಮೊಟ್ಟೆ ಇಡುತ್ತವೆ."],
   ["Goa's state bird is the flame-throated bulbul, a yellow forest bird with a bright red-orange throat. Dr Salim Ali suggested it in 1972.", "गोवा का राज्य पक्षी लाल गले वाली बुलबुल है, चमकीले लाल-नारंगी गले वाली पीली जंगली चिड़िया। डॉ. सालिम अली ने 1972 में इसका सुझाव दिया था।", "ಗೋವಾದ ರಾಜ್ಯ ಪಕ್ಷಿ ಕೆಂಪುಗಂಟಲ ಪಿಕಳಾರ; ಕೆಂಪು-ಕಿತ್ತಳೆ ಗಂಟಲಿನ ಹಳದಿ ಕಾಡುಹಕ್ಕಿ. ಡಾ. ಸಲೀಂ ಅಲಿ 1972ರಲ್ಲಿ ಇದನ್ನು ಸೂಚಿಸಿದರು."],
   ["The gaur, also called the Indian bison, is Goa's state animal and the largest wild cattle in the world.", "गौर, जिसे भारतीय बाइसन भी कहते हैं, गोवा का राज्य पशु है और दुनिया का सबसे बड़ा जंगली गोवंश है।", "ಕಾಡುಕೋಣ ಅಥವಾ ಗೌರ್ ಗೋವಾದ ರಾಜ್ಯ ಪ್ರಾಣಿ; ಜಗತ್ತಿನ ಅತಿ ದೊಡ್ಡ ಕಾಡು ದನ ಇದು."],
   ["Goan craftspeople carve coconut shells into cups, spoons, lamps and little boxes.", "गोवा के कारीगर नारियल के खोल को तराशकर प्याले, चम्मच, दीये और छोटी डिबियाँ बनाते हैं।", "ಗೋವಾದ ಕುಶಲಕರ್ಮಿಗಳು ತೆಂಗಿನ ಚಿಪ್ಪನ್ನು ಕೆತ್ತಿ ಬಟ್ಟಲು, ಚಮಚ, ದೀಪ, ಪುಟ್ಟ ಡಬ್ಬಿಗಳನ್ನು ಮಾಡುತ್ತಾರೆ."],
   ["Mud crabs live among mangrove roots and walk sideways, waving their big claws.", "मिट्टी के केकड़े मैंग्रोव की जड़ों के बीच रहते हैं और अपने बड़े पंजे हिलाते हुए तिरछे चलते हैं।", "ಕೆಸರು ಏಡಿಗಳು ಕಾಂಡ್ಲಾ ಬೇರುಗಳ ನಡುವೆ ವಾಸಿಸುತ್ತವೆ; ದೊಡ್ಡ ಕೊಂಬುಗಾಲುಗಳನ್ನು ಅಲ್ಲಾಡಿಸುತ್ತಾ ಓರೆಯಾಗಿ ನಡೆಯುತ್ತವೆ."],
   ["In rampon fishing, a long net is taken out by canoe and then the whole village pulls it back to the beach together.", "रापोण मछली पकड़ने में एक लंबा जाल नाव से समुद्र में ले जाया जाता है, फिर पूरा गाँव मिलकर उसे किनारे खींचता है।", "ರಾಪೋಣ್ ಮೀನುಗಾರಿಕೆಯಲ್ಲಿ ಉದ್ದದ ಬಲೆಯನ್ನು ದೋಣಿಯಲ್ಲಿ ಕಡಲಿಗೆ ಒಯ್ದು, ಆಮೇಲೆ ಊರವರೆಲ್ಲ ಸೇರಿ ದಡಕ್ಕೆ ಎಳೆಯುತ್ತಾರೆ."],
   ["Mando is a gentle Konkani song-and-dance of Goa, sung about love and village life at weddings and feasts.", "मांडो गोवा का मधुर कोंकणी गीत-नृत्य है, जो शादियों और उत्सवों में प्रेम और गाँव के जीवन के बारे में गाया जाता है।", "ಮಾಂಡೋ ಗೋವಾದ ಮೃದುವಾದ ಕೊಂಕಣಿ ಹಾಡು-ಕುಣಿತ; ಮದುವೆ, ಹಬ್ಬಗಳಲ್ಲಿ ಪ್ರೀತಿ ಮತ್ತು ಹಳ್ಳಿ ಬದುಕಿನ ಬಗ್ಗೆ ಹಾಡುತ್ತಾರೆ."],
   ["In the fugdi dance, women whirl in circles, clapping and singing, faster and faster, during festivals like Ganesh Chaturthi.", "फुगडी नृत्य में महिलाएँ गणेश चतुर्थी जैसे त्योहारों पर ताली बजाते और गाते हुए गोल-गोल, तेज़ और तेज़ घूमती हैं।", "ಫುಗ್ಡಿ ಕುಣಿತದಲ್ಲಿ ಗಣೇಶ ಚತುರ್ಥಿಯಂಥ ಹಬ್ಬಗಳಲ್ಲಿ ಹೆಣ್ಣುಮಕ್ಕಳು ಚಪ್ಪಾಳೆ ತಟ್ಟಿ ಹಾಡುತ್ತಾ ವೇಗವಾಗಿ ಗಿರಗಿರನೆ ಸುತ್ತುತ್ತಾರೆ."],
   ["The Kunbi saree, with its red and white checks, was worn by the Kunbi farming community and is now being woven again.", "लाल-सफ़ेद चौखानों वाली कुणबी साड़ी कुणबी किसान समुदाय पहनता था, और अब इसे फिर से बुना जा रहा है।", "ಕೆಂಪು-ಬಿಳಿ ಚೌಕುಳಿಯ ಕುಣಬಿ ಸೀರೆಯನ್ನು ಕುಣಬಿ ರೈತ ಸಮುದಾಯ ಉಡುತ್ತಿತ್ತು; ಈಗ ಮತ್ತೆ ನೇಯಲಾಗುತ್ತಿದೆ."],
   ["Sol kadhi is a cool pink drink of kokum and coconut milk, often sipped after a spicy Goan meal.", "सोल कढ़ी कोकम और नारियल के दूध से बना ठंडा गुलाबी पेय है, जिसे अक्सर तीखे गोवा के खाने के बाद पिया जाता है।", "ಸೋಲ್ ಕಢಿ ಪುನರ್ಪುಳಿ ಮತ್ತು ತೆಂಗಿನ ಹಾಲಿನ ತಂಪಾದ ಗುಲಾಬಿ ಪಾನೀಯ; ಖಾರದ ಗೋವಾ ಊಟದ ನಂತರ ಹೆಚ್ಚಾಗಿ ಕುಡಿಯುತ್ತಾರೆ."],
   ["Sannas are soft, fluffy steamed rice cakes, a little like idlis, made for feasts and celebrations.", "सान्नस नरम, फूले हुए भाप में पके चावल के केक हैं, कुछ-कुछ इडली जैसे, जो दावतों और उत्सवों में बनते हैं।", "ಸಾನ್ನಸ್ ಮೃದುವಾದ, ಉಬ್ಬಿದ ಹಬೆಯಲ್ಲಿ ಬೇಯಿಸಿದ ಅಕ್ಕಿ ಕಡುಬು, ಸ್ವಲ್ಪ ಇಡ್ಲಿಯಂತೆ; ಹಬ್ಬ, ಸಮಾರಂಭಗಳಿಗೆ ಮಾಡುತ್ತಾರೆ."],
   ["Patoleo are sweet rice parcels filled with coconut and jaggery, steamed in fragrant turmeric leaves.", "पातोळ्यो नारियल और गुड़ भरे चावल के मीठे लिफ़ाफ़े हैं, जिन्हें खुशबूदार हल्दी के पत्तों में भाप दी जाती है।", "ಪಾತೋಳ್ಯೋ ತೆಂಗಿನಕಾಯಿ-ಬೆಲ್ಲ ತುಂಬಿದ ಸಿಹಿ ಅಕ್ಕಿ ಕಡುಬು; ಪರಿಮಳದ ಅರಿಶಿನ ಎಲೆಯಲ್ಲಿ ಸುತ್ತಿ ಹಬೆಯಲ್ಲಿ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["Many Goan temples have a tall white lamp tower, a deepastambha, with ledges for hundreds of little oil lamps.", "गोवा के कई मंदिरों में ऊँची सफ़ेद दीप-मीनार यानी दीपस्तंभ होता है, जिसकी कगारों पर सैकड़ों छोटे दीये रखे जाते हैं।", "ಗೋವಾದ ಅನೇಕ ದೇವಾಲಯಗಳಲ್ಲಿ ಎತ್ತರದ ಬಿಳಿ ದೀಪಸ್ತಂಭ ಇರುತ್ತದೆ; ಅದರ ಅಂಚುಗಳ ಮೇಲೆ ನೂರಾರು ಹಣತೆಗಳನ್ನು ಇಡುತ್ತಾರೆ."],
   ["River ferries carry people, scooters and even cars across Goa's wide rivers to islands like Divar and Chorao.", "नदी की फ़ेरियाँ लोगों, स्कूटरों और कारों तक को गोवा की चौड़ी नदियों के पार दिवाड़ और चोराव जैसे द्वीपों तक ले जाती हैं।", "ನದಿಯ ದಾಟುದೋಣಿಗಳು ಜನ, ಸ್ಕೂಟರ್, ಕಾರುಗಳನ್ನೂ ಗೋವಾದ ವಿಶಾಲ ನದಿಗಳಾಚೆ ದಿವಾಡ್, ಚೋರಾವ್ ದ್ವೀಪಗಳಿಗೆ ಸಾಗಿಸುತ್ತವೆ."],
   ["Tambdi Surla temple was built of black basalt stone in the 12th century and survived because it was hidden deep in the forest.", "ताम्बडी सुरला मंदिर 12वीं सदी में काले बेसाल्ट पत्थर से बना और घने जंगल में छिपा होने के कारण बचा रहा।", "ತಾಂಬ್ಡಿ ಸುರ್ಲಾ ದೇವಾಲಯವನ್ನು 12ನೇ ಶತಮಾನದಲ್ಲಿ ಕಪ್ಪು ಕಲ್ಲಿನಿಂದ ಕಟ್ಟಲಾಯಿತು; ದಟ್ಟ ಕಾಡಿನೊಳಗೆ ಅಡಗಿದ್ದರಿಂದ ಉಳಿದುಕೊಂಡಿತು."],
   ["Black pepper grows as a vine climbing up trees. Its green berries turn black when dried in the sun.", "काली मिर्च पेड़ों पर चढ़ने वाली बेल पर उगती है। इसके हरे दाने धूप में सूखकर काले हो जाते हैं।", "ಕಾಳುಮೆಣಸು ಮರಗಳ ಮೇಲೆ ಹಬ್ಬುವ ಬಳ್ಳಿಯಲ್ಲಿ ಬೆಳೆಯುತ್ತದೆ. ಹಸಿರು ಕಾಳುಗಳು ಬಿಸಿಲಿನಲ್ಲಿ ಒಣಗಿ ಕಪ್ಪಾಗುತ್ತವೆ."],
   ["At Christmas, Goan homes hang big paper star lanterns that glow in the windows and verandahs.", "क्रिसमस पर गोवा के घर बड़े कागज़ के सितारा कंदील टाँगते हैं, जो खिड़कियों और बरामदों में जगमगाते हैं।", "ಕ್ರಿಸ್ಮಸ್ ಸಮಯದಲ್ಲಿ ಗೋವಾದ ಮನೆಗಳಲ್ಲಿ ದೊಡ್ಡ ಕಾಗದದ ನಕ್ಷತ್ರ ಗೂಡುದೀಪಗಳನ್ನು ತೂಗುಹಾಕುತ್ತಾರೆ; ಕಿಟಕಿ, ಜಗಲಿಗಳಲ್ಲಿ ಅವು ಬೆಳಗುತ್ತವೆ."]],
  kl:[["The elephant is Kerala's state animal. At temple festivals, elephants wear a shining golden headdress and carry the god's image on their backs.", "हाथी केरल का राज्य पशु है। मंदिर उत्सवों में हाथी चमकता सुनहरा मुकुट पहनते हैं और पीठ पर देवता की मूर्ति उठाते हैं।", "ಆನೆ ಕೇರಳದ ರಾಜ್ಯ ಪ್ರಾಣಿ. ದೇವಾಲಯದ ಉತ್ಸವಗಳಲ್ಲಿ ಆನೆಗಳು ಹೊಳೆಯುವ ಚಿನ್ನದ ಹಣೆಪಟ್ಟ ತೊಟ್ಟು, ಬೆನ್ನ ಮೇಲೆ ದೇವರ ಮೂರ್ತಿಯನ್ನು ಹೊರುತ್ತವೆ."],
   ["A snake boat, or chundan vallam, is over 100 feet long, with a tall curved back like a cobra's raised hood. About a hundred rowers paddle it together to the beat of a boat song.", "सर्प नौका या 'चुंडन वल्लम' 100 फ़ुट से भी लंबी होती है, जिसका पिछला ऊँचा मुड़ा सिरा उठे हुए नाग के फन जैसा होता है। लगभग सौ नाविक नाव-गीत की ताल पर एक साथ चप्पू चलाते हैं।", "ಹಾವುದೋಣಿ ಅಥವಾ 'ಚುಂಡನ್ ವಳ್ಳಂ' 100 ಅಡಿಗಿಂತ ಉದ್ದ; ಇದರ ಎತ್ತರವಾಗಿ ಬಾಗಿದ ಹಿಂಭಾಗ ಎತ್ತಿದ ನಾಗರಹೆಡೆಯಂತೆ ಕಾಣುತ್ತದೆ. ಸುಮಾರು ನೂರು ಜನ ದೋಣಿಹಾಡಿನ ತಾಳಕ್ಕೆ ಒಟ್ಟಿಗೆ ಹುಟ್ಟು ಹಾಕುತ್ತಾರೆ."],
   ["The Onam sadya is a grand feast served on a banana leaf, with rice and more than twenty dishes, ending with sweet payasam.", "ओणम सद्या केले के पत्ते पर परोसी जाने वाली बड़ी दावत है, जिसमें चावल और बीस से ज़्यादा व्यंजन होते हैं, और अंत में मीठा पायसम।", "ಓಣಂ ಸದ್ಯ ಬಾಳೆಎಲೆಯಲ್ಲಿ ಬಡಿಸುವ ದೊಡ್ಡ ಹಬ್ಬದೂಟ; ಅನ್ನದ ಜೊತೆಗೆ ಇಪ್ಪತ್ತಕ್ಕೂ ಹೆಚ್ಚು ಖಾದ್ಯಗಳು, ಕೊನೆಯಲ್ಲಿ ಸಿಹಿ ಪಾಯಸ."],
   ["In Kathakali, a green face shows a good and noble hero. Getting the make-up and costume ready can take the actor hours before the show.", "कथकली में हरा चेहरा अच्छे और महान नायक को दिखाता है। प्रदर्शन से पहले मेकअप और पोशाक तैयार करने में कलाकार को घंटों लग सकते हैं।", "ಕಥಕ್ಕಳಿಯಲ್ಲಿ ಹಸಿರು ಮುಖ ಒಳ್ಳೆಯ, ಉದಾತ್ತ ನಾಯಕನನ್ನು ಸೂಚಿಸುತ್ತದೆ. ಪ್ರದರ್ಶನಕ್ಕೆ ಮುನ್ನ ಬಣ್ಣ, ವೇಷ ಸಿದ್ಧಮಾಡಿಕೊಳ್ಳಲು ಕಲಾವಿದನಿಗೆ ಗಂಟೆಗಟ್ಟಲೆ ಬೇಕಾಗಬಹುದು."],
   ["The coconut palm is Kerala's state tree. Many people say the name Kerala comes from 'kera', the Malayalam word for coconut.", "नारियल का पेड़ केरल का राज्य वृक्ष है। बहुत से लोग कहते हैं कि केरल नाम मलयालम शब्द 'केरा' यानी नारियल से आया है।", "ತೆಂಗಿನ ಮರ ಕೇರಳದ ರಾಜ್ಯ ವೃಕ್ಷ. ಕೇರಳ ಎಂಬ ಹೆಸರು ತೆಂಗಿಗೆ ಮಲಯಾಳಂ ಪದವಾದ 'ಕೇರ'ದಿಂದ ಬಂತು ಎಂದು ಅನೇಕರು ಹೇಳುತ್ತಾರೆ."],
   ["Kerala murals use five colours, called panchavarna: ochre yellow, red, green, black and white, all made from minerals and plants. Famous ones cover the walls of Mattancherry Palace in Kochi.", "केरल भित्तिचित्रों में पाँच रंग होते हैं, जिन्हें 'पंचवर्ण' कहते हैं: गेरुआ पीला, लाल, हरा, काला और सफ़ेद, सब खनिजों और पौधों से बने। प्रसिद्ध चित्र कोच्चि के मट्टनचेरी महल की दीवारों पर हैं।", "ಕೇರಳದ ಗೋಡೆಚಿತ್ರಗಳಲ್ಲಿ 'ಪಂಚವರ್ಣ' ಎಂಬ ಐದು ಬಣ್ಣಗಳು: ಕಾವಿ ಹಳದಿ, ಕೆಂಪು, ಹಸಿರು, ಕಪ್ಪು, ಬಿಳಿ; ಎಲ್ಲವೂ ಖನಿಜ ಮತ್ತು ಗಿಡಗಳಿಂದ ಮಾಡಿದವು. ಕೊಚ್ಚಿಯ ಮಟ್ಟಾಂಚೇರಿ ಅರಮನೆಯ ಗೋಡೆಗಳಲ್ಲಿ ಪ್ರಸಿದ್ಧ ಚಿತ್ರಗಳಿವೆ."],
   ["A Kerala houseboat, the kettuvallam, was once a rice barge. Its wooden planks are tied together with coir rope, and its curved roof is woven from bamboo and palm leaves.", "केरल की हाउसबोट 'केट्टुवल्लम' कभी चावल ढोने वाली नाव थी। इसके लकड़ी के तख़्ते नारियल रेशे की रस्सी से बँधे होते हैं, और इसकी गोल छत बाँस और ताड़ के पत्तों से बुनी जाती है।", "ಕೇರಳದ ದೋಣಿಮನೆ 'ಕೆಟ್ಟುವಳ್ಳಂ' ಹಿಂದೆ ಭತ್ತ ಸಾಗಿಸುವ ದೋಣಿಯಾಗಿತ್ತು. ಇದರ ಮರದ ಹಲಗೆಗಳನ್ನು ತೆಂಗಿನ ನಾರಿನ ಹಗ್ಗದಿಂದ ಕಟ್ಟುತ್ತಾರೆ; ಬಾಗಿದ ಛಾವಣಿಯನ್ನು ಬಿದಿರು ಮತ್ತು ಗರಿಗಳಿಂದ ಹೆಣೆಯುತ್ತಾರೆ."],
   ["During the ten days of Onam, families make a pookalam, a flower carpet on the ground at the front door, adding new rings of flowers each day.", "ओणम के दस दिनों में परिवार घर के दरवाज़े के आगे ज़मीन पर फूलों का गलीचा 'पूकलम' बनाते हैं, और हर दिन फूलों के नए घेरे जोड़ते हैं।", "ಓಣಂನ ಹತ್ತು ದಿನಗಳಲ್ಲಿ ಮನೆಯವರು ಬಾಗಿಲ ಮುಂದೆ ನೆಲದ ಮೇಲೆ 'ಪೂಕಳಂ' ಎಂಬ ಹೂವಿನ ರಂಗೋಲಿ ಹಾಕುತ್ತಾರೆ; ಪ್ರತಿ ದಿನ ಹೂವಿನ ಹೊಸ ಸುತ್ತು ಸೇರಿಸುತ್ತಾರೆ."],
   ["The nilavilakku is a tall brass lamp. In many Kerala homes it is lit at sunset, and every big event and show begins by lighting it.", "निलविलक्कु पीतल का एक ऊँचा दीया है। केरल के कई घरों में इसे सूर्यास्त पर जलाया जाता है, और हर बड़ा आयोजन और प्रदर्शन इसे जलाकर शुरू होता है।", "ನಿಲವಿಳಕ್ಕು ಹಿತ್ತಾಳೆಯ ಎತ್ತರದ ಕಾಲುದೀಪ. ಕೇರಳದ ಅನೇಕ ಮನೆಗಳಲ್ಲಿ ಸೂರ್ಯಾಸ್ತದಲ್ಲಿ ಇದನ್ನು ಹಚ್ಚುತ್ತಾರೆ; ಪ್ರತಿ ದೊಡ್ಡ ಕಾರ್ಯಕ್ರಮ, ಪ್ರದರ್ಶನವೂ ಇದನ್ನು ಬೆಳಗಿಸಿಯೇ ಶುರುವಾಗುತ್ತದೆ."],
   ["Appam is a bowl-shaped pancake made from rice batter and coconut, soft and fluffy in the middle with crispy lace edges. It is often eaten with a mild coconut-milk stew.", "अप्पम चावल के घोल और नारियल से बना कटोरी जैसा पैनकेक है, बीच में नरम-फूला और किनारों पर कुरकुरी जाली जैसा। इसे अक्सर नारियल के दूध वाली हल्की करी के साथ खाते हैं।", "ಅಪ್ಪಂ ಅಕ್ಕಿಹಿಟ್ಟು, ತೆಂಗಿನಕಾಯಿಯಿಂದ ಮಾಡಿದ ಬಟ್ಟಲಿನಾಕಾರದ ದೋಸೆ; ನಡುವೆ ಮೆತ್ತಗೆ ಉಬ್ಬಿ, ಅಂಚುಗಳು ಗರಿಗರಿಯಾದ ಜಾಳಿಗೆಯಂತಿರುತ್ತವೆ. ಇದನ್ನು ಹೆಚ್ಚಾಗಿ ತೆಂಗಿನಹಾಲಿನ ಸೌಮ್ಯ ಸಾರಿನ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Tea pickers in Munnar pluck just the top two leaves and a bud from each bush, and the bushes are kept waist-high so they are easy to reach.", "मुन्नार में चाय तोड़ने वाले हर झाड़ी से सिर्फ़ ऊपर की दो पत्तियाँ और एक कली तोड़ते हैं, और झाड़ियों को कमर तक ऊँचा रखा जाता है ताकि आसानी से पहुँचा जा सके।", "ಮುನ್ನಾರಿನಲ್ಲಿ ಚಹಾ ಎಲೆ ಕೀಳುವವರು ಪ್ರತಿ ಗಿಡದಿಂದ ಮೇಲಿನ ಎರಡು ಎಲೆ ಮತ್ತು ಒಂದು ಮೊಗ್ಗನ್ನಷ್ಟೇ ಕೀಳುತ್ತಾರೆ; ಸುಲಭವಾಗಿ ಕೈಗೆಟುಕಲೆಂದು ಗಿಡಗಳನ್ನು ಸೊಂಟದೆತ್ತರದಲ್ಲಿ ಇಡುತ್ತಾರೆ."],
   ["The great hornbill is Kerala's state bird. It has a big yellow casque on top of its beak, and its wingbeats sound like a loud whoosh through the forest.", "बड़ा धनेश केरल का राज्य पक्षी है। इसकी चोंच के ऊपर बड़ा पीला कलगीनुमा उभार होता है, और इसके पंखों की फड़फड़ाहट जंगल में ज़ोरदार 'हुश्श' जैसी सुनाई देती है।", "ದೊಡ್ಡ ಮಂಗಟ್ಟೆ ಹಕ್ಕಿ ಕೇರಳದ ರಾಜ್ಯ ಪಕ್ಷಿ. ಇದರ ಕೊಕ್ಕಿನ ಮೇಲೆ ದೊಡ್ಡ ಹಳದಿ ಟೊಪ್ಪಿಯಂಥ ಉಬ್ಬು ಇದೆ; ಇದು ರೆಕ್ಕೆ ಬಡಿದಾಗ ಕಾಡಿನಲ್ಲಿ ಜೋರಾದ 'ವೂಶ್' ಸದ್ದು ಕೇಳುತ್ತದೆ."],
   ["The nettipattam is the golden headdress that temple elephants wear at festivals. It is made of hundreds of small gold-coloured pieces and shines in the sun.", "नेट्टिपट्टम वह सुनहरा मुकुट है जो मंदिर के हाथी उत्सवों में पहनते हैं। यह सैकड़ों छोटे सुनहरे टुकड़ों से बना होता है और धूप में चमकता है।", "ನೆತ್ತಿಪಟ್ಟ ಉತ್ಸವಗಳಲ್ಲಿ ದೇವಾಲಯದ ಆನೆಗಳು ತೊಡುವ ಚಿನ್ನದ ಹಣೆಪಟ್ಟ. ನೂರಾರು ಪುಟ್ಟ ಚಿನ್ನದ ಬಣ್ಣದ ತುಣುಕುಗಳಿಂದ ಮಾಡಿದ ಇದು ಬಿಸಿಲಿನಲ್ಲಿ ಮಿನುಗುತ್ತದೆ."],
   ["Iruttukuthi boats are smaller, faster race boats. They race in their own groups at Kerala's boat festivals, before the big snake boats.", "इरुट्टुकुत्ति छोटी और तेज़ दौड़ नौकाएँ हैं। केरल के नौका उत्सवों में ये बड़ी सर्प नौकाओं से पहले अपने अलग समूहों में दौड़ती हैं।", "ಇರುಟ್ಟುಕುತ್ತಿ ಸಣ್ಣ, ವೇಗದ ಸ್ಪರ್ಧಾ ದೋಣಿಗಳು. ಕೇರಳದ ದೋಣಿ ಹಬ್ಬಗಳಲ್ಲಿ ದೊಡ್ಡ ಹಾವುದೋಣಿಗಳಿಗಿಂತ ಮೊದಲು ಇವು ತಮ್ಮದೇ ಗುಂಪುಗಳಲ್ಲಿ ಸ್ಪರ್ಧಿಸುತ್ತವೆ."],
   ["Puttu is steamed rice flour and grated coconut, pressed into a tube shape. A favourite Kerala breakfast is puttu with a spicy curry of black chickpeas called kadala.", "पुट्टु भाप में पका चावल का आटा और कसा नारियल है, जिसे नली के आकार में दबाया जाता है। केरल का पसंदीदा नाश्ता है पुट्टु के साथ काले चने की तीखी करी 'कडला'।", "ಪುಟ್ಟು ಆವಿಯಲ್ಲಿ ಬೇಯಿಸಿದ ಅಕ್ಕಿಹಿಟ್ಟು ಮತ್ತು ತುರಿದ ತೆಂಗಿನಕಾಯಿ, ಕೊಳವೆಯಾಕಾರದಲ್ಲಿ ಒತ್ತಿದ್ದು. ಕಪ್ಪು ಕಡಲೆಯ ಖಾರದ ಸಾರು 'ಕಡಲ' ಜೊತೆ ಪುಟ್ಟು ಕೇರಳದ ಇಷ್ಟದ ತಿಂಡಿ."],
   ["Theyyam performers paint their faces in bright red, yellow and black patterns. People believe that while dancing, the performer becomes the god for a while.", "तेय्यम कलाकार अपने चेहरों पर चटक लाल, पीले और काले नमूने रंगते हैं। लोग मानते हैं कि नाचते समय कलाकार कुछ देर के लिए देवता बन जाता है।", "ತೆಯ್ಯಂ ಕಲಾವಿದರು ಮುಖಕ್ಕೆ ಗಾಢ ಕೆಂಪು, ಹಳದಿ, ಕಪ್ಪು ಚಿತ್ತಾರ ಬಳಿಯುತ್ತಾರೆ. ಕುಣಿಯುವಾಗ ಕಲಾವಿದ ಸ್ವಲ್ಪ ಹೊತ್ತು ದೈವವೇ ಆಗುತ್ತಾನೆ ಎಂದು ಜನ ನಂಬುತ್ತಾರೆ."],
   ["Rubber trees grow in neat rows around Kottayam. Farmers cut a thin line in the bark early in the morning and collect the white milky sap in a cup.", "कोट्टयम के आसपास रबर के पेड़ सुघड़ कतारों में उगते हैं। किसान सुबह-सुबह छाल में पतली लकीर काटते हैं और सफ़ेद दूधिया रस एक कप में इकट्ठा करते हैं।", "ಕೋಟ್ಟಯಂ ಸುತ್ತ ರಬ್ಬರ್ ಮರಗಳು ಅಚ್ಚುಕಟ್ಟಾದ ಸಾಲುಗಳಲ್ಲಿ ಬೆಳೆಯುತ್ತವೆ. ರೈತರು ಮುಂಜಾನೆ ತೊಗಟೆಯಲ್ಲಿ ತೆಳು ಗೆರೆ ಕೊಯ್ದು, ಬಿಳಿಯ ಹಾಲಿನಂಥ ರಸವನ್ನು ಬಟ್ಟಲಿನಲ್ಲಿ ಸಂಗ್ರಹಿಸುತ್ತಾರೆ."],
   ["Kalamezhuthu is a big picture of a god drawn on a temple floor with five coloured powders made from rice, turmeric, leaves and charcoal. After the ritual it is wiped away.", "कलमेळुत्तु मंदिर के फ़र्श पर चावल, हल्दी, पत्तों और कोयले से बने पाँच रंगों के चूर्ण से बनाई गई देवता की बड़ी तस्वीर है। अनुष्ठान के बाद इसे मिटा दिया जाता है।", "ಕಳಮೆಳುತ್ತು ದೇವಾಲಯದ ನೆಲದ ಮೇಲೆ ಅಕ್ಕಿ, ಅರಿಶಿನ, ಎಲೆ, ಇದ್ದಿಲಿನಿಂದ ಮಾಡಿದ ಐದು ಬಣ್ಣದ ಪುಡಿಗಳಿಂದ ಬಿಡಿಸುವ ದೇವರ ದೊಡ್ಡ ಚಿತ್ರ. ಪೂಜೆ ಮುಗಿದ ಮೇಲೆ ಅದನ್ನು ಅಳಿಸಿಬಿಡುತ್ತಾರೆ."],
   ["Small wooden canoes called vallams are the everyday cars of the backwaters. People use them to go to school, sell vegetables and catch fish.", "छोटी लकड़ी की डोंगियाँ, जिन्हें 'वल्लम' कहते हैं, बैकवॉटर की रोज़ की गाड़ियाँ हैं। लोग इनसे स्कूल जाते हैं, सब्ज़ियाँ बेचते हैं और मछली पकड़ते हैं।", "'ವಳ್ಳಂ' ಎಂಬ ಸಣ್ಣ ಮರದ ದೋಣಿಗಳೇ ಹಿನ್ನೀರಿನ ದಿನನಿತ್ಯದ ವಾಹನ. ಜನ ಅವುಗಳಲ್ಲಿ ಶಾಲೆಗೆ ಹೋಗುತ್ತಾರೆ, ತರಕಾರಿ ಮಾರುತ್ತಾರೆ, ಮೀನು ಹಿಡಿಯುತ್ತಾರೆ."],
   ["The tiny white thumba flower is loved at Onam. It is placed at the centre of the first day's pookalam.", "छोटा सफ़ेद तुम्बा फूल ओणम में बहुत प्यारा माना जाता है। पहले दिन के पूकलम के बीच में इसे ही रखा जाता है।", "ಪುಟ್ಟ ಬಿಳಿಯ ತುಂಬೆ ಹೂವು ಓಣಂನಲ್ಲಿ ತುಂಬಾ ಪ್ರೀತಿಯದು. ಮೊದಲ ದಿನದ ಪೂಕಳಂನ ನಡುವೆ ಇದನ್ನೇ ಇಡುತ್ತಾರೆ."],
   ["Kerala temples have brass lamps hanging on chains from the roof, with many little wicks. At night rows of these lamps glow all around the temple.", "केरल के मंदिरों में छत से ज़ंजीरों पर लटकते पीतल के दीये होते हैं, जिनमें कई छोटी बत्तियाँ होती हैं। रात में इनकी कतारें मंदिर के चारों ओर जगमगाती हैं।", "ಕೇರಳದ ದೇವಾಲಯಗಳಲ್ಲಿ ಛಾವಣಿಯಿಂದ ಸರಪಳಿಯಲ್ಲಿ ತೂಗುವ, ಹಲವು ಪುಟ್ಟ ಬತ್ತಿಗಳ ಹಿತ್ತಾಳೆ ದೀಪಗಳಿರುತ್ತವೆ. ರಾತ್ರಿ ಇವುಗಳ ಸಾಲು ದೇವಾಲಯದ ಸುತ್ತಲೂ ಬೆಳಗುತ್ತದೆ."],
   ["Idiyappam is made by pressing rice dough through a mould into thin noodle threads, which are then steamed into soft round nests.", "इडियप्पम चावल के आटे को साँचे से दबाकर पतले सेवई जैसे धागों में निकालकर बनता है, जिन्हें फिर भाप में नरम गोल घोंसलों जैसा पकाया जाता है।", "ಅಕ್ಕಿಹಿಟ್ಟನ್ನು ಒರಳಿನಲ್ಲಿ ಒತ್ತಿ ತೆಳುವಾದ ಎಳೆಗಳಾಗಿ ತೆಗೆದು, ಆವಿಯಲ್ಲಿ ಬೇಯಿಸಿ ಮೆತ್ತನೆಯ ದುಂಡು ಗೂಡುಗಳಂತೆ ಒತ್ತುಶಾವಿಗೆ ಮಾಡುತ್ತಾರೆ."],
   ["Cardamom is called the queen of spices. Its green pods grow close to the ground at the base of the plant in the shady Cardamom Hills of Idukki.", "इलायची को मसालों की रानी कहते हैं। इसकी हरी फलियाँ इडुक्की की छायादार इलायची पहाड़ियों में पौधे के नीचे ज़मीन के पास उगती हैं।", "ಏಲಕ್ಕಿಯನ್ನು ಸಾಂಬಾರ ಪದಾರ್ಥಗಳ ರಾಣಿ ಎನ್ನುತ್ತಾರೆ. ಇಡುಕ್ಕಿಯ ನೆರಳಿನ ಏಲಕ್ಕಿ ಬೆಟ್ಟಗಳಲ್ಲಿ ಇದರ ಹಸಿರು ಕಾಯಿಗಳು ಗಿಡದ ಬುಡದಲ್ಲಿ ನೆಲಕ್ಕೆ ಹತ್ತಿರವಾಗಿ ಬೆಳೆಯುತ್ತವೆ."],
   ["The Malabar grey hornbill is found only in the Western Ghats. It is smaller than the great hornbill and loves to eat wild figs.", "मालाबार भूरा धनेश सिर्फ़ पश्चिमी घाट में मिलता है। यह बड़े धनेश से छोटा होता है और जंगली अंजीर खाना पसंद करता है।", "ಮಲಬಾರ್ ಬೂದು ಮಂಗಟ್ಟೆ ಪಶ್ಚಿಮ ಘಟ್ಟಗಳಲ್ಲಿ ಮಾತ್ರ ಸಿಗುತ್ತದೆ. ಇದು ದೊಡ್ಡ ಮಂಗಟ್ಟೆಗಿಂತ ಚಿಕ್ಕದು; ಕಾಡು ಅತ್ತಿಹಣ್ಣು ಇದಕ್ಕೆ ತುಂಬಾ ಇಷ್ಟ."],
   ["Athirappilly Falls is so wide in the monsoon that it is nicknamed the Niagara of India.", "मानसून में अथिरापल्ली जलप्रपात इतना चौड़ा हो जाता है कि इसे भारत का नियाग्रा कहते हैं।", "ಮಳೆಗಾಲದಲ್ಲಿ ಅತಿರಪ್ಪಿಳ್ಳಿ ಜಲಪಾತ ಎಷ್ಟು ಅಗಲವಾಗುತ್ತದೆ ಎಂದರೆ ಅದನ್ನು ಭಾರತದ ನಯಾಗರ ಎಂದು ಕರೆಯುತ್ತಾರೆ."],
   ["Each Chinese fishing net in Kochi needs a team of about four to six fishermen. They balance the net with big stones hung on ropes, like a giant see-saw.", "कोच्चि के हर चीनी मछली जाल को चलाने के लिए लगभग चार से छह मछुआरों की टोली चाहिए। वे रस्सियों पर लटके बड़े पत्थरों से जाल को एक बड़े झूले की तरह संतुलित करते हैं।", "ಕೊಚ್ಚಿಯ ಪ್ರತಿ ಚೀನೀ ಮೀನುಬಲೆಗೆ ಸುಮಾರು ನಾಲ್ಕರಿಂದ ಆರು ಬೆಸ್ತರ ತಂಡ ಬೇಕು. ಹಗ್ಗಕ್ಕೆ ಕಟ್ಟಿದ ದೊಡ್ಡ ಕಲ್ಲುಗಳಿಂದ ಅವರು ಬಲೆಯನ್ನು ದೊಡ್ಡ ಏರಿಳಿ ಹಲಗೆಯಂತೆ ಸಮತೋಲನ ಮಾಡುತ್ತಾರೆ."],
   ["The Nilgiri tahr is a wild mountain goat that climbs steep, grassy cliffs. Eravikulam National Park near Munnar has the largest group of them.", "नीलगिरि तहर एक जंगली पहाड़ी बकरी है जो खड़ी घास वाली चट्टानों पर चढ़ती है। मुन्नार के पास एरविकुलम राष्ट्रीय उद्यान में इनका सबसे बड़ा झुंड है।", "ನೀಲಗಿರಿ ತಾರ್ ಕಡಿದಾದ, ಹುಲ್ಲಿನ ಬಂಡೆಗಳನ್ನು ಹತ್ತುವ ಕಾಡು ಬೆಟ್ಟದ ಆಡು. ಮುನ್ನಾರ್ ಬಳಿಯ ಇರವಿಕುಳಂ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನದಲ್ಲಿ ಇವುಗಳ ಅತಿ ದೊಡ್ಡ ಹಿಂಡಿದೆ."],
   ["The lion-tailed macaque has a silver-white mane around its black face and a tuft at the end of its tail, like a lion's. It lives high in the rainforest trees.", "शेरपूँछ मकाक के काले चेहरे के चारों ओर चाँदी-सफ़ेद अयाल होती है और पूँछ के सिरे पर शेर जैसा गुच्छा। यह वर्षावन के ऊँचे पेड़ों पर रहता है।", "ಸಿಂಗಳೀಕನ ಕಪ್ಪು ಮುಖದ ಸುತ್ತ ಬೆಳ್ಳಿ-ಬಿಳಿಯ ಕೇಸರವಿದೆ, ಬಾಲದ ತುದಿಯಲ್ಲಿ ಸಿಂಹದಂತೆ ಕೂದಲಿನ ಕುಚ್ಚು. ಇದು ಮಳೆಕಾಡಿನ ಎತ್ತರದ ಮರಗಳಲ್ಲಿ ವಾಸಿಸುತ್ತದೆ."],
   ["Kalaripayattu is one of the oldest martial arts in the world. Students train in a kalari, a pit-like hall, learning high kicks, leaps and stick fighting.", "कलरिपयट्टु दुनिया की सबसे पुरानी युद्ध कलाओं में से एक है। विद्यार्थी 'कलरी' नाम के गड्ढेनुमा कक्ष में ऊँची किक, छलाँग और लाठी चलाना सीखते हैं।", "ಕಳರಿಪಯಟ್ಟು ಜಗತ್ತಿನ ಅತಿ ಹಳೆಯ ಸಮರಕಲೆಗಳಲ್ಲಿ ಒಂದು. ವಿದ್ಯಾರ್ಥಿಗಳು 'ಕಳರಿ' ಎಂಬ ತಗ್ಗಿನ ಅಂಗಳದಲ್ಲಿ ಎತ್ತರದ ಒದೆತ, ಜಿಗಿತ, ಕೋಲಿನ ವರಸೆ ಕಲಿಯುತ್ತಾರೆ."],
   ["Mohiniyattam is a graceful classical dance of Kerala. Dancers wear a white and gold kasavu saree and sway gently like palm leaves in the breeze.", "मोहिनीअट्टम केरल का सुंदर शास्त्रीय नृत्य है। नर्तकियाँ सफ़ेद-सुनहरी कसवु साड़ी पहनती हैं और हवा में ताड़ के पत्तों की तरह धीरे-धीरे लहराती हैं।", "ಮೋಹಿನಿಯಾಟ್ಟಂ ಕೇರಳದ ಸೊಗಸಾದ ಶಾಸ್ತ್ರೀಯ ನೃತ್ಯ. ನರ್ತಕಿಯರು ಬಿಳಿ-ಚಿನ್ನದ ಕಸವು ಸೀರೆ ಉಟ್ಟು, ಗಾಳಿಯಲ್ಲಿ ತೆಂಗಿನ ಗರಿಗಳಂತೆ ಮೆಲ್ಲಗೆ ತೂಗುತ್ತಾರೆ."],
   ["Padayani is a temple festival of central Kerala. Its huge masks, called kolams, are cut from the stiff sheath of the areca palm and painted with natural colours.", "पडयणी मध्य केरल का मंदिर उत्सव है। इसके बड़े मुखौटे, जिन्हें 'कोलम' कहते हैं, सुपारी के पेड़ के कड़े पत्ते के आवरण से काटकर प्राकृतिक रंगों से रंगे जाते हैं।", "ಪಡಯಣಿ ಮಧ್ಯ ಕೇರಳದ ದೇವಾಲಯ ಉತ್ಸವ. ಇದರ 'ಕೋಲಂ' ಎಂಬ ದೊಡ್ಡ ಮುಖವಾಡಗಳನ್ನು ಅಡಿಕೆ ಮರದ ಗಟ್ಟಿ ಹಾಳೆಯಿಂದ ಕತ್ತರಿಸಿ ಸಹಜ ಬಣ್ಣಗಳಿಂದ ಬಳಿಯುತ್ತಾರೆ."],
   ["The kasavu saree is cream-white with a shining gold border. Many women in Kerala wear it for Onam and Vishu.", "कसवु साड़ी मलाई जैसी सफ़ेद होती है और उसका किनारा चमकता सुनहरा। केरल की कई महिलाएँ ओणम और विषु पर इसे पहनती हैं।", "ಕಸವು ಸೀರೆ ಹಾಲುಬಿಳುಪು, ಹೊಳೆಯುವ ಚಿನ್ನದ ಅಂಚು. ಕೇರಳದ ಅನೇಕ ಹೆಂಗಸರು ಓಣಂ, ವಿಷುಗೆ ಇದನ್ನೇ ಉಡುತ್ತಾರೆ."],
   ["The Aranmula mirror is made of polished metal, not glass. Only a few families know the secret mix of metals, and it has its own GI tag.", "आरनमुला दर्पण काँच का नहीं, चमकाई गई धातु का बनता है। धातुओं के इस गुप्त मिश्रण को कुछ ही परिवार जानते हैं, और इसे अपना जीआई टैग मिला है।", "ಆರನ್ಮುಳ ಕನ್ನಡಿ ಗಾಜಿನದಲ್ಲ, ಹೊಳಪು ಕೊಟ್ಟ ಲೋಹದ್ದು. ಲೋಹಗಳ ಈ ಗುಟ್ಟಿನ ಮಿಶ್ರಣ ಕೆಲವೇ ಕುಟುಂಬಗಳಿಗೆ ಗೊತ್ತು; ಇದಕ್ಕೆ ತನ್ನದೇ ಜಿಐ ಗುರುತು ಸಿಕ್ಕಿದೆ."],
   ["Coir is the strong fibre from coconut husks. In Alappuzha it is spun into ropes and woven into doormats and carpets.", "कॉयर नारियल के छिलके का मज़बूत रेशा है। अलप्पुझा में इससे रस्सियाँ बटी जाती हैं और पायदान व कालीन बुने जाते हैं।", "ತೆಂಗಿನ ಸಿಪ್ಪೆಯ ಗಟ್ಟಿ ನಾರೇ ಕಯರ್. ಆಲಪ್ಪುಳದಲ್ಲಿ ಅದರಿಂದ ಹಗ್ಗ ಹೊಸೆಯುತ್ತಾರೆ, ಕಾಲೊರೆಸು, ಜಮಖಾನೆ ನೇಯುತ್ತಾರೆ."],
   ["The jackfruit became Kerala's state fruit in 2018. It is the biggest fruit that grows on a tree, and one fruit can weigh more than a small child.", "कटहल 2018 में केरल का राज्य फल बना। यह पेड़ पर उगने वाला सबसे बड़ा फल है, और एक कटहल किसी छोटे बच्चे से भी भारी हो सकता है।", "ಹಲಸಿನ ಹಣ್ಣು 2018ರಲ್ಲಿ ಕೇರಳದ ರಾಜ್ಯ ಹಣ್ಣಾಯಿತು. ಮರದಲ್ಲಿ ಬೆಳೆಯುವ ಹಣ್ಣುಗಳಲ್ಲೇ ಇದು ಅತಿ ದೊಡ್ಡದು; ಒಂದು ಹಣ್ಣು ಪುಟ್ಟ ಮಗುವಿಗಿಂತ ಭಾರವಿರಬಹುದು."],
   ["Kerala has many kinds of payasam. Ada pradhaman is made with rice flakes, jaggery and coconut milk, and is the star dessert of the Onam feast.", "केरल में कई तरह का पायसम बनता है। 'अडा प्रथमन' चावल के पत्रकों, गुड़ और नारियल के दूध से बनता है, और ओणम दावत की ख़ास मिठाई है।", "ಕೇರಳದಲ್ಲಿ ಬಗೆಬಗೆಯ ಪಾಯಸಗಳಿವೆ. ಅಕ್ಕಿ ಅಡೆ, ಬೆಲ್ಲ, ತೆಂಗಿನಹಾಲಿನಿಂದ ಮಾಡುವ 'ಅಡ ಪ್ರಥಮನ್' ಓಣಂ ಊಟದ ಮುಖ್ಯ ಸಿಹಿ."],
   ["The chenda is a loud cylinder-shaped drum played with two curved sticks. In a chenda melam, dozens of drummers play together and the ground seems to shake.", "चेंडा बेलन जैसा तेज़ आवाज़ वाला ढोल है, जिसे दो मुड़ी हुई छड़ियों से बजाते हैं। 'चेंडा मेलम' में दर्जनों ढोल वाले साथ बजाते हैं और ज़मीन हिलती-सी लगती है।", "ಚಂಡೆ ಎರಡು ಬಾಗಿದ ಕೋಲುಗಳಿಂದ ಬಾರಿಸುವ ಜೋರು ಸದ್ದಿನ ಉರುಳೆಯಾಕಾರದ ವಾದ್ಯ. 'ಚೆಂಡ ಮೇಳಂ'ನಲ್ಲಿ ಹತ್ತಾರು ಜನ ಒಟ್ಟಿಗೆ ಬಾರಿಸಿದಾಗ ನೆಲವೇ ನಡುಗಿದಂತಾಗುತ್ತದೆ."],
   ["At Thrissur Pooram, two temple teams line up their elephants face to face and quickly swap bright, sparkling parasols on top of them. This is called kudamattam.", "त्रिशूर पूरम में दो मंदिर दल अपने हाथियों को आमने-सामने खड़ा करते हैं और उन पर चमचमाती रंगीन छतरियाँ जल्दी-जल्दी बदलते हैं। इसे 'कुडमाट्टम' कहते हैं।", "ತ್ರಿಶೂರ್ ಪೂರಂನಲ್ಲಿ ಎರಡು ದೇವಾಲಯಗಳ ತಂಡಗಳು ತಮ್ಮ ಆನೆಗಳನ್ನು ಮುಖಾಮುಖಿ ನಿಲ್ಲಿಸಿ, ಅವುಗಳ ಮೇಲಿನ ಮಿನುಗುವ ಬಣ್ಣದ ಕೊಡೆಗಳನ್ನು ಬೇಗಬೇಗ ಬದಲಿಸುತ್ತವೆ. ಇದನ್ನು 'ಕುಡಮಾಟ್ಟಂ' ಎನ್ನುತ್ತಾರೆ."],
   ["Bekal Fort has no palace inside. It was built only for defence, with holes in its walls for guns pointing out to sea.", "बेकल किले के अंदर कोई महल नहीं है। यह सिर्फ़ रक्षा के लिए बना था, और इसकी दीवारों में समुद्र की ओर तोपों के लिए छेद हैं।", "ಬೇಕಲ ಕೋಟೆಯೊಳಗೆ ಅರಮನೆ ಇಲ್ಲ. ಇದನ್ನು ರಕ್ಷಣೆಗೆಂದೇ ಕಟ್ಟಿದ್ದು; ಗೋಡೆಗಳಲ್ಲಿ ಸಮುದ್ರದ ಕಡೆಗೆ ಫಿರಂಗಿಗಳಿಗಾಗಿ ಕಿಂಡಿಗಳಿವೆ."],
   ["Karimeen, or pearl spot, became Kerala's state fish in 2010. It lives in the backwaters and is often cooked wrapped in a banana leaf.", "करिमीन यानी पर्ल स्पॉट मछली 2010 में केरल की राज्य मछली बनी। यह बैकवॉटर में रहती है और इसे अक्सर केले के पत्ते में लपेटकर पकाते हैं।", "ಕರಿಮೀನು 2010ರಲ್ಲಿ ಕೇರಳದ ರಾಜ್ಯ ಮೀನಾಯಿತು. ಇದು ಹಿನ್ನೀರಿನಲ್ಲಿ ವಾಸಿಸುತ್ತದೆ; ಹೆಚ್ಚಾಗಿ ಬಾಳೆಎಲೆಯಲ್ಲಿ ಸುತ್ತಿ ಬೇಯಿಸುತ್ತಾರೆ."],
   ["Black pepper from the Malabar coast was so precious in the old days that traders from Rome, Arabia and China sailed to Kerala for it. It was called black gold.", "पुराने ज़माने में मालाबार तट की काली मिर्च इतनी क़ीमती थी कि रोम, अरब और चीन के व्यापारी इसके लिए जहाज़ से केरल आते थे। इसे काला सोना कहा जाता था।", "ಹಿಂದಿನ ಕಾಲದಲ್ಲಿ ಮಲಬಾರ್ ಕರಾವಳಿಯ ಕಾಳುಮೆಣಸು ಎಷ್ಟು ಬೆಲೆಬಾಳುತ್ತಿತ್ತೆಂದರೆ ರೋಮ್, ಅರೇಬಿಯಾ, ಚೀನಾದ ವ್ಯಾಪಾರಿಗಳು ಅದಕ್ಕಾಗಿ ಹಡಗಿನಲ್ಲಿ ಕೇರಳಕ್ಕೆ ಬರುತ್ತಿದ್ದರು. ಅದನ್ನು ಕಪ್ಪು ಚಿನ್ನ ಎನ್ನುತ್ತಿದ್ದರು."],
   ["A nalukettu is a traditional Kerala house built around an open courtyard in the middle, so rain and sunlight come right into the house.", "नालुकेट्टु केरल का पारंपरिक घर है, जो बीच के खुले आँगन के चारों ओर बनता है, ताकि बारिश और धूप सीधे घर के अंदर आ सके।", "ನಾಲುಕೆಟ್ಟು ಕೇರಳದ ಸಾಂಪ್ರದಾಯಿಕ ಮನೆ; ನಡುವೆ ತೆರೆದ ಅಂಗಳದ ಸುತ್ತ ಕಟ್ಟುತ್ತಾರೆ, ಹಾಗಾಗಿ ಮಳೆ, ಬಿಸಿಲು ನೇರವಾಗಿ ಮನೆಯೊಳಗೆ ಬರುತ್ತದೆ."],
   ["The Malabar giant squirrel is maroon and cream, and as long as a cat with its bushy tail. It can leap about six metres between tall trees.", "मालाबार बड़ी गिलहरी कत्थई और मलाई रंग की होती है, और अपनी झबरी पूँछ समेत बिल्ली जितनी लंबी। यह ऊँचे पेड़ों के बीच लगभग छह मीटर तक छलाँग लगा सकती है।", "ಕೆಂದಳಿಲು ಕಂದುಗೆಂಪು ಮತ್ತು ಹಾಲುಬಣ್ಣದ್ದು; ಪೊದೆಯಂಥ ಬಾಲ ಸೇರಿ ಬೆಕ್ಕಿನಷ್ಟು ಉದ್ದ. ಎತ್ತರದ ಮರಗಳ ನಡುವೆ ಸುಮಾರು ಆರು ಮೀಟರ್ ಜಿಗಿಯಬಲ್ಲದು."],
   ["An uruli is a wide, shallow bronze pot. It is used to cook payasam for big feasts, and many homes float flowers in water in an uruli at the doorway.", "उरुली काँसे का चौड़ा, उथला बर्तन है। बड़ी दावतों में इसमें पायसम बनता है, और कई घरों में दरवाज़े पर उरुली में पानी भरकर फूल तैराए जाते हैं।", "ಉರುಳಿ ಅಗಲವಾದ, ಆಳವಿಲ್ಲದ ಕಂಚಿನ ಪಾತ್ರೆ. ದೊಡ್ಡ ಊಟಗಳಿಗೆ ಇದರಲ್ಲಿ ಪಾಯಸ ಮಾಡುತ್ತಾರೆ; ಅನೇಕ ಮನೆಗಳಲ್ಲಿ ಬಾಗಿಲ ಬಳಿ ಉರುಳಿಯಲ್ಲಿ ನೀರು ತುಂಬಿ ಹೂವು ತೇಲಿಸುತ್ತಾರೆ."]],
  ld:[["The butterfly fish is Lakshadweep's state animal. These flat, bright yellow, black and white fish flutter around the corals in pairs.", "तितली मछली लक्षद्वीप का राज्य पशु है। ये चपटी, चटक पीली, काली और सफ़ेद मछलियाँ जोड़ों में मूँगों के आसपास फुदकती हैं।", "ಚಿಟ್ಟೆ ಮೀನು ಲಕ್ಷದ್ವೀಪದ ರಾಜ್ಯ ಪ್ರಾಣಿ. ಚಪ್ಪಟೆಯಾದ, ಗಾಢ ಹಳದಿ-ಕಪ್ಪು-ಬಿಳಿಯ ಈ ಮೀನುಗಳು ಜೋಡಿಯಾಗಿ ಹವಳಗಳ ಸುತ್ತ ಚಿಟ್ಟೆಯಂತೆ ಹಾರಾಡುತ್ತವೆ."],
   ["The sooty tern is Lakshadweep's state bird. It spends most of its life flying over the ocean and comes to land only to nest.", "सूटी टर्न लक्षद्वीप का राज्य पक्षी है। यह अपना ज़्यादातर जीवन समुद्र के ऊपर उड़ते हुए बिताता है और सिर्फ़ घोंसला बनाने ज़मीन पर आता है।", "ಸೂಟಿ ಕಡಲಹಕ್ಕಿ ಲಕ್ಷದ್ವೀಪದ ರಾಜ್ಯ ಪಕ್ಷಿ. ಇದು ಜೀವನದ ಬಹುಪಾಲು ಸಮುದ್ರದ ಮೇಲೆ ಹಾರುತ್ತಲೇ ಕಳೆಯುತ್ತದೆ; ಗೂಡು ಕಟ್ಟಲು ಮಾತ್ರ ನೆಲಕ್ಕೆ ಬರುತ್ತದೆ."],
   ["The breadfruit is Lakshadweep's state tree. Its big round green fruit is cooked like a vegetable and tastes a little like potato.", "ब्रेडफ़्रूट लक्षद्वीप का राज्य वृक्ष है। इसका बड़ा गोल हरा फल सब्ज़ी की तरह पकाया जाता है और थोड़ा आलू जैसा लगता है।", "ಜೀಗುಜ್ಜೆ ಲಕ್ಷದ್ವೀಪದ ರಾಜ್ಯ ವೃಕ್ಷ. ಇದರ ದೊಡ್ಡ ದುಂಡನೆಯ ಹಸಿರು ಕಾಯಿಯನ್ನು ತರಕಾರಿಯಂತೆ ಬೇಯಿಸುತ್ತಾರೆ; ರುಚಿ ಸ್ವಲ್ಪ ಆಲೂಗಡ್ಡೆಯಂತೆ."],
   ["Coconut is the main crop of the islands, and Lakshadweep coconuts are known for having very rich oil.", "नारियल इन द्वीपों की मुख्य फ़सल है, और लक्षद्वीप के नारियल बहुत ज़्यादा तेल के लिए जाने जाते हैं।", "ತೆಂಗು ಈ ದ್ವೀಪಗಳ ಮುಖ್ಯ ಬೆಳೆ; ಲಕ್ಷದ್ವೀಪದ ತೆಂಗಿನಕಾಯಿಗಳು ಹೆಚ್ಚು ಎಣ್ಣೆಯ ಅಂಶಕ್ಕೆ ಹೆಸರುವಾಸಿ."],
   ["Lakshadweep fishers catch skipjack tuna one at a time with a pole and line, a gentle way of fishing that does not harm other sea life.", "लक्षद्वीप के मछुआरे स्किपजैक टूना को डंडे और डोरी से एक-एक करके पकड़ते हैं, मछली पकड़ने का यह कोमल तरीक़ा दूसरे समुद्री जीवों को नुकसान नहीं पहुँचाता।", "ಲಕ್ಷದ್ವೀಪದ ಮೀನುಗಾರರು ಕೋಲು ಮತ್ತು ದಾರದಿಂದ ಕೇದರ್ ಮೀನನ್ನು ಒಂದೊಂದಾಗಿ ಹಿಡಿಯುತ್ತಾರೆ; ಈ ಮೃದುವಾದ ವಿಧಾನ ಬೇರೆ ಕಡಲ ಜೀವಿಗಳಿಗೆ ಹಾನಿ ಮಾಡುವುದಿಲ್ಲ."],
   ["Jahadhoni are colourful race boats of Minicoy. They are used for races, to welcome important guests and for the island's yearly picnic.", "जहधोनी मिनिकॉय की रंग-बिरंगी दौड़ नौकाएँ हैं। इनका इस्तेमाल दौड़ के लिए, ख़ास मेहमानों के स्वागत के लिए और द्वीप की सालाना पिकनिक के लिए होता है।", "ಜಹಧೋನಿ ಮಿನಿಕಾಯ್‌ನ ಬಣ್ಣಬಣ್ಣದ ಸ್ಪರ್ಧಾ ದೋಣಿಗಳು. ಸ್ಪರ್ಧೆಗೆ, ಗಣ್ಯ ಅತಿಥಿಗಳನ್ನು ಸ್ವಾಗತಿಸಲು ಮತ್ತು ದ್ವೀಪದ ವಾರ್ಷಿಕ ವಿಹಾರಕ್ಕೆ ಇವನ್ನು ಬಳಸುತ್ತಾರೆ."],
   ["Minicoy's lighthouse was built by the British in 1885 and is about 50 metres tall. Visitors can climb its many steps for a view of the whole lagoon.", "मिनिकॉय का लाइटहाउस अंग्रेज़ों ने 1885 में बनाया था और यह लगभग 50 मीटर ऊँचा है। सैलानी इसकी कई सीढ़ियाँ चढ़कर पूरे लैगून का नज़ारा देख सकते हैं।", "ಮಿನಿಕಾಯ್ ದೀಪಸ್ತಂಭವನ್ನು ಬ್ರಿಟಿಷರು 1885ರಲ್ಲಿ ಕಟ್ಟಿದರು; ಇದು ಸುಮಾರು 50 ಮೀಟರ್ ಎತ್ತರ. ಇದರ ಹಲವಾರು ಮೆಟ್ಟಿಲು ಹತ್ತಿದರೆ ಇಡೀ ಕಡಲಕೊಳ ಕಾಣುತ್ತದೆ."],
   ["Green sea turtles graze on seagrass in the lagoons, and mother turtles crawl onto quiet beaches at night to lay their eggs.", "हरे समुद्री कछुए लैगून में समुद्री घास चरते हैं, और मादा कछुए रात में शांत तटों पर अंडे देने आती हैं।", "ಹಸಿರು ಕಡಲಾಮೆಗಳು ಕಡಲಕೊಳಗಳಲ್ಲಿ ಕಡಲಹುಲ್ಲು ಮೇಯುತ್ತವೆ; ತಾಯಿ ಆಮೆಗಳು ರಾತ್ರಿ ಶಾಂತ ತೀರಗಳಿಗೆ ಬಂದು ಮೊಟ್ಟೆ ಇಡುತ್ತವೆ."],
   ["All the islands of Lakshadweep are made of coral. Coral looks like a plant or a rock, but it is built by tiny animals living together.", "लक्षद्वीप के सारे द्वीप मूँगे से बने हैं। मूँगा पौधे या पत्थर जैसा दिखता है, पर इसे साथ रहने वाले नन्हे जीव बनाते हैं।", "ಲಕ್ಷದ್ವೀಪದ ಎಲ್ಲಾ ದ್ವೀಪಗಳೂ ಹವಳದಿಂದಾದವು. ಹವಳ ಗಿಡ ಅಥವಾ ಕಲ್ಲಿನಂತೆ ಕಂಡರೂ, ಅದನ್ನು ಒಟ್ಟಿಗೆ ಬದುಕುವ ಪುಟ್ಟ ಜೀವಿಗಳು ಕಟ್ಟುತ್ತವೆ."],
   ["In the Daf Muttu dance, performers beat round frame drums called daf while singing songs together.", "दफ़ मुट्टु नृत्य में कलाकार साथ मिलकर गीत गाते हुए 'दफ़' नाम के गोल ढोल बजाते हैं।", "ದಫ್ ಮುಟ್ಟು ನೃತ್ಯದಲ್ಲಿ ಕಲಾವಿದರು ಒಟ್ಟಿಗೆ ಹಾಡುತ್ತಾ 'ದಫ್' ಎಂಬ ದುಂಡನೆಯ ದಪ್ಪುಗಳನ್ನು ಬಾರಿಸುತ್ತಾರೆ."],
   ["A glass-bottom boat has a clear window in its floor, so you can watch the coral reef and fish without getting wet.", "काँच के तले वाली नाव के फ़र्श में पारदर्शी खिड़की होती है, जिससे बिना भीगे मूँगे की चट्टान और मछलियाँ देख सकते हैं।", "ಗಾಜಿನ ತಳದ ದೋಣಿಯ ನೆಲದಲ್ಲಿ ಪಾರದರ್ಶಕ ಕಿಟಕಿ ಇರುತ್ತದೆ; ನೆನೆಯದೆಯೇ ಹವಳದ ದಿಬ್ಬ ಮತ್ತು ಮೀನುಗಳನ್ನು ನೋಡಬಹುದು."],
   ["Cowrie shells are smooth, shiny sea snail shells. Long ago, cowrie shells were used as money in many parts of India and Africa.", "कौड़ियाँ चिकने, चमकीले समुद्री घोंघों के खोल हैं। बहुत पहले भारत और अफ़्रीका के कई हिस्सों में कौड़ियाँ पैसे की तरह चलती थीं।", "ಕವಡೆಗಳು ನಯವಾದ, ಹೊಳೆಯುವ ಕಡಲ ಬಸವನಹುಳುವಿನ ಚಿಪ್ಪುಗಳು. ಬಹಳ ಹಿಂದೆ ಭಾರತ ಮತ್ತು ಆಫ್ರಿಕಾದ ಅನೇಕ ಕಡೆ ಕವಡೆಗಳು ಹಣದಂತೆ ಚಲಾವಣೆಯಲ್ಲಿದ್ದವು."],
   ["The Moorish idol is a black, white and yellow reef fish with a long, trailing fin on its back. It looks a lot like the butterfly fish.", "मूरिश आइडल काली, सफ़ेद और पीली चट्टानी मछली है, जिसकी पीठ पर लंबा लहराता पंख होता है। यह तितली मछली से बहुत मिलती-जुलती है।", "ಮೂರಿಶ್ ಐಡಲ್ ಕಪ್ಪು-ಬಿಳಿ-ಹಳದಿ ಹವಳದ ಮೀನು; ಬೆನ್ನ ಮೇಲೆ ಉದ್ದವಾಗಿ ಹರಿಯುವ ರೆಕ್ಕೆ ಇದೆ. ಇದು ಚಿಟ್ಟೆ ಮೀನಿನಂತೆಯೇ ಕಾಣುತ್ತದೆ."],
   ["The brown noddy is a seabird that nests on Pitti island with the sooty terns. Unlike most birds, it nods its head to its mate.", "ब्राउन नॉडी समुद्री पक्षी है जो सूटी टर्न के साथ पिट्टी द्वीप पर घोंसला बनाता है। ज़्यादातर पक्षियों से अलग, यह अपने साथी को सिर हिलाकर इशारा करता है।", "ಕಂದು ನಾಡಿ ಹಕ್ಕಿ ಸೂಟಿ ಕಡಲಹಕ್ಕಿಗಳ ಜೊತೆ ಪಿಟ್ಟಿ ದ್ವೀಪದಲ್ಲಿ ಗೂಡು ಕಟ್ಟುವ ಕಡಲಹಕ್ಕಿ. ಬೇರೆ ಹಕ್ಕಿಗಳಂತಲ್ಲದೆ, ಇದು ತನ್ನ ಸಂಗಾತಿಗೆ ತಲೆ ಆಡಿಸಿ ಸನ್ನೆ ಮಾಡುತ್ತದೆ."],
   ["Screw pine trees grow on stilt roots along the beaches. Islanders weave its long leaves into mats and baskets.", "केवड़ा के पेड़ तटों पर खंभे जैसी जड़ों पर उगते हैं। द्वीपवासी इसके लंबे पत्तों से चटाइयाँ और टोकरियाँ बुनते हैं।", "ಕೇದಗೆ ಮರಗಳು ಕಡಲತೀರದಲ್ಲಿ ಕಂಬದಂಥ ಬೇರುಗಳ ಮೇಲೆ ಬೆಳೆಯುತ್ತವೆ. ದ್ವೀಪದವರು ಇದರ ಉದ್ದ ಎಲೆಗಳಿಂದ ಚಾಪೆ, ಬುಟ್ಟಿ ಹೆಣೆಯುತ್ತಾರೆ."],
   ["A tender coconut is a young green coconut full of sweet, cool water. It is the best drink on a hot island day.", "कच्चा नारियल मीठे, ठंडे पानी से भरा हरा नारियल होता है। गर्म द्वीप के दिन यह सबसे अच्छा पेय है।", "ಎಳನೀರು ಸಿಹಿಯಾದ ತಣ್ಣನೆಯ ನೀರಿನಿಂದ ತುಂಬಿದ ಹಸಿರು ಎಳೆ ಕಾಯಿ. ಬಿಸಿಲಿನ ದ್ವೀಪದ ದಿನಕ್ಕೆ ಇದೇ ಅತ್ಯುತ್ತಮ ಪಾನೀಯ."],
   ["Yellowfin tuna have bright yellow fins and can swim very fast. Fishers catch them along with skipjack using poles and lines.", "येलोफ़िन टूना के पंख चटक पीले होते हैं और यह बहुत तेज़ तैरती है। मछुआरे इसे स्किपजैक के साथ डंडे और डोरी से पकड़ते हैं।", "ಹಳದಿರೆಕ್ಕೆ ಕೇದರ್ ಮೀನಿಗೆ ಗಾಢ ಹಳದಿ ರೆಕ್ಕೆಗಳಿವೆ, ತುಂಬಾ ವೇಗವಾಗಿ ಈಜುತ್ತದೆ. ಮೀನುಗಾರರು ಇದನ್ನೂ ಕೋಲು-ದಾರದಿಂದಲೇ ಹಿಡಿಯುತ್ತಾರೆ."],
   ["Before motorboats, Minicoy fishers went out in hand-built wooden canoes called mas-odi to catch tuna close to the island.", "मोटर नावों से पहले मिनिकॉय के मछुआरे 'मास-ओडी' नाम की हाथ से बनी लकड़ी की डोंगियों में द्वीप के पास टूना पकड़ने जाते थे।", "ಯಂತ್ರದೋಣಿಗಳು ಬರುವ ಮೊದಲು ಮಿನಿಕಾಯ್‌ನ ಮೀನುಗಾರರು 'ಮಾಸ್-ಓಡಿ' ಎಂಬ ಕೈಯಿಂದ ಮಾಡಿದ ಮರದ ದೋಣಿಗಳಲ್ಲಿ ದ್ವೀಪದ ಬಳಿಯೇ ಕೇದರ್ ಮೀನು ಹಿಡಿಯಲು ಹೋಗುತ್ತಿದ್ದರು."],
   ["Small beacons stand on the reefs to warn boats where the water is too shallow, so they do not crash onto the coral.", "चट्टानों पर छोटे निशान-स्तंभ खड़े होते हैं जो नावों को बताते हैं कि कहाँ पानी बहुत उथला है, ताकि वे मूँगे से न टकराएँ।", "ನೀರು ಎಲ್ಲಿ ತುಂಬಾ ಆಳವಿಲ್ಲವೋ ಅಲ್ಲಿ ದೋಣಿಗಳಿಗೆ ಎಚ್ಚರಿಸಲು ಹವಳದ ದಿಬ್ಬಗಳ ಮೇಲೆ ಪುಟ್ಟ ಗುರುತುಕಂಬಗಳಿರುತ್ತವೆ; ದೋಣಿಗಳು ಹವಳಕ್ಕೆ ಡಿಕ್ಕಿ ಹೊಡೆಯುವುದಿಲ್ಲ."],
   ["The hawksbill turtle has a pointed beak like a hawk's. It pulls sponges out of cracks in the reef to eat.", "हॉक्सबिल कछुए की चोंच बाज़ जैसी नुकीली होती है। यह चट्टान की दरारों से स्पंज निकालकर खाता है।", "ಗಿಣಿಕೊಕ್ಕಿನ ಕಡಲಾಮೆಗೆ ಗಿಡುಗದಂತೆ ಚೂಪಾದ ಕೊಕ್ಕು ಇದೆ. ಹವಳದ ಸಂದುಗಳಿಂದ ಸ್ಪಂಜುಗಳನ್ನು ಎಳೆದು ತಿನ್ನುತ್ತದೆ."],
   ["Brain coral grows in big round domes covered with wavy grooves, just like a brain. It grows only a few millimetres a year.", "दिमाग़ी मूँगा लहरदार खाँचों से ढके बड़े गोल गुंबदों में उगता है, बिल्कुल दिमाग़ जैसा। यह साल में सिर्फ़ कुछ मिलीमीटर बढ़ता है।", "ಮಿದುಳು ಹವಳ ಅಲೆಅಲೆಯಾದ ಗೆರೆಗಳಿರುವ ದೊಡ್ಡ ದುಂಡು ಗುಮ್ಮಟಗಳಾಗಿ ಬೆಳೆಯುತ್ತದೆ, ಥೇಟ್ ಮಿದುಳಿನಂತೆ. ವರ್ಷಕ್ಕೆ ಕೆಲವೇ ಮಿಲಿಮೀಟರ್ ಬೆಳೆಯುತ್ತದೆ."],
   ["The arabana is a flat round hand drum. Groups of men sit in a line and play it while singing in the Arabanamuttu performance.", "अरबाना चपटा गोल हाथ का ढोल है। अरबानमुट्टु प्रदर्शन में पुरुषों की टोली कतार में बैठकर गाते हुए इसे बजाती है।", "ಅರಬನ ಚಪ್ಪಟೆಯಾದ ದುಂಡು ಕೈದಪ್ಪು. ಅರಬನಮುಟ್ಟು ಪ್ರದರ್ಶನದಲ್ಲಿ ಗಂಡಸರ ತಂಡ ಸಾಲಾಗಿ ಕುಳಿತು ಹಾಡುತ್ತಾ ಇದನ್ನು ಬಾರಿಸುತ್ತದೆ."],
   ["Visitors paddle kayaks across the calm, shallow lagoons, where the water is so clear you can see fish under the boat.", "सैलानी शांत, उथले लैगूनों में कयाक चलाते हैं, जहाँ पानी इतना साफ़ है कि नाव के नीचे मछलियाँ दिखती हैं।", "ಪ್ರವಾಸಿಗರು ಶಾಂತ, ಆಳವಿಲ್ಲದ ಕಡಲಕೊಳಗಳಲ್ಲಿ ಕಯಾಕ್ ದೋಣಿ ಹುಟ್ಟು ಹಾಕುತ್ತಾರೆ; ನೀರು ಎಷ್ಟು ತಿಳಿಯೆಂದರೆ ದೋಣಿಯ ಕೆಳಗಿನ ಮೀನೂ ಕಾಣುತ್ತದೆ."],
   ["A conch shell is the spiral home of a large sea snail. If you blow into it the right way, it makes a loud trumpet sound.", "शंख एक बड़े समुद्री घोंघे का घुमावदार घर है। इसमें सही तरीक़े से फूँकने पर तुरही जैसी तेज़ आवाज़ निकलती है।", "ಶಂಖ ದೊಡ್ಡ ಕಡಲ ಬಸವನಹುಳುವಿನ ಸುರುಳಿ ಮನೆ. ಸರಿಯಾಗಿ ಊದಿದರೆ ಕಹಳೆಯಂತೆ ಜೋರು ಸದ್ದು ಮಾಡುತ್ತದೆ."],
   ["Masmin is tuna that is boiled, smoked and dried in the sun until it is hard as wood, so it keeps for months. Most of the islands' tuna becomes masmin.", "मासमिन वह टूना है जिसे उबालकर, धुएँ में सुखाकर और धूप में लकड़ी जितना सख़्त होने तक सुखाया जाता है, ताकि महीनों चले। द्वीपों की ज़्यादातर टूना मासमिन बनती है।", "ಮಾಸ್ಮಿನ್ ಎಂದರೆ ಬೇಯಿಸಿ, ಹೊಗೆಯಲ್ಲಿ ಒಣಗಿಸಿ, ಮರದಷ್ಟು ಗಟ್ಟಿಯಾಗುವವರೆಗೆ ಬಿಸಿಲಿನಲ್ಲಿ ಒಣಗಿಸಿದ ಕೇದರ್ ಮೀನು; ತಿಂಗಳುಗಟ್ಟಲೆ ಉಳಿಯುತ್ತದೆ. ದ್ವೀಪಗಳ ಹೆಚ್ಚಿನ ಮೀನು ಮಾಸ್ಮಿನ್ ಆಗುತ್ತದೆ."],
   ["Kilanji is a paper-thin pancake made from rice and eggs, eaten with sweet coconut milk, banana and jaggery.", "किलांजी चावल और अंडे से बना काग़ज़ जैसा पतला पैनकेक है, जिसे मीठे नारियल के दूध, केले और गुड़ के साथ खाते हैं।", "ಕಿಲಾಂಜಿ ಅಕ್ಕಿ ಮತ್ತು ಮೊಟ್ಟೆಯಿಂದ ಮಾಡಿದ ಕಾಗದದಷ್ಟು ತೆಳುವಾದ ದೋಸೆ; ಸಿಹಿ ತೆಂಗಿನಹಾಲು, ಬಾಳೆಹಣ್ಣು, ಬೆಲ್ಲದ ಜೊತೆ ತಿನ್ನುತ್ತಾರೆ."],
   ["Manta rays are huge, gentle fish that glide through the water like giant birds, eating only tiny sea creatures.", "मंटा रे विशाल, शांत मछलियाँ हैं जो बड़े पक्षियों की तरह पानी में तैरती हैं और सिर्फ़ नन्हे समुद्री जीव खाती हैं।", "ಮಂಟಾ ತೊರಕೆಗಳು ದೈತ್ಯ, ಸಾಧು ಮೀನುಗಳು; ದೊಡ್ಡ ಹಕ್ಕಿಗಳಂತೆ ನೀರಿನಲ್ಲಿ ತೇಲುತ್ತಾ ಪುಟ್ಟ ಕಡಲಜೀವಿಗಳನ್ನು ಮಾತ್ರ ತಿನ್ನುತ್ತವೆ."],
   ["Spinner dolphins leap out of the sea and spin round and round in the air before splashing back down.", "स्पिनर डॉल्फ़िन समुद्र से उछलकर हवा में गोल-गोल घूमती हैं और फिर छपाक से वापस गिरती हैं।", "ಸುತ್ತುನೆಗೆತದ ಡಾಲ್ಫಿನ್‌ಗಳು ಸಮುದ್ರದಿಂದ ಜಿಗಿದು ಗಾಳಿಯಲ್ಲಿ ಗಿರಗಿರನೆ ತಿರುಗಿ, ಮತ್ತೆ ನೀರಿಗೆ ಧುಮುಕುತ್ತವೆ."],
   ["An octopus has eight arms and can change colour in a flash to hide among the rocks and coral.", "ऑक्टोपस की आठ भुजाएँ होती हैं, और यह चट्टानों और मूँगे में छिपने के लिए पल भर में रंग बदल सकता है।", "ಅಷ್ಟಪದಿಗೆ ಎಂಟು ತೋಳುಗಳಿವೆ; ಬಂಡೆ, ಹವಳಗಳ ನಡುವೆ ಅಡಗಲು ಕ್ಷಣದಲ್ಲೇ ಬಣ್ಣ ಬದಲಿಸಬಲ್ಲದು."],
   ["A hermit crab lives inside an empty sea shell. When it grows too big, it moves into a larger shell.", "हर्मिट केकड़ा किसी ख़ाली सीप के खोल में रहता है। जब यह बड़ा हो जाता है, तो बड़े खोल में चला जाता है।", "ಸನ್ಯಾಸಿ ಏಡಿ ಖಾಲಿ ಕಡಲಚಿಪ್ಪಿನೊಳಗೆ ವಾಸಿಸುತ್ತದೆ. ದೊಡ್ಡದಾದಾಗ ಇನ್ನೂ ದೊಡ್ಡ ಚಿಪ್ಪಿಗೆ ಮನೆ ಬದಲಿಸುತ್ತದೆ."],
   ["Parrotfish have beaks like parrots. They crunch dead coral, and the fine white sand of the beaches is partly made this way.", "तोता मछली की चोंच तोते जैसी होती है। यह मरे हुए मूँगे को कुतरती है, और तटों की बारीक सफ़ेद रेत का कुछ हिस्सा इसी से बनता है।", "ಗಿಣಿಮೀನಿಗೆ ಗಿಣಿಯಂಥ ಕೊಕ್ಕು ಇದೆ. ಇದು ಸತ್ತ ಹವಳವನ್ನು ಕಡಿದು ತಿನ್ನುತ್ತದೆ; ಕಡಲತೀರದ ನುಣ್ಣನೆಯ ಬಿಳಿ ಮರಳಿನ ಸ್ವಲ್ಪ ಭಾಗ ಹೀಗೆಯೇ ಆಗುತ್ತದೆ."],
   ["Clownfish live safely among the stinging arms of sea anemones, which protect them from bigger fish.", "क्लाउनफ़िश समुद्री एनीमोन की डंक मारने वाली भुजाओं के बीच सुरक्षित रहती है, जो उसे बड़ी मछलियों से बचाती हैं।", "ಕೋಡಂಗಿ ಮೀನು ಕುಟುಕುವ ಕಡಲ ಹೂಜೀವಿಗಳ ತೋಳುಗಳ ನಡುವೆ ಸುರಕ್ಷಿತವಾಗಿ ಬದುಕುತ್ತದೆ; ಅವು ಅದನ್ನು ದೊಡ್ಡ ಮೀನುಗಳಿಂದ ಕಾಪಾಡುತ್ತವೆ."],
   ["Blacktip reef sharks are small, shy sharks with black tips on their fins. They swim in the shallow lagoons and keep the reef healthy.", "ब्लैकटिप रीफ़ शार्क छोटी, शर्मीली शार्क हैं जिनके पंखों के सिरे काले होते हैं। ये उथले लैगून में तैरती हैं और चट्टानों को स्वस्थ रखती हैं।", "ಕರಿತುದಿ ಹವಳದ ಶಾರ್ಕ್‌ಗಳು ರೆಕ್ಕೆಗಳ ತುದಿ ಕಪ್ಪಾಗಿರುವ ಪುಟ್ಟ, ನಾಚಿಕೆಯ ಶಾರ್ಕ್‌ಗಳು. ಇವು ಆಳವಿಲ್ಲದ ಕಡಲಕೊಳಗಳಲ್ಲಿ ಈಜುತ್ತಾ ಹವಳದ ದಿಬ್ಬವನ್ನು ಆರೋಗ್ಯವಾಗಿಡುತ್ತವೆ."],
   ["The Lava dance of Minicoy is performed at festivals by dancers in bright costumes, moving to the beat of drums and songs.", "मिनिकॉय का लावा नृत्य उत्सवों में चमकीली पोशाकों वाले नर्तक ढोल और गीतों की ताल पर करते हैं।", "ಮಿನಿಕಾಯ್‌ನ ಲಾವಾ ನೃತ್ಯವನ್ನು ಹಬ್ಬಗಳಲ್ಲಿ ಢಾಳ ಬಣ್ಣದ ಉಡುಪಿನ ನರ್ತಕರು ಡೋಲು ಮತ್ತು ಹಾಡಿನ ತಾಳಕ್ಕೆ ಮಾಡುತ್ತಾರೆ."],
   ["In Kolkali, dancers move in a circle, tapping short wooden sticks against each other's in time with the song.", "कोलकली में नर्तक गोले में घूमते हुए गीत की ताल पर एक-दूसरे की छोटी लकड़ी की छड़ियों से छड़ियाँ टकराते हैं।", "ಕೋಲ್ಕಳಿಯಲ್ಲಿ ನರ್ತಕರು ವೃತ್ತದಲ್ಲಿ ಸುತ್ತುತ್ತಾ ಹಾಡಿನ ತಾಳಕ್ಕೆ ತಮ್ಮ ಪುಟ್ಟ ಮರದ ಕೋಲುಗಳನ್ನು ಒಬ್ಬರದಕ್ಕೊಬ್ಬರು ತಾಗಿಸುತ್ತಾರೆ."],
   ["Parichakali is a dance with wooden shields and swords. Pairs of dancers leap and strike in a pretend fight to the beat of songs.", "परिचकली लकड़ी की ढालों और तलवारों वाला नृत्य है। नर्तकों के जोड़े गीतों की ताल पर उछलते हैं और नक़ली लड़ाई में वार करते हैं।", "ಪರಿಚಕಳಿ ಮರದ ಗುರಾಣಿ-ಕತ್ತಿಗಳ ನೃತ್ಯ. ನರ್ತಕರ ಜೋಡಿಗಳು ಹಾಡಿನ ತಾಳಕ್ಕೆ ಜಿಗಿಯುತ್ತಾ ನಾಟಕೀಯ ಕಾಳಗದಲ್ಲಿ ಹೊಡೆಯುತ್ತಾರೆ."],
   ["Kavaratti's Ujra Mosque has a ceiling carved from a single piece of driftwood, people say, with delicate patterns all over it.", "कवरत्ती की उजरा मस्जिद की छत पर बारीक नक्काशी है; लोग कहते हैं कि यह बहकर आई लकड़ी के एक ही टुकड़े से बनी है।", "ಕವರತ್ತಿಯ ಉಜ್ರಾ ಮಸೀದಿಯ ಛಾವಣಿಯ ತುಂಬಾ ನಾಜೂಕಾದ ಕೆತ್ತನೆ ಇದೆ; ತೇಲಿ ಬಂದ ಒಂದೇ ಮರದ ತುಂಡಿನಿಂದ ಮಾಡಿದ್ದು ಎಂದು ಜನ ಹೇಳುತ್ತಾರೆ."],
   ["Many Minicoy homes have a wooden swing cot hanging inside, painted in bright colours and patterns.", "मिनिकॉय के कई घरों में अंदर लकड़ी का झूला-पलंग लटका होता है, जो चटक रंगों और नमूनों से रंगा होता है।", "ಮಿನಿಕಾಯ್‌ನ ಅನೇಕ ಮನೆಗಳ ಒಳಗೆ ಮರದ ಉಯ್ಯಾಲೆ ಮಂಚ ತೂಗುತ್ತಿರುತ್ತದೆ; ಅದಕ್ಕೆ ಗಾಢ ಬಣ್ಣ, ಚಿತ್ತಾರ ಬಳಿದಿರುತ್ತಾರೆ."],
   ["Minicoy craftspeople make small model boats and paint them carefully, just like the real boats of the island.", "मिनिकॉय के कारीगर छोटे नाव के मॉडल बनाते हैं और उन्हें द्वीप की असली नावों की तरह ध्यान से रंगते हैं।", "ಮಿನಿಕಾಯ್‌ನ ಕುಶಲಕರ್ಮಿಗಳು ಪುಟ್ಟ ದೋಣಿ ಮಾದರಿಗಳನ್ನು ಮಾಡಿ, ದ್ವೀಪದ ನಿಜವಾದ ದೋಣಿಗಳಂತೆಯೇ ಎಚ್ಚರದಿಂದ ಬಣ್ಣ ಬಳಿಯುತ್ತಾರೆ."],
   ["Big passenger ships sail between Kochi and the islands, carrying people, food and letters across the sea.", "बड़े यात्री जहाज़ कोच्चि और द्वीपों के बीच चलते हैं, जो समुद्र पार लोगों, खाने और चिट्ठियों को ले जाते हैं।", "ದೊಡ್ಡ ಪ್ರಯಾಣಿಕರ ಹಡಗುಗಳು ಕೊಚ್ಚಿ ಮತ್ತು ದ್ವೀಪಗಳ ನಡುವೆ ಸಂಚರಿಸಿ, ಜನ, ಆಹಾರ, ಪತ್ರಗಳನ್ನು ಸಮುದ್ರದಾಚೆ ಸಾಗಿಸುತ್ತವೆ."],
   ["Helicopters fly between the islands, and in an emergency they rush sick people to hospital.", "हेलिकॉप्टर द्वीपों के बीच उड़ते हैं, और आपात स्थिति में बीमार लोगों को जल्दी अस्पताल पहुँचाते हैं।", "ಹೆಲಿಕಾಪ್ಟರ್‌ಗಳು ದ್ವೀಪಗಳ ನಡುವೆ ಹಾರುತ್ತವೆ; ತುರ್ತು ಸಮಯದಲ್ಲಿ ರೋಗಿಗಳನ್ನು ಬೇಗನೆ ಆಸ್ಪತ್ರೆಗೆ ತಲುಪಿಸುತ್ತವೆ."],
   ["With a snorkel mask you can float face-down in the lagoon and breathe through a tube while watching the fish below.", "स्नॉर्कल मास्क पहनकर आप लैगून में मुँह नीचे करके तैर सकते हैं और नली से साँस लेते हुए नीचे की मछलियाँ देख सकते हैं।", "ಮುಳುಗುಈಜು ಮುಖವಾಡ ಧರಿಸಿ ಕಡಲಕೊಳದಲ್ಲಿ ಮುಖ ಕೆಳಗೆ ಮಾಡಿ ತೇಲುತ್ತಾ, ನಳಿಕೆಯಿಂದ ಉಸಿರಾಡುತ್ತಾ ಕೆಳಗಿನ ಮೀನುಗಳನ್ನು ನೋಡಬಹುದು."],
   ["Giant clams sit in the reef with their wavy shells open, showing bright blue and green lips inside.", "विशाल सीपें चट्टान में अपने लहरदार खोल खोलकर बैठती हैं, जिनके अंदर चटक नीले और हरे होंठ दिखते हैं।", "ದೈತ್ಯ ಚಿಪ್ಪುಗಳು ಹವಳದ ದಿಬ್ಬದಲ್ಲಿ ತಮ್ಮ ಅಲೆಅಲೆಯಾದ ಚಿಪ್ಪು ತೆರೆದು ಕುಳಿತಿರುತ್ತವೆ; ಒಳಗೆ ಗಾಢ ನೀಲಿ-ಹಸಿರು ತುಟಿಗಳು ಕಾಣುತ್ತವೆ."],
   ["A sand cay is a tiny island of pure white sand that can appear, shrink or move as the waves and storms reshape it.", "रेत का टापू शुद्ध सफ़ेद रेत का छोटा द्वीप है, जो लहरों और तूफ़ानों से बनता, सिकुड़ता या खिसकता रहता है।", "ಮರಳು ದಿಬ್ಬ ಶುದ್ಧ ಬಿಳಿ ಮರಳಿನ ಪುಟ್ಟ ದ್ವೀಪ; ಅಲೆ, ಚಂಡಮಾರುತಗಳಿಂದ ಅದು ಹುಟ್ಟಬಹುದು, ಕುಗ್ಗಬಹುದು ಅಥವಾ ಜಾಗ ಬದಲಿಸಬಹುದು."]],
  tn:[["A gopuram is the tall gateway tower of a South Indian temple. It gets narrower as it rises and is covered with colourful carved figures of gods, animals and people.", "गोपुरम दक्षिण भारतीय मंदिर का ऊँचा प्रवेश-द्वार स्तंभ है। यह ऊपर जाते-जाते पतला होता है और देवताओं, जानवरों और लोगों की रंगीन मूर्तियों से ढका होता है।", "ಗೋಪುರ ದಕ್ಷಿಣ ಭಾರತದ ದೇವಾಲಯದ ಎತ್ತರದ ಪ್ರವೇಶ ಗೋಪುರ. ಮೇಲೆ ಹೋದಂತೆ ಕಿರಿದಾಗುತ್ತದೆ; ದೇವರು, ಪ್ರಾಣಿ, ಮನುಷ್ಯರ ಬಣ್ಣದ ಕೆತ್ತನೆಗಳಿಂದ ತುಂಬಿರುತ್ತದೆ."],
   ["Tanjore paintings use real gold foil pressed onto raised parts of the picture, and glass stones that sparkle like jewels. They often show baby Krishna or other gods.", "तंजौर चित्रों में तस्वीर के उभरे हिस्सों पर असली सोने की पन्नी दबाई जाती है, और गहनों जैसे चमकते काँच के पत्थर लगाए जाते हैं। इनमें अक्सर बाल कृष्ण या दूसरे देवता होते हैं।", "ತಂಜಾವೂರು ಚಿತ್ರಗಳಲ್ಲಿ ಚಿತ್ರದ ಉಬ್ಬಿದ ಭಾಗಗಳ ಮೇಲೆ ನಿಜವಾದ ಚಿನ್ನದ ಹಾಳೆ ಒತ್ತುತ್ತಾರೆ, ಆಭರಣದಂತೆ ಮಿನುಗುವ ಗಾಜಿನ ಹರಳು ಕೂರಿಸುತ್ತಾರೆ. ಇವುಗಳಲ್ಲಿ ಹೆಚ್ಚಾಗಿ ಬಾಲಕೃಷ್ಣ ಅಥವಾ ಇತರ ದೇವರು ಇರುತ್ತಾರೆ."],
   ["Bharatanatyam is the classical dance of Tamil Nadu. Dancers tell whole stories with their eyes, faces and hand gestures called mudras.", "भरतनाट्यम तमिलनाडु का शास्त्रीय नृत्य है। नर्तक अपनी आँखों, चेहरे और 'मुद्रा' कहलाने वाले हाथ के इशारों से पूरी कहानियाँ कहते हैं।", "ಭರತನಾಟ್ಯ ತಮಿಳುನಾಡಿನ ಶಾಸ್ತ್ರೀಯ ನೃತ್ಯ. ನರ್ತಕರು ಕಣ್ಣು, ಮುಖಭಾವ ಮತ್ತು 'ಮುದ್ರೆ' ಎಂಬ ಕೈಸನ್ನೆಗಳಿಂದಲೇ ಇಡೀ ಕಥೆ ಹೇಳುತ್ತಾರೆ."],
   ["At the Pongal harvest festival in January, new rice is cooked with milk and jaggery in a clay pot until it boils over, a sign of plenty for the year.", "जनवरी में पोंगल फ़सल उत्सव पर नए चावल को दूध और गुड़ के साथ मिट्टी के बर्तन में तब तक पकाते हैं जब तक वह उफनकर बाहर न आ जाए, जो साल भर की समृद्धि का शुभ संकेत है।", "ಜನವರಿಯ ಪೊಂಗಲ್ ಸುಗ್ಗಿ ಹಬ್ಬದಲ್ಲಿ ಹೊಸ ಅಕ್ಕಿಯನ್ನು ಹಾಲು, ಬೆಲ್ಲದ ಜೊತೆ ಮಣ್ಣಿನ ಮಡಕೆಯಲ್ಲಿ ಉಕ್ಕಿ ಬರುವವರೆಗೆ ಬೇಯಿಸುತ್ತಾರೆ; ವರ್ಷವಿಡೀ ಸಮೃದ್ಧಿಯ ಶುಭ ಸೂಚನೆ ಅದು."],
   ["Every morning, many families draw a kolam at their doorstep with rice flour. Ants and birds eat the flour, so the drawing also shares food with small creatures.", "हर सुबह कई परिवार अपने दरवाज़े पर चावल के आटे से कोलम बनाते हैं। चींटियाँ और पक्षी वह आटा खाते हैं, इसलिए यह चित्र छोटे जीवों के साथ भोजन भी बाँटता है।", "ಪ್ರತಿ ಮುಂಜಾನೆ ಅನೇಕ ಮನೆಗಳ ಬಾಗಿಲ ಮುಂದೆ ಅಕ್ಕಿಹಿಟ್ಟಿನಿಂದ ರಂಗೋಲಿ ಹಾಕುತ್ತಾರೆ. ಇರುವೆ, ಹಕ್ಕಿಗಳು ಆ ಹಿಟ್ಟನ್ನು ತಿನ್ನುತ್ತವೆ; ಹೀಗೆ ಆ ಚಿತ್ತಾರ ಪುಟ್ಟ ಜೀವಿಗಳ ಜೊತೆ ಆಹಾರವನ್ನೂ ಹಂಚುತ್ತದೆ."],
   ["The palmyra palm is Tamil Nadu's state tree. Its leaves were once used to write books on, and its jelly-like nungu fruit is a cool summer treat.", "ताड़ (पल्मायरा) का पेड़ तमिलनाडु का राज्य वृक्ष है। कभी इसके पत्तों पर किताबें लिखी जाती थीं, और इसका जेली जैसा 'नुंगु' फल गर्मियों की ठंडी सौगात है।", "ತಾಳೆ ಮರ ತಮಿಳುನಾಡಿನ ರಾಜ್ಯ ವೃಕ್ಷ. ಹಿಂದೆ ಇದರ ಗರಿಗಳ ಮೇಲೆ ಪುಸ್ತಕ ಬರೆಯುತ್ತಿದ್ದರು; ಇದರ ಜೆಲ್ಲಿಯಂಥ 'ನುಂಗು' ಹಣ್ಣು ಬೇಸಿಗೆಯ ತಂಪು ಉಡುಗೊರೆ."],
   ["The Nilgiri toy train is so slow on the steep climb that you could almost walk beside it. The ride up to Ooty passes through many tunnels and over many bridges.", "नीलगिरि खिलौना रेल खड़ी चढ़ाई पर इतनी धीमी चलती है कि आप लगभग उसके साथ पैदल चल सकें। ऊटी तक का रास्ता कई सुरंगों और पुलों से होकर जाता है।", "ನೀಲಗಿರಿ ಆಟಿಕೆ ರೈಲು ಕಡಿದಾದ ಏರಿನಲ್ಲಿ ಎಷ್ಟು ನಿಧಾನವೆಂದರೆ ಅದರ ಪಕ್ಕದಲ್ಲೇ ನಡೆದುಬಿಡಬಹುದು. ಊಟಿಯವರೆಗಿನ ದಾರಿ ಹಲವು ಸುರಂಗ, ಸೇತುವೆಗಳ ಮೂಲಕ ಸಾಗುತ್ತದೆ."],
   ["The Thanjavur veena is carved from a single block of jackfruit wood. It has seven strings and is one of the oldest instruments of Indian classical music.", "तंजावुर वीणा कटहल की लकड़ी के एक ही टुकड़े से तराशी जाती है। इसमें सात तार होते हैं और यह भारतीय शास्त्रीय संगीत के सबसे पुराने वाद्यों में से एक है।", "ತಂಜಾವೂರು ವೀಣೆಯನ್ನು ಹಲಸಿನ ಮರದ ಒಂದೇ ತುಂಡಿನಿಂದ ಕೆತ್ತುತ್ತಾರೆ. ಇದಕ್ಕೆ ಏಳು ತಂತಿಗಳು; ಭಾರತೀಯ ಶಾಸ್ತ್ರೀಯ ಸಂಗೀತದ ಅತಿ ಹಳೆಯ ವಾದ್ಯಗಳಲ್ಲಿ ಇದೂ ಒಂದು."],
   ["Kanchipuram silk saris are woven with thick silk and real silver threads coated in gold. The border is often woven separately and joined so tightly it never comes apart.", "कांचीपुरम रेशमी साड़ियाँ मोटे रेशम और सोने की परत चढ़े असली चाँदी के धागों से बुनी जाती हैं। किनारा अक्सर अलग बुनकर इतनी मज़बूती से जोड़ा जाता है कि कभी अलग नहीं होता।", "ಕಂಚಿ ರೇಷ್ಮೆ ಸೀರೆಗಳನ್ನು ದಪ್ಪ ರೇಷ್ಮೆ ಮತ್ತು ಚಿನ್ನದ ಲೇಪದ ನಿಜವಾದ ಬೆಳ್ಳಿ ಎಳೆಗಳಿಂದ ನೇಯುತ್ತಾರೆ. ಅಂಚನ್ನು ಹೆಚ್ಚಾಗಿ ಬೇರೆಯಾಗಿ ನೇಯ್ದು, ಎಂದೂ ಬಿಡದಷ್ಟು ಬಿಗಿಯಾಗಿ ಜೋಡಿಸುತ್ತಾರೆ."],
