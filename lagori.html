/* ---------- screens ---------- */
function renderScore(){ if(!G){$('#score').innerHTML='';return} $('#score').innerHTML=Array.from({length:G.players},(_,i)=>`<span class="pl ${i===G.cur?'on':''}">${G.players===1?t('you'):t('p')(i+1)} <b>${G.scores[i]}</b></span>`).join('')+`<span class="pl">${t('round')(Math.min(G.round,ROUNDS),ROUNDS)}</span>` }
function start(){ newGame(); G.over=true; $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep3_effigy.jpg" alt=""><h3>${t('howT')}</h3><div class="how">${t('how').map(([i,s])=>`<div><b>${i}</b><span>${s}</span></div>`).join('')}</div>
  <div class="modes"><button class="mode" data-m="solo" aria-pressed="${mode==='solo'}">🧑 ${t('solo')}</button><button class="mode" data-m="duo" aria-pressed="${mode==='duo'}">👫 ${t('duo')}</button></div><button class="go" id="go">${t('start')}</button></div></div>`;
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b)) });
  $('#go').onclick=()=>{ ac(); $('#overlay').innerHTML=''; newGame(); say(t('round')(1,ROUNDS)+' · '+t('aim'),2.6) } }
function finish(){ G.over=true; const best=Math.max(...G.scores.slice(0,G.players)); try{const pr=JSON.parse(localStorage.getItem('storyquest')||'{}'); pr.dv3=1; localStorage.setItem('storyquest',JSON.stringify(pr))}catch(e){}
  const stars=best>=200?3:best>=120?2:1; const who=G.players===2?(G.scores[0]===G.scores[1]?'🤝':(G.scores[0]>G.scores[1]?'🏆 '+t('p')(1):'🏆 '+t('p')(2))):'';
  $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep3_satya.jpg" alt=""><h3>${t('winT')}</h3><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${t('winP')}</p>
  <p><b>${t('total')}:</b> ${G.scores.slice(0,G.players).map((s,i)=>(G.players===2?t('p')(i+1)+' ':'')+s).join(' · ')} ${who}</p><button class="go" id="again">${t('again')}</button><a class="go alt" href="index.html#dv3">${t('story')}</a></div></div>`; $('#again').onclick=start }
function applyLang(){ document.documentElement.lang=lang; $('#t-eyebrow').textContent=t('eyebrow'); $('#t-title').textContent=t('title'); $('#back').textContent=t('back');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang)); renderScore() }
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('sq_lang',lang)}catch(e){} applyLang(); if(!G||G.over)start() });
$('#sound').onclick=()=>{ soundOn=!soundOn; $('#sound').setAttribute('aria-pressed',soundOn); $('#sound').textContent=soundOn?'🔊':'🔇' };
$('#newgame').onclick=start;
layout(); applyLang(); start(); requestAnimationFrame(loop);
</script>
</body>
</html>
