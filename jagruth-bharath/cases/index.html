.hero img{width:clamp(96px,22vw,150px);filter:drop-shadow(0 6px 0 #0004);animation:bob 3s ease-in-out infinite}

.rank{font:800 17px var(--display)}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

 return `<div class="card prog"><span style="font-size:34px">🏅</span><div style="flex:1;min-width:160px"><div class="rank">${esc(rank(n))} · ${n}/${total} ${esc(UI[L].solved)}</div><div class="bar2"><i style="width:${total?Math.round(n/total*100):0}%"></i></div></div></div>`}

function renderBook(){
 const u=UI[L], s=store.get();
 document.title=u.book+' · Jagruth Bharath';
 const tiles=[...E].reverse().map(e=>{const open=isOpen(e);const href=open?`?ep=${e.n}`:'#';
  return `<a class="tile${open?'':' locked'}" href="${href}" style="--c:${e.color}" ${open?'':'aria-disabled="true" onclick="return false"'}><div class="th" style="background-image:url(${thumb(e.yt[L]||e.yt.en)})">${s[e.n]?`<span class="stamp">✔ ${esc(u.done)}</span>`:''}</div>
  <span class="no">${esc(u.case)} ${String(e.n).padStart(2,'0')}</span><span class="ic">${e.icon}</span>
  <div class="tx"><b>${esc(T(e.t))}</b><small>${open?esc(T(e.bait)).slice(0,70):'🔒 '+esc(u.soon)+' '+esc(fmtDate(e.sched))}</small></div></a>`}).join('');
 const wk=W.map(w=>{const open=isOpen(w);return `<a class="tile weekly${open?'':' locked'}" href="${open?'?weekly='+w.n:'#'}" style="--c:${w.color||'#118ab2'}" ${open?'':'onclick="return false"'}><div class="th" style="background-image:url(${thumb(w.yt[L]||w.yt.en)})"></div><span class="no">📰 ${esc(u.weekly)} #${w.n}</span><span class="ic">${w.icon||'🗞️'}</span><div class="tx"><b>${esc(T(w.t))}</b><small>${open?'':'🔒 '+esc(u.soon)+' '+esc(fmtDate(w.sched))}</small></div></a>`}).join('');
 $('#app').innerHTML=`<section class="hero" style="--c:#8338ec"><div><span class="pill">🦉 Jagruth Bharath</span><h1>${esc(u.book)}</h1><p>${esc(u.lede)}</p></div><img src="../img/mauna.webp" alt="Mauna the detective owl"></section>
 ${progressHTML()}
 ${wk?`<div class="grid">${wk}</div>`:''}
 <div class="grid">${tiles}</div>
 ${helpHTML('1930')}`;
}

function helpHTML(h){const u=UI[L];if(h==='')h='1930';
 return `<div class="helpc"><b>${h}</b><div><div style="font:800 19px var(--display)">${esc(u.help)}</div><small>${esc(h==='1915'?u.help2:u.helpc)}</small></div></div>`}

function videoHTML(e,wide){const u=UI[L];const open=isOpen(e);
 const tabs=`<div class="vtabs" role="group" aria-label="${esc(u.lang)}">${['en','hi','kn'].filter(l=>e.yt[l]).map(l=>`<button data-vl="${l}" class="${l===L?'on':''}">${LN[l]}</button>`).join('')}</div>`;
 const id=e.yt[L]||e.yt.en;
 return tabs+`<div class="vid${wide?' wide':''}" id="vid">${open?`<button data-id="${id}" aria-label="Play" style="background-image:url(${thumb(id)})"><span>▶</span></button>`:`<div class="soon">🔒 ${esc(u.soon)}<br>${esc(fmtDate(e.sched))}</div>`}</div>`}
function wireVideo(e){
 const play=b=>{b.onclick=()=>{const box=$('#vid');box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.id}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Mauna video"></iframe>`;window.__watched=true;const g=$('#gate');if(g)g.remove();}};
 const b=$('#vid button');if(b)play(b);
 document.querySelectorAll('.vtabs button').forEach(t=>t.onclick=()=>{document.querySelectorAll('.vtabs button').forEach(x=>x.classList.toggle('on',x===t));const id=e.yt[t.dataset.vl];if(!isOpen(e))return;$('#vid').innerHTML=`<button data-id="${id}" aria-label="Play" style="background-image:url(${thumb(id)})"><span>▶</span></button>`;play($('#vid button'))});
}

function renderCase(e){
 const u=UI[L], idx=E.indexOf(e), next=E[idx+1]&&isOpen(E[idx+1])?E[idx+1]:null;
 document.title=`${u.case} ${e.n}: ${T(e.t)} · ${u.book}`;
 document.documentElement.style.setProperty('--c',e.color);
 const steps=(e.steps[L]||e.steps.en);
 const blog=e.blog?`<a class="blogline" href="${esc(e.blog)}" target="_blank" rel="noopener">${esc(u.blog)}</a>`:'';
 $('#app').innerHTML=`<a href="?" class="muted" style="text-decoration:none;font-weight:700">${esc(u.back)}</a>
 <section class="hero" style="--c:${e.color}"><div><span class="pill">${e.icon} ${esc(u.case)} ${String(e.n).padStart(2,'0')}</span><h1>${esc(T(e.t))}</h1><p>${esc(T(e.lesson))}</p></div><img src="../img/mauna.webp" alt="Mauna the detective owl"></section>
 <div class="card bubble"><img src="../img/mr-promise.webp" alt="Mr. Promise"><div class="say"><small>${esc(u.says)}</small>${esc(T(e.bait))}</div></div>
 <div class="card"><h2 style="margin-bottom:10px">${esc(u.watch)}</h2>${videoHTML(e)}</div>
 <div class="card"><h2 style="margin-bottom:12px">${esc(u.freeze)}</h2><div class="steps">${steps.map((s,i)=>`<div class="flip" tabindex="0" role="button"><div><div class="f">${i+1}<small>${esc(u.tapflip)}</small></div><div class="b"><span><em>${esc(u.step)} ${i+1}</em>${esc(s)}</span></div></div></div>`).join('')}</div></div>
 <div class="card" id="quiz"></div>
 <div class="card"><h2 style="margin-bottom:10px">${esc(u.rules)}</h2><ul class="rules">${(e.rules[L]||e.rules.en).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
 ${blog}
 ${helpHTML(e.help)}
 <div class="row"><a class="btn wa" id="share" target="_blank" rel="noopener">📲 ${esc(u.share)}</a>${next?`<a class="btn" href="?ep=${next.n}">${esc(u.nextc)}</a>`:''}<a class="btn alt" href="?">${esc(u.back)}</a></div>`;
 wireVideo(e);
 document.querySelectorAll('.flip').forEach(f=>{const t=()=>{f.classList.toggle('open');sfx(520)};f.onclick=t;f.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();t()}}});
 const url=location.origin+location.pathname+'?ep='+e.n;
 $('#share').href='https://wa.me/?text='+encodeURIComponent(u.shareText.replace('{t}',T(e.t))+' '+url);
 runQuiz(e);
}

function runQuiz(e){
 const u=UI[L], box=$('#quiz'), Q=e.quiz||[];let i=0, score=0, marks=[];
 function show(){
  if(i>=Q.length) return finish();
  const q=Q[i], opts=q.o[L]||q.o.en;
  box.innerHTML=`<div class="q"><div class="qh"><h2>${esc(u.quiz)}</h2><div class="dots">${Q.map((_,k)=>`<i class="${marks[k]===1?'ok':marks[k]===0?'no':k===i?'cur':''}"></i>`).join('')}</div></div>
   <div class="muted" style="font-weight:800">${esc(u.q)} ${i+1}/${Q.length}</div><h3>${esc(T(q.q))}</h3>
   ${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}
   <div class="why" id="why"><img src="../img/mauna.webp" alt=""><div><b id="wv"></b> ${esc(T(q.why))}</div></div>
   <div id="nx"></div></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k, ok=k===q.a; marks[i]=ok?1:0; if(ok)score++;
   box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});
   if(!ok)b.classList.add('wrong');
   $('#wv').textContent=ok?u.right:u.wrong; $('#why').classList.add('show');
   if(ok){confetti(40);sfx(880);setTimeout(()=>sfx(1175),120)}else sfx(220);
   $('#nx').innerHTML=`<button class="btn" id="go">${esc(i+1<Q.length?u.next:'🏁')}</button>`;$('#go').onclick=()=>{i++;show();box.scrollIntoView({behavior:'smooth',block:'start'})};
  });
 }
 function finish(){
  const all=score===Q.length;
  if(all){const s=store.get();s[e.n]=1;store.set(s);confetti(160);sfx(660);setTimeout(()=>sfx(990),150);setTimeout(()=>sfx(1320),300)}
  const n=E.filter(x=>store.get()[x.n]).length;
  box.innerHTML=`<div class="result">${all?`<div class="bigstamp">✔ ${esc(u.done)}</div><div class="rank">🏅 ${esc(rank(n))} · ${n}/${E.length} ${esc(u.solved)}</div>`:`<h2>${esc(u.tryall)} ${score} ${esc(u.of)} ${Q.length}</h2><button class="btn" id="re">🔁 ${esc(u.again)}</button>`}</div>`;
  const re=$('#re');if(re)re.onclick=()=>{i=0;score=0;marks=[];show()};
 }
 show();
}

function renderWeekly(w){
 const u=UI[L];document.documentElement.style.setProperty('--c','#118ab2');
 document.title=`${u.weekly} #${w.n} · ${u.book}`;
 const blog=w.blog?`<a class="blogline" href="${esc(w.blog)}" target="_blank" rel="noopener">${esc(u.blog)}</a>`:'';
 $('#app').innerHTML=`<a href="?" class="muted" style="text-decoration:none;font-weight:700">${esc(u.back)}</a>
 <section class="hero" style="--c:#118ab2"><div><span class="pill">📰 ${esc(u.weekly)} #${w.n}</span><h1>${esc(T(w.t))}</h1><p>${esc(T(w.lesson))}</p></div><img src="../img/mauna.webp" alt=""></section>
 <div class="card"><h2 style="margin-bottom:10px">${esc(u.watch)}</h2>${videoHTML(w,true)}</div>
 ${w.quiz?'<div class="card" id="quiz"></div>':''}
 ${w.rules?`<div class="card"><h2 style="margin-bottom:10px">${esc(u.rules)}</h2><ul class="rules">${(w.rules[L]||w.rules.en).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}
 ${blog}${helpHTML('1930')}<div class="row"><a class="btn alt" href="?">${esc(u.back)}</a></div>`;
 wireVideo(w); if(w.quiz) runQuiz(Object.assign({},w,{n:'w'+w.n}));
}

function render(){
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 $('#brand').textContent=UI[L].book;
 const ep=qs.get('ep'), wk=qs.get('weekly');
 const e=ep&&E.find(x=>String(x.n)===ep), w=wk&&W.find(x=>String(x.n)===wk);
 if(e&&isOpen(e))renderCase(e); else if(w&&isOpen(w))renderWeekly(w); else renderBook();
}
/* tiny sound + confetti, no files needed */
let AC;function sfx(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.25);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.26)}catch(e){}}
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[];
function confetti(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;cv.width=innerWidth;cv.height=innerHeight;const C=['#ff5d8f','#ffb703','#06d6a0','#118ab2','#8338ec','#fb5607'];for(let k=0;k<n;k++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:6+Math.random()*7,c:C[k%C.length],r:Math.random()*6,life:90});if(parts.length===n)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=.2;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});parts=parts.filter(p=>p.life>0&&p.y<innerHeight+20);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}
render();
</script>
