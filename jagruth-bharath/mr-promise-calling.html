     kn:["\ud83d\udcf9 ವಿಡಿಯೋ ಕಾಲ್...","ನಾನು ಇನ್ಸ್\u200cಪೆಕ್ಟರ್ ರಾಥೋಡ್, ಮುಂಬೈ ಭಯೋತ್ಪಾದನಾ ನಿಗ್ರಹ ದಳ.","ನಿಮ್ಮ ಆಧಾರ್ ನಂಬರ್ ಟೆರರ್ ಫಂಡಿಂಗ್ ಹಣ ವರ್ಗಾವಣೆ ಕೇಸ್\u200cಗೆ ಸಂಬಂಧಿಸಿದೆ. ನಿಮ್ಮ ಹೆಸರಿನಲ್ಲಿ ಬಂಧನ ವಾರಂಟ್ ಹೊರಡಿಸಲಾಗಿದೆ."]},
  o:[{s:0,t:{en:"Sir, I am innocent! Please help me.",hi:"सर, मैं बेक़सूर हूँ! प्लीज़ मेरी मदद कीजिए\u0964",kn:"ಸರ್, ನಾನು ನಿರಪರಾಧಿ! ದಯವಿಟ್ಟು ಸಹಾಯ ಮಾಡಿ."}},
     {s:1,t:{en:"Police don't arrest on video calls. I'm cutting this call.",hi:"पुलिस वीडियो कॉल पर गिरफ़्तार नहीं करती\u0964 मैं कॉल काट रहा हूँ\u0964",kn:"ಪೊಲೀಸರು ವಿಡಿಯೋ ಕಾಲ್\u200cನಲ್ಲಿ ಬಂಧಿಸುವುದಿಲ್ಲ. ನಾನು ಕರೆ ಕಟ್ ಮಾಡುತ್ತಿದ್ದೇನೆ."}},
     {s:0,t:{en:"Which case? Send me the details.",hi:"कौन-सा केस? मुझे डिटेल भेजिए\u0964",kn:"ಯಾವ ಕೇಸ್? ವಿವರ ಕಳುಹಿಸಿ."}}],
  c:{en:"Police, CBI or ED never call on WhatsApp or video to arrest anyone. There is no 'digital arrest' in Indian law.",hi:"पुलिस, CBI या ED कभी WhatsApp या वीडियो कॉल पर गिरफ़्तारी नहीं करते\u0964 भारतीय क़ानून में 'डिजिटल अरेस्ट' नहीं है\u0964",kn:"ಪೊಲೀಸ್, CBI ಅಥವಾ ED ಎಂದೂ WhatsApp ಅಥವಾ ವಿಡಿಯೋ ಕಾಲ್\u200cನಲ್ಲಿ ಬಂಧಿಸುವುದಿಲ್ಲ. ಭಾರತದ ಕಾನೂನಿನಲ್ಲಿ 'ಡಿಜಿಟಲ್ ಅರೆಸ್ಟ್' ಇಲ್ಲ."}},
 {m:{en:["\ud83d\udcc4 Arrest_Warrant_CBI.pdf","This is a secret national security case. Stay on this video call. Do NOT tell anyone - not even your family. If you tell anyone, they will also be arrested."],
     hi:["\ud83d\udcc4 Arrest_Warrant_CBI.pdf","यह गुप्त राष्ट्रीय सुरक्षा केस है\u0964 इसी वीडियो कॉल पर रहिए\u0964 किसी को मत बताइए - परिवार को भी नहीं\u0964 बताया तो उन्हें भी गिरफ़्तार किया जाएगा\u0964"],
     kn:["\ud83d\udcc4 Arrest_Warrant_CBI.pdf","ಇದು ರಹಸ್ಯ ರಾಷ್ಟ್ರೀಯ ಭದ್ರತಾ ಕೇಸ್. ಇದೇ ವಿಡಿಯೋ ಕಾಲ್\u200cನಲ್ಲಿರಿ. ಯಾರಿಗೂ ಹೇಳಬೇಡಿ - ಕುಟುಂಬಕ್ಕೂ. ಹೇಳಿದರೆ ಅವರನ್ನೂ ಬಂಧಿಸುತ್ತೇವೆ."]},
  o:[{s:0,t:{en:"OK sir, I won't tell anyone.",hi:"ठीक है सर, मैं किसी को नहीं बताऊँगा\u0964",kn:"ಸರಿ ಸರ್, ಯಾರಿಗೂ ಹೇಳುವುದಿಲ್ಲ."}},
     {s:1,t:{en:"I'm calling my son right now.",hi:"मैं अभी अपने बेटे को फ़ोन कर रहा हूँ\u0964",kn:"ನಾನು ಈಗಲೇ ನನ್ನ ಮಗನಿಗೆ ಕರೆ ಮಾಡುತ್ತೇನೆ."}}],
  c:{en:"'Tell no one' is the biggest red flag. Secrecy removes the one thing that stops every scam - a second opinion.",hi:"'किसी को मत बताना' सबसे बड़ा ख़तरे का संकेत है\u0964 चुप्पी वह चीज़ छीन लेती है जो हर स्कैम रोकती है - दूसरी राय\u0964",kn:"'ಯಾರಿಗೂ ಹೇಳಬೇಡಿ' ಎಂಬುದೇ ದೊಡ್ಡ ಅಪಾಯದ ಸೂಚನೆ. ಗುಟ್ಟು ಪ್ರತಿಯೊಂದು ಮೋಸವನ್ನೂ ತಡೆಯುವ ಇನ್ನೊಬ್ಬರ ಅಭಿಪ್ರಾಯವನ್ನು ಕಿತ್ತುಕೊಳ್ಳುತ್ತದೆ."}},
 {m:{en:["To prove you are innocent, move your fixed deposit to the RBI verification account.","It will be returned within 24 hours after verification. Do it now, or the warrant will be executed."],
     hi:["बेक़सूर साबित करने के लिए अपनी एफडी RBI वेरिफ़िकेशन खाते में डालिए\u0964","जाँच के बाद 24 घंटे में लौटा दी जाएगी\u0964 अभी कीजिए, वरना वारंट लागू होगा\u0964"],
     kn:["ನಿರಪರಾಧಿ ಎಂದು ಸಾಬೀತುಪಡಿಸಲು ನಿಮ್ಮ ಎಫ್\u200cಡಿಯನ್ನು RBI ಪರಿಶೀಲನಾ ಖಾತೆಗೆ ಹಾಕಿ.","ಪರಿಶೀಲನೆಯ ನಂತರ 24 ಗಂಟೆಯಲ್ಲಿ ಮರಳಿಸುತ್ತೇವೆ. ಈಗಲೇ ಮಾಡಿ, ಇಲ್ಲದಿದ್ದರೆ ವಾರಂಟ್ ಜಾರಿ."]},
  o:[{s:0,t:{en:"Transferring \u20b95 lakh now.",hi:"अभी \u20b95 लाख भेज रहा हूँ\u0964",kn:"ಈಗಲೇ \u20b95 ಲಕ್ಷ ಕಳುಹಿಸುತ್ತೇನೆ."}},
     {s:1,t:{en:"No agency takes money for 'verification'. I'm calling 1930.",hi:"कोई एजेंसी 'जाँच' के लिए पैसा नहीं लेती\u0964 मैं 1930 पर कॉल कर रहा हूँ\u0964",kn:"ಯಾವ ಸಂಸ್ಥೆಯೂ 'ಪರಿಶೀಲನೆ'ಗೆ ಹಣ ತೆಗೆದುಕೊಳ್ಳುವುದಿಲ್ಲ. ನಾನು 1930ಗೆ ಕರೆ ಮಾಡುತ್ತೇನೆ."}}],
  c:{en:"No police, court or RBI ever asks you to move money for 'verification' or 'safe custody'.",hi:"कोई पुलिस, कोर्ट या RBI कभी 'जाँच' या 'सुरक्षित रखने' के लिए पैसा नहीं मँगवाता\u0964",kn:"ಯಾವ ಪೊಲೀಸ್, ಕೋರ್ಟ್ ಅಥವಾ RBI ಎಂದೂ 'ಪರಿಶೀಲನೆ' ಅಥವಾ 'ಸುರಕ್ಷಿತವಾಗಿ ಇಡಲು' ಹಣ ಕೇಳುವುದಿಲ್ಲ."}}
 ]},
{id:"refund",icon:"\ud83d\uded2",amt:"\u20b91,05,000",
 name:{en:"The \u20b9441 refund",hi:"\u20b9441 का रिफ़ंड",kn:"\u20b9441 ರಿಫಂಡ್"},
 from:{en:"Customer Care 24x7 \u2714",hi:"Customer Care 24x7 \u2714",kn:"Customer Care 24x7 \u2714"},
 beats:[
 {m:{en:["(You searched 'shopping refund customer care number' and called the first number.)","Hello madam, refund team here. Your \u20b9441 refund has failed. Don't worry, I will process it right now."],
     hi:["(आपने 'शॉपिंग रिफ़ंड कस्टमर केयर नंबर' सर्च किया और पहले नंबर पर कॉल किया\u0964)","हैलो मैडम, रिफ़ंड टीम से बोल रहा हूँ\u0964 आपका \u20b9441 का रिफ़ंड फ़ेल हुआ है\u0964 चिंता मत कीजिए, मैं अभी प्रोसेस कर देता हूँ\u0964"],
     kn:["(ನೀವು 'ಶಾಪಿಂಗ್ ರಿಫಂಡ್ ಕಸ್ಟಮರ್ ಕೇರ್ ನಂಬರ್' ಹುಡುಕಿ ಮೊದಲ ನಂಬರ್\u200cಗೆ ಕರೆ ಮಾಡಿದಿರಿ.)","ಹಲೋ ಮೇಡಂ, ರಿಫಂಡ್ ತಂಡದಿಂದ. ನಿಮ್ಮ \u20b9441 ರಿಫಂಡ್ ವಿಫಲವಾಗಿದೆ. ಚಿಂತೆ ಬೇಡ, ಈಗಲೇ ಪ್ರೊಸೆಸ್ ಮಾಡುತ್ತೇನೆ."]},
  o:[{s:0,t:{en:"Thank you! What should I do?",hi:"धन्यवाद! मुझे क्या करना है?",kn:"ಧನ್ಯವಾದ! ನಾನೇನು ಮಾಡಬೇಕು?"}},
     {s:1,t:{en:"I'll use the Help section inside the official app instead.",hi:"मैं ऑफ़िशियल ऐप के अंदर Help सेक्शन से ही करूँगी\u0964",kn:"ನಾನು ಅಧಿಕೃತ ಆ್ಯಪ್\u200cನ ಒಳಗಿನ Help ವಿಭಾಗದಿಂದಲೇ ಮಾಡುತ್ತೇನೆ."}}],
  c:{en:"Customer-care numbers from Google search are often planted by scammers. Use only the Help section inside the official app.",hi:"Google सर्च के कस्टमर-केयर नंबर अक्सर ठग डालते हैं\u0964 सिर्फ़ ऑफ़िशियल ऐप का Help सेक्शन इस्तेमाल कीजिए\u0964",kn:"Google ಸರ್ಚ್\u200cನ ಕಸ್ಟಮರ್ ಕೇರ್ ನಂಬರ್\u200cಗಳನ್ನು ಹೆಚ್ಚಾಗಿ ವಂಚಕರೇ ಹಾಕಿರುತ್ತಾರೆ. ಅಧಿಕೃತ ಆ್ಯಪ್\u200cನ Help ವಿಭಾಗ ಮಾತ್ರ ಬಳಸಿ."}},
 {m:{en:["Please click this link and fill your details:","\ud83d\udd17 refund-helpdesk-claim.in/form","It takes only one minute, madam."],
     hi:["कृपया यह लिंक क्लिक करके अपनी डिटेल भरिए:","\ud83d\udd17 refund-helpdesk-claim.in/form","बस एक मिनट लगेगा, मैडम\u0964"],
     kn:["ದಯವಿಟ್ಟು ಈ ಲಿಂಕ್ ಕ್ಲಿಕ್ ಮಾಡಿ ವಿವರ ತುಂಬಿ:","\ud83d\udd17 refund-helpdesk-claim.in/form","ಒಂದೇ ನಿಮಿಷ, ಮೇಡಂ."]},
  o:[{s:0,t:{en:"Opening the link...",hi:"लिंक खोल रही हूँ...",kn:"ಲಿಂಕ್ ತೆರೆಯುತ್ತಿದ್ದೇನೆ..."}},
     {s:1,t:{en:"Why does a refund need a link? I'm hanging up.",hi:"रिफ़ंड के लिए लिंक क्यों? मैं फ़ोन रख रही हूँ\u0964",kn:"ರಿಫಂಡ್\u200cಗೆ ಲಿಂಕ್ ಯಾಕೆ? ನಾನು ಕರೆ ಕಟ್ ಮಾಡುತ್ತೇನೆ."}}],
  c:{en:"Real refunds go back automatically. No refund ever needs a link, an app or your details.",hi:"असली रिफ़ंड अपने-आप वापस आता है\u0964 किसी रिफ़ंड के लिए लिंक, ऐप या डिटेल नहीं चाहिए\u0964",kn:"ನಿಜವಾದ ರಿಫಂಡ್ ತಾನಾಗಿ ಮರಳುತ್ತದೆ. ಯಾವ ರಿಫಂಡ್\u200cಗೂ ಲಿಂಕ್, ಆ್ಯಪ್ ಅಥವಾ ವಿವರ ಬೇಕಿಲ್ಲ."}},
 {m:{en:["Now a UPI request of \u20b9441 will come. Enter your UPI PIN to RECEIVE the refund.","Quickly madam, the request expires in 2 minutes!"],
     hi:["अब \u20b9441 की UPI रिक्वेस्ट आएगी\u0964 रिफ़ंड पाने के लिए UPI PIN डालिए\u0964","जल्दी मैडम, रिक्वेस्ट 2 मिनट में ख़त्म हो जाएगी!"],
     kn:["ಈಗ \u20b9441ರ UPI ರಿಕ್ವೆಸ್ಟ್ ಬರುತ್ತದೆ. ರಿಫಂಡ್ ಪಡೆಯಲು UPI PIN ಹಾಕಿ.","ಬೇಗ ಮೇಡಂ, ರಿಕ್ವೆಸ್ಟ್ 2 ನಿಮಿಷದಲ್ಲಿ ಮುಗಿಯುತ್ತದೆ!"]},
  o:[{s:0,t:{en:"Entering my PIN...",hi:"PIN डाल रही हूँ...",kn:"PIN ಹಾಕುತ್ತಿದ್ದೇನೆ..."}},
     {s:1,t:{en:"A PIN is only for PAYING. You never need it to receive money. No!",hi:"PIN सिर्फ़ पैसा भेजने के लिए होता है\u0964 पैसा पाने के लिए कभी नहीं\u0964 नहीं!",kn:"PIN ಹಣ ಕಳುಹಿಸಲು ಮಾತ್ರ. ಹಣ ಪಡೆಯಲು ಎಂದೂ ಬೇಡ. ಇಲ್ಲ!"}}],
  c:{en:"You never need a UPI PIN to receive money. If anything asks for your PIN, you are paying.",hi:"पैसा पाने के लिए कभी UPI PIN नहीं चाहिए\u0964 PIN माँगा गया, मतलब आप पैसा भेज रहे हैं\u0964",kn:"ಹಣ ಪಡೆಯಲು ಎಂದೂ UPI PIN ಬೇಡ. PIN ಕೇಳಿದರೆ ನೀವು ಹಣ ಕಳುಹಿಸುತ್ತಿದ್ದೀರಿ ಎಂದರ್ಥ."}}
 ]},
{id:"trading",icon:"\ud83d\udcc8",amt:"\u20b92,44,000",
 name:{en:"The VIP profit group",hi:"VIP मुनाफ़ा ग्रुप",kn:"VIP ಲಾಭದ ಗುಂಪು"},
 from:{en:"Profit King VIP \ud83d\udcb9",hi:"Profit King VIP \ud83d\udcb9",kn:"Profit King VIP \ud83d\udcb9"},
 beats:[
 {m:{en:["Namaste sir \ud83d\ude4f You are selected for our VIP stock group!","Our SEBI expert gives 5% profit EVERY WEEK. 2,000 members are already earning. Join today, only 10 seats left."],
     hi:["नमस्ते सर \ud83d\ude4f आप हमारे VIP स्टॉक ग्रुप के लिए चुने गए हैं!","हमारे SEBI एक्सपर्ट हर हफ़्ते 5% मुनाफ़ा देते हैं\u0964 2,000 सदस्य कमा रहे हैं\u0964 आज ही जुड़िए, सिर्फ़ 10 सीटें बचीं\u0964"],
     kn:["ನಮಸ್ತೆ ಸರ್ \ud83d\ude4f ನೀವು ನಮ್ಮ VIP ಷೇರು ಗುಂಪಿಗೆ ಆಯ್ಕೆಯಾಗಿದ್ದೀರಿ!","ನಮ್ಮ SEBI ತಜ್ಞರು ಪ್ರತಿ ವಾರ 5% ಲಾಭ ಕೊಡುತ್ತಾರೆ. 2,000 ಸದಸ್ಯರು ಗಳಿಸುತ್ತಿದ್ದಾರೆ. ಇಂದೇ ಸೇರಿ, 10 ಸೀಟು ಮಾತ್ರ ಉಳಿದಿವೆ."]},
  o:[{s:0,t:{en:"5% a week? Add me! I'll start with \u20b910,000.",hi:"हर हफ़्ते 5%? जोड़िए! \u20b910,000 से शुरू करता हूँ\u0964",kn:"ವಾರಕ್ಕೆ 5%? ಸೇರಿಸಿ! \u20b910,000ದಿಂದ ಶುರು ಮಾಡುತ್ತೇನೆ."}},
     {s:1,t:{en:"I'll first check your SEBI registration on SEBI's own website.",hi:"पहले SEBI की अपनी वेबसाइट पर आपका रजिस्ट्रेशन जाँचूँगा\u0964",kn:"ಮೊದಲು SEBI ವೆಬ್\u200cಸೈಟ್\u200cನಲ್ಲೇ ನಿಮ್ಮ ನೋಂದಣಿ ಪರಿಶೀಲಿಸುತ್ತೇನೆ."}}],
  c:{en:"'Guaranteed' weekly profit is impossible. Real advisers are SEBI-registered - and you can check that yourself.",hi:"हर हफ़्ते 'गारंटीड' मुनाफ़ा असंभव है\u0964 असली सलाहकार SEBI-रजिस्टर्ड होते हैं - और आप ख़ुद जाँच सकते हैं\u0964",kn:"ಪ್ರತಿ ವಾರ 'ಗ್ಯಾರಂಟಿ' ಲಾಭ ಅಸಾಧ್ಯ. ನಿಜವಾದ ಸಲಹೆಗಾರರು SEBI ನೋಂದಾಯಿತರು - ನೀವೇ ಪರಿಶೀಲಿಸಬಹುದು."}},
 {m:{en:["\ud83d\ude80 Congratulations! Your \u20b910,000 is now \u20b914,200 on our app!","Big news: you got an IPO allotment! Add \u20b92 lakh today to claim it - offer closes tonight."],

var FT={en:{next:'Next case',watch:'Watch the next video',cd:'Opening in {n}s',stay:'Stay here',allT:'All 5 cases done! 🦉',allM:'Mauna is proud of you. Now share these games with your family.',blog:'Read all case files',home:'Back to Scam Alert'},
hi:{next:'अगला केस',watch:'अगला वीडियो देखिए',cd:'{n} सेकंड में खुलेगा',stay:'यहीं रहिए',allT:'पाँचों केस पूरे! 🦉',allM:'मौना को आप पर गर्व है। अब ये गेम अपने परिवार के साथ शेयर कीजिए।',blog:'सभी केस फ़ाइलें पढ़िए',home:'स्कैम अलर्ट पर वापस'},
kn:{next:'ಮುಂದಿನ ಕೇಸ್',watch:'ಮುಂದಿನ ವಿಡಿಯೋ ನೋಡಿ',cd:'{n} ಸೆಕೆಂಡ್‌ನಲ್ಲಿ ತೆರೆಯುತ್ತೆ',stay:'ಇಲ್ಲೇ ಇರಿ',allT:'ಐದೂ ಕೇಸ್ ಮುಗೀತು! 🦉',allM:'ಮೌನಗೆ ನಿಮ್ಮ ಬಗ್ಗೆ ಹೆಮ್ಮೆ. ಈಗ ಈ ಆಟಗಳನ್ನು ನಿಮ್ಮ ಕುಟುಂಬದ ಜೊತೆ ಹಂಚಿಕೊಳ್ಳಿ.',blog:'ಎಲ್ಲಾ ಕೇಸ್ ಫೈಲ್‌ಗಳನ್ನು ಓದಿ',home:'ಸ್ಕ್ಯಾಮ್ ಅಲರ್ಟ್‌ಗೆ ವಾಪಸ್'}};
var cur=KIND==='safe'?'family':KIND==='spot'?'spot':'arrest';
if(KIND==='chat'){try{var q=new URLSearchParams(location.search).get('case');if(q&&ORDER.indexOf(q)>=0)cur=q}catch(e){}
 document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#jbc .case[data-i]');if(b)cur=['arrest','refund','trading'][+b.getAttribute('data-i')]||cur},true)}
var SEL={chat:'#jbc .result .end',safe:'#jbf .score',spot:'#g-body .badge'}[KIND];
function lang(){var l='en';try{l=localStorage.getItem('jb_lang')||'en'}catch(e){}return FT[l]?l:'en'}
function show(el){
 var L=lang(),t=FT[L],i=ORDER.indexOf(cur),box=document.createElement('div');box.className='flow-nx';
 if(i>=0&&i<ORDER.length-1){
  var n=NX[i+1],url='./?lang='+L+'&play='+n.id+'#'+n.id,s=12;
  box.innerHTML='<div class="k">'+t.next+' · '+n.icon+'</div><b>'+n.t[L]+'</b><p>🎬 '+n.ep[L]+'</p><a class="btn red" href="'+url+'">▶ '+t.watch+'</a><small class="ctl"><span class="cd">'+t.cd.replace('{n}',s)+'</span> · <button class="lnk">'+t.stay+'</button></small>';
  var tm=setInterval(function(){if(!document.contains(box)){clearInterval(tm);return}s--;box.querySelector('.cd').textContent=t.cd.replace('{n}',s);if(s<=0){clearInterval(tm);location.href=url}},1000);
  var stop=function(){clearInterval(tm);var c=box.querySelector('.ctl');if(c)c.remove();['pointerdown','wheel','keydown','touchstart'].forEach(function(ev){document.removeEventListener(ev,onAct,true)})};
  var onAct=function(e){if(!box.contains(e.target))stop()};
  box.querySelector('.lnk').onclick=stop;
  setTimeout(function(){['pointerdown','wheel','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,onAct,true)})},400);
 }else{
  box.innerHTML='<b>'+t.allT+'</b><p>'+t.allM+'</p><a class="btn" target="_blank" rel="noopener" href="'+BLOG+'">📰 '+t.blog+' ↗</a><a class="lnk" href="./?lang='+L+'">'+t.home+'</a>';
 }
 el.parentNode.insertBefore(box,el.nextSibling);
}
new MutationObserver(function(){var el=document.querySelector(SEL);if(el&&!el.parentNode.querySelector('.flow-nx'))show(el)}).observe(document.body,{childList:true,subtree:true});
})();
</script>
