 w:{en:"Power companies don't send disconnection threats from personal numbers. The 'officer' will ask you to install a screen-sharing app or pay a small amount, then empty your account.",hi:"बिजली कंपनियाँ निजी नंबर से कटौती की धमकी नहीं भेजतीं। 'अधिकारी' आपसे स्क्रीन-शेयर ऐप डलवाएगा या छोटी रक़म भरवाएगा, फिर खाता ख़ाली कर देगा।",kn:"ಕರೆಂಟ್ ಕಂಪನಿಗಳು ಖಾಸಗಿ ನಂಬರ್‌ನಿಂದ ಕಟ್ ಮಾಡ್ತೀವಿ ಅಂತ ಬೆದರಿಸಲ್ಲ. ಆ 'ಅಧಿಕಾರಿ' ಸ್ಕ್ರೀನ್-ಶೇರ್ ಆ್ಯಪ್ ಹಾಕಿಸ್ತಾನೆ ಅಥವಾ ಸಣ್ಣ ಮೊತ್ತ ಕಟ್ಟಿಸ್ತಾನೆ, ಆಮೇಲೆ ಅಕೌಂಟ್ ಖಾಲಿ."},ep:"Mauna Ep 12 \u2013 Power Cut Tonight"},

 t:{en:"Your order will be delivered today between 2 PM and 5 PM. No action needed. Track it in the shopping app you ordered from.",hi:"आपका ऑर्डर आज दोपहर 2 से 5 बजे के बीच पहुँचेगा। कुछ करने की ज़रूरत नहीं। जिस शॉपिंग ऐप से मँगाया, उसी में ट्रैक करें।",kn:"ನಿಮ್ಮ ಆರ್ಡರ್ ಇವತ್ತು ಮಧ್ಯಾಹ್ನ 2 ರಿಂದ 5ರ ಒಳಗೆ ಬರುತ್ತೆ. ಏನೂ ಮಾಡಬೇಕಿಲ್ಲ. ಆರ್ಡರ್ ಮಾಡಿದ ಶಾಪಿಂಗ್ ಆ್ಯಪ್‌ನಲ್ಲೇ ಟ್ರ್ಯಾಕ್ ಮಾಡಿ."},

 w:{en:"Safe. But if a 'courier' asks for a re-delivery fee, an address-update link, or says a parcel in your name has drugs \u2014 that's a scam.",hi:"सुरक्षित। पर अगर 'कूरियर' री-डिलीवरी फ़ीस, पता-अपडेट लिंक माँगे, या कहे कि आपके नाम के पार्सल में ड्रग्स हैं \u2014 तो स्कैम है।",kn:"ಸುರಕ್ಷಿತ. ಆದ್ರೆ 'ಕೊರಿಯರ್' ರೀ-ಡೆಲಿವರಿ ಫೀ, ವಿಳಾಸ-ಅಪ್‌ಡೇಟ್ ಲಿಂಕ್ ಕೇಳಿದ್ರೆ, ಅಥವಾ ನಿಮ್ಮ ಹೆಸರಿನ ಪಾರ್ಸೆಲ್‌ನಲ್ಲಿ ಡ್ರಗ್ಸ್ ಇದೆ ಅಂದ್ರೆ \u2014 ಅದು ಮೋಸ."}},

 t:{en:"Sorry madam, I sent ₹5,000 to your number by mistake! I've sent you a request on UPI \u2014 just enter your PIN to return it, please.",hi:"सॉरी मैडम, ग़लती से आपके नंबर पर ₹5,000 चले गए! मैंने UPI पर रिक्वेस्ट भेजी है \u2014 बस PIN डालकर लौटा दीजिए, प्लीज़।",kn:"ಸಾರಿ ಮೇಡಂ, ತಪ್ಪಾಗಿ ನಿಮ್ಮ ನಂಬರ್‌ಗೆ ₹5,000 ಹೋಯ್ತು! UPI ನಲ್ಲಿ ರಿಕ್ವೆಸ್ಟ್ ಕಳಿಸಿದ್ದೀನಿ \u2014 PIN ಹಾಕಿ ವಾಪಸ್ ಕೊಟ್ಟುಬಿಡಿ, ಪ್ಲೀಸ್."},
 f:{en:["A 'collect request', not a refund","Entering PIN = paying, never receiving","Pressure + politeness"],hi:["यह 'कलेक्ट रिक्वेस्ट' है, रिफ़ंड नहीं","PIN डालना = पैसे देना, लेना कभी नहीं","दबाव + विनम्रता"],kn:["ಇದು 'ಕಲೆಕ್ಟ್ ರಿಕ್ವೆಸ್ಟ್', ರೀಫಂಡ್ ಅಲ್ಲ","PIN ಹಾಕಿದ್ರೆ ದುಡ್ಡು ಹೋಗುತ್ತೆ, ಬರಲ್ಲ","ಒತ್ತಡ + ವಿನಯ"]},
 w:{en:"You never need a PIN to RECEIVE money. Check your bank balance yourself. If money really came by mistake, the bank will handle it.",hi:"पैसे पाने के लिए PIN की ज़रूरत कभी नहीं होती। बैलेंस ख़ुद देखिए। अगर सच में ग़लती से पैसा आया है, तो बैंक संभालेगा।",kn:"ದುಡ್ಡು ಬರೋಕೆ PIN ಯಾವತ್ತೂ ಬೇಕಾಗಲ್ಲ. ಬ್ಯಾಲೆನ್ಸ್ ನೀವೇ ನೋಡಿ. ನಿಜವಾಗ್ಲೂ ತಪ್ಪಾಗಿ ಬಂದಿದ್ರೆ ಬ್ಯಾಂಕ್ ನೋಡಿಕೊಳ್ಳುತ್ತೆ."},ep:"Mauna Ep 13 \u2013 I Sent It By Mistake"},

 t:{en:"Your account will be BLOCKED today due to pending KYC. Update now: bit.ly/kyc-upd8",hi:"KYC बाक़ी होने के कारण आपका खाता आज ब्लॉक हो जाएगा। अभी अपडेट करें: bit.ly/kyc-upd8",kn:"KYC ಬಾಕಿ ಇರೋದ್ರಿಂದ ನಿಮ್ಮ ಅಕೌಂಟ್ ಇವತ್ತು ಬ್ಲಾಕ್ ಆಗುತ್ತೆ. ಈಗಲೇ ಅಪ್‌ಡೇಟ್ ಮಾಡಿ: bit.ly/kyc-upd8"},

 w:{en:"The link opens a copy of your bank's page that steals your login and OTP. For KYC, visit your branch or use your bank's own app.",hi:"लिंक आपके बैंक जैसा नकली पेज खोलता है जो लॉगिन और OTP चुरा लेता है। KYC के लिए ब्रांच जाइए या बैंक का अपना ऐप इस्तेमाल कीजिए।",kn:"ಲಿಂಕ್ ನಿಮ್ಮ ಬ್ಯಾಂಕ್‌ನಂತೆ ಕಾಣೋ ನಕಲಿ ಪುಟ ತೆರೆಯುತ್ತೆ, ಲಾಗಿನ್ ಮತ್ತು OTP ಕದಿಯುತ್ತೆ. KYC ಗೆ ಬ್ರಾಂಚ್‌ಗೆ ಹೋಗಿ ಅಥವಾ ಬ್ಯಾಂಕ್‌ನ ಸ್ವಂತ ಆ್ಯಪ್ ಬಳಸಿ."},ep:"Mauna Ep 9 \u2013 The KYC Link"},
{s:0,ch:"CALL",from:{en:"Your bank's number (on your card)",hi:"आपके बैंक का नंबर (कार्ड पर लिखा)",kn:"ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ನಂಬರ್ (ಕಾರ್ಡ್ ಮೇಲಿರೋದು)"},ctx:{en:"YOU called the number printed on the back of your debit card to block it after losing it.",hi:"कार्ड खोने के बाद आपने ख़ुद डेबिट कार्ड के पीछे लिखे नंबर पर कॉल करके उसे ब्लॉक करवाया।",kn:"ಕಾರ್ಡ್ ಕಳೆದುಹೋದ ಮೇಲೆ, ಡೆಬಿಟ್ ಕಾರ್ಡ್ ಹಿಂದೆ ಇರೋ ನಂಬರ್‌ಗೆ ನೀವೇ ಫೋನ್ ಮಾಡಿ ಬ್ಲಾಕ್ ಮಾಡಿಸಿದ್ರಿ."},
 t:{en:"Bank: Your card ending 4821 is now blocked. A new card will reach your registered address in 7 days. We will never ask for your PIN or OTP.",hi:"बैंक: आपका 4821 वाला कार्ड ब्लॉक हो गया है। नया कार्ड 7 दिन में आपके पंजीकृत पते पर पहुँचेगा। हम आपसे कभी PIN या OTP नहीं माँगेंगे।",kn:"ಬ್ಯಾಂಕ್: 4821 ಕೊನೆಯ ನಿಮ್ಮ ಕಾರ್ಡ್ ಬ್ಲಾಕ್ ಆಗಿದೆ. ಹೊಸ ಕಾರ್ಡ್ 7 ದಿನದಲ್ಲಿ ನಿಮ್ಮ ನೋಂದಾಯಿತ ವಿಳಾಸಕ್ಕೆ ಬರುತ್ತೆ. ನಾವು ಯಾವತ್ತೂ PIN, OTP ಕೇಳಲ್ಲ."},
 f:{en:["YOU dialled the official number","Nothing asked from you","Says it won't ask for PIN/OTP"],hi:["आपने ख़ुद आधिकारिक नंबर मिलाया","आपसे कुछ नहीं माँगा","कहता है कि PIN/OTP नहीं माँगेंगे"],kn:["ಅಧಿಕೃತ ನಂಬರ್‌ಗೆ ನೀವೇ ಫೋನ್ ಮಾಡಿದ್ದು","ನಿಮ್ಮಿಂದ ಏನೂ ಕೇಳಿಲ್ಲ","PIN/OTP ಕೇಳಲ್ಲ ಅಂತಾನೇ ಹೇಳ್ತಿದೆ"]},
 w:{en:"The safest call is the one YOU make, to a number you found yourself (back of the card, official website). Never search 'bank customer care' on Google and dial the first result.",hi:"सबसे सुरक्षित कॉल वह है जो आप ख़ुद करें, ऐसे नंबर पर जो आपने ख़ुद ढूँढा (कार्ड के पीछे, आधिकारिक वेबसाइट)। गूगल पर 'कस्टमर केयर' खोजकर पहला नंबर कभी न मिलाएँ।",kn:"ಅತ್ಯಂತ ಸುರಕ್ಷಿತ ಕಾಲ್ ಅಂದ್ರೆ, ನೀವೇ ಹುಡುಕಿದ ನಂಬರ್‌ಗೆ (ಕಾರ್ಡ್ ಹಿಂದೆ, ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್) ನೀವೇ ಮಾಡೋದು. ಗೂಗಲ್‌ನಲ್ಲಿ 'ಕಸ್ಟಮರ್ ಕೇರ್' ಹುಡುಕಿ ಮೊದಲ ನಂಬರ್‌ಗೆ ಫೋನ್ ಮಾಡಬೇಡಿ."},ep:"Mauna Ep 10 \u2013 Fake Customer Care"}
