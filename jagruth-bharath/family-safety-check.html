{q:{en:"Have you checked how many SIM cards are registered in your name on Sanchar Saathi?",hi:"क्या आपने संचार साथी पर देखा है कि आपके नाम पर कितने SIM कार्ड हैं?",kn:"ಸಂಚಾರ ಸಾಥಿಯಲ್ಲಿ ನಿಮ್ಮ ಹೆಸರಿನಲ್ಲಿ ಎಷ್ಟು SIM ಕಾರ್ಡ್\u200cಗಳಿವೆ ಎಂದು ಪರಿಶೀಲಿಸಿದ್ದೀರಾ?"},

{q:{en:"Does everyone at home refuse to install apps (APK, 'support' or screen-sharing apps) because a caller asked?",hi:"क्या घर में हर कोई कॉल करने वाले के कहने पर ऐप (APK, 'सपोर्ट' या स्क्रीन-शेयरिंग ऐप) इंस्टॉल करने से मना करता है?",kn:"ಕರೆ ಮಾಡಿದವರು ಹೇಳಿದರೆಂದು ಆ್ಯಪ್ (APK, 'ಸಪೋರ್ಟ್' ಅಥವಾ ಸ್ಕ್ರೀನ್ ಶೇರಿಂಗ್ ಆ್ಯಪ್) ಇನ್\u200cಸ್ಟಾಲ್ ಮಾಡಲು ಮನೆಯಲ್ಲಿ ಎಲ್ಲರೂ ನಿರಾಕರಿಸುತ್ತಾರೆಯೇ?"},

{q:{en:"Do you contact customer care only from inside the official app or website - never from a Google search?",hi:"क्या आप कस्टमर केयर से सिर्फ़ ऑफ़िशियल ऐप या वेबसाइट के अंदर से संपर्क करते हैं - Google सर्च से कभी नहीं?",kn:"ಕಸ್ಟಮರ್ ಕೇರ್ ಅನ್ನು ಅಧಿಕೃತ ಆ್ಯಪ್ ಅಥವಾ ವೆಬ್\u200cಸೈಟ್ ಒಳಗಿನಿಂದಲೇ ಸಂಪರ್ಕಿಸುತ್ತೀರಾ - Google ಸರ್ಚ್\u200cನಿಂದ ಎಂದೂ ಅಲ್ಲವೇ?"},
