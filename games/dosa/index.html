button{font-family:inherit;border:0;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;top:6px;left:6px;right:6px;display:none;gap:5px;white-space:nowrap;align-items:center;z-index:5;pointer-events:none}
#hud .chip{background:rgba(255,247,234,.94);border-radius:12px;padding:3px 9px;font-weight:900;font-size:14px;line-height:1.2;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px;pointer-events:auto}

#title .sub{color:#ffe9c4;font-weight:800;font-size:clamp(15px,2.6vw,20px);text-align:center;max-width:90vw}
#langs{display:flex;gap:8px}#langs button{background:rgba(255,247,234,.25);color:#fff;border-radius:999px;padding:7px 14px;font-weight:900;border:2px solid rgba(255,240,210,.5)}#langs button.on{background:var(--cream);color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(15,8,3,.62);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
#modal .box{background:var(--cream);border-radius:24px;padding:18px 16px 14px;max-width:440px;width:100%;text-align:center;box-shadow:0 14px 50px rgba(0,0,0,.6);border:3px solid #f0d3a2;animation:pop .35s cubic-bezier(.2,1.5,.4,1);max-height:92vh;overflow:auto}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#modal h2{font-family:var(--disp);font-weight:800;margin:2px 0 6px;font-size:26px;color:var(--deep)}
#modal p{margin:6px 0;font-weight:700;color:#5c3a1c}
#modal .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.recipe{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;background:#fbefd9;border-radius:16px;padding:8px;margin:8px 0;font-weight:900}
.recipe img{width:44px;height:44px;object-fit:contain}.recipe .ar{color:#b06a24}
.stars{font-size:44px;letter-spacing:4px}.stars span{color:#d8c7a8}.stars span.got{color:#f2b705;text-shadow:0 2px 0 #b07a00}
.up{display:flex;align-items:center;gap:10px;background:#fbefd9;border-radius:14px;padding:8px 10px;margin:6px 0;text-align:left}
