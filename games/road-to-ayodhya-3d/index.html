<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Road to Ayodhya · Moksha Patam 3D</title>
<link rel="icon" href="img/wow_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&family=Baloo+Tamma+2:wght@600;800&family=Hind:wght@400;600&display=swap">
<script>window.WOW_PORTAL='site';window.WOW_GD_ID='';</script>
<script src="portal.js"></script>
<style>
:root{--night:#1c1442;--night-2:#2a1f5c;--night-3:#362a72;--ink:#fdf3dc;--muted:#c7bce6;--line:rgba(253,243,220,.16);
  --marigold:#f6a723;--flame:#ffd35a;--kumkum:#e0405a;--leaf:#46b882;--cloth:#f7e7c4;--rail:300px;
  --display:"Baloo 2","Baloo Tamma 2","Trebuchet MS",system-ui,sans-serif;--body:"Mukta","Hind","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 35% 40%,#3b2a7a 0%,#1c1442 55%,#0e0a26 100%);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.top{position:fixed;left:12px;top:8px;right:calc(var(--rail) + 22px);display:flex;align-items:center;gap:10px;z-index:10;pointer-events:none}
.top h1{margin:0;font:800 clamp(18px,2.6vw,26px)/1 var(--display);text-shadow:0 2px 8px #0008}
.top h1 small{display:block;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--marigold);margin-bottom:3px}
.lvchip{pointer-events:auto;margin-left:auto;background:#0d0826aa;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:700 14px var(--body);color:var(--flame);cursor:pointer;white-space:nowrap}
.rail{position:fixed;right:10px;top:8px;bottom:10px;width:var(--rail);display:flex;flex-direction:column;gap:8px;z-index:10}
.btns{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.pill{background:var(--night-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;min-width:34px;height:34px;padding:0 10px;font-weight:700;cursor:pointer;font-size:14px}
.pill[aria-pressed="true"]{background:var(--marigold);color:var(--night);border-color:var(--marigold)}
.panel{background:linear-gradient(180deg,#2a1f5cee,#362a72ee);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px -12px #000}
.players{display:flex;flex-direction:column;gap:4px}
.pl{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:10px;border:1.5px solid transparent;font-size:15px}
.pl.turn{background:#ffffff14;border-color:var(--flame)}
.pl i{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #0006 inset}
.pl b{flex:1;font:800 16px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl em{font-style:normal;font-size:13px}
.pl span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.dicep{display:flex;flex-direction:column;gap:8px}
.dicerow{display:flex;align-items:center;gap:10px}
#dice{width:92px;height:92px;flex:none;cursor:pointer;border-radius:14px;background:radial-gradient(circle at 50% 40%,#ffffff18,transparent 70%)}
.acts{flex:1;display:flex;flex-direction:column;gap:6px}
.roll{font:800 22px var(--display);background:var(--marigold);color:var(--night);border:0;border-radius:14px;padding:12px 10px;cursor:pointer;box-shadow:0 5px 0 #a86a0c;transition:transform .1s}
.roll:active{transform:translateY(3px);box-shadow:0 2px 0 #a86a0c}
.roll:disabled{opacity:.45;cursor:default}
.roll.pulse:not(:disabled){animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #a86a0c,0 0 0 8px #ffd35a33}}
.choice{display:none;gap:6px}.choice.on{display:flex}
.choice button{flex:1;font:800 15px var(--display);border:0;border-radius:12px;padding:9px 6px;cursor:pointer}
#move{background:var(--leaf);color:#06260f}#reroll{background:var(--flame);color:#2a1100}
.hint{color:var(--muted);font-size:13.5px;margin:0;line-height:1.35;min-height:2.7em}
.lamps{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.lamps .tok{display:flex;gap:4px}.lamps .tok span{font-size:20px;filter:grayscale(1);opacity:.35}.lamps .tok span.on{filter:none;opacity:1;text-shadow:0 0 10px #ffb84a}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress span{flex:1;min-width:18px;height:8px;border-radius:4px;background:#ffffff1a}
.progress span.done{background:var(--leaf)}.progress span.cur{background:var(--flame)}
#toast{position:fixed;left:0;top:52px;width:calc(100% - var(--rail) - 20px);display:flex;justify-content:center;pointer-events:none;z-index:30}
#toast div{background:#0d0826e6;border:2px solid var(--marigold);color:var(--ink);border-radius:999px;padding:8px 18px;font:800 17px var(--display);box-shadow:0 10px 30px #0008;
  opacity:0;transform:translateY(-10px) scale(.95);transition:opacity .25s,transform .25s;max-width:92%;text-align:center}
#toast div.on{opacity:1;transform:none}
#toast div.snake{border-color:var(--kumkum)}#toast div.ladder{border-color:var(--leaf)}
#tip{position:fixed;z-index:31;pointer-events:none;background:#0d0826ee;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font:700 13px var(--body);display:none;white-space:nowrap}
.ov{position:fixed;inset:0;background:#0d0826b0;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
.card{width:min(460px,100%);background:var(--cloth);color:#3a1d0c;border-radius:20px;padding:18px 20px;box-shadow:0 30px 80px #000a;border:5px solid var(--marigold);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-height:94vh;overflow:auto}
.card .tag{display:inline-block;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--marigold);color:#2a1100}
.card h3{font-family:var(--display);font-size:26px;line-height:1.05;margin:8px 0 6px}
.card p{margin:0 0 10px}
.card .opts{display:grid;gap:7px;margin:6px 0 10px}
.card .opt{text-align:left;border:2px solid #d9bf8d;background:#fffaf0;color:#3a1d0c;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:600;cursor:pointer}
.card .opt.right{background:#c8f2d8;border-color:var(--leaf)}.card .opt.wrong{background:#fbd0d6;border-color:var(--kumkum)}
.card .go{display:block;font:800 18px var(--display);background:#3a1d0c;color:var(--cloth);border:0;border-radius:14px;padding:11px 18px;cursor:pointer;width:100%;text-align:center}
.card .go.alt{background:#b8643a}.card .go.ghost{background:transparent;color:#3a1d0c;border:2px solid #3a1d0c}
.card .stack{display:grid;gap:8px}
.card img.hero{width:100%;border-radius:14px;display:block;margin-bottom:8px;max-height:26vh;object-fit:cover}
.card .stack.row{grid-template-columns:1fr 1fr}.card .stack.row .go:first-child{grid-column:1/-1}
.stars{font-size:34px;letter-spacing:4px;margin:2px 0 8px}.stars i{font-style:normal;color:#d9bf8d}.stars i.on{color:#f6a723;text-shadow:0 0 8px #ffb84a}
.setup .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.setup input[type=text]{flex:1;min-width:110px;font:600 16px var(--body);padding:8px 10px;border-radius:10px;border:2px solid #d9bf8d;background:#fffaf0;color:#3a1d0c;-webkit-user-select:text;user-select:text}
.setup select{font:600 15px var(--body);padding:7px 8px;border-radius:10px;border:2px solid #d9bf8d;background:#fffaf0;color:#3a1d0c}
.setup .dot{width:18px;height:18px;border-radius:50%;flex:none}
.count{display:flex;gap:6px;margin:6px 0 12px}
.count button{flex:1;font:800 18px var(--display);padding:7px;border-radius:12px;border:2px solid #d9bf8d;background:#fffaf0;color:#3a1d0c;cursor:pointer}
.count button[aria-pressed="true"]{background:#3a1d0c;color:var(--cloth);border-color:#3a1d0c}
.small{font-size:13px;color:#7a5a3a}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.map button{border:2px solid #d9bf8d;background:#fffaf0;color:#3a1d0c;border-radius:14px;padding:8px 6px;cursor:pointer;font:700 13px var(--body);line-height:1.2;min-height:76px}
.map button b{display:block;font:800 22px var(--display)}
.map button small{display:block;color:#f6a723;font-size:14px;letter-spacing:1px}
.map button.cur{border-color:#3a1d0c;background:#ffe9b8}
.map button:disabled{opacity:.45;cursor:default}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
/* portrait / narrow: board on top (main), compact controls below */
@media (max-aspect-ratio:1/1){
  :root{--rail:100%}
  .top{left:8px;right:8px;top:6px;gap:6px}.top h1 small{display:none}.top h1{font-size:19px;white-space:nowrap}.lvchip{font-size:12px;padding:5px 9px}
  .rail{left:6px;right:6px;top:auto;bottom:6px;width:auto;gap:5px}
  .rail .btns{position:fixed;top:36px;left:6px;right:6px;justify-content:center;flex-wrap:nowrap;gap:4px}
  .pill{min-width:30px;height:30px;padding:0 7px;font-size:13px}
  .panel{padding:6px 10px;border-radius:13px}
  .rail .panel.pp:last-child,.rail .panel.lp{display:none}
  .players{flex-direction:row;gap:4px}.pl{flex:1;min-width:0;padding:2px 6px;font-size:13px}.pl b{font-size:14px}.pl i{width:14px;height:14px}
  .dicerow{gap:8px}#dice{width:58px;height:58px}.roll{font-size:18px;padding:9px 8px}
  .hint{font-size:12.5px;min-height:0}.choice button{font-size:14px;padding:8px 4px}
  #toast{width:100%;top:74px}#toast div{font-size:14px;padding:6px 12px}
}
@media (max-height:560px){.card{padding:12px 16px}.card h3{font-size:22px}.stars{font-size:26px;margin:0 0 4px}.card p{margin:0 0 6px;font-size:14.5px}.card .go{padding:9px 14px;font-size:16px}}
@media (max-height:470px) and (min-aspect-ratio:1/1){
  .panel{padding:7px 10px}.pl{padding:2px 6px}#dice{width:78px;height:78px}.roll{padding:9px 8px;font-size:20px}.hint{min-height:2.4em;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D Moksha Patam board"></canvas>
<canvas id="fx"></canvas>
<header class="top">
  <h1><small id="t-eyebrow">Moksha Patam · Snakes &amp; Ladders</small><span id="t-title">Road to Ayodhya</span></h1>
  <button class="lvchip" id="lvchip">Level 1 · Ayodhya</button>
</header>
<aside class="rail">
  <div class="btns">
    <button class="pill" data-lang="en" aria-pressed="true">EN</button>
    <button class="pill" data-lang="hi" aria-pressed="false">हिं</button>
    <button class="pill" data-lang="kn" aria-pressed="false">ಕ</button>
    <button class="pill" id="music" aria-pressed="true" title="Music">🎵</button>
    <button class="pill" id="sound" aria-pressed="true" title="Sound">🔊</button>
    <button class="pill" id="who" title="Players">👥</button>
    <button class="pill" id="mapbtn" title="Levels">🗺️</button>
  </div>
  <section class="panel pp"><div class="players" id="players"></div></section>
  <section class="panel dicep">
    <div class="dicerow">
      <canvas id="dice"></canvas>
      <div class="acts">
        <button class="roll pulse" id="roll">Roll</button>
        <div class="choice" id="choice"><button id="move">Move</button><button id="reroll">Re-roll 🪔</button></div>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </section>
  <section class="panel lp">
    <div class="lamps"><span id="t-lamps">Your lamps</span><div class="tok" id="tok"></div></div>
  </section>
  <section class="panel pp"><div class="progress" id="prog"></div></section>
</aside>
<div id="toast"><div></div></div>
<div id="tip"></div>
<div id="overlay"></div>
<script type="module" src="game.js"></script>
</body>
</html>
