<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aangan — Home Stories · World of Wonders Studio</title>
<meta name="description" content="Come home to Ajji's old house. Play carrom on the verandah, make crisp dosas, and bring the courtyard back to life.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@600;800;900&family=Baloo+2:wght@600;800&family=Baloo+Tamma+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2414;--cream:#fff7ea;--paper:#fbefd9;--gold:#e8a33a;--deep:#7a3a12;--leaf:#3f7d3a;--sh:0 4px 0 rgba(70,35,10,.22);--ui:'Nunito','Baloo 2','Baloo Tamma 2',system-ui,sans-serif;--disp:'Fraunces',Georgia,serif}
html[lang=hi]{--ui:'Baloo 2','Nunito',sans-serif;--disp:'Baloo 2',serif}
html[lang=kn]{--ui:'Baloo Tamma 2','Nunito',sans-serif;--disp:'Baloo Tamma 2',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1d120a;color:var(--ink);font-family:var(--ui)}
img{-webkit-user-drag:none;pointer-events:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}
/* ---------- Hub ---------- */
#hub .bg{position:absolute;inset:0;background-size:cover;background-position:center 60%;transition:opacity 1.6s ease}
#hub .bgB{opacity:0}
#hub .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(30,15,5,.55));pointer-events:none}
#hub .light{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,220,150,.0) 30%,rgba(255,220,150,.16) 45%,rgba(255,220,150,0) 60%);animation:sun 9s ease-in-out infinite alternate}
@keyframes sun{to{transform:translateX(6%)}}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff5d6;opacity:.0;animation:mote linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}100%{transform:translate(60px,-160px);opacity:0}}
#topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:5}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,247,234,.92);border-radius:999px;padding:4px 14px 4px 5px;font-weight:900;box-shadow:var(--sh);font-size:18px}
.chip img{width:30px;height:30px}
.sp{flex:1}
.round{width:44px;height:44px;border-radius:50%;background:rgba(255,247,234,.92);box-shadow:var(--sh);display:grid;place-items:center;font-size:20px}
#placeTitle{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-family:var(--disp);font-weight:800;color:#fff;font-size:clamp(22px,4vw,34px);text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap;z-index:4;pointer-events:none}
#restore{position:absolute;left:50%;top:clamp(104px,15vh,140px);transform:translateX(-50%);z-index:5;background:rgba(255,247,234,.95);border-radius:18px;padding:8px 10px 8px 8px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;max-width:92vw;border:2px solid #f0d3a2}
#restore .ri{width:46px;height:46px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:26px}
#restore .rt{font-weight:900;font-size:15px;line-height:1.15}
#restore .rs{font-size:12.5px;color:#7a5a3c;font-weight:700}
.btn{border-radius:14px;padding:9px 16px;font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.25);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn img{width:22px}
.btn.g{background:linear-gradient(#5cc46a,#2f8f3c);color:#fff}
.btn.o{background:linear-gradient(#ffc964,#e8952a);color:#4a2306}
.btn.p{background:#eadcc6;color:#5c3a1c}
.btn.off{filter:grayscale(.9);opacity:.6}
#games{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:14px;z-index:5;padding:0 12px}
.gcard{position:relative;width:min(240px,44vw);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);border:3px solid #fff3dc;background:#2a1a10;transition:transform .15s}
.gcard:active{transform:scale(.97)}
.gcard .art{height:min(130px,18vh);background-size:cover;background-position:center}
.gcard .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(30,14,4,.9));color:#fff;text-align:left}
.gcard .gn{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1}
.gcard .gs{font-size:12.5px;font-weight:800;color:#ffd98a}
/* Ajji */
#ajji{position:fixed;left:0;bottom:0;z-index:30;display:none;align-items:flex-end;gap:0;pointer-events:none;width:100%}
#ajji.on{display:flex}
#ajji .face{height:min(46vh,380px);flex:none;margin-left:-10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));animation:breathe 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.012) translateY(-2px)}}
#ajji .say{pointer-events:auto;margin:0 12px 24px -20px;background:var(--cream);border-radius:22px;padding:16px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:3px solid #f0d3a2;max-width:560px;min-height:96px;position:relative;cursor:pointer}
#ajji .who{font-family:var(--disp);font-weight:800;color:var(--deep);font-size:17px}
#ajji .txt{font-size:clamp(16px,2.3vw,19px);font-weight:700;line-height:1.35;margin-top:2px}
#ajji .nxt{position:absolute;right:14px;bottom:8px;font-size:13px;font-weight:900;color:#b06a24;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#restore{width:min(560px,92vw)}#restore>div:nth-child(2){flex:1;min-width:0}
@media (max-aspect-ratio:1/1){#ajji{flex-direction:column;align-items:flex-start}#ajji .face{height:min(36vh,300px);margin-left:4px}#ajji .say{margin:-34px 10px 18px;max-width:none;width:calc(100% - 20px)}#placeTitle{top:58px}#restore{top:96px}}
#dim{position:fixed;inset:0;background:rgba(15,8,3,.45);z-index:29;display:none}
/* Title */
#title{background:#2a1608}
#title .bg{position:absolute;inset:0;background:url(assets/court4.webp) center/cover;filter:saturate(1.05);animation:kenburns 30s ease-in-out infinite alternate}
@keyframes kenburns{to{transform:scale(1.08) translate(-1%,-1%)}}
#title .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(30,15,5,.1),rgba(30,15,5,.75))}
#title .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#title h1{margin:0;font-family:'Fraunces',serif;font-weight:800;color:#fff3d8;font-size:clamp(54px,12vw,110px);line-height:.9;text-shadow:0 4px 24px rgba(0,0,0,.6);letter-spacing:.5px}
#title .sub{font-family:'Fraunces',serif;color:#ffe2a8;font-size:clamp(17px,3vw,24px);font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#title .goal{color:#fff3d8;font-weight:800;font-size:clamp(14px,2.4vw,18px);background:rgba(60,25,8,.55);padding:6px 14px;border-radius:999px;max-width:92vw}
#title .play{font-size:22px;padding:13px 52px;border-radius:999px;margin-top:8px}
#langs{display:flex;gap:8px}
#langs button{background:rgba(255,247,234,.25);color:#fff;border-radius:12px;padding:5px 12px;font-weight:800;border:1px solid rgba(255,255,255,.35)}
#langs button.on{background:#fff7ea;color:var(--ink)}
#title .by{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#ffe2a8;font-weight:800;font-size:13px;opacity:.85}
/* Mini-game shared */
.mg{background:#1d120a}
.mg canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mgtop{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.mgtop>*{pointer-events:auto}
.lvl{background:rgba(255,247,234,.93);border-radius:14px;padding:4px 14px;font-weight:900;box-shadow:var(--sh);font-size:15px;line-height:1.15}
.lvl small{display:block;font-size:12px;color:#7a5a3c;font-weight:800}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(255,247,234,.93);border-radius:14px;padding:6px 14px;font-weight:800;box-shadow:var(--sh);z-index:5;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(15,8,3,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#modal .box{background:var(--cream);border-radius:26px;padding:20px 18px 16px;max-width:420px;width:100%;text-align:center;box-shadow:0 14px 50px rgba(0,0,0,.6);border:3px solid #f0d3a2;animation:pop .35s cubic-bezier(.2,1.5,.4,1);max-height:92vh;overflow:auto}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modal h2{font-family:var(--disp);font-weight:800;margin:4px 0 6px;font-size:26px;color:var(--deep)}
#modal p{margin:6px 0;font-weight:700;color:#5c3a1c}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars span{font-size:46px;color:#d9c7aa;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15));transform:scale(0)}
.stars span.got{color:#f5b301;animation:starpop .45s cubic-bezier(.2,1.8,.4,1) forwards}
.stars span.no{animation:starpop .3s forwards}
@keyframes starpop{to{transform:scale(1)}}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.lv{background:#fff;border-radius:14px;padding:6px 0 4px;font-weight:900;font-size:20px;box-shadow:var(--sh);border:2px solid #f0d3a2}
.lv small{display:block;font-size:12px;color:#f5b301;letter-spacing:1px}
.lv.lock{opacity:.4}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#modal p img{width:30px;height:30px}

#playLv{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(min(130px,18vh) + 108px);z-index:6;font-size:22px;padding:12px 34px;border-radius:999px;box-shadow:0 6px 0 #1f6b2a,0 10px 30px rgba(0,0,0,.4);animation:pulse4 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes pulse4{50%{transform:translateX(-50%) scale(1.05)}}
#bonusLbl{position:absolute;left:0;right:0;bottom:calc(min(130px,18vh) + 22px);text-align:center;color:#ffe9c4;font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase;z-index:5;text-shadow:0 1px 4px #000}
#games{flex-wrap:wrap}
#games .gcard{width:min(170px,30vw)}#games .gcard .art{height:min(96px,13vh)}#games .gcard .gn{font-size:16px}
#house{bottom:auto}
.goals{display:flex;gap:8px;align-items:center}.gl{display:flex;align-items:center;gap:3px;font-weight:900;font-size:16px}.gl img{width:30px;height:30px}.gl.done{color:#2f8f3c}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--cream);border-radius:16px;padding:8px 18px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:70;animation:toast 2.2s ease forwards;display:flex;align-items:center;gap:8px;font-size:17px}
.toast img{width:28px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

#house{position:absolute;left:10px;top:62px;z-index:6;background:rgba(40,20,8,.55);color:#ffe9c4;border-radius:14px;padding:5px 10px;font-weight:900;font-size:12px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
#house .hb{width:110px;height:8px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}#house .hb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#e8952a);transition:width 1.2s}
#roomTabs{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:6;background:rgba(40,20,8,.45);padding:4px;border-radius:999px;backdrop-filter:blur(4px)}
.rtab{padding:6px 14px;border-radius:999px;font-weight:900;color:#ffe9c4;font-size:14px;white-space:nowrap}
.rtab.on{background:var(--cream);color:var(--ink);box-shadow:var(--sh)}
.rtab.lock{opacity:.65}
#placeTitle{display:none}
#restore{top:64px}
@media (min-aspect-ratio:1/1){#restore{top:62px}#house{top:auto;bottom:calc(min(130px,18vh) + 64px);left:50%;transform:translateX(-50%)}}
#festBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(min(130px,18vh) + 30px);z-index:5;background:rgba(122,58,18,.88);color:#ffe9c4;font-weight:800;font-size:13px;border-radius:999px;padding:5px 14px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.gcard .fest{position:absolute;top:8px;right:8px;background:#e8542a;color:#fff;font-weight:900;font-size:11px;border-radius:999px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mgbtn{pointer-events:auto}
#rPal{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;background:rgba(255,247,234,.9);padding:8px 12px;border-radius:999px;box-shadow:var(--sh)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{outline:3px solid #7a3a12;transform:scale(1.15)}
.kpop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--disp);font-weight:800;font-size:clamp(28px,6vw,52px);color:#fff3c4;text-shadow:0 4px 0 #7a3a12,0 0 30px rgba(255,200,80,.8);animation:kpop 1.2s ease forwards;pointer-events:none;z-index:7;white-space:nowrap}
@keyframes kpop{0%{transform:translate(-50%,10px) scale(.5);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
@media (max-aspect-ratio:1/1){#house{top:104px}#roomTabs{top:60px}.rtab{padding:5px 10px;font-size:13px}#restore{top:140px}#festBar{font-size:11.5px;white-space:normal;text-align:center;border-radius:14px}}
#festBar{bottom:auto!important;top:132px}
@media (max-aspect-ratio:1/1){#festBar{top:232px;max-width:90vw}}
.xsc{min-width:min(260px,38vw)}.xsc .sv{font-weight:900;font-size:17px;text-align:center}
.sb{position:relative;height:12px;border-radius:8px;background:#ead9bd;overflow:visible;margin:4px 6px 2px}.sb i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#f59e0b,#fde047);transition:width .3s}
.sb em{position:absolute;top:-7px;transform:translateX(-50%);font-style:normal;font-size:18px;color:#cdbb9c;text-shadow:0 1px 0 #fff}.sb em.on{color:#f5b301;animation:starpop .4s}
.ithm{display:inline-block;color:#fff;font-weight:900;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.igs{display:flex;justify-content:center;gap:14px;margin:6px 0}.ig{display:flex;flex-direction:column;align-items:center;font-size:20px}.ig img{width:58px;height:58px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.istars{display:flex;justify-content:center;gap:8px;margin:8px 0}.istars span{background:#fff;border-radius:10px;padding:3px 8px;font-weight:900;color:#b7791f;border:2px solid #f0d3a2;font-size:13px}
.itask{font-size:13px!important;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}.itask img{width:20px}
.rbar{background:#fff;border-radius:14px;padding:8px;margin:8px 0;border:2px solid #f0d3a2;font-weight:800;font-size:13px}.rbar .sb i{background:linear-gradient(90deg,#ffd36b,#e8952a)}.rbar small img{width:16px;vertical-align:middle}
@media (max-aspect-ratio:1/1){.xsc{position:absolute;top:58px;left:50%;transform:translateX(-50%);min-width:70vw}}
.cboard{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:none;gap:6px;z-index:6}.cboard .pl{background:rgba(255,247,234,.9);border-radius:12px;padding:3px 10px;font-weight:900;font-size:13px;text-align:center;box-shadow:var(--sh);min-width:64px}.cboard .pl span{display:block;font-size:17px;color:#b06a24}.cboard .pl.on{background:#ffd36b;transform:scale(1.08)}
.mres{background:#fff;border-radius:14px;padding:8px;border:2px solid #f0d3a2;text-align:left;font-weight:800}.mres div{display:flex;justify-content:space-between;padding:3px 6px}
.cmode{display:grid;gap:8px;margin:8px 0}.cmode .btn{width:100%}

/* story scenes */
#scene{position:fixed;inset:0;z-index:45;display:none;background:#120804;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:pointer}
#scene.on{display:block;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#scene .bg{position:absolute;inset:-5%;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease}
#scene .bg.show{opacity:1;animation:kbS 16s ease-in-out infinite alternate}
@keyframes kbS{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
#scene .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.35)),linear-gradient(transparent 50%,rgba(20,8,2,.6));pointer-events:none}
#scene .pt{position:absolute;bottom:0;height:min(60vh,480px);opacity:0;transition:transform .5s cubic-bezier(.2,1.25,.4,1),opacity .4s,filter .35s;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));transform-origin:50% 100%;pointer-events:none}
#scene .pt.in{opacity:1}
#scene .pt.quiet{filter:brightness(.55) saturate(.8) drop-shadow(0 10px 16px rgba(0,0,0,.55))}
#scene .pt.talk{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{translate:0 0}to{translate:0 -6px}}
#sAjji{right:1%;transform:translateX(40%)}#sAjji.in{transform:none}
#sMeera{left:0;height:min(56vh,450px);transform:translateX(-40%)}#sMeera.in{transform:none}
#sArjun{left:min(17vw,210px);height:min(47vh,380px);transform:translateX(-80%)}#sArjun.in{transform:none}#sArjun.jump{height:min(60vh,470px)}
#scene .box{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(720px,90vw);background:var(--cream);border:3px solid #f0d3a2;border-radius:22px;padding:12px 20px 18px;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:3;min-height:92px}
#scene .who{display:inline-block;font-family:var(--disp);font-weight:800;font-size:16px;color:#fff;padding:3px 14px;border-radius:999px;margin:-26px 0 6px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#scene .txt{font-size:clamp(16px,2.3vw,20px);font-weight:700;line-height:1.4;color:var(--deep)}
#scene .nxt{position:absolute;right:16px;bottom:8px;font-size:13px;font-weight:900;color:#b06a24;animation:blink 1s infinite}
#scene .box.nar{background:rgba(28,12,4,.8);border-color:rgba(255,215,140,.5);text-align:center;bottom:auto;top:9%}
#scene .box.nar .txt{color:#ffe9c4;font-style:italic;font-weight:600}
#scene .box.nar .who{display:none}
#scene .skip{position:absolute;top:12px;right:12px;z-index:4;background:rgba(30,14,4,.6);color:#ffe9c4;border:1.5px solid rgba(255,220,160,.5);border-radius:999px;padding:7px 16px;font-weight:800;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
#scene .dots{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4}
