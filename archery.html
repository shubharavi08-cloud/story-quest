function shoot(v){ const A=archer(); G.arrows--; G.arrow={x:A.bx,y:A.by,vx:v.vx,vy:v.vy,trail:[],life:0,pw:v.pw}; SFX.twang(v.pw); SFX.whoosh(); vib(20) }
/* ---------- hits ---------- */
function hitTarget(o,X,Y,bull){ o.alive=false; G.streak++; let pts=10+(G.streak-1)*5; if(bull)pts*=2; G.scores[G.cur]+=pts; renderScore();
  const col=['#d9c7a8','#ffb347','#7fd8ff'][o.kind]; burst(X,Y,col,34); burst(X,Y,'#fff6c0',12); popup(X,Y-30,'+'+pts,bull?'#ffe066':'#ffffff');
  [SFX.crack,SFX.fizz,SFX.splash][o.kind](); vib(bull?[30,20,60]:35); G.stop=.06; G.shake=bull?.45:.25;
  if(bull){ SFX.bull(); G.big={txt:t('bull'),k:0}; G.flash=.5 } else if(G.streak>=3) G.big={txt:t('combo')(G.streak),k:0};
  if(G.tg.every(q=>!q.alive)){ const bonus=G.arrows*5; G.scores[G.cur]+=bonus; renderScore(); setTimeout(()=>{ if(!G)return; G.big={txt:t('clear'),k:0}; popup(W/2,H*.45,'+'+bonus,'#9dffb0'); SFX.win(); for(let k=0;k<6;k++)setTimeout(()=>G&&fireworks(W*(.4+Math.random()*.5),H*(.15+Math.random()*.3)),k*130) },250); endStage(2.2) } }
function hitBoss(X,Y,bull){ const b=G.boss; b.hp--; b.hitk=1; G.streak++; let pts=30+(bull?30:0); G.scores[G.cur]+=pts; renderScore(); popup(X,Y-40,'+'+pts,'#ffe066');
  burst(X,Y,'#ffd35a',40); burst(X,Y,'#ff6b3d',20); SFX.boss(); vib([40,30,80]); G.stop=.12; G.shake=.7; G.flash=.6;
  if(b.hp<=0){ b.dead=.01; G.slow=1.4; const bonus=50+G.arrows*10; G.scores[G.cur]+=bonus; renderScore(); G.big={txt:t('win'),k:0}; SFX.win(); cheer(); vib([60,40,60,40,200]);
    for(let k=0;k<14;k++)setTimeout(()=>G&&fireworks(W*(.15+Math.random()*.7),H*(.1+Math.random()*.35)),k*120); popup(W/2,H*.48,'+'+bonus,'#9dffb0'); endStage(3.2) }
  else G.big={txt:t('bossHit'),k:0} }
function endStage(delay){ G.phase='wait'; setTimeout(()=>{ if(!G||G.over)return;
  if(G.players===2&&G.cur===0){ G.cur=1 } else { G.cur=0; G.stage++ }
  if(G.stage>STAGES){ finish(); return }
  setupStage(); renderScore(); if(G.players===2) say(t('turn')(G.cur+1)+' · '+t('S')[G.stage-1],2.4) }, delay*1000) }
function popup(X,Y,txt,c){ G.pops.push({x:X,y:Y,txt,c,k:0}) }
function burst(X,Y,c,n=22){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=2+Math.random()*7; G.parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c,r:3+Math.random()*4}) } }
function fireworks(X,Y){ const c=['#ffd35a','#ff6bd6','#7fe3ff','#9dffb0','#fff'][Math.random()*5|0]; for(let i=0;i<40;i++){ const a=i/40*6.283, sp=3+Math.random()*3; G.parts.push({x:X,y:Y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1.2,c,r:2.5}) } tone(900+Math.random()*600,.08,'sine',.04) }
/* ---------- update ---------- */
function update(dt){ if(!G)return; if(G.stop>0){ G.stop-=dt; return } if(G.slow>0){ G.slow-=dt; dt*=.35 } G.el+=dt;
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*3); if(G.shake>0)G.shake=Math.max(0,G.shake-dt*2); if(G.big){ G.big.k+=dt; if(G.big.k>1.6)G.big=null } if(G.msgT>0){G.msgT-=dt; if(G.msgT<=0)G.msg=null}
  if(G.drag){ const pw=launch(G.drag).pw; if(Math.abs(pw-(G.lastPw||0))>.06){ G.lastPw=pw; SFX.charge(pw) } }
  if(G.boss){ const b=G.boss; b.enter=Math.min(1,b.enter+dt*.8); if(b.hitk>0)b.hitk=Math.max(0,b.hitk-dt*2.5); if(b.dead>0)b.dead+=dt }
  for(const o of G.tg) if(o.hitk>0) o.hitk-=dt;
  const a=G.arrow; if(a){ a.life+=dt; a.vy+=GRAV*dt*(W/1280); a.vx+=G.wind*dt*(W/1280); a.x+=a.vx*dt; a.y+=a.vy*dt; a.trail.push([a.x,a.y]); if(a.trail.length>14)a.trail.shift();
    const sc=S();
    for(const o of G.tg){ if(!o.alive)continue; const [ix,iy]=tgPos(o), [X,Y]=P(ix,iy), r=o.r*sc*(portrait?1.25:1); const dd=Math.hypot(a.x-X,a.y-Y); if(dd<r){ hitTarget(o,X,Y,dd<r*.35); G.arrow=null; break } }
    if(G.arrow&&G.boss&&G.boss.hp>0){ const [bx,by]=bossPos(), [X,Y]=P(bx,by), r=95*sc; const dd=Math.hypot(a.x-X,a.y-(Y-30*sc)); if(dd<r){ hitBoss(a.x,a.y,dd<r*.3); G.arrow=null } }
    if(G.arrow&&(a.x>W+60||a.y>H+60||a.x<-80||a.life>4)){ G.arrow=null; G.streak=0; SFX.miss(); say(t('miss')+' · '+t('arrows')(G.arrows),1.2) }
    if(!G.arrow&&G.phase==='aim'&&G.arrows<=0&&!(G.tg.length&&G.tg.every(q=>!q.alive))&&!(G.boss&&G.boss.hp<=0)){ say(G.boss?t('escaped'):t('holds'),2); endStage(2) } }
  for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18; p.l-=dt*1.3} G.parts=G.parts.filter(p=>p.l>0)
  for(const p of G.pops) p.k+=dt; G.pops=G.pops.filter(p=>p.k<1.2) }
/* ---------- draw ---------- */
function rr(x,y,w,h,r){ cx.beginPath(); cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h) }
function drawTarget(o){ const [ix,iy]=tgPos(o), [X,Y]=P(ix,iy), r=o.r*S()*(portrait?1.25:1), el=G.el;
  cx.save(); cx.translate(X,Y);
  const glow=cx.createRadialGradient(0,0,r*.2,0,0,r*1.6); const gc=['rgba(255,220,170,','rgba(255,140,40,','rgba(100,200,255,'][o.kind]; glow.addColorStop(0,gc+'.45)'); glow.addColorStop(1,gc+'0)'); cx.fillStyle=glow; cx.beginPath(); cx.arc(0,0,r*1.6,0,6.283); cx.fill();
  if(o.kind===0){ cx.rotate(Math.sin(el+o.ph)*.15); const g=cx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r); g.addColorStop(0,'#c8b9a0'); g.addColorStop(.7,'#7d6a55'); g.addColorStop(1,'#4a3a2c'); cx.fillStyle=g; cx.beginPath();
    for(let k=0;k<9;k++){ const a=k/9*6.283, rad=r*(.82+.18*Math.sin(k*2.7+o.ph)); cx[k?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad) } cx.closePath(); cx.fill(); cx.strokeStyle='rgba(30,20,10,.6)'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(-r*.4,-r*.2); cx.lineTo(0,r*.1); cx.lineTo(r*.3,-r*.3); cx.stroke() }
  else if(o.kind===1){ for(let k=0;k<3;k++){ const s=1-k*.25, f=Math.sin(el*9+k+o.ph)*.08; const g=cx.createRadialGradient(0,r*.2,0,0,0,r*s); g.addColorStop(0,'#fff6b0'); g.addColorStop(.4,'#ffb030'); g.addColorStop(1,'rgba(220,50,10,0)'); cx.fillStyle=g; cx.beginPath(); cx.moveTo(0,-r*s*(1.25+f)); cx.bezierCurveTo(r*s*.9,-r*s*.3,r*s*.8,r*s*.8,0,r*s*.85); cx.bezierCurveTo(-r*s*.8,r*s*.8,-r*s*.9,-r*s*.3,0,-r*s*(1.25+f)); cx.fill() } }
  else { const g=cx.createRadialGradient(-r*.35,-r*.4,r*.05,0,0,r); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.35,'rgba(120,210,255,.75)'); g.addColorStop(1,'rgba(30,90,200,.85)'); cx.fillStyle=g; cx.beginPath(); cx.ellipse(0,0,r*(1+Math.sin(el*4+o.ph)*.05),r*(1-Math.sin(el*4+o.ph)*.05),0,0,6.283); cx.fill(); cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=3; cx.beginPath(); cx.arc(0,0,r*.7,3.6,4.6); cx.stroke() }
  // bullseye ring
  cx.strokeStyle='rgba(255,240,200,.8)'; cx.lineWidth=2.5; cx.setLineDash([4,5]); cx.beginPath(); cx.arc(0,0,r*.35,0,6.283); cx.stroke(); cx.setLineDash([]); cx.restore() }
function drawBoss(){ const b=G.boss; if(!NARAKA.complete)return; let [bx,by]=bossPos(); const [X,Y]=P(bx,by); const h=(portrait?300:340)*S()/1.1, w=h*NARAKA.width/NARAKA.height;
  const rise=1-Math.pow(1-b.enter,3); let a=1, dy=(1-rise)*200; if(b.dead>0){ a=Math.max(0,1-b.dead/1.4); dy+=b.dead*b.dead*260 }
  cx.save(); cx.globalAlpha=a; cx.translate(X,Y+dy); if(b.hitk>0){ cx.translate(Math.sin(G.el*90)*10*b.hitk,0); cx.filter=`brightness(${1+b.hitk*1.5})` }
  const gl=cx.createRadialGradient(0,-h*.1,10,0,-h*.1,h*.7); gl.addColorStop(0,'rgba(140,0,40,.45)'); gl.addColorStop(1,'rgba(140,0,40,0)'); cx.fillStyle=gl; cx.beginPath(); cx.arc(0,-h*.1,h*.7,0,6.283); cx.fill();
  cx.drawImage(NARAKA,-w/2,-h*.6,w,h); cx.filter='none'; cx.restore();
  // health bar
  if(b.dead===0){ const bw=260, x0=W-bw-40, y0=portrait?90:70; rr(x0,y0,bw,26,13); cx.fillStyle='rgba(0,0,0,.55)'; cx.fill(); for(let i=0;i<3;i++){ rr(x0+6+i*(bw-12)/3,y0+5,(bw-12)/3-6,16,8); cx.fillStyle=i<b.hp?'#ff4d4d':'rgba(255,255,255,.15)'; cx.fill() }
    cx.font='800 18px "Baloo 2",sans-serif'; cx.fillStyle='#ffe9a8'; cx.textAlign='right'; cx.fillText('👑 Narakasura',x0+bw,y0-8) } }
function drawArcher(){ const A=archer(); if(!SATYA.complete)return; const bob=Math.sin(G.el*2)*6; cx.save();
  const gl=cx.createRadialGradient(A.x+A.w*.5,A.y+A.h*.6,10,A.x+A.w*.5,A.y+A.h*.6,A.h*.6); gl.addColorStop(0,'rgba(255,200,120,.35)'); gl.addColorStop(1,'rgba(255,200,120,0)'); cx.fillStyle=gl; cx.fillRect(A.x-100,A.y-50,A.w+300,A.h+100);
  let pull=0; if(G.drag) pull=launch(G.drag).pw; cx.translate(-pull*14,bob); cx.drawImage(SATYA,A.x,A.y,A.w,A.h); cx.restore();
  // drawn string + nocked arrow while aiming
  if(G.drag&&G.phase==='aim'){ const v=launch(G.drag), ang=Math.atan2(v.vy,v.vx), bx=A.bx-pull*14, by=A.by+bob;
    cx.save(); cx.translate(bx,by); cx.rotate(ang); drawArrowShape(-40-pull*30,0,70,1); cx.restore();
    // trajectory preview: only the first part of the flight
    const n=Math.round(8+v.pw*10); cx.fillStyle='rgba(255,240,200,.9)';
    for(let k=1;k<=n;k++){ const tt=k*.035, x=bx+v.vx*tt+.5*G.wind*(W/1280)*tt*tt, y=by+v.vy*tt+.5*GRAV*(W/1280)*tt*tt; cx.globalAlpha=1-k/n*.85; cx.beginPath(); cx.arc(x,y,4,0,6.283); cx.fill() } cx.globalAlpha=1;
    cx.strokeStyle=`hsl(${50-v.pw*50},100%,60%)`; cx.lineWidth=6; cx.beginPath(); cx.arc(bx,by,46,-Math.PI/2,-Math.PI/2+v.pw*6.283); cx.stroke() }
  else if(G.phase==='aim'&&!G.arrow&&G.arrows>0){ cx.font=`${portrait?40:46}px serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('👆',A.bx+60+Math.sin(G.el*5)*10,A.by+60) } }
function drawArrowShape(x,y,len,a){ cx.globalAlpha=a; cx.strokeStyle='#ffe9b0'; cx.lineWidth=4; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+len,y); cx.stroke();
  cx.fillStyle='#fff3c0'; cx.beginPath(); cx.moveTo(x+len+16,y); cx.lineTo(x+len-4,y-8); cx.lineTo(x+len-4,y+8); cx.closePath(); cx.fill();
  cx.fillStyle='#ff7a3d'; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x-12,y-9); cx.lineTo(x+6,y); cx.lineTo(x-12,y+9); cx.closePath(); cx.fill(); cx.globalAlpha=1 }
function draw(){ cx.save(); if(G.shake>0)cx.translate(Math.sin(G.el*70)*12*G.shake,Math.cos(G.el*53)*7*G.shake);
  if(BG.complete&&BG.naturalWidth) cx.drawImage(BG,OX()-(portrait?IW*S()*.12:0),OY(),IW*S(),IH*S()); else { cx.fillStyle='#141a33'; cx.fillRect(-20,-20,W+40,H+40) }
  // flickering fire-ring glow
  { const [fx,fy]=P(600,560); const g=cx.createRadialGradient(fx,fy,20,fx,fy,420*S()); g.addColorStop(0,`rgba(255,150,50,${.18+Math.sin(G.el*7)*.05})`); g.addColorStop(1,'rgba(255,120,30,0)'); cx.fillStyle=g; cx.fillRect(0,0,W,H) }
  for(const o of G.tg) if(o.alive) drawTarget(o);
  if(G.boss) drawBoss();
  drawArcher();
  const a=G.arrow; if(a){ for(let k=0;k<a.trail.length;k++){ const [x,y]=a.trail[k]; cx.globalAlpha=k/a.trail.length*.6; cx.fillStyle='#ffd35a'; cx.beginPath(); cx.arc(x,y,3+k*.4,0,6.283); cx.fill() } cx.globalAlpha=1;
    cx.save(); cx.translate(a.x,a.y); cx.rotate(Math.atan2(a.vy,a.vx)); const gl=cx.createRadialGradient(0,0,2,0,0,40); gl.addColorStop(0,'rgba(255,230,140,.8)'); gl.addColorStop(1,'rgba(255,230,140,0)'); cx.fillStyle=gl; cx.beginPath(); cx.arc(0,0,40,0,6.283); cx.fill(); drawArrowShape(-70,0,70,1); cx.restore() }
  // HUD: arrows left + wind
  if(G.phase!=='wait'||G.arrow){ const y0=H-30, x0=portrait?W-20:W-30; cx.save(); cx.textAlign='right'; for(let i=0;i<G.arrows;i++){ cx.save(); cx.translate(x0-i*22,y0); cx.rotate(-Math.PI/2); drawArrowShape(-18,0,30,.95); cx.restore() } cx.restore() }
  if(G.wind){ const x=portrait?W/2:W/2, y=portrait?H-40:H-34, len=Math.min(120,Math.abs(G.wind)); rr(x-110,y-20,220,40,20); cx.fillStyle='rgba(28,20,66,.75)'; cx.fill(); cx.fillStyle='#bfe8ff'; cx.font='800 18px "Baloo 2",sans-serif'; cx.textAlign='left'; cx.textBaseline='middle'; cx.fillText('💨 '+t('wind'),x-98,y+1);
    const sx=x+30, dir=Math.sign(G.wind); cx.strokeStyle='#bfe8ff'; cx.lineWidth=5; cx.beginPath(); cx.moveTo(sx+(dir<0?len*.6:0),y); cx.lineTo(sx+(dir<0?0:len*.6),y); cx.stroke(); const hx=sx+(dir<0?0:len*.6); cx.beginPath(); cx.moveTo(hx+dir*12,y); cx.lineTo(hx-dir*2,y-9); cx.lineTo(hx-dir*2,y+9); cx.closePath(); cx.fillStyle='#bfe8ff'; cx.fill() }
  for(const p of G.parts){ cx.globalAlpha=Math.max(0,Math.min(1,p.l)); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r||4,0,6.283); cx.fill() } cx.globalAlpha=1;
  for(const p of G.pops){ const a=1-Math.max(0,p.k-.7)/.5; cx.globalAlpha=Math.max(0,a); cx.font=`900 ${34+10*Math.min(1,p.k*6)}px "Baloo 2",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineWidth=7; cx.strokeStyle='#2a0d3a'; cx.strokeText(p.txt,p.x,p.y-p.k*70); cx.fillStyle=p.c; cx.fillText(p.txt,p.x,p.y-p.k*70) } cx.globalAlpha=1;
  if(G.big){ const k=G.big.k, s2=k<.2?k/.2*1.3:(k<.35?1.3-(k-.2)/.15*.3:1), a=k>1.2?1-(k-1.2)/.4:1; cx.save(); cx.globalAlpha=Math.max(0,a); cx.translate(W/2,H*.3); cx.scale(s2,s2); cx.rotate(-.04);
    cx.font=`900 ${portrait?54:76}px "Baloo 2","Baloo Tamma 2",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineWidth=12; cx.strokeStyle='#3a0a4a'; cx.strokeText(G.big.txt,0,0,W*.9); const gg=cx.createLinearGradient(0,-40,0,40); gg.addColorStop(0,'#fff6b0'); gg.addColorStop(1,'#ff9a2e'); cx.fillStyle=gg; cx.fillText(G.big.txt,0,0,W*.9); cx.restore() }
  if(G.flash>0){ cx.fillStyle=`rgba(255,240,200,${G.flash*.45})`; cx.fillRect(0,0,W,H) }
  if(G.msg){ cx.font=`800 30px "Baloo 2","Baloo Tamma 2",sans-serif`; const tw=Math.min(W*.9,cx.measureText(G.msg).width+50), bh=50, by2=portrait?H*.08:H*.06;
    rr((W-tw)/2,by2,tw,bh,25); cx.fillStyle='rgba(28,20,66,.86)'; cx.fill(); cx.strokeStyle='#f6a723'; cx.lineWidth=3; cx.stroke(); cx.fillStyle='#ffe9a8'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(G.msg,W/2,by2+bh/2+2,W*.86) }
  cx.restore() }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000||0); last=now; if(G){ update(dt); draw() } requestAnimationFrame(loop) }
/* ---------- screens ---------- */
function renderScore(){ if(!G){$('#score').innerHTML='';return} $('#score').innerHTML=Array.from({length:G.players},(_,i)=>`<span class="pl ${i===G.cur?'on':''}">${G.players===1?t('you'):t('p')(i+1)} <b>${G.scores[i]}</b></span>`).join('')+`<span class="pl">${t('stage')(Math.min(G.stage,STAGES),STAGES)}</span>` }
function start(){ newGame(); G.over=true; G.msg=null; $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep4_fort.jpg" alt=""><h3>${t('howT')}</h3><div class="how">${t('how').map(([i,s])=>`<div><b>${i}</b><span>${s}</span></div>`).join('')}</div>
  <div class="modes"><button class="mode" data-m="solo" aria-pressed="${mode==='solo'}">🧑 ${t('solo')}</button><button class="mode" data-m="duo" aria-pressed="${mode==='duo'}">👫 ${t('duo')}</button></div><button class="go" id="go">${t('start')}</button></div></div>`;
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b)) });
  $('#go').onclick=()=>{ ac(); $('#overlay').innerHTML=''; newGame() } }
function finish(){ G.over=true; const best=Math.max(...G.scores.slice(0,G.players)); try{const pr=JSON.parse(localStorage.getItem('storyquest')||'{}'); pr.dv4=1; localStorage.setItem('storyquest',JSON.stringify(pr))}catch(e){}
  const stars=best>=330?3:best>=200?2:1; const who=G.players===2?(G.scores[0]===G.scores[1]?'🤝':(G.scores[0]>G.scores[1]?'🏆 '+t('p')(1):'🏆 '+t('p')(2))):'';
  $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep4_satya_hero.jpg" alt=""><h3>${t('winT')}</h3><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${t('winP')}</p>
  <p><b>${t('total')}:</b> ${G.scores.slice(0,G.players).map((s,i)=>(G.players===2?t('p')(i+1)+' ':'')+s).join(' · ')} ${who}</p><button class="go" id="again">${t('again')}</button><a class="go alt" href="index.html#dv4">${t('story')}</a></div></div>`; $('#again').onclick=start }
function applyLang(){ document.documentElement.lang=lang; $('#t-eyebrow').textContent=t('eyebrow'); $('#t-title').textContent=t('title'); $('#back').textContent=t('back'); document.title=t('title');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang)); renderScore() }
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('sq_lang',lang)}catch(e){} applyLang(); if(!G||G.over)start() });
$('#sound').onclick=()=>{ soundOn=!soundOn; $('#sound').setAttribute('aria-pressed',soundOn); $('#sound').textContent=soundOn?'🔊':'🔇' };
$('#newgame').onclick=start;
layout(); applyLang(); start(); requestAnimationFrame(loop);
</script>
