/* ---------- fx ---------- */
function popup(X,Y,txt,c){ G.pops.push({x:X,y:Y,txt,c,k:0}) }
function burst(X,Y,c,n=22){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=2+Math.random()*6; G.parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c,r:2.5+Math.random()*3.5}) } }
function fireworks(X,Y){ const c=['#ffd35a','#ff6bd6','#7fe3ff','#9dffb0','#fff'][Math.random()*5|0]; for(let i=0;i<40;i++){ const a=i/40*6.283, sp=3+Math.random()*3; G.parts.push({x:X,y:Y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1.2,c,r:2.5}) } tone(900+Math.random()*600,.08,'sine',.04) }
function update(dt){ if(!G)return; G.el+=dt; if(!G.over&&!G.done){ G.rt+=dt; const R=ROUNDS[Math.min(G.round,ROUNDS.length-1)]; if(!G.here&&G.rt>=R.time){ G.here=true; G.late++; say(t('here'),2.6); SFX.bell(); vib([40,40,40]) } if(!G.here&&Math.floor(G.rt*2)!==Math.floor((G.rt-dt)*2)) SFX.hoof() }
  for(const c of G.cards){ const tg=c.face||c.gone?1:0; c.up+=(tg-c.up)*Math.min(1,dt*12) }
  for(const o of G.onThali) o.k=Math.min(1,o.k+dt*1.6);
  if(G.big){ G.big.k+=dt; if(G.big.k>1.6)G.big=null } if(G.msgT>0){G.msgT-=dt; if(G.msgT<=0)G.msg=null}
  for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18; p.l-=dt*1.3} G.parts=G.parts.filter(p=>p.l>0); for(const p of G.pops) p.k+=dt; G.pops=G.pops.filter(p=>p.k<1.3) }
/* ---------- draw ---------- */
function rr(x,y,w,h,r){ cx.beginPath(); cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h) }
function drawCard(c){ if(c.gone&&c.up>.98) return; const flip=c.up, sx=Math.abs(Math.cos(flip*Math.PI)), face=flip>.5; cx.save(); cx.translate(c.x+c.w/2,c.y+c.h/2); cx.scale(Math.max(.02,sx),1);
  cx.fillStyle='rgba(0,0,0,.35)'; rr(-c.w/2+4,-c.h/2+6,c.w,c.h,16); cx.fill();
  if(face){ rr(-c.w/2,-c.h/2,c.w,c.h,16); const g=cx.createLinearGradient(0,-c.h/2,0,c.h/2); g.addColorStop(0,'#fff8e6'); g.addColorStop(1,'#f3dfb0'); cx.fillStyle=g; cx.fill(); cx.strokeStyle='#e0a020'; cx.lineWidth=4; cx.stroke();
    cx.font=`${c.w*.5}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(c.it[0],0,-c.h*.06);
    cx.font=`800 ${Math.max(12,c.w*.13)}px "Baloo 2","Baloo Tamma 2",sans-serif`; cx.fillStyle='#7a3b10'; cx.fillText(c.it[L[lang].li],0,c.h*.36,c.w*.92) }
  else { rr(-c.w/2,-c.h/2,c.w,c.h,16); const g=cx.createLinearGradient(-c.w/2,-c.h/2,c.w/2,c.h/2); g.addColorStop(0,'#b8243c'); g.addColorStop(1,'#6a0f40'); cx.fillStyle=g; cx.fill(); cx.strokeStyle='#ffd35a'; cx.lineWidth=4; cx.stroke();
    // rangoli back
    cx.strokeStyle='rgba(255,214,90,.75)'; cx.lineWidth=2; for(let k=0;k<8;k++){ cx.save(); cx.rotate(k/8*6.283); cx.beginPath(); cx.ellipse(0,-c.w*.18,c.w*.07,c.w*.16,0,0,6.283); cx.stroke(); cx.restore() }
    cx.fillStyle='#ffd35a'; cx.beginPath(); cx.arc(0,0,c.w*.06,0,6.283); cx.fill();
    for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ cx.beginPath(); cx.arc(dx*c.w*.36,dy*c.h*.38,3,0,6.283); cx.fill() } }
  cx.restore() }
function drawThali(){ const tp=thaliPos(); cx.save();
  const gl=cx.createRadialGradient(tp.x,tp.y,tp.r*.3,tp.x,tp.y,tp.r*1.5); gl.addColorStop(0,'rgba(255,210,90,.35)'); gl.addColorStop(1,'rgba(255,210,90,0)'); cx.fillStyle=gl; cx.beginPath(); cx.arc(tp.x,tp.y,tp.r*1.5,0,6.283); cx.fill();
  cx.fillStyle='rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse(tp.x+6,tp.y+12,tp.r,tp.r*.96,0,0,6.283); cx.fill();
  const g=cx.createRadialGradient(tp.x-tp.r*.3,tp.y-tp.r*.3,10,tp.x,tp.y,tp.r); g.addColorStop(0,'#fff0a8'); g.addColorStop(.6,'#e0a828'); g.addColorStop(1,'#8a5a08'); cx.fillStyle=g; cx.beginPath(); cx.arc(tp.x,tp.y,tp.r,0,6.283); cx.fill();
  cx.strokeStyle='rgba(255,250,210,.8)'; cx.lineWidth=3; cx.beginPath(); cx.arc(tp.x,tp.y,tp.r*.9,0,6.283); cx.stroke(); cx.beginPath(); cx.arc(tp.x,tp.y,tp.r*.42,0,6.283); cx.stroke();
  for(let k=0;k<24;k++){ const a=k/24*6.283; cx.fillStyle='rgba(140,80,0,.5)'; cx.beginPath(); cx.arc(tp.x+Math.cos(a)*tp.r*.95,tp.y+Math.sin(a)*tp.r*.95,2.5,0,6.283); cx.fill() }
  // central diya, flame grows with progress
  const prog=G.onThali.length/Math.max(1,G.cards.length/2); const fr=10+prog*14+Math.sin(G.el*9)*1.5;
  cx.fillStyle='#b8622a'; cx.beginPath(); cx.ellipse(tp.x,tp.y+6,22,10,0,0,Math.PI); cx.fill(); cx.fillStyle='#8a3f16'; cx.beginPath(); cx.ellipse(tp.x,tp.y+6,22,7,0,0,6.283); cx.fill();
  const fg=cx.createRadialGradient(tp.x,tp.y-fr*.4,1,tp.x,tp.y-fr*.3,fr*1.2); fg.addColorStop(0,'#fffbe0'); fg.addColorStop(.45,'#ffc83a'); fg.addColorStop(1,'rgba(255,90,20,0)'); cx.fillStyle=fg; cx.beginPath(); cx.moveTo(tp.x,tp.y-fr*1.6); cx.bezierCurveTo(tp.x+fr*.6,tp.y-fr*.6,tp.x+fr*.4,tp.y,tp.x,tp.y); cx.bezierCurveTo(tp.x-fr*.4,tp.y,tp.x-fr*.6,tp.y-fr*.6,tp.x,tp.y-fr*1.6); cx.fill();
  const n=G.cards.length/2; G.onThali.forEach((o,k)=>{ const a=-Math.PI/2+k/n*6.283, X=tp.x+Math.cos(a)*tp.r*.66, Y=tp.y+Math.sin(a)*tp.r*.66; const e=1-Math.pow(1-o.k,3); const x=o.from[0]+(X-o.from[0])*e, y=o.from[1]+(Y-o.from[1])*e-Math.sin(o.k*Math.PI)*80;
    cx.font=`${tp.r*.3*(1+Math.sin(o.k*Math.PI)*.4)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(o.it[0],x,y) });
  cx.restore() }
function drawTrack(){ const R=ROUNDS[Math.min(G.round,ROUNDS.length-1)], p=Math.min(1,G.rt/R.time), x0=portrait?40:W*.03, x1=portrait?W-40:W*.69, y=portrait?40:44;
  rr(x0,y-14,x1-x0,28,14); cx.fillStyle='rgba(28,20,66,.8)'; cx.fill(); rr(x0+4,y-10,(x1-x0-8)*p,20,10); cx.fillStyle=G.here?'#ff6b6b':p>.75?'#ffb347':'#9dffb0'; cx.fill();
  cx.font='34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('🐃',x0+(x1-x0)*p,y-4+Math.abs(Math.sin(G.el*8))*-5); cx.fillText('🏠',x1+24,y-2);
  cx.font='800 17px "Baloo 2","Baloo Tamma 2",sans-serif'; cx.fillStyle='#ffe9a8'; cx.textAlign='left'; cx.fillText(t('round')(G.round+1,ROUNDS.length),x0,y+30) }
function draw(){ cx.save();
  if(BG.complete&&BG.naturalWidth){ const s=Math.max(W/BG.width,H/BG.height); cx.drawImage(BG,(W-BG.width*s)/2,(H-BG.height*s)/2,BG.width*s,BG.height*s) } else { cx.fillStyle='#2a1a10'; cx.fillRect(0,0,W,H) }
  cx.fillStyle='rgba(20,10,30,.25)'; cx.fillRect(0,0,W,H);
  drawTrack(); drawThali(); for(const c of G.cards) drawCard(c);
  for(const p of G.parts){ cx.globalAlpha=Math.max(0,Math.min(1,p.l)); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r||4,0,6.283); cx.fill() } cx.globalAlpha=1;
  for(const p of G.pops){ const a=1-Math.max(0,p.k-.8)/.5; cx.globalAlpha=Math.max(0,a); cx.font='900 28px "Baloo 2","Baloo Tamma 2",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineWidth=6; cx.strokeStyle='#2a0d3a'; cx.strokeText(p.txt,p.x,p.y-p.k*50); cx.fillStyle=p.c; cx.fillText(p.txt,p.x,p.y-p.k*50) } cx.globalAlpha=1;
  if(G.big){ const k=G.big.k, s2=k<.2?k/.2*1.3:(k<.35?1.3-(k-.2)/.15*.3:1), a=k>1.2?1-(k-1.2)/.4:1; cx.save(); cx.globalAlpha=Math.max(0,a); cx.translate(W/2,H*.45); cx.scale(s2,s2); cx.rotate(-.04);
    cx.font=`900 ${portrait?50:70}px "Baloo 2","Baloo Tamma 2",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineWidth=12; cx.strokeStyle='#3a0a4a'; cx.strokeText(G.big.txt,0,0,W*.9); const gg=cx.createLinearGradient(0,-40,0,40); gg.addColorStop(0,'#fff6b0'); gg.addColorStop(1,'#ff9a2e'); cx.fillStyle=gg; cx.fillText(G.big.txt,0,0,W*.9); cx.restore() }
  if(G.msg){ cx.font=`800 26px "Baloo 2","Baloo Tamma 2",sans-serif`; const tw=Math.min(W*.92,cx.measureText(G.msg).width+50), bh=46, by=portrait?H-60:H-56;
    rr((W-tw)/2,by,tw,bh,23); cx.fillStyle='rgba(28,20,66,.9)'; cx.fill(); cx.strokeStyle='#f6a723'; cx.lineWidth=3; cx.stroke(); cx.fillStyle='#ffe9a8'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(G.msg,W/2,by+bh/2+2,W*.88) }
  cx.restore() }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000||0); last=now; if(G){ update(dt); draw() } requestAnimationFrame(loop) }
/* ---------- screens ---------- */
function renderScore(){ if(!G){$('#score').innerHTML='';return} $('#score').innerHTML=Array.from({length:G.players},(_,i)=>`<span class="pl ${G.players===2&&i===G.cur?'on':''}">${G.players===1?t('you'):(i?'👧 ':'👦 ')+t('p')(i+1)} <b>${G.scores[i]}</b></span>`).join('')+`<span class="pl">${t('round')(Math.min(G.round+1,ROUNDS.length),ROUNDS.length)}</span>` }
function start(){ newGame(); G.over=true; G.done=true; G.msg=null; $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep8_tilak.jpg" alt=""><h3>${t('howT')}</h3><div class="how">${t('how').map(([i,s])=>`<div><b>${i}</b><span>${s}</span></div>`).join('')}</div>
  <div class="modes"><button class="mode" data-m="solo" aria-pressed="${mode==='solo'}">🧑 ${t('solo')}</button><button class="mode" data-m="duo" aria-pressed="${mode==='duo'}">👫 ${t('duo')}</button></div><button class="go" id="go">${t('start')}</button></div></div>`;
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b)) });
  $('#go').onclick=()=>{ ac(); $('#overlay').innerHTML=''; newGame() } }
function finish(){ G.over=true; try{const pr=JSON.parse(localStorage.getItem('storyquest')||'{}'); pr.dv8=1; localStorage.setItem('storyquest',JSON.stringify(pr))}catch(e){}
  const stars=G.late===0?3:G.late===1?2:1; const tot=G.scores.slice(0,G.players).reduce((a,b)=>a+b,0); const m=Math.floor(G.totalTime/60), s=Math.round(G.totalTime%60);
  $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep8_tathastu.jpg" alt=""><h3>${t('winT')}</h3><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${t('winP')}</p>
  <p><b>${tot}</b> ⭐ · ${t('moves')}: ${G.turns} · ${t('time')}: ${m}:${String(s).padStart(2,'0')}</p><button class="go" id="again">${t('again')}</button><a class="go alt" href="finale.html">${t('finale')}</a><a class="go alt" href="index.html#dv8">${t('story')}</a></div></div>`; $('#again').onclick=start }
function applyLang(){ document.documentElement.lang=lang; $('#t-eyebrow').textContent=t('eyebrow'); $('#t-title').textContent=t('title'); $('#back').textContent=t('back'); document.title=t('title')+' · QUAD Story Quest';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang)); renderScore() }
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('sq_lang',lang)}catch(e){} applyLang(); if(!G||G.over)start() });
$('#sound').onclick=()=>{ soundOn=!soundOn; $('#sound').setAttribute('aria-pressed',soundOn); $('#sound').textContent=soundOn?'🔊':'🔇' };
$('#newgame').onclick=start;
layout(); applyLang(); start(); requestAnimationFrame(loop);
</script>
