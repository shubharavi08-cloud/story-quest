  const R=p.roar>0?bowlR(p):50, g=cx.createLinearGradient(0,-8,0,22); g.addColorStop(0,'#ffe9a0'); g.addColorStop(.5,'#e0a020'); g.addColorStop(1,'#8a5200'); cx.fillStyle=g; cx.beginPath(); cx.ellipse(0,0,R,R*.2,0,0,6.283); cx.fill(); cx.beginPath(); cx.moveTo(-R,0); cx.quadraticCurveTo(0,R*.9,R,0); cx.fill();
  cx.strokeStyle='#fff3c0'; cx.lineWidth=2; cx.beginPath(); cx.ellipse(0,0,R,R*.2,0,0,6.283); cx.stroke(); cx.restore() }
function drawHUD(){ const alive=G.clones.filter(c=>!c.dead).length, x0=portrait?W-24:W-28, y0=portrait?30:30;
  cx.save(); cx.font='800 20px "Baloo 2","Baloo Tamma 2",sans-serif'; cx.textAlign='right'; cx.textBaseline='middle'; const lab='👹 '+t('clones'); const tw=cx.measureText(lab).width;
  rr(x0-tw-MAXC*24-34,y0-20,tw+MAXC*24+44,40,20); cx.fillStyle='rgba(28,20,66,.78)'; cx.fill(); cx.fillStyle='#ffe9a8'; cx.fillText(lab,x0-MAXC*24-10,y0+1);
  for(let i=0;i<MAXC;i++){ cx.beginPath(); cx.arc(x0-6-(MAXC-1-i)*24,y0,8,0,6.283); cx.fillStyle=i<alive?'#ff4d5e':'rgba(255,255,255,.18)'; cx.fill() } cx.restore();
  // power meters
  G.pl.forEach((p,i)=>{ const x=portrait?(G.players===2?(i?W*.55:24):24):(G.players===2?(i?W-238:28):28), y=portrait?72:H-36; const bw=210;
    cx.save(); rr(x,y-14,bw,28,14); cx.fillStyle='rgba(28,20,66,.78)'; cx.fill(); const f=p.roar>0?p.roar/6:p.meter/8; rr(x+4,y-10,(bw-8)*f,20,10); const gg=cx.createLinearGradient(x,0,x+bw,0); gg.addColorStop(0,'#ff9a2e'); gg.addColorStop(1,'#fff6b0'); cx.fillStyle=p.roar>0?`hsl(${(G.el*200)%360},90%,65%)`:gg; cx.fill();
    cx.font='800 15px "Baloo 2","Baloo Tamma 2",sans-serif'; cx.fillStyle='#fff'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText((i?t('diya'):t('kali'))+' ⚡',x+bw/2,y+1); cx.restore() }) }
function draw(){ cx.save(); if(G.shake>0)cx.translate(Math.sin(G.el*70)*10*G.shake,Math.cos(G.el*53)*6*G.shake);
  drawBG(); drawRak();
  for(const c of G.clones) drawClone(c);
  G.pl.forEach((p,i)=>{ shadow(p.x,GY()+4,KH()*(i?.3:.5)); drawBowlGlow(p) });
  if(G.players===2) drawDiya(G.pl[1]); drawKali(G.pl[0]);
  if(G.players===2){ cx.save(); cx.setLineDash([6,10]); cx.strokeStyle='rgba(255,240,200,.25)'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(W/2,H*.45); cx.lineTo(W/2,H); cx.stroke(); cx.restore() }
  for(const d of G.drops) drawDrop(d);
  if(G.sweep>0){ const k=G.sweep/1.4, x=-W*.3+k*W*1.6; const g=cx.createLinearGradient(x-260,0,x+260,0); g.addColorStop(0,'rgba(255,240,200,0)'); g.addColorStop(.5,'rgba(255,240,200,.55)'); g.addColorStop(1,'rgba(255,240,200,0)'); cx.fillStyle=g; cx.fillRect(0,0,W,H) }
  for(const p of G.parts){ cx.globalAlpha=Math.max(0,Math.min(1,p.l)); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r||4,0,6.283); cx.fill() } cx.globalAlpha=1;
  drawHUD(); if(G.phase==='play') drawTBtn();
  for(const p of G.pops){ const a=1-Math.max(0,p.k-.7)/.5; cx.globalAlpha=Math.max(0,a); cx.font=`900 ${30+10*Math.min(1,p.k*6)}px "Baloo 2",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineWidth=7; cx.strokeStyle='#2a0d3a'; cx.strokeText(p.txt,p.x,p.y-p.k*70); cx.fillStyle=p.c; cx.fillText(p.txt,p.x,p.y-p.k*70) } cx.globalAlpha=1;
  if(G.big){ const k=G.big.k, s2=k<.2?k/.2*1.3:(k<.35?1.3-(k-.2)/.15*.3:1), a=k>1.2?1-(k-1.2)/.4:1; cx.save(); cx.globalAlpha=Math.max(0,a); cx.translate(W/2,H*.42); cx.scale(s2,s2); cx.rotate(-.04);
    cx.font=`900 ${portrait?50:72}px "Baloo 2","Baloo Tamma 2",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineWidth=12; cx.strokeStyle='#3a0a4a'; cx.strokeText(G.big.txt,0,0,W*.9); const gg=cx.createLinearGradient(0,-40,0,40); gg.addColorStop(0,'#fff6b0'); gg.addColorStop(1,'#ff9a2e'); cx.fillStyle=gg; cx.fillText(G.big.txt,0,0,W*.9); cx.restore() }
  if(G.flash>0){ cx.fillStyle=`rgba(255,240,200,${G.flash*.4})`; cx.fillRect(0,0,W,H) }
  if(G.msg){ cx.font=`800 28px "Baloo 2","Baloo Tamma 2",sans-serif`; const tw=Math.min(W*.92,cx.measureText(G.msg).width+50), bh=48, by2=portrait?H*.30:H*.56;
    rr((W-tw)/2,by2,tw,bh,24); cx.fillStyle='rgba(28,20,66,.86)'; cx.fill(); cx.strokeStyle='#f6a723'; cx.lineWidth=3; cx.stroke(); cx.fillStyle='#ffe9a8'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(G.msg,W/2,by2+bh/2+2,W*.88) }
  cx.restore() }
let last=0; function loop(now){ const dt=Math.min(.05,(now-last)/1000||0); last=now; if(G){ if(!G.over||G.phase==='end') update(dt); draw() } requestAnimationFrame(loop) }
/* ---------- screens ---------- */
function renderScore(){ if(!G){$('#score').innerHTML='';return} $('#score').innerHTML=Array.from({length:G.players},(_,i)=>`<span class="pl on">${G.players===1?t('you'):(i?'🪔 '+t('diya'):'🔱 '+t('kali'))} <b>${G.scores[i]}</b></span>`).join('')+`<span class="pl">${t('wave')(Math.min(G.wave+1,WAVES.length),WAVES.length)}</span>` }
function start(){ newGame(); G.over=true; G.phase='menu'; G.msg=null; $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep6_kali_drops.jpg" alt=""><h3>${t('howT')}</h3><div class="how">${t('how').map(([i,s])=>`<div><b>${i}</b><span>${s}</span></div>`).join('')}</div>
  <div class="modes"><button class="mode" data-m="solo" aria-pressed="${mode==='solo'}">🧑 ${t('solo')}</button><button class="mode" data-m="duo" aria-pressed="${mode==='duo'}">👫 ${t('duo')}</button></div><button class="go" id="go">${t('start')}</button></div></div>`;
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b)) });
  $('#go').onclick=()=>{ ac(); $('#overlay').innerHTML=''; newGame() } }
function finish(){ if(!G)return; G.over=true; G.phase='done'; try{const pr=JSON.parse(localStorage.getItem('storyquest')||'{}'); pr.dv6=1; localStorage.setItem('storyquest',JSON.stringify(pr))}catch(e){}
  const ratio=G.caught/Math.max(1,G.caught+G.missed), stars=ratio>=.85?3:ratio>=.6?2:1;
  $('#overlay').innerHTML=`<div class="ov"><div class="card"><img class="hero" src="img/ep6_kali_hero.jpg" alt=""><h3>${t('winT')}</h3><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${t('winP')}</p>
  <p><b>${t('total')}:</b> ${G.scores.slice(0,G.players).map((s,i)=>(G.players===2?(i?t('diya'):t('kali'))+' ':'')+s).join(' · ')} · 💧 ${G.caught}/${G.caught+G.missed}</p><button class="go" id="again">${t('again')}</button><a class="go alt" href="index.html#dv6">${t('story')}</a></div></div>`; $('#again').onclick=start }
function applyLang(){ document.documentElement.lang=lang; $('#t-eyebrow').textContent=t('eyebrow'); $('#t-title').textContent=t('title'); $('#back').textContent=t('back'); document.title=t('title')+' · World of Wonders';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang)); renderScore() }
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('sq_lang',lang)}catch(e){} applyLang(); if(!G||G.over)start() });
$('#sound').onclick=()=>{ soundOn=!soundOn; $('#sound').setAttribute('aria-pressed',soundOn); $('#sound').textContent=soundOn?'🔊':'🔇' };
$('#newgame').onclick=start;
layout(); applyLang(); start(); requestAnimationFrame(loop);
</script>
