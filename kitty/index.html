<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b0124f">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ಕಿಟ್ಟಿ ಪಾರ್ಟಿ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kitty Party Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, festive, chatty — a ladies' circle; big, simple, Kannada first for elder members
   IDEA: a housie ticket and a printed party invite, the things passed around the room
   PICTURE: the live housie board / ticket itself, big, tappable, opens full screen sideways
   COLOUR and TYPE: rani pink bands, marigold support, leaf-teal accent; Baloo Tamma 2 (Kannada + Latin)
   LAYOUT: tab bar (bottom on phones), one calm column per tab, cards only where they hold a thing */
:root{color-scheme:light dark;
--bg:light-dark(#fff7f2,#1c0a12);--card:light-dark(#ffffff,#2a1019);--ink:light-dark(#2b0d18,#fbeef2);--soft:light-dark(#7a4a5a,#d6aebb);
--rani:#b0124f;--rani2:light-dark(#fde3ec,#4a1529);--gold:#f2a516;--gold2:light-dark(#fff1d1,#3d2a08);--teal:#0f8a7e;--line:light-dark(#f1d3dc,#4b2232);
--f:"Baloo Tamma 2","Noto Sans Kannada",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f);overflow-x:clip;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f);font-weight:800;line-height:1.15;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(30px,6vw,46px)}h2{font-size:clamp(25px,4.5vw,34px)}h3{font-size:21px}
p{margin:0 0 .8em}.muted{color:var(--soft)}.small{font-size:16px}
header.top{background:var(--rani);color:#fff;padding:calc(22px + env(safe-area-inset-top)) max(5vw,16px) 24px;position:relative;overflow:hidden}
header.top svg.garland{position:absolute;left:0;right:0;top:env(safe-area-inset-top);width:100%;height:30px}
header.top .sub{color:#ffd9e6;margin:0}
header.top h1{margin:0;color:#fff}
header.top .brand{display:flex;align-items:center;gap:12px;margin-top:14px;padding-right:96px}
header.top .logo{width:clamp(64px,16vw,84px);height:auto;flex:none;border-radius:50%;box-shadow:0 0 0 3px #f2a516,0 6px 16px #0004}
.lang{position:absolute;right:max(5vw,16px);top:calc(40px + env(safe-area-inset-top));background:#ffffff26;border:1.5px solid #ffffff80;color:#fff;min-height:40px;padding:4px 14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px #0000001a}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;text-decoration:none;color:var(--soft);font-weight:600;font-size:13.5px;line-height:1.2;text-align:center}
nav.tabs a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--rani)}
@media(min-width:900px){nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);box-shadow:none;grid-template-columns:repeat(6,auto);justify-content:center;gap:10px}nav.tabs a{flex-direction:row;gap:8px;font-size:16px;padding:12px 16px}body{padding-bottom:0}}
main{max-width:1000px;margin:0 auto;padding:22px max(4vw,14px) 40px}
section.view{display:none}section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
button,.btn{font:700 17px var(--f);min-height:48px;padding:8px 20px;border-radius:999px;border:2px solid var(--rani);background:var(--rani);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
button.ghost,.btn.ghost{background:transparent;color:var(--rani)}
:root[data-theme=dark] button.ghost{color:#ff8fb7;border-color:#ff8fb7}
button.gold{background:var(--gold);border-color:var(--gold);color:#2b0d18}
button.teal,.btn.teal{background:var(--teal);border-color:var(--teal)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:700;margin:14px 0 4px}label .opt{font-weight:400;color:var(--soft);font-size:14px}
input,select,textarea{width:100%;font:17px var(--f);padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:78px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:42px;font-weight:600;font-size:16px}
.chip.on{background:var(--rani2);border-color:var(--rani);color:var(--rani)}
:root[data-theme=dark] .chip.on{color:#ffb3cd}
.secret{margin-left:auto;min-height:34px;padding:2px 12px;font-size:14px;border-width:1.5px;background:transparent;color:var(--soft);border-color:var(--line)}
.secret svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.secret.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mo{border-radius:14px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:block;min-height:0}
.mo b{display:block;font-weight:800;font-size:22px;line-height:1.15}
.mo .m{color:var(--soft);font-size:15px}
.mo.past{opacity:.55}.mo.next{background:var(--gold2);border-color:var(--gold)}
.mo .tag{display:block;font-size:13.5px;font-weight:700;color:var(--teal);margin-top:2px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.bigdate{font-weight:800;font-size:clamp(38px,9vw,60px);line-height:1.05;color:var(--rani)}
:root[data-theme=dark] .bigdate{color:#ff8fb7}
ol.steps{margin:0;padding-left:1.3em}ol.steps li{margin:4px 0}
/* invite */
.invite{border-radius:22px;padding:26px 22px;background:var(--rani);color:#fff;text-align:center;position:relative;overflow:hidden;box-shadow:0 14px 30px #b0124f40}
.invite::before{content:"";position:absolute;inset:10px;border:1.5px dashed #ffffff80;border-radius:16px;pointer-events:none}
.invite .k{font-size:15px;color:#ffd9e6}
.invite h2{color:#fff;font-size:clamp(30px,6vw,40px);margin:.1em 0}
.invite .who{font-weight:800;font-size:26px}
.invite .when{font-weight:800;font-size:22px;color:var(--gold);margin:.3em 0}
.invite .blk{overflow-wrap:anywhere;background:#ffffff1a;border-radius:12px;padding:8px 12px;margin:10px 0 0;text-align:left;white-space:pre-line;font-size:16px}
.invite .blk b{color:var(--gold)}
.invite .blk.sec{background:#00000026;font-style:italic}
/* housie */
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.board button{min-height:0;aspect-ratio:1;padding:0;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:800 clamp(14px,2.8vw,20px) var(--f)}
.board button.c{background:var(--rani);border-color:var(--rani);color:#fff}
.board button.last{background:var(--gold);border-color:var(--gold);color:#2b0d18}
.callbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ball{width:clamp(96px,22vw,132px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffd36b,var(--gold) 55%,#c97d00);color:#2b0d18;font:800 clamp(42px,10vw,60px)/1 var(--f);box-shadow:inset 0 -6px 0 #0000001f,0 8px 18px #f2a51650}
.ball.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ball.pop{animation:none}}
.phrase{font-weight:800;font-size:clamp(20px,4vw,26px);line-height:1.2}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.hist span{background:var(--rani2);border-radius:999px;padding:2px 10px;font-weight:800}
.codebig{font:800 clamp(28px,7vw,40px)/1.1 var(--f);letter-spacing:.06em;color:var(--teal)}
.ticket{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;background:var(--gold);padding:8px;border-radius:14px;box-shadow:0 10px 24px #f2a51640}
.ticket div,.ticket button{aspect-ratio:1/1.05;border-radius:8px;display:grid;place-items:center}
.ticket div{background:#ffe9b8}
.ticket button{min-height:0;padding:0;border:0;background:#fff;color:#2b0d18;font:800 clamp(16px,4.4vw,24px) var(--f)}
.ticket button.mk{background:var(--rani);color:#fff;box-shadow:inset 0 0 0 3px #fff6}
.ticket button.hit{background:var(--teal);color:#fff}
.ticket.mini button{font-size:clamp(13px,3.4vw,18px)}
.tapme{cursor:zoom-in;position:relative}
.prizes{display:grid;gap:8px}
.prize{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.prize span{font-weight:700}
.ok{color:var(--teal);font-weight:800}.no{color:var(--soft)}
/* full screen, sideways */
.fs{position:fixed;inset:0;z-index:80;background:var(--rani);overflow:hidden;color:#fff}
.fs[hidden]{display:none}
.fs-in{position:absolute;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
@media(orientation:portrait){.fs-in{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);padding:10px 14px}}
.fs-bar{display:flex;align-items:center;gap:10px;flex:none}
.fs-bar b{flex:1;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-bar button{min-height:42px;padding:4px 16px;background:#fff;color:var(--rani);border-color:#fff}
.fs-body{flex:1;container-type:size;display:grid;place-items:center}
.fs .ticket{width:min(96cqw,calc(100cqh * 2.7));gap:.8cqw;padding:1cqw}
.fs .ticket button{font-size:min(5.4cqw,14cqh)}
.fs-host{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,27%) minmax(0,1fr);gap:2cqw;align-items:center}
.fs-host .ball{width:min(22cqw,46cqh);font-size:min(10cqw,22cqh)}
.fs-host .side{display:grid;justify-items:center;gap:1.4cqh;text-align:center}
.fs-host .phrase{font-size:min(2.6cqw,6cqh)}
.fs-host .side button{min-height:44px;width:100%}
.fs-host .side button.ghost{background:transparent;color:#fff;border-color:#fff}
.fsboard{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:.7cqh;height:100%}
.fsboard span{display:grid;place-items:center;border-radius:8px;background:#ffffff1f;color:#ffffffb0;font-weight:800;font-size:min(2.6cqw,7cqh)}
.fsboard span.c{background:#fff;color:var(--rani)}.fsboard span.last{background:var(--gold);color:#2b0d18}
/* games */
.timer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:140px;height:140px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 42px var(--f)}
@media(max-width:480px){.timer{grid-template-columns:1fr;justify-items:center;text-align:center}.timer .row{justify-content:center}}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.game{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.game.pick{border-color:var(--gold);background:var(--gold2)}
.game h3{margin-bottom:.2em}.game .need{font-size:15px;color:var(--teal);font-weight:700}
.game p{font-size:16px;margin:.4em 0 .7em}
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.menu-list ul{margin:.3em 0 0;padding-left:1.1em}.menu-list li{margin:2px 0}
.result{background:var(--gold2);border:1.5px solid var(--gold);border-radius:16px;padding:14px 16px;white-space:pre-line}
.idea h3{color:var(--rani)}:root[data-theme=dark] .idea h3{color:#ff8fb7}
.dlg{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:90;padding:16px}.dlg.on{display:grid}
.dlg .card{max-width:420px;width:100%;margin:0}
.guide{position:fixed;inset:0;z-index:85;background:#2b0d18f5;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px max(6vw,20px)}
.guide ol{font-size:19px;line-height:1.5;padding-left:1.3em;margin:0 0 14px}.guide li{margin:10px 0}
.guide h3{color:#fff;font-size:26px}.guide .note{color:#ffd9e6;font-size:16px}
.guide .arrow{position:fixed;width:64px;height:64px;color:var(--gold);animation:bob 1s ease-in-out infinite alternate}
.guide .arrow.down{bottom:calc(12px + env(safe-area-inset-bottom));left:calc(50% - 32px)}
.guide .arrow.up{top:calc(8px + env(safe-area-inset-top));right:14px;transform:rotate(180deg)}
@keyframes bob{to{translate:0 10px}}
.guide .arrow.up{animation-name:bobup}@keyframes bobup{to{translate:0 -10px}}
@media(prefers-reduced-motion:reduce){.guide .arrow{animation:none}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .25s;z-index:95;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="top">
  <svg class="garland" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 4 Q50 26 100 4 T200 4 T300 4 T400 4" stroke="#f2a516" stroke-width="2" fill="none"/>
    <g fill="#f2a516"><circle cx="25" cy="14" r="5"/><circle cx="75" cy="14" r="5"/><circle cx="125" cy="14" r="5"/><circle cx="175" cy="14" r="5"/><circle cx="225" cy="14" r="5"/><circle cx="275" cy="14" r="5"/><circle cx="325" cy="14" r="5"/><circle cx="375" cy="14" r="5"/></g>
    <g fill="#fff"><circle cx="50" cy="15" r="3"/><circle cx="150" cy="15" r="3"/><circle cx="250" cy="15" r="3"/><circle cx="350" cy="15" r="3"/></g>
  </svg>
  <button class="lang" id="langBtn" type="button">English</button>
  <div class="brand"><img class="logo" src="logo.png" alt="" width="80" height="80"><h1 data-t="title"></h1></div>
  <p class="sub" data-t="sub"></p>
</header>

<nav class="tabs" id="tabs">
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tHome"></span></a>
  <a href="#invite"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span data-t="tInvite"></span></a>
  <a href="#housie"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 6v12M15 6v12M3 12h18"/></svg><span data-t="tHousie"></span></a>
  <a href="#games"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg><span data-t="tGames"></span></a>
  <a href="#food"><svg viewBox="0 0 24 24"><path d="M4 13h16a8 8 0 0 1-16 0zM8 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg><span data-t="tFood"></span></a>
  <a href="#ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span data-t="tIdeas"></span></a>
</nav>

<main>
<section class="view" id="v-home">
  <div class="card hero">
    <div>
      <p class="muted" style="margin:0" data-t="nextParty"></p>
      <div class="bigdate" id="nextMonth">—</div>
      <h2 id="nextHost" style="margin-top:.2em">—</h2>
      <p class="muted" id="nextNote"></p>
      <div class="row"><a class="btn" href="#invite" data-t="makeInvite"></a><a class="btn ghost" href="#housie" data-t="startHousie"></a></div>
    </div>
    <div>
      <h3 data-t="howTitle"></h3>
      <ol class="steps small"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li><li data-t="how4"></li></ol>
    </div>
  </div>
  <div class="card" id="installCard">
    <h3 data-t="instTitle"></h3>
    <div class="row" style="margin-bottom:8px"><button class="teal" id="installBtn" type="button" data-t="instBtn"></button></div>
    <p class="small" style="margin:0" id="instShort"></p>
  </div>
  <h2 data-t="calTitle"></h2>
  <p class="muted small" data-t="calHint"></p>
  <div class="cal" id="cal"></div>
</section>

<section class="view" id="v-invite">
  <h2 data-t="invTitle"></h2>
  <p class="muted" data-t="invSub"></p>
  <div class="grid2">
    <form class="card" id="invForm" autocomplete="off">
      <label for="iHost" data-t="fHost"></label><input id="iHost">
      <label for="iDate" data-t="fDate"></label><input id="iDate" type="date">
      <label for="iTime" data-t="fTime"></label><input id="iTime" type="time" value="16:00">
      <label data-t="fWhere"></label><div class="chips" id="vType"><button type="button" class="chip" data-v="home" data-t="vHome"></button><button type="button" class="chip" data-v="other" data-t="vOther"></button></div>
      <div id="venueWrap"><label for="iVenue" data-t="fVenue"></label><input id="iVenue" data-tp="phVenue"></div>
      <label for="iPlace"><span data-t="fPlace"></span><button type="button" class="secret" data-s="place"></button></label><textarea id="iPlace" data-tp="phPlace"></textarea>
      <label for="iTheme"><span data-t="fTheme"></span><span class="opt" data-t="opt"></span><button type="button" class="secret" data-s="theme"></button></label>
      <input id="iTheme" list="themeList" data-tp="phTheme"><datalist id="themeList"></datalist>
      <label for="iMenu"><span data-t="fMenu"></span><span class="opt" data-t="opt"></span><button type="button" class="secret" data-s="menu"></button></label>
      <textarea id="iMenu" data-tp="phMenu"></textarea>
      <div class="row" style="margin-top:6px"><button type="button" class="ghost" id="iMenuGen" data-t="suggestMenu"></button></div>
      <label><span data-t="fGames"></span><span class="opt" data-t="optTap"></span><button type="button" class="secret" data-s="games"></button></label>
      <div class="chips" id="iGames"></div>
      <label for="iKitty"><span data-t="fKitty"></span><span class="opt" data-t="opt"></span></label><input id="iKitty" inputmode="numeric" data-tp="phKitty">
      <label for="iNote"><span data-t="fNote"></span><span class="opt" data-t="opt"></span></label><textarea id="iNote" data-tp="phNote"></textarea>
      <label for="iPrivate"><span data-t="fPrivate"></span></label><textarea id="iPrivate" data-tp="phPrivate"></textarea>
      <p class="small muted" style="margin-top:10px" data-t="privacyNote"></p>
    </form>
    <div>
      <div class="invite" id="invCard"></div>
      <div class="row" style="margin-top:14px">
        <a class="btn teal" id="waBtn" href="#" target="_blank" rel="noopener" data-t="sendWa"></a>
        <button class="ghost" id="copyInv" type="button" data-t="copyText"></button>
      </div>
      <p class="small muted" style="margin-top:8px" data-t="shotNote"></p>
    </div>
  </div>
</section>

<section class="view" id="v-housie">
  <h2 data-t="housieTitle"></h2>

const hashStr=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0};
const rng=seed=>{let a=hashStr(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}};
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
function makeTicket(code,name,game){
  const r=rng(norm(code)+'|'+norm(name)+'|'+game);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  let rows;
  for(;;){rows=[0,1,2].map(()=>shuffle([0,1,2,3,4,5,6,7,8]).slice(0,5));const cnt=Array(9).fill(0);rows.flat().forEach(c=>cnt[c]++);if(cnt.every(x=>x>=1))break}
  const T=[0,1,2].map(()=>Array(9).fill(0));
  for(let c=0;c<9;c++){const lo=c===0?1:c*10,hi=c===8?90:c*10+9;const pool=[];for(let n=lo;n<=hi;n++)pool.push(n);
    const rs=[0,1,2].filter(i=>rows[i].includes(c));const nums=shuffle(pool).slice(0,rs.length).sort((a,b)=>a-b);rs.forEach((ri,k)=>T[ri][c]=nums[k])}
  return T;
}
const ticketHTML=(T,cls)=>T.flat().map(n=>n?`<button type="button" class="${cls(n)}" data-n="${n}">${n}</button>`:'<div></div>').join('');
const PKEYS=['early','top','mid','bot','corners','full'];

$('#clearMarks').onclick=()=>ask(t('clearMQ'),t('clearMB'),()=>{P.marks=[];store.set('player',P);store.set(mkKey(),[]);drawPlayer()});
$('#changeCard').onclick=()=>{$('#pCode').value=P.code;$('#pName').value=P.name;$('#pGame').value=P.game;P=null;store.set('player',null);drawPlayer()};

/* ---------- FULL SCREEN, SIDEWAYS ---------- */
function drawFS(){
  const body=$('#fsBody');
  if(fsKind==='ticket'&&P){const T=makeTicket(P.code,P.name,P.game),mk=new Set(P.marks||[]);
    $('#fsTitle').textContent=P.name+' · '+t('meta',P.code,P.game);body.innerHTML=`<div class="ticket">${ticketHTML(T,n=>mk.has(n)?'mk':'')}</div>`}
  if(fsKind==='host'){const set=new Set(H.called),last=H.called[H.called.length-1];
    $('#fsTitle').textContent=t('code')+' '+H.code+' · '+t('count',H.called.length);
    body.innerHTML=`<div class="fs-host"><div class="side"><div class="ball">${last||'–'}</div><div class="phrase">${esc(last?phraseOf(last):t('begin'))}</div><button class="gold" data-a="next" type="button" ${H.called.length>=90?'disabled':''}>${esc(t('callNext'))}</button><button class="ghost" data-a="undo" type="button" ${H.called.length?'':'disabled'}>${esc(t('undo'))}</button></div><div class="fsboard">${Array.from({length:90},(_,i)=>`<span class="${set.has(i+1)?'c':''} ${i+1===last?'last':''}">${i+1}</span>`).join('')}</div></div>`}
}
function openFS(kind){
  fsKind=kind;$('#fs').hidden=false;drawFS();
  try{const d=document.documentElement;const p=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen&&d.webkitRequestFullscreen();
    if(p&&p.then)p.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}
}
function closeFS(){fsKind=null;$('#fs').hidden=true;try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
  try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}}
$('#fsClose').onclick=closeFS;
$('#hostBig').onclick=()=>openFS('host');
$('#fsBody').addEventListener('click',e=>{
  if(fsKind==='ticket'){const b=e.target.closest('button[data-n]');if(b)toggleMark(+b.dataset.n)}
  if(fsKind==='host'){const a=e.target.closest('button[data-a]');if(!a)return;if(a.dataset.a==='next')callNext();else undo()}});

/* ---------- GAMES + TIMER ---------- */
let gF='all',chosen=null;
function drawGames(){
  $('#gFilter').innerHTML=[['all','fAll'],['none','fNone'],['props','fProps']].map(([k,l])=>`<button type="button" class="chip ${gF===k?'on':''}" data-f="${k}">${esc(t(l))}</button>`).join('');
  $('#glist').innerHTML=GAMES.filter(g=>gF==='all'||g.t===gF).map(g=>`<div class="game ${chosen===g.id?'pick':''}"><h3>${esc(g[L][0])}</h3><div class="need">${esc(t('need')+g[L][1])}</div><p>${esc(g[L][2])}</p><button type="button" class="ghost" data-g="${g.id}">${esc(t('playThis'))}</button></div>`).join('');
  $('#tGame').textContent=chosen?gName(GAMES.find(g=>g.id===chosen)):t('pickGame');$('#tStart').textContent=tId?t('stop'):t('start');
}
$('#gFilter').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){gF=c.dataset.f;drawGames()}});
const choose=id=>{chosen=id;resetT();drawGames();window.scrollTo({top:0,behavior:'smooth'})};
$('#glist').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(b)choose(b.dataset.g)});
$('#gRand').onclick=()=>choose(pick(GAMES.filter(g=>g.id!=='housie'&&g.id!==chosen)).id);
let tId=null,tEnd=0;const arc=$('#arc'),C=276.5;
const beep=(f,d)=>{try{const a=beep.ctx||(beep.ctx=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}};
const tick=()=>{const left=Math.max(0,(tEnd-Date.now())/1000);$('#tLeft').textContent=Math.ceil(left);arc.style.strokeDashoffset=C*(1-left/60);
  if(left<=10&&left>0&&Math.ceil(left)!==tick.l){tick.l=Math.ceil(left);beep(660,.08)}
  if(left<=0){clearInterval(tId);tId=null;beep(440,.9);$('#tStart').textContent=t('start');toast(t('timeUp'))}};
function resetT(){clearInterval(tId);tId=null;$('#tLeft').textContent='60';arc.style.strokeDashoffset=0;$('#tStart').textContent=t('start')}
$('#tStart').onclick=()=>{if(tId){resetT();return}beep(880,.1);tEnd=Date.now()+60000;tick.l=0;tId=setInterval(tick,200);$('#tStart').textContent=t('stop')};
$('#tReset').onclick=resetT;

/* ---------- MENU ---------- */
let menuSel={p:0};
const menuText=()=>menuSel.text!=null?menuSel.text:PRESETS[menuSel.p][L][1];
function drawFood(){
  $('#presetChips').innerHTML=PRESETS.map((p,i)=>`<button type="button" class="chip ${menuSel.p===i&&menuSel.text==null?'on':''}" data-k="${i}">${esc(p[L][0])}</button>`).join('');
  $('#menuOut').textContent=menuText();
  $('#menuList').innerHTML=MENU.map(c=>`<div class="card" style="margin:0"><h3>${esc(c[L])}</h3><ul>${c.i[L].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
}
$('#presetChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){menuSel={p:+c.dataset.k};drawFood()}});
$('#mixMenu').onclick=()=>{menuSel={p:-1,text:mixMenu()};drawFood()};
$('#useMenu').onclick=()=>{$('#iMenu').value=menuText();drawInv();location.hash='invite';toast(t('menuAdded'))};

/* ---------- IDEAS ---------- */
let ideaPick=-1;
const drawIdeas=()=>{$('#ideaList').innerHTML=IDEAS.map((x,i)=>`<div class="game idea ${ideaPick===i?'pick':''}"><h3>${esc(x[L][0])}</h3><p>${esc(x[L][1])}</p><button type="button" class="ghost" data-i="${i}">${esc(t('useTheme'))}</button></div>`).join('');
  $('#themeList').innerHTML=IDEAS.map(x=>`<option value="${esc(x[L][0])}">`).join('')};
$('#ideaRand').onclick=()=>{let i;do{i=Math.floor(Math.random()*IDEAS.length)}while(i===ideaPick);ideaPick=i;drawIdeas();toast(IDEAS[i][L][0]);const el=$$('#ideaList .game')[i];if(el)el.scrollIntoView({behavior:'smooth',block:'center'})};
$('#ideaList').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;$('#iTheme').value=IDEAS[+b.dataset.i][L][0];drawInv();location.hash='invite';toast(t('themeAdded'))});

/* ---------- INSTALL ---------- */
let deferred=null;
const UA=navigator.userAgent||'';const isIOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const iosOther=isIOS&&/CriOS|FxiOS|EdgiOS/.test(UA);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
const showGuide=()=>{const k=isIOS?(iosOther?'gIosChrome':'gIos'):'gAndroid';$('#gSteps').innerHTML=t(k).map(x=>`<li>${esc(x)}</li>`).join('');$('#gNote').textContent=t('gNote');
  const a=$('#gArrow');a.classList.toggle('down',isIOS&&!iosOther);a.classList.toggle('up',!(isIOS&&!iosOther));$('#guide').hidden=false};
$('#installBtn').onclick=async()=>{if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;return}showGuide()};
$('#gClose').onclick=()=>{$('#guide').hidden=true};
try{if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#installCard').hidden=true}catch(e){}
try{if(APP_URL&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

/* ---------- LANGUAGE + START ---------- */
function drawAll(){applyWords();$('#instShort').textContent=t('instShort');if(!$('#guide').hidden)showGuide();drawCal();if(!$('#iHost').value)$('#iHost').value=nm(cal[nextIdx()].host);drawInv();drawHost();drawPlayer();drawGames();drawFood();drawIdeas();if(fsKind)drawFS()}
$('#langBtn').onclick=()=>{L=L==='kn'?'en':'kn';store.set('lang',L);drawAll()};
drawAll();setMode(store.get('mode','host')==='host');route();
}
</script>
</body>
</html>
