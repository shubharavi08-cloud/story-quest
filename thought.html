.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.lang{font:700 15px var(--body);border-radius:999px;padding:7px 16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}

.tag{color:var(--muted);margin:0;font-size:18px}

.flip{perspective:1200px;cursor:pointer;border:0;padding:0;background:none;color:inherit;text-align:left;font:inherit;width:100%}
.flip .in{position:relative;display:grid;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;border:1px solid rgba(246,167,35,.4);background:linear-gradient(160deg,#3b2a12,#2a1f5c 70%);display:flex;flex-direction:column;gap:8px}

.stepbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepbox input{flex:1 1 220px;min-width:0;font:600 16px var(--body);color:var(--ink);background:var(--night);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.week{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}

.dy svg{width:36px;height:40px}

.dy.lit .fl{opacity:1;animation:flick 1.2s ease-in-out infinite alternate}

.ok{color:var(--leaf);font-weight:700;margin:0;min-height:1.5em}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:700 15px var(--body);border-radius:999px;padding:8px 16px;border:1.5px solid var(--line);background:var(--night-2);color:var(--ink);cursor:pointer}

.share{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

.tile.ghost .ph{aspect-ratio:16/9;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,var(--night-3),var(--night-2))}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

     chips:[['📚 परीक्षा','बस 10 मिनट किताब खोलिए। शुरू करते ही डर छोटा हो जाता है।'],['💬 मुश्किल बात','जो पहला वाक्य कहना है, लिख लीजिए। फिर आज ही कह दीजिए।'],['💼 काम या बॉस','जो सवाल टाल रहे हैं, वही पूछ लीजिए। साफ़ बात चिंता से बेहतर है।'],['🌀 कुछ और','उसे एक शब्द में नाम दीजिए। नाम मिलते ही डर छोटा हो जाता है।']],
     share:'रोज़ एक विचार: भागोगे तो डर पीछा करेगा, पलटोगे तो छोटा हो जाएगा। 🪔 एक कहानी, एक श्लोक, एक छोटा क़दम:'},
   kn:{title:'ಎದುರಿಸು',hook:'ಓಡಿದರೆ, ಭಯ <span style="color:var(--flame)">ಬೆನ್ನಟ್ಟುತ್ತದೆ.</span>',
     story:'ಬನಾರಸ್, ಬಹಳ ವರ್ಷಗಳ ಹಿಂದೆ. ಒಬ್ಬ ಯುವ ಸಂನ್ಯಾಸಿ ಘಾಟಿನ ದಾರಿಯಲ್ಲಿ ನಡೆಯುತ್ತಿದ್ದಾಗ ಕೋತಿಗಳ ಗುಂಪೊಂದು ಅವರ ಬೆನ್ನಟ್ಟಿತು. ಅವರು ಓಡಿದರು; ಎಷ್ಟು ವೇಗವಾಗಿ ಓಡಿದರೋ, ಕೋತಿಗಳು ಅಷ್ಟು ಹತ್ತಿರ ಬಂದವು. ಆಗ ಒಬ್ಬ ಹಿರಿಯ ಸಾಧು ಕೂಗಿದರು: “ನಿಲ್ಲು! ತಿರುಗು! ಎದುರಿಸು!” ಅವರು ನಿಂತರು, ತಿರುಗಿದರು, ಕೋತಿಗಳ ಕಣ್ಣಲ್ಲಿ ಕಣ್ಣಿಟ್ಟು ನೋಡಿದರು. ಕೋತಿಗಳು ಓಡಿಹೋದವು. ಆ ಯುವಕ ಸ್ವಾಮಿ ವಿವೇಕಾನಂದರು.',
     today:'ನಮಗೆಲ್ಲರಿಗೂ ನಮ್ಮದೇ ಕೋತಿಗಳಿವೆ: ಪರೀಕ್ಷೆಯ ಭಯ, ಬಾಸ್ ಜೊತೆಗಿನ ಮೀಟಿಂಗ್, ಆ ಒಂದು ಕಷ್ಟದ ಮಾತು. ಎಷ್ಟು ಮುಂದೂಡುತ್ತೇವೋ, ಅಷ್ಟು ಬೆನ್ನಟ್ಟುತ್ತವೆ.',
     meaning:'ಹೇ ಪಾರ್ಥ, ಹೇಡಿತನ ನಿನಗೆ ತಕ್ಕದ್ದಲ್ಲ. ಮನಸ್ಸಿನ ಈ ಸಣ್ಣ ದೌರ್ಬಲ್ಯವನ್ನು ಬಿಟ್ಟು, ಎದ್ದೇಳು.',
     step:'ಇಂದು ನೀವು ತಪ್ಪಿಸಿಕೊಳ್ಳುತ್ತಿರುವ ಆ ಒಂದು ಕೆಲಸದ ಕಡೆ ತಿರುಗಿ ನೋಡಿ.',
     chips:[['📚 ಪರೀಕ್ಷೆ','ಕೇವಲ 10 ನಿಮಿಷ ಪುಸ್ತಕ ತೆರೆಯಿರಿ. ಶುರು ಮಾಡಿದ ಕೂಡಲೇ ಭಯ ಚಿಕ್ಕದಾಗುತ್ತದೆ.'],['💬 ಕಷ್ಟದ ಮಾತು','ಹೇಳಬೇಕಾದ ಮೊದಲ ವಾಕ್ಯವನ್ನು ಬರೆದುಕೊಳ್ಳಿ. ಇಂದೇ ಹೇಳಿ.'],['💼 ಕೆಲಸ ಅಥವಾ ಬಾಸ್','ತಪ್ಪಿಸುತ್ತಿರುವ ಆ ಪ್ರಶ್ನೆಯನ್ನೇ ಕೇಳಿ. ಸ್ಪಷ್ಟತೆ ಚಿಂತೆಗಿಂತ ಮೇಲು.'],['🌀 ಬೇರೆ ಏನೋ','ಅದಕ್ಕೆ ಒಂದು ಪದದ ಹೆಸರು ಕೊಡಿ. ಹೆಸರಿಟ್ಟ ಭಯ ಆಗಲೇ ಚಿಕ್ಕದು.']],
     share:'ದಿನಕ್ಕೊಂದು ವಿಚಾರ: ಓಡಿದರೆ ಭಯ ಬೆನ್ನಟ್ಟುತ್ತದೆ, ತಿರುಗಿದರೆ ಚಿಕ್ಕದಾಗುತ್ತದೆ. 🪔 ಒಂದು ಕಥೆ, ಒಂದು ಶ್ಲೋಕ, ಒಂದು ಪುಟ್ಟ ಹೆಜ್ಜೆ:'}
  }}
];

/* ---------- small helpers (storage is a per-browser convenience only) ---------- */
const st={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=dkey(new Date());
const live=THOUGHTS.filter(t=>t.date<=todayKey).sort((a,b)=>a.date<b.date?1:-1);
const pickDefault=()=>live[0]||THOUGHTS[0];
let L=['en','hi','kn'].includes(st.get('tad-lang','en'))?st.get('tad-lang','en'):'en';
const qsLang=new URLSearchParams(location.search).get('lang'); if(['en','hi','kn'].includes(qsLang))L=qsLang;
let cur=pickDefault();
const hashN=parseInt((location.hash.match(/^#t(\d+)/)||[])[1]); if(hashN){const f=live.find(t=>t.n===hashN); if(f)cur=f}

function streak(){const done=new Set(st.get('tad-done',[]));let n=0;const d=new Date();if(!done.has(dkey(d)))d.setDate(d.getDate()-1);while(done.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function week(){const done=new Set(st.get('tad-done',[]));const u=UI[L];let h='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const lit=done.has(dkey(d));
 h+=`<div class="dy ${lit?'lit':''}"><svg viewBox="0 0 36 40" aria-hidden="true"><g class="fl"><path d="M18 4 Q11 15 18 22 Q25 15 18 4Z" fill="#ffd35a"/><path d="M18 10 Q15 16 18 20 Q21 16 18 10Z" fill="#fff3c4"/></g><path d="M3 24 Q4 36 18 37 Q32 36 33 24 Q25 28 18 28 Q11 28 3 24Z" fill="${lit?'#e08a3c':'#5a4a8a'}"/><path d="M3 24 Q18 19 33 24 Q25 28 18 28 Q11 28 3 24Z" fill="${lit?'#f4c25b':'#6e5ea8'}"/></svg><span>${i===0?'●':u.days[d.getDay()]}</span></div>`}
 $('week').innerHTML=h}

function render(){
 const u=UI[L], t=cur.t[L];
 document.documentElement.lang=L; document.title=`${u.series}: ${t.title} · World of Wonders`;
 document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 const d=new Date(cur.date+'T00:00:00');
 $('series').textContent=`${u.series} · #${cur.n} · ${d.toLocaleDateString(L==='en'?'en-IN':L+'-IN',{day:'numeric',month:'long'})}`;
 $('hook').innerHTML=t.hook; $('tag').innerHTML=u.tag; $('streak').textContent=u.streak(streak());
 const id=cur.yt[L];
 $('video').innerHTML=id?`<iframe src="https://www.youtube.com/embed/${id}?rel=0&playsinline=1" title="${t.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`
   :`<img src="${cur.img}" alt="${t.title}"><div class="soon">${u.soon}</div>`;
 $('lStory').textContent=u.story; $('story').textContent=t.story;
 $('lToday').textContent=u.today; $('todayTxt').textContent=t.today;
 $('lVerse').textContent=`${u.verse} ${cur.verse}`; $('sk').innerHTML=cur.sk.join('<br>'); $('iast').textContent=cur.iast;
 $('lTap').textContent='↻ '+u.tap; $('lTapBack').textContent='↻ '+u.tapBack; $('lMeaning').textContent=u.meaning; $('meaning').textContent=t.meaning;
 $('lStep').textContent=u.step; $('step').textContent=t.step; $('note').placeholder=u.ph; $('note').value=st.get('tad-note-'+cur.n,'');
 $('did').textContent=u.did; $('okmsg').textContent=st.get('tad-done',[]).includes(todayKey)?u.again:''; week();
 $('lQ').textContent=u.q; $('tip').hidden=true;
 $('chips').innerHTML=t.chips.map((c,i)=>`<button class="chip" data-i="${i}">${c[0]}</button>`).join('');
 const url=`https://worldofwondersstudio.com/thought.html?lang=${L}#t${cur.n}`;
 $('wa').textContent='💬 '+u.wa; $('wa').href='https://wa.me/?text='+encodeURIComponent(t.share+' '+url);
 $('native').textContent=u.native; $('native').hidden=!navigator.share; $('copy').textContent=u.copy; $('copied').textContent='';
 $('lMore').textContent=u.more;
 $('archive').innerHTML=live.map(x=>`<a class="tile ${x===cur?'cur':''}" href="#t${x.n}"><img src="${x.tile}" alt="" loading="lazy"><div class="body"><span class="eyebrow">#${x.n} · ${u.verse} ${x.verse}</span><h3>${x.t[L].title}</h3><p>${x.t[L].hook.replace(/<[^>]+>/g,'')}</p></div></a>`).join('')
   +`<div class="tile ghost"><div class="ph">🪔</div><div class="body"><h3>${u.next}</h3></div></div>`;
}

document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{L=b.dataset.l;st.set('tad-lang',L);render()});
$('flip').onclick=()=>{const f=$('flip');f.classList.toggle('on');f.setAttribute('aria-pressed',f.classList.contains('on'))};
$('note').oninput=e=>st.set('tad-note-'+cur.n,e.target.value);
$('did').onclick=()=>{const done=st.get('tad-done',[]);const u=UI[L];
 if(!done.includes(todayKey)){done.push(todayKey);st.set('tad-done',done.slice(-400));$('okmsg').textContent=u.done}else $('okmsg').textContent=u.again;
 $('streak').textContent=u.streak(streak()); week()};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
 const tp=$('tip');tp.hidden=false;tp.textContent=cur.t[L].chips[+b.dataset.i][1];tp.style.animation='none';tp.offsetHeight;tp.style.animation=''};
$('native').onclick=()=>{const t=cur.t[L];navigator.share({title:UI[L].series,text:t.share,url:`https://worldofwondersstudio.com/thought.html?lang=${L}#t${cur.n}`}).catch(()=>{})};
$('copy').onclick=()=>{const url=`https://worldofwondersstudio.com/thought.html?lang=${L}#t${cur.n}`;(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>$('copied').textContent=UI[L].copied).catch(()=>{$('copied').textContent=url})};
addEventListener('hashchange',()=>{const n=parseInt((location.hash.match(/^#t(\d+)/)||[])[1]);const f=live.find(t=>t.n===n);if(f){cur=f;$('flip').classList.remove('on');render();scrollTo({top:0,behavior:'smooth'})}});
render();
</script>
<script src="join.js?v=4" defer></script>
</body>
</html>
