<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chowka Bhara — World of Wonders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Kannada:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ff9a3c; --bg2:#ff4f8b; --bg3:#7b5cff;
  --ink:#2b1d3a; --card:#fffaf2; --line:#e7cfa6;
  --red:#e63946; --green:#16a37f; --yellow:#f2b705; --blue:#3a7bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background-color:#4a2a17!important;
  font-family:"Baloo 2","Noto Sans Kannada","Noto Sans Devanagari",system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(120% 80% at 10% 0%,#ffd36e 0%,transparent 55%),
             radial-gradient(100% 70% at 100% 100%,#8f7bff 0%,transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  user-select:none;-webkit-user-select:none;
}
body.kn{font-family:"Noto Sans Kannada","Baloo 2",system-ui,sans-serif}
body.hi{font-family:"Noto Sans Devanagari","Baloo 2",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}

/* ---------- menu ---------- */
#menu{justify-content:center;padding:18px;overflow:auto}
.menu-card{width:min(440px,100%);background:var(--card);border-radius:28px;padding:22px 20px 20px;
  box-shadow:0 18px 50px rgba(60,10,60,.35);position:relative}
.brand{margin-top:26px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#a0527a;text-align:center;font-weight:700}
.title{font-size:44px;line-height:1;text-align:center;margin:6px 0 2px;font-weight:800;
  background:linear-gradient(90deg,#e63946,#ff7a00,#16a37f,#3a7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#6b5878;font-size:15px;margin-bottom:12px}
.hero{display:flex;justify-content:center;gap:6px;margin:4px 0 14px}
.hero .cw{height:58px;filter:drop-shadow(2px 4px 3px rgba(0,0,0,.35))}
.hero .cw img{height:58px!important;width:auto!important;display:block}
.row{margin:12px 0}
.label{font-size:13px;font-weight:700;color:#8a6f8f;margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.06em}
body.kn .label,body.hi .label{text-transform:none;letter-spacing:0;font-size:14px}
.seg{display:flex;background:#f3e6d3;border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;background:transparent;font-weight:700;font-size:16px;color:#7a6070}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(120,60,20,.18)}
.seg small{display:block;font-size:12px;font-weight:500;color:#9a8492}
.seats{display:grid;gap:8px}
.seat{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;border:2px solid #f0e2cc}
.seat .dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.seat .nm{flex:1;font-weight:700;font-size:16px}
.seat .tg{padding:7px 12px;border-radius:10px;background:#f3e6d3;font-weight:700;font-size:14px;min-width:96px}
.seat .tg.cpu{background:#efe4ff;color:#5a3fc0}
.seat.off{opacity:.35}
.play{display:block;width:100%;margin-top:16px;padding:14px;border-radius:18px;font-size:22px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,#ff7a00,#e63946);box-shadow:0 8px 20px rgba(230,57,70,.4)}
.play:active{transform:translateY(2px)}
.minor{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:#f3e6d3;font-weight:700;font-size:14px}
.langs{position:absolute;top:14px;right:14px;display:flex;gap:4px}
.langs button{padding:4px 8px;border-radius:8px;background:#f3e6d3;font-size:13px;font-weight:700}
.langs button.on{background:#2b1d3a;color:#fff}

/* ---------- game ---------- */
#game{padding:8px 10px 12px;justify-content:center}
.top{width:min(560px,100%);display:flex;align-items:center;gap:8px;color:#fff}
.top .t{flex:1;font-weight:800;font-size:19px;text-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);font-size:19px;display:grid;place-items:center}
.players{width:min(560px,100%);display:flex;gap:6px;margin:8px 0}
.pl{flex:1;background:rgba(255,255,255,.85);border-radius:14px;padding:5px 6px;display:flex;align-items:center;gap:6px;
  border:3px solid transparent;transition:.25s;min-width:0}
.pl .dot{width:18px;height:18px;border-radius:50%;flex:none}
.pl .n{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .h{font-size:12px;color:#7a6070;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.players.p4 .pl .hw{display:none}
.players.p4 .pl{padding:5px 4px;gap:4px}
.pl .h b{color:#2b1d3a}
.pl.act{background:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.pl .key{font-size:12px}
.boardwrap{position:relative;width:min(560px,94vw,calc(100vh - 342px));aspect-ratio:1;flex:none}
#boardsvg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 26px rgba(50,0,60,.35))}
#pawns{position:absolute;inset:0}
.pawn{position:absolute;width:var(--ps);height:var(--ps);margin:calc(var(--ps)/-2) 0 0 calc(var(--ps)/-2);border-radius:50%;
  transition:left .17s ease,top .17s ease,transform .2s;z-index:2;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 12%,transparent 13%),
             radial-gradient(circle at 50% 55%,var(--c) 0 60%,var(--cd) 100%);
  box-shadow:0 3px 0 var(--cd),0 5px 8px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.9)}
.pawn.can{cursor:pointer;animation:glow 0.9s ease-in-out infinite alternate;z-index:5}
.pawn.can::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.pawn.hop{transform:scale(1.25) translateY(-4px);z-index:8}
.pawn .bd{position:absolute;right:-7px;top:-7px;background:#2b1d3a;color:#fff;font-size:11px;font-weight:800;border-radius:999px;
  min-width:17px;height:17px;display:grid;place-items:center;padding:0 3px;font-family:"Baloo 2",sans-serif}
@keyframes glow{from{box-shadow:0 3px 0 var(--cd),0 0 0 3px #fff,0 0 12px 4px #fff}to{box-shadow:0 3px 0 var(--cd),0 0 0 5px #fff,0 0 22px 10px #ffe46b}}
.ghost{position:absolute;width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);border-radius:18%;
  border:3px dashed var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);pointer-events:none;z-index:1;animation:fade .9s infinite alternate}
@keyframes fade{from{opacity:.45}to{opacity:1}}
.dock{width:min(560px,100%);margin-top:12px;background:rgba(255,250,242,.95);border-radius:22px;padding:10px 12px;
  box-shadow:0 10px 30px rgba(50,0,60,.3);display:flex;flex-direction:column;gap:6px}
.msg{min-height:24px;text-align:center;font-weight:700;font-size:16px}
.dockrow{display:flex;align-items:center;gap:10px}
.pool{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;min-height:36px}
.pool .plbl{font-size:13px;font-weight:700;color:#8a6f8f;margin-right:2px;white-space:nowrap}
.pool .pplus{font-weight:800;font-size:16px;color:#e5532a;animation:fade .7s infinite alternate}
.pc{min-width:38px;height:34px;padding:0 11px;border-radius:999px;background:#fff;border:2px solid #e7d3b5;font-weight:800;font-size:16px;line-height:1;
  color:#2b1d3a;box-shadow:0 2px 0 #dcc39c;white-space:nowrap;font-family:"Baloo 2",system-ui,sans-serif;transition:transform .12s,background .12s}
.pc:active{transform:translateY(2px)}
.pc.sel{background:linear-gradient(180deg,#ff8a1f,#e5532a);border-color:#a8341a;color:#fff;box-shadow:0 2px 0 #a8341a,0 0 0 3px rgba(255,138,31,.32);transform:scale(1.06)}
.pc.off{background:#ece4d8;border-color:#ddd2c2;color:#a3968c;box-shadow:none}
.pc.ro{box-shadow:none;cursor:default}
.pool.many{gap:5px}
.pool.many .pc{height:30px;min-width:32px;padding:0 8px;font-size:14px}
.tray{flex:1;height:96px;border-radius:16px;background-size:cover;background-position:center;
  box-shadow:inset 0 3px 12px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.25);overflow:hidden;position:relative}
.tray .cw{position:absolute;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.55))}
.cw img,.fly img{display:block}
#throwLayer{position:fixed;inset:0;pointer-events:none;z-index:40}
.fly{position:absolute;will-change:transform;filter:drop-shadow(3px 6px 4px rgba(0,0,0,.45))}
.hands{position:absolute;font-size:74px;line-height:1;transform-origin:50% 80%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));
  animation:shake .11s ease-in-out infinite alternate;transition:transform .22s ease-out,opacity .35s}
@keyframes shake{from{translate:-7px -2px;rotate:-6deg}to{translate:7px 2px;rotate:6deg}}
.hands.pour{animation:none;transform:rotate(-38deg) translate(-6px,10px)}
.hands.gone{opacity:0}
.val{z-index:3;position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:800;color:#ffe08a;text-shadow:0 2px 0 #3a1a08}
.throw{padding:0 16px;height:96px;border-radius:16px;font-weight:800;font-size:17px;color:#fff;min-width:118px;line-height:1.1;
  background:linear-gradient(180deg,#ff8a1f,#e5532a);box-shadow:0 5px 0 #a8341a}
.throw:active{transform:translateY(3px);box-shadow:0 2px 0 #a8341a}
.throw:disabled{pointer-events:none;filter:grayscale(.8) brightness(1.1);opacity:.6;box-shadow:none}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:20;
  background:#fff;padding:10px 22px;border-radius:999px;font-weight:800;font-size:26px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  transition:.25s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(30,10,40,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.ov.on{display:flex}
.box{background:var(--card);border-radius:24px;padding:20px;width:min(440px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.box h2{margin:0 0 10px;font-size:26px}
.box ol{padding-left:22px;margin:0;font-size:16px;line-height:1.45}
.box li{margin-bottom:8px}
.box .play{margin-top:12px}
.win{text-align:center}
.win .big{font-size:34px;font-weight:800;margin:6px 0}
.win .crown{font-size:56px}
.btns{display:flex;gap:10px}
.btns .play{flex:1}
.btns .alt{background:linear-gradient(90deg,#7b5cff,#3a7bff);box-shadow:0 8px 20px rgba(58,123,255,.35)}
.tutb{background:linear-gradient(90deg,#7b5cff,#3a7bff);box-shadow:0 8px 20px rgba(58,123,255,.35);margin-top:10px;font-size:18px;padding:11px}
.box h2{font-size:22px;line-height:1.25}
ul.card{list-style:none;padding:0;margin:0 0 4px;display:grid;gap:8px}
ul.card li{margin-bottom:0;display:flex;gap:8px;align-items:flex-start;background:#fff;border:2px solid #f0e2cc;border-radius:12px;padding:6px 9px;font-size:14px;line-height:1.35}
ul.card .ci{font-size:22px;line-height:1;flex:none;width:28px;text-align:center}
.dock{position:relative}
.tip{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);background:#2b1d3a;color:#fff;border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.35;
  box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);pointer-events:none;transition:.22s;z-index:30}
.tip.on{opacity:1;transform:none}
.tip::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#2b1d3a;border-bottom:0}
.tw{display:inline-block}
.coach{width:min(560px,100%);margin:0 0 8px;z-index:25;background:rgba(255,250,242,.97);border:3px solid #7b5cff;border-radius:18px;padding:10px 12px;
  box-shadow:0 10px 28px rgba(40,0,80,.35);display:none;font-size:15px;line-height:1.4}
.coach.on{display:block;animation:pop .25s ease-out}
#game.tutmode .players{display:none}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.coach .cb{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.coach button{padding:7px 14px;border-radius:12px;font-weight:800;font-size:14px}
.coach .cnext{background:#7b5cff;color:#fff}.coach .cskip{background:#f3e6d3;color:#6b5878}
.hl{position:absolute;width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);border-radius:18%;border:4px solid #7b5cff;
  box-shadow:0 0 0 4px rgba(123,92,255,.25),0 0 18px rgba(123,92,255,.6);pointer-events:none;z-index:4;animation:fade .8s infinite alternate}
.pawn.jodi{border-color:#ffd23f;box-shadow:0 3px 0 var(--cd),0 0 0 3px #ffd23f,0 5px 8px rgba(0,0,0,.35)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

    <button class="play tutb" id="btnTut"></button>

<!-- ============ GAME ============ -->
<section id="game" class="screen">
  <div class="top">
    <button class="ib" id="btnHome" aria-label="menu">⌂</button>
    <div class="t" id="gTitle"></div>
    <button class="ib" id="btnShare2" aria-label="share">⤴</button>
    <button class="ib" id="btnHow2" aria-label="help">?</button>

<div id="throwLayer"></div>
<div class="ov" id="ovHow"><div class="box"><h2 id="hTitle"></h2><ul class="card" id="hList"></ul><button class="play" id="hClose"></button><button class="play tutb" id="hTut"></button></div></div>
<div class="ov" id="ovWin"><div class="box win"><div class="crown">🏆</div><div class="big" id="wText"></div>
  <div class="btns"><button class="play" id="wAgain"></button><button class="play alt" id="wMenu"></button></div>

  <div class="btns"><button class="play" id="qYes"></button><button class="play alt" id="qNo"></button></div></div></div>

const save=()=>{try{localStorage.setItem("cb_settings",JSON.stringify(S))}catch(e){}};
const L=()=>T[S.lang];
const DEBUG={fast:false,log:[]};window.CB={DEBUG,S};

/* seats used for each player count (0 bottom,1 right,2 top,3 left; turn order anticlockwise) */
const SEATS={2:[0,2],3:[0,1,2],4:[0,1,2,3]};

/* ================= GEOMETRY ================= */
function ringList(N,k){ // anticlockwise (screen): bottom row → right col up → top row left → left col down
  const lo=k,hi=N-1-k,a=[];
  if(lo===hi)return[[lo,lo]];
  for(let c=lo;c<=hi;c++)a.push([hi,c]);
  for(let r=hi-1;r>=lo;r--)a.push([r,hi]);
  for(let c=hi-1;c>=lo;c--)a.push([lo,c]);
  for(let r=lo+1;r<=hi-1;r++)a.push([r,lo]);
  return a;
}
function inward(N,k,[r,c]){const lo=k,hi=N-1-k;
  if(r===hi&&c>lo&&c<hi)return[r-1,c];if(r===lo&&c>lo&&c<hi)return[r+1,c];
  if(c===hi&&r>lo&&r<hi)return[r,c-1];if(c===lo&&r>lo&&r<hi)return[r,c+1];return null}
function rotTo(list,cell){const i=list.findIndex(p=>p[0]===cell[0]&&p[1]===cell[1]);return list.slice(i).concat(list.slice(0,i))}
function buildBasePath(N){
  if(N===7){ // outer anticlockwise; middle ring clockwise from its ✕ corner round to the house beside it;
             // inner ring clockwise from just above that house; into the lotus from below
    const outer=rotTo(ringList(7,0),[6,3]);
    const mid=rotTo(ringList(7,1).slice().reverse(),[5,1]); // enter on the ✕ corner, end on the house beside it
    const inner=rotTo(ringList(7,2).slice().reverse(),[4,2]);
    return outer.concat(mid,inner,[[3,3]]);
  }
  const m=(N-1)/2,path=[];let entry=[N-1,m];const rings=m;
  for(let k=0;k<rings;k++){
    let list=ringList(N,k);if(k%2===1)list=list.slice().reverse();
    const i=list.findIndex(p=>p[0]===entry[0]&&p[1]===entry[1]);
    let seg=list.slice(i).concat(list.slice(0,i));
    if(k===rings-1){ // last ring: finish on a square next to the centre
      while(seg.length&&!inward(N,k,seg[seg.length-1]))seg.pop();
    }
    path.push(...seg);
    if(k<rings-1)entry=inward(N,k,seg[seg.length-1]);
  }
  path.push([m,m]);return path;
}
const rot=(N,[r,c])=>[N-1-c,r];
function pathFor(N,seat){let p=buildBasePath(N);for(let i=0;i<seat;i++)p=p.map(x=>rot(N,x));return p}
function safeSet(N){const m=(N-1)/2,s=new Set([`${N-1},${m}`,`${m},${N-1}`,`0,${m}`,`${m},0`,`${m},${m}`]);
  if(N===7){[[1,1],[1,5],[5,1],[5,5]].forEach(([r,c])=>s.add(`${r},${c}`))}return s}

/* ================= GAME STATE & RULES ================= */
let G=null;
function newGame(o){
  o=o||{};const N=o.size||S.size,count=o.count||S.count,types=o.types||S.types,seats=SEATS[count];const L0=L();let cpuI=0;
  const players=seats.map((seat,i)=>{
    const type=types[i];let name;
    if(type==="cpu")name=L0.cpuNames[cpuI++%3];else name=(i===0?L0.you:L0.colors[seat]);
    return{seat,type,name,color:COLORS[seat],path:pathFor(N,seat),pawns:Array(N===5?4:6).fill(0),hit:false,isYou:type==="human"&&i===0};
  });
  G={N,m:(N-1)/2,players,cur:0,phase:"idle",throwVal:0,extra:false,safe:safeSet(N),
     last:players[0].path.length-1,gate:4*(N-1),entry:o.entry||S.entry,open:false,stuck:0,cowries:N===5?4:6,legal:[],
     over:false,timer:null,streak:0,run:0,snap:null,tut:!!o.tut,force:[],pool:[],chips:[],sel:null,capt:false,moved:false};
}
const cellKey=(p,i)=>{const c=p.path[i];return c[0]+","+c[1]};
const centreKey=()=>G.m+","+G.m;
function ringOfKey(key){const [r,c]=key.split(",").map(Number);return Math.min(r,c,G.N-1-r,G.N-1-c)}
function isInnerKey(key){return ringOfKey(key)>=1&&key!==centreKey()}
function ownAt(P,key){let n=0;P.pawns.forEach(i=>{if(i<G.last&&cellKey(P,i)===key)n++});return n}
function oppAt(pi,key){const out=[];G.players.forEach((O,oj)=>{if(oj===pi)return;const c=ownAt(O,key);if(c)out.push({oj,c})});return out}
function jodiBlock(pi,key){return !G.safe.has(key)&&isInnerKey(key)&&oppAt(pi,key).some(o=>o.c>=2)}
function canEnter(P){return G.entry==="easy"||P.hit||G.open}
function isJodiAt(P,idx){const key=cellKey(P,idx);return idx<G.last&&isInnerKey(key)&&ownAt(P,key)>=2}
function throwCowries(){
  const n=G.cowries,ups=[];for(let i=0;i<n;i++)ups.push(Math.random()<0.5);
  const k=ups.filter(Boolean).length;let v,extra=false,label="";
  if(k===0){v=n===4?8:12;extra=true;label=L().bhara}else if(k===n){v=n;extra=true;label=n===4?L().chowka:""}else v=k;
  if(n===6&&v===5)extra=true; // 7 houses: 5, 6 and 12 give another throw
  return{ups,v,extra,label};
}
/* can the pawn (or Jodi) standing on path index idx move with throw v? */
function evalMove(pi,idx,v){
  const P=G.players[pi];
  if(idx>=G.last)return{ok:false,why:"home"};
  const jodi=isJodiAt(P,idx);let step=v;
  if(jodi){if(v%2)return{ok:false,why:"jodiOdd"};step=v/2}
  const t=idx+step;
  if(t>G.last)return{ok:false,why:"exact",need:G.last-idx};
  if(idx<G.gate&&t>=G.gate&&!canEnter(P))return{ok:false,why:"gate"};
  for(let i=idx+1;i<t;i++)if(jodiBlock(pi,cellKey(P,i)))return{ok:false,why:"block"};
  if(t<G.last&&jodiBlock(pi,cellKey(P,t)))return{ok:false,why:jodi?"jodiVsJodi":"block"};
  return{ok:true,mv:{from:idx,to:t,v,step,jodi}};
}
function legalMoves(pi,v){const P=G.players[pi],seen=new Set(),res=[];
  P.pawns.forEach(idx=>{if(seen.has(idx))return;seen.add(idx);const r=evalMove(pi,idx,v);if(r.ok)res.push(r.mv)});return res}
function gateBlocked(pi,v){const P=G.players[pi];return P.pawns.some(i=>i<G.last&&evalMove(pi,i,v).why==="gate")}
/* pawns that would be hit by landing on key (outer: everyone there; inner: only lone pawns) */
function victimsAt(pi,key){
  if(G.safe.has(key)||key===centreKey())return[];const out=[];
  G.players.forEach((O,oj)=>{if(oj===pi)return;const ks=[];O.pawns.forEach((oi,ok)=>{if(oi<G.last&&cellKey(O,oi)===key)ks.push(ok)});
    if(!ks.length)return;if(isInnerKey(key)&&ks.length>=2)return;out.push({oj,ks})});
  return out;
}

/* ================= AI ================= */
const DISTS={4:{1:.25,2:.375,3:.25,4:.0625,8:.0625},6:{1:6/64,2:15/64,3:20/64,4:15/64,5:6/64,6:1/64,12:1/64}};
const distNow=()=>DISTS[G.cowries];
function danger(pi,key,willBeJodi){
  if(G.safe.has(key)||key===centreKey()||willBeJodi)return 0;let risk=0;
  G.players.forEach((O,oj)=>{if(oj===pi)return;
    O.pawns.forEach(oi=>{if(oi>=G.last)return;
      for(const v in distNow()){const t=oi+ +v;if(t>G.last)continue;if(oi<G.gate&&t>=G.gate&&!canEnter(O))continue;
        if(cellKey(O,t)===key)risk+=distNow()[v]}})});
  return Math.min(1,risk);
}
function hitChance(pi,myIdx){const P=G.players[pi];let c=0;
  for(const v in distNow()){const t=myIdx+ +v;if(t>=G.gate||t>G.last)continue;if(victimsAt(pi,cellKey(P,t)).length)c+=distNow()[v]}return c}
function aiScore(pi,mv){
    const P=G.players[pi],kt=cellKey(P,mv.to),kf=cellKey(P,mv.from);let s=0;
    const n=mv.jodi?2:1;
    if(mv.to===G.last)s+=900*n;
    s+=victimsAt(pi,kt).reduce((a,x)=>a+x.ks.length,0)*650;
    const joins=isInnerKey(kt)&&ownAt(P,kt)>=1&&mv.to<G.last;
    s-=danger(pi,kt,mv.jodi||joins)*(280+mv.to*6)*n;
    s+=danger(pi,kf,mv.jodi)*(200+mv.from*6);
    if(G.safe.has(kt))s+=60;
    if(joins&&!mv.jodi)s+=150; // forms a Jodi: blocks rivals
    s+=mv.to*1.5;if(mv.from===0)s+=25;
    if(!canEnter(P))s+=hitChance(pi,mv.to)*420;
    s+=Math.random()*8;
    return s;
}
function aiPick(pi,moves){let best=null,bs=-1e9;for(const mv of moves){const s=aiScore(pi,mv);if(s>bs){bs=s;best=mv}}return best}
/* greedy over every (chip, move) pair of the current pool */
function aiPickPool(pi,chips){let best=null,bs=-1e9;
  for(const c of chips)for(const mv of c.moves){const s=aiScore(pi,mv);if(s>bs){bs=s;best={c,mv}}}return best}

/* ================= AUDIO ================= */
let AC=null,master=null,musicGain=null,musicTimer=null;
function audio(){
  if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(master)}catch(e){AC=null}return AC;
}
function tone(f,t,dur,type,vol,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05)}
function noise(t,dur,vol,freq){const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=3;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
const sfx={
  clatter(){if(!S.sound||!audio())return;const t=AC.currentTime;for(let i=0;i<12;i++)noise(t+i*.045+Math.random()*.02,.05,.35,2500+Math.random()*2500)},
  land(){if(!S.sound||!audio())return;const t=AC.currentTime;for(let i=0;i<G.cowries;i++)noise(t+i*.03,.06,.5,1800+Math.random()*1500)},
  shake(d){if(!S.sound||!audio())return;const t=AC.currentTime;for(let i=0;i<d/0.055;i++)noise(t+i*.055+Math.random()*.02,.04,.22,3000+Math.random()*2500)},
  tap(v){if(!S.sound||!audio())return;noise(AC.currentTime,.05,(v||1)*.45,1600+Math.random()*1800)},
  step(){if(!S.sound||!audio())return;tone(520,AC.currentTime,.07,"triangle",.12)},
  hit(){if(!S.sound||!audio())return;const t=AC.currentTime;tone(180,t,.25,"sine",.35);tone(120,t+.08,.3,"sine",.3);noise(t,.15,.4,600)},
  home(){if(!S.sound||!audio())return;const t=AC.currentTime;[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.09,.6,"sine",.14))},
  bonus(){if(!S.sound||!audio())return;const t=AC.currentTime;tone(660,t,.15,"triangle",.15);tone(990,t+.1,.25,"triangle",.15)},
  win(){if(!S.sound||!audio())return;const t=AC.currentTime;[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.13,.5,"triangle",.16))}
};
/* gentle Mohanam-raga style loop on a plucked string + soft drone (Karnataka feel) */
const SA=196; // G3
const MOHANAM=[0,2,4,7,9,12,14,16,19,21,24];
function startMusic(){
  if(!S.sound||!audio()||musicTimer)return;
  musicGain.gain.cancelScheduledValues(AC.currentTime);musicGain.gain.linearRampToValueAtTime(.55,AC.currentTime+1.5);
  let next=AC.currentTime+.1,pos=4,beat=0;
  const pluck=(semi,t,v)=>{const f=SA*Math.pow(2,semi/12);tone(f,t,1.2,"triangle",v,musicGain);tone(f*2,t,.5,"sine",v*.35,musicGain)};
  const drone=t=>{[SA/2,SA*1.5/2,SA].forEach((f,i)=>tone(f,t+i*.55,2.6,"sine",.045,musicGain))};
  musicTimer=setInterval(()=>{
    while(next<AC.currentTime+.6){
      if(beat%8===0)drone(next);
      if(Math.random()<.78){pos=Math.max(0,Math.min(MOHANAM.length-1,pos+[-2,-1,-1,1,1,2,0][Math.floor(Math.random()*7)]));
        pluck(MOHANAM[pos],next,beat%4===0?.09:.06)}
      next+=beat%8===7?.75:.375;beat++;
    }
  },150);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(AC&&musicGain){musicGain.gain.cancelScheduledValues(AC.currentTime);musicGain.gain.linearRampToValueAtTime(0,AC.currentTime+.4)}}
function toggleSound(){S.sound=!S.sound;save();if(S.sound){audio();AC&&AC.resume&&AC.resume();startMusic()}else stopMusic();renderText()}

document.body.style.background=`linear-gradient(rgba(40,20,8,.18),rgba(40,20,8,.32)),url(${WOODBG}) center/cover`;
document.body.style.minHeight='100%';
const COWRIE={up:SHELLS[2].up,down:SHELLS[1].down}; // one matching white set
const CW_H=()=>G&&G.cowries>4?40:46, CW_W=()=>Math.round(CW_H()*0.69);
function cowrieImg(i,up){return `<img alt="" src="${up?COWRIE.up:COWRIE.down}" width="${CW_W()}" height="${CW_H()}">`}
function placeShells(n,W,H){ // random resting spots, never on top of each other
  const h=CW_H(),minD=h*1.02,pts=[];
  const x0=h*.55,x1=W-h*.55,y0=h*.55,y1=H-h*.55;
  for(let k=0;k<n;k++){let best=null,bd=-1;
    for(let a=0;a<300;a++){const p={x:x0+Math.random()*(x1-x0),y:y0+Math.random()*(y1-y0)};
      const d=pts.length?Math.min(...pts.map(q=>Math.hypot(q.x-p.x,(q.y-p.y)*1.25))):1e9;
      if(d>=minD){best=p;break}if(d>bd){bd=d;best=p}}
    best.r=Math.random()*140-70;pts.push(best)}
  return pts;
}
let trayPts=null;
function trayArea(){const t=$("tray");return{W:Math.max(120,t.clientWidth-46),H:Math.max(60,t.clientHeight)}}
function setTray(ups,pts){
  const tray=$("tray");tray.style.backgroundImage=`url(${WOOD})`;
  tray.querySelectorAll(".cw").forEach(e=>e.remove());
  const A=trayArea();if(!pts||pts.length!==ups.length)pts=placeShells(ups.length,A.W,A.H);trayPts=pts;
  const w=CW_W(),h=CW_H();
  ups.forEach((u,j)=>{const d=document.createElement("div");d.className="cw";d.innerHTML=cowrieImg(j,u);
    d.style.left=(pts[j].x-w/2)+"px";d.style.top=(pts[j].y-h/2)+"px";d.style.transform=`rotate(${pts[j].r}deg)`;
    tray.insertBefore(d,$("val"))});
}
async function throwAnim(ups){
  const tray=$("tray"),r=tray.getBoundingClientRect(),layer=$("throwLayer"),A=trayArea();
  tray.querySelectorAll(".cw").forEach(e=>e.remove());layer.innerHTML="";
  const w=CW_W(),h=CW_H();
  // 1. a short rattle, then the cowries are poured onto the tray
  const hx=r.left+A.W*0.5,hy=r.top-34;
  sfx.shake(0.45);await wait(420);
  const pts=placeShells(ups.length,A.W,A.H),jobs=[];
  ups.forEach((up,i)=>{
    const el=document.createElement("div");el.className="fly";el.innerHTML=cowrieImg(i,Math.random()<.5);
    el.style.left=(hx-w/2+(Math.random()*16-8))+"px";el.style.top=(hy-h/2)+"px";layer.appendChild(el);
    const dx=r.left+pts[i].x-hx,dy=r.top+pts[i].y-hy,r0=Math.random()*360,spin=(Math.random()<.5?-1:1)*(360+Math.random()*360),rf=pts[i].r+Math.round(spin/360)*360;
    const lean=Math.random()*24-12,delay=i*75,dur=880+Math.random()*160;
    const anim=el.animate([
      {transform:`translate(0px,0px) rotate(${r0}deg) scale(1.3)`,offset:0,easing:"cubic-bezier(.45,0,.9,.6)"},
      {transform:`translate(${dx*.72+lean}px,${dy}px) rotate(${r0+spin*.55}deg) scale(1)`,offset:.48,easing:"cubic-bezier(.2,.7,.4,1)"},
      {transform:`translate(${dx*.86+lean*.5}px,${dy-16}px) rotate(${r0+spin*.75}deg) scale(1.1)`,offset:.63,easing:"cubic-bezier(.6,0,.9,.5)"},
      {transform:`translate(${dx*.95}px,${dy}px) rotate(${r0+spin*.9}deg) scale(1)`,offset:.78,easing:"cubic-bezier(.2,.8,.3,1)"},
      {transform:`translate(${dx}px,${dy}px) rotate(${rf}deg) scale(1)`,offset:1}],
      {duration:dur,delay,fill:"forwards"});
    // flips while airborne, final face once it settles
    const img=el.querySelector("img");let flips=0;
    const flipT=setInterval(()=>{img.src=Math.random()<.5?COWRIE.up:COWRIE.down;flips++},75);
    setTimeout(()=>{sfx.tap()},delay+dur*.48);
    setTimeout(()=>{clearInterval(flipT);img.src=up?COWRIE.up:COWRIE.down;sfx.tap(.5)},delay+dur*.78);
    jobs.push(anim.finished);
  });
  await Promise.all(jobs);
  // 3. hand the resting shells over to the tray
  setTray(ups,pts);layer.innerHTML="";
}

const $=id=>document.getElementById(id);
function drawBoard(){
  const N=G.N,U=100,W=N*U,svg=$("boardsvg");svg.setAttribute("viewBox",`-14 -14 ${W+28} ${W+28}`);
  let h=`<defs><linearGradient id="frm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a00"/><stop offset=".5" stop-color="#e63946"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
  <radialGradient id="cen" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffd166"/></radialGradient></defs>
  <rect x="-14" y="-14" width="${W+28}" height="${W+28}" rx="34" fill="url(#frm)"/>
  <rect x="-5" y="-5" width="${W+10}" height="${W+10}" rx="24" fill="#fffaf0"/>`;

function poolChips(pool){

  const add=ix=>{const vals=ix.map(i=>pool[i]),key=vals.slice().sort((a,b)=>a-b).join("+");if(seen.has(key))return;seen.add(key);
    const sum=vals.reduce((a,b)=>a+b,0);out.push({ix,vals,sum,key,moves:[],label:vals.length>1?vals.map(num).join("+")+"="+num(sum):num(sum)})};

  else{pool.forEach((_,i)=>add([i]));for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)add([i,j]);add(pool.map((_,i)=>i))}

  const c=$("coach"),tt=L().tut;
  c.innerHTML=`<div class="ct">${text}</div><div class="cb">`+
   (btn==="next"?`<button class="cnext" id="cNext">${tt.next} ▶</button>`:"")+
   (btn==="end"?`<button class="cnext" id="cPlay">${tt.playNow} ▶</button>`:`<button class="cskip" id="cSkip">${tt.skip}</button>`)+`</div>`;
  c.classList.add("on");$("game").classList.add("tutmode");
  const n=$("cNext");if(n)n.onclick=()=>{sfx.tap();Tut.next()};
  const p=$("cPlay");if(p)p.onclick=()=>{Tut.stop();start()};
  const sk=$("cSkip");if(sk)sk.onclick=()=>{Tut.stop();if(G){G.over=true;clearTimeout(G.timer)}show("menu")};
}
function showHl(keys){const cs=$("boardwrap").clientWidth/G.N;keys.forEach(k=>{const [r,c]=k.split(",").map(Number);
  const d=document.createElement("div");d.className="hl";d.style.left=(c+.5)*cs+"px";d.style.top=(r+.5)*cs+"px";$("pawns").appendChild(d)})}
function clearHl(){document.querySelectorAll(".hl").forEach(e=>e.remove())}

function confetti(){const cols=["#e63946","#16a37f","#f2b705","#3a7bff","#ff7aa8"];
  for(let i=0;i<70;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";
    d.style.background=cols[i%5];d.style.animationDuration=(1.6+Math.random()*1.8)+"s";d.style.animationDelay=Math.random()*.6+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}

/* ================= MENU ================= */
function renderText(){
  const t=L();document.body.className=S.lang;document.documentElement.lang=S.lang;
  $("tTitle").textContent=t.title;$("tSub").textContent=t.sub;$("tBoard").textContent=t.board;$("tPlayers").textContent=t.players;
  $("btnPlay").textContent=t.play;$("btnHow").textContent=t.how;$("btnSound").textContent=S.sound?t.soundOn:t.soundOff;
  $("btnSnd2").textContent=S.sound?"♪":"✕";$("btnThrow").innerHTML=t.throw.replace("\n","<br>");
  $("btnShare").textContent="⤴ "+WOWShare.t;$("wShare").textContent="⤴ "+WOWShare.t;WOWShare.setLang(S.lang);
  $("btnTut").textContent=t.tutorial;
  $("wAgain").textContent=t.again;$("wMenu").textContent=t.menu;$("qText").textContent=t.quit;$("qYes").textContent=t.yes;$("qNo").textContent=t.no;
  $("langs").innerHTML=[["en","EN"],["kn","ಕ"],["hi","हि"]].map(([k,l])=>`<button data-l="${k}" class="${S.lang===k?"on":""}">${l}</button>`).join("");
  $("segBoard").innerHTML=`<button data-s="5" class="${S.size===5?"on":""}">${t.h5}<small>${t.h5s}</small></button><button data-s="7" class="${S.size===7?"on":""}">${t.h7}<small>${t.h7s}</small></button>`;
  $("tEntry").textContent=t.entry;
  $("segEntry").innerHTML=`<button data-e="easy" class="${S.entry==="easy"?"on":""}">${t.easy}<small>${t.easyS}</small></button><button data-e="hard" class="${S.entry!=="easy"?"on":""}">${t.hard}<small>${t.hardS}</small></button>`;
  $("segCount").innerHTML=[2,3,4].map(n=>`<button data-c="${n}" class="${S.count===n?"on":""}">${num(n)}</button>`).join("");
  const seats=SEATS[S.count];let cpuI=0;
  $("seats").innerHTML=[0,1,2,3].map(i=>{
    if(i>=seats.length)return"";const seat=seats[i],type=S.types[i];
    const nm=i===0&&type==="human"?t.you:(type==="cpu"?t.cpuNames[cpuI++%3]:t.colors[seat]);
    return `<div class="seat"><span class="dot" style="background:${COLORS[seat][0]}"></span><span class="nm">${nm}</span>
      <button class="tg ${type==="cpu"?"cpu":""}" data-i="${i}">${type==="cpu"?"🤖 "+(S.lang==="en"?"Computer":S.lang==="kn"?"ತಾನೇ ಆಡುತ್ತದೆ":"खुद खेलेगा"):"🙋 "+t.player}</button></div>`}).join("");
  $("hero").innerHTML=[0,1,2,3].map(i=>`<div class="cw" style="transform:rotate(${[-18,12,-6,22][i]}deg)">${cowrieImg(i,i!==1)}</div>`).join("");
  if(G){$("gTitle").textContent=t.title+" · "+(G.N===5?t.h5:t.h7)}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){S.lang=b.dataset.l;save();renderText()}
  else if(b.dataset.e){S.entry=b.dataset.e;save();renderText()}
  else if(b.dataset.s){S.size=+b.dataset.s;save();renderText()}
  else if(b.dataset.c){S.count=+b.dataset.c;save();renderText()}
  else if(b.dataset.i!==undefined){const i=+b.dataset.i;S.types[i]=S.types[i]==="cpu"?"human":"cpu";save();renderText()}
});
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function start(){
  audio();if(AC&&AC.resume)AC.resume();if(S.sound)startMusic();
  if(G&&G.timer)clearTimeout(G.timer);Tut.stop();newGame();show("game");renderText();drawBoard();buildPawns();setTray(Array(G.cowries).fill(false));renderPlayers();
  msg("");$("btnThrow").disabled=true;renderPool();
  if(DEBUG.fast)startTurn();else showCard("start");
}
$("btnPlay").onclick=start;
$("btnShare").onclick=$("btnShare2").onclick=$("wShare").onclick=()=>WOWShare.open();
$("btnThrow").onclick=()=>{if(!G||G.over)return;const W=L().why,P=curP();
  if(G.phase==="throw"&&P.type==="human")return doThrow();
  if(G.phase==="move"&&P.type==="human")return tip(W.moveFirst);
  if(P.type!=="human")return tip(W.wait(P.name));};
$("pool").onclick=e=>{const b=e.target.closest(".pc");if(b)onChipTap(+b.dataset.pc)};
$("btnThrowWrap").onclick=e=>{if(e.target===$("btnThrowWrap")&&$("btnThrow").disabled)$("btnThrow").onclick()};
$("btnHow").onclick=()=>showCard("help");$("btnHow2").onclick=()=>showCard(G&&G.tut?"help":"game");
$("hClose").onclick=closeCard;$("hTut").onclick=()=>{$("ovHow").classList.remove("on");Tut.start()};
$("btnTut").onclick=()=>Tut.start();
$("btnSound").onclick=$("btnSnd2").onclick=toggleSound;
$("btnHome").onclick=()=>{if(G&&G.tut){Tut.stop();G.over=true;show("menu");return}if(G&&!G.over)$("ovQuit").classList.add("on");else{show("menu")}};
$("qYes").onclick=()=>{$("ovQuit").classList.remove("on");if(G){G.over=true;clearTimeout(G.timer)}show("menu")};
$("qNo").onclick=()=>$("ovQuit").classList.remove("on");
$("wAgain").onclick=()=>{$("ovWin").classList.remove("on");start()};
$("wMenu").onclick=()=>{$("ovWin").classList.remove("on");show("menu")};
window.addEventListener("resize",()=>{if(G)layout(true)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopMusic();else if(S.sound&&AC&&$("game").classList.contains("on"))startMusic()});
CB.start=start;CB.state=()=>G;CB.legal=legalMoves;CB.path=pathFor;CB.evalMove=evalMove;CB.Tut=Tut;CB.newGame=newGame;CB.chips=()=>G.chips;CB.pool=()=>G.pool;CB.poolChips=poolChips;CB.aiScore=aiScore;CB.spend=spend;
WOWShare.init({lang:S.lang,url:"https://worldofwondersstudio.com/chowka-bhara.html",
  title:{en:"Chowka Bhara",kn:"ಚೌಕಾಬಾರ",hi:"चौका बारा"},
  text:{en:"Come play Chowka Bhara! Karnataka's traditional board game with real cowrie shells 🐚",
        kn:"ಚೌಕಾಬಾರ ಆಡೋಣ ಬನ್ನಿ! ನಿಜವಾದ ಕವಡೆಗಳೊಂದಿಗೆ ಕರ್ನಾಟಕದ ಸಾಂಪ್ರದಾಯಿಕ ಆಟ 🐚",
        hi:"आओ चौका बारा खेलें! असली कौड़ियों वाला कर्नाटक का पारंपरिक खेल 🐚"}});
renderText();
</script>
